name: Ubuntu XFCE RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          echo ""
          echo "OS:"
          cat /etc/os-release

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "UID:"
          id

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h /

          echo ""
          echo "Logged users:"
          who || true


      # =========================================================
      # 2. CREATE ABDULRAHMAN
      # =========================================================
      - name: Create Abdulrahman
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
          UBUNTU_PASSWORD: ${{ secrets.UBUNTU_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CREATING ABDULRAHMAN"
          echo "=========================================="

          if [ -z "$UBUNTU_USERNAME" ]; then
            echo "ERROR: UBUNTU_USERNAME is empty."
            exit 1
          fi

          if [ -z "$UBUNTU_PASSWORD" ]; then
            echo "ERROR: UBUNTU_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$UBUNTU_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          echo ""
          echo "Username:"
          echo "$UBUNTU_USERNAME"

          if id "$UBUNTU_USERNAME" >/dev/null 2>&1; then

            echo ""
            echo "User already exists."

            printf '%s:%s\n' \
              "$UBUNTU_USERNAME" \
              "$UBUNTU_PASSWORD" | \
              sudo chpasswd

          else

            echo ""
            echo "Creating user..."

            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$UBUNTU_USERNAME"

            printf '%s:%s\n' \
              "$UBUNTU_USERNAME" \
              "$UBUNTU_PASSWORD" | \
              sudo chpasswd

            echo "User created."

          fi

          echo ""
          echo "Adding sudo privileges..."

          sudo usermod \
            --append \
            --groups sudo \
            "$UBUNTU_USERNAME"

          echo ""
          echo "User:"
          id "$UBUNTU_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$UBUNTU_USERNAME"


      # =========================================================
      # 3. VERIFY ABDULRAHMAN
      # =========================================================
      - name: Verify Abdulrahman
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING ABDULRAHMAN"
          echo "=========================================="

          echo ""
          echo "whoami:"
          sudo -u "$UBUNTU_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$UBUNTU_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$UBUNTU_USERNAME"

          echo ""
          echo "Home:"
          getent passwd "$UBUNTU_USERNAME" | cut -d: -f6

          echo ""
          echo "Administrator check:"

          if id -nG "$UBUNTU_USERNAME" | \
             tr ' ' '\n' | \
             grep -qx sudo; then

            echo "SUCCESS: User has sudo privileges."

          else

            echo "ERROR: User does not have sudo privileges."
            exit 1

          fi


      # =========================================================
      # 4. INSTALL XFCE
      # =========================================================
      - name: Install XFCE GUI
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING LIGHTWEIGHT XFCE GUI"
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils \
            x11-utils \
            xauth \
            xfonts-base \
            xfonts-100dpi \
            xfonts-75dpi \
            xvfb \
            curl \
            wget \
            jq \
            ca-certificates \
            net-tools

          echo ""
          echo "XFCE installed."

          xfce4-session --version || true


      # =========================================================
      # 5. PREPARE USER
      # =========================================================
      - name: Prepare Abdulrahman GUI
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " PREPARING ABDULRAHMAN GUI"
          echo "=========================================="

          HOME_DIR="/home/$UBUNTU_USERNAME"

          sudo mkdir -p "$HOME_DIR/.config/xfce4"

          sudo chown -R \
            "$UBUNTU_USERNAME:$UBUNTU_USERNAME" \
            "$HOME_DIR/.config"

          echo ""
          echo "Home:"
          echo "$HOME_DIR"

          sudo -u "$UBUNTU_USERNAME" \
            env \
            HOME="$HOME_DIR" \
            USER="$UBUNTU_USERNAME" \
            LOGNAME="$UBUNTU_USERNAME" \
            bash -lc '
              echo "HOME=$HOME"
              echo "USER=$USER"
            '


      # =========================================================
      # 6. INSTALL RUSTDESK
      # =========================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          API_URL="https://api.github.com/repos/rustdesk/rustdesk/releases/latest"

          echo ""
          echo "Getting latest RustDesk release..."

          RUSTDESK_URL=$(
            curl -fsSL "$API_URL" |
            jq -r '
              .assets[]
              | select(
                  (.name | test("x86_64.*\\.deb$"; "i"))
                  or
                  (.name | test("amd64.*\\.deb$"; "i"))
                )
              | .browser_download_url
            ' |
            head -n 1
          )

          if [ -z "$RUSTDESK_URL" ] || [ "$RUSTDESK_URL" = "null" ]; then
            echo "ERROR: RustDesk .deb was not found."
            exit 1
          fi

          echo ""
          echo "Downloading RustDesk..."

          wget \
            --show-progress \
            -O /tmp/rustdesk.deb \
            "$RUSTDESK_URL"

          echo ""
          echo "Installing RustDesk..."

          sudo apt-get install -y \
            /tmp/rustdesk.deb

          echo ""
          echo "RustDesk version:"

          rustdesk --version || true

          echo ""
          echo "RustDesk path:"

          command -v rustdesk


      # =========================================================
      # 7. START X11
      # =========================================================
      - name: Start X11 Desktop
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " STARTING X11 DESKTOP"
          echo "=========================================="

          export DISPLAY=:99

          sudo pkill -f "Xvfb :99" || true

          echo ""
          echo "Starting Xvfb..."

          sudo -u "$UBUNTU_USERNAME" \
            nohup Xvfb :99 \
              -screen 0 1920x1080x24 \
              -ac \
              +extension GLX \
              +render \
              -noreset \
              >/tmp/xvfb.log 2>&1 &

          sleep 5

          echo ""
          echo "Xvfb:"

          pgrep -af Xvfb || true

          echo ""
          echo "Testing X11..."

          DISPLAY=:99 \
            xdpyinfo >/dev/null

          echo ""
          echo "SUCCESS: X11 display is working."


      # =========================================================
      # 8. START XFCE
      # =========================================================
      - name: Start XFCE Session
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " STARTING XFCE SESSION"
          echo "=========================================="

          HOME_DIR="/home/$UBUNTU_USERNAME"

          sudo -u "$UBUNTU_USERNAME" \
            env \
            DISPLAY=:99 \
            HOME="$HOME_DIR" \
            USER="$UBUNTU_USERNAME" \
            LOGNAME="$UBUNTU_USERNAME" \
            XDG_SESSION_TYPE=x11 \
            XDG_CURRENT_DESKTOP=XFCE \
            XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg \
            nohup dbus-run-session \
            startxfce4 \
            >/tmp/xfce.log 2>&1 &

          sleep 15

          echo ""
          echo "XFCE processes:"

          pgrep -af xfce || true

          echo ""
          echo "XFCE log:"

          tail -50 /tmp/xfce.log || true


      # =========================================================
      # 9. CONFIGURE RUSTDESK
      # =========================================================
      - name: Configure RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK"
          echo "=========================================="

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD is empty."
            exit 1
          fi

          echo ""
          echo "RustDesk version:"
          rustdesk --version || true

          echo ""
          echo "RustDesk executable:"
          command -v rustdesk

          # -------------------------------------------------------
          # Stop any previous instance
          # -------------------------------------------------------

          sudo systemctl stop rustdesk \
            2>/dev/null || true

          sudo pkill -f "rustdesk --service" \
            2>/dev/null || true

          sleep 3

          # -------------------------------------------------------
          # Start service
          # -------------------------------------------------------

          echo ""
          echo "Starting RustDesk service..."

          sudo systemctl enable rustdesk

          sudo systemctl start rustdesk

          sleep 15

          echo ""
          echo "Service status:"

          sudo systemctl is-active rustdesk

          # -------------------------------------------------------
          # Get ID
          # -------------------------------------------------------

          echo ""
          echo "Getting RustDesk ID..."

          RUSTDESK_ID=$(
            sudo rustdesk \
              --get-id \
              2>/dev/null || true
          )

          echo ""
          echo "RustDesk ID:"
          echo "$RUSTDESK_ID"

          if [ -z "$RUSTDESK_ID" ]; then
            echo ""
            echo "ERROR: RustDesk ID is empty."
            exit 1
          fi

          # -------------------------------------------------------
          # Set permanent password
          # -------------------------------------------------------

          echo ""
          echo "Setting permanent password..."

          PASSWORD_OUTPUT=$(
            sudo rustdesk \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          )

          echo ""
          echo "Password command result:"
          echo "$PASSWORD_OUTPUT"

          # -------------------------------------------------------
          # Configure permanent password authentication
          # -------------------------------------------------------

          echo ""
          echo "Configuring permanent password authentication..."

          sudo rustdesk \
            --option verification-method \
            use-permanent-password \
            2>&1 || true

          sudo rustdesk \
            --option approve-mode \
            password \
            2>&1 || true

          sudo rustdesk \
            --option allow-linux-headless \
            Y \
            2>&1 || true

          # -------------------------------------------------------
          # Restart service
          # -------------------------------------------------------

          echo ""
          echo "Restarting RustDesk..."

          sudo systemctl restart rustdesk

          sleep 20

          # -------------------------------------------------------
          # Verify
          # -------------------------------------------------------

          echo ""
          echo "Checking service..."

          if sudo systemctl is-active --quiet rustdesk; then
            echo "SUCCESS: RustDesk service is ACTIVE."
          else
            echo "ERROR: RustDesk service is NOT ACTIVE."
            exit 1
          fi

          FINAL_ID=$(
            sudo rustdesk \
              --get-id \
              2>/dev/null || true
          )

          echo ""
          echo "=========================================="
          echo " RUSTDESK READY"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          echo "$FINAL_ID"

          echo ""
          echo "Password:"
          echo "CONFIGURED"

          echo ""
          echo "Authentication:"
          echo "PERMANENT PASSWORD"


      # =========================================================
      # 10. RUSTDESK NETWORK DIAGNOSTICS
      # =========================================================
      - name: RustDesk Network Diagnostics
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " RUSTDESK NETWORK DIAGNOSTICS"
          echo "=========================================="

          echo ""
          echo "RustDesk version:"
          rustdesk --version

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id

          echo ""
          echo "RustDesk service:"
          sudo systemctl is-active rustdesk

          echo ""
          echo "RustDesk processes:"
          pgrep -af rustdesk

          echo ""
          echo "Network connections:"
          sudo ss -tunap | grep -i rustdesk || true

          echo ""
          echo "Listening ports:"
          sudo ss -lntup | grep -E \
            '2111|21115|21116|21117|21118|21119' \
            || true

          echo ""
          echo "DNS test:"

          getent hosts rustdesk.com || true
          getent hosts github.com || true

          echo ""
          echo "Internet test:"

          curl \
            -4 \
            -I \
            --connect-timeout 10 \
            https://rustdesk.com \
            || true

          echo ""
          echo "Public IPv4:"

          curl \
            -4 \
            --connect-timeout 10 \
            https://api.ipify.org \
            || true

          echo ""
          echo ""
          echo "RustDesk service status:"
          sudo systemctl status rustdesk \
            --no-pager \
            || true

          echo ""
          echo "RustDesk journal:"
          sudo journalctl \
            -u rustdesk \
            --no-pager \
            -n 100 \
            || true

          echo ""
          echo "RustDesk configuration locations:"

          sudo find \
            /root \
            /home \
            /etc \
            -maxdepth 5 \
            -iname '*rustdesk*' \
            2>/dev/null |
            head -100

          echo ""
          echo "=========================================="
          echo " END DIAGNOSTICS"
          echo "=========================================="


      # =========================================================
      # 11. OPEN XFCE TERMINAL
      # =========================================================
      - name: Open XFCE Terminal
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " OPENING XFCE TERMINAL"
          echo "=========================================="

          HOME_DIR="/home/$UBUNTU_USERNAME"

          sudo -u "$UBUNTU_USERNAME" \
            env \
            DISPLAY=:99 \
            HOME="$HOME_DIR" \
            USER="$UBUNTU_USERNAME" \
            LOGNAME="$UBUNTU_USERNAME" \
            XDG_SESSION_TYPE=x11 \
            nohup xfce4-terminal \
            >/tmp/terminal.log 2>&1 &

          sleep 5

          echo ""
          echo "Terminal:"

          pgrep -af xfce4-terminal || true


      # =========================================================
      # 12. FINAL CHECK
      # =========================================================
      - name: Final Check
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          echo ""
          echo "OS:"
          grep PRETTY_NAME /etc/os-release

          echo ""
          echo "Kernel:"
          uname -r

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Abdulrahman:"
          id "$UBUNTU_USERNAME"

          echo ""
          echo "Abdulrahman groups:"
          id -Gn "$UBUNTU_USERNAME"

          echo ""
          echo "X11:"
          DISPLAY=:99 \
            xdpyinfo >/dev/null \
            && echo "X11 OK" \
            || echo "X11 FAILED"

          echo ""
          echo "Xvfb:"
          pgrep -af Xvfb || true

          echo ""
          echo "XFCE:"
          pgrep -af xfce || true

          echo ""
          echo "RustDesk:"
          pgrep -af rustdesk || true

          echo ""
          echo "RustDesk service:"
          sudo systemctl is-active rustdesk \
            || true

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk \
            --get-id \
            2>/dev/null || true

          echo ""
          echo "RustDesk logs:"
          sudo journalctl \
            -u rustdesk \
            --no-pager \
            -n 30 \
            2>/dev/null || true


      # =========================================================
      # 13. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RUSTDESK RUNNER IS ONLINE"
          echo "=========================================="

          echo ""
          echo "The runner will remain online."

          while true
          do

            echo ""
            echo "=========================================="
            echo "[$(date)] Runner alive"
            echo "=========================================="

            echo ""
            echo "Users:"
            who || true

            echo ""
            echo "Xvfb:"
            pgrep -af Xvfb || true

            echo ""
            echo "XFCE:"
            pgrep -af xfce || true

            echo ""
            echo "RustDesk:"
            pgrep -af rustdesk || true

            echo ""
            echo "RustDesk service:"
            systemctl is-active rustdesk \
              2>/dev/null || true

            echo ""
            echo "RustDesk ID:"
            sudo rustdesk \
              --get-id \
              2>/dev/null || true

            echo ""
            echo "X11:"
            DISPLAY=:99 \
              xdpyinfo >/dev/null \
              && echo "X11 OK" \
              || echo "X11 FAILED"

            sleep 300

          done
