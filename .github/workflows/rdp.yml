name: Ubuntu RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================
      - name: System Information
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          cat /etc/os-release

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h


      # ============================================================
      # 2. CREATE USER
      # ============================================================
      - name: Create Abdulrahman User
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
          UBUNTU_PASSWORD: ${{ secrets.UBUNTU_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CREATING USER"
          echo "=========================================="

          if id "$UBUNTU_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            sudo useradd -m -s /bin/bash "$UBUNTU_USERNAME"
          fi

          echo "$UBUNTU_USERNAME:$UBUNTU_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$UBUNTU_USERNAME"

          echo "$UBUNTU_USERNAME ALL=(ALL) NOPASSWD:ALL" |
            sudo tee "/etc/sudoers.d/$UBUNTU_USERNAME" >/dev/null

          sudo chmod 440 "/etc/sudoers.d/$UBUNTU_USERNAME"

          sudo chown -R "$UBUNTU_USERNAME:$UBUNTU_USERNAME" \
            "/home/$UBUNTU_USERNAME"


      # ============================================================
      # 3. VERIFY USER
      # ============================================================
      - name: Verify User
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set +e

          echo "=========================================="
          echo " USER VERIFICATION"
          echo "=========================================="

          id "$UBUNTU_USERNAME"

          echo ""
          groups "$UBUNTU_USERNAME"

          echo ""
          sudo -u "$UBUNTU_USERNAME" sudo -n whoami


      # ============================================================
      # 4. INSTALL XFCE
      # ============================================================
      - name: Install XFCE Desktop
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING XFCE"
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils \
            x11-utils \
            xauth \
            xterm \
            xvfb \
            curl \
            wget \
            ca-certificates \
            jq \
            net-tools \
            iproute2 \
            procps


      # ============================================================
      # 5. START X11
      # ============================================================
      - name: Start X11 Desktop
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " STARTING X11"
          echo "=========================================="

          sudo pkill Xvfb || true

          sudo Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 5

          if pgrep -x Xvfb >/dev/null; then
            echo "Xvfb is running."
          else
            echo "ERROR: Xvfb failed."
            cat /tmp/xvfb.log
            exit 1
          fi


      # ============================================================
      # 6. START XFCE
      # ============================================================
      - name: Start XFCE Session
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " STARTING XFCE"
          echo "=========================================="

          sudo -u "$UBUNTU_USERNAME" bash -c '
            export DISPLAY=:99
            export XDG_SESSION_TYPE=x11
            export XDG_CURRENT_DESKTOP=XFCE
            export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
            export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

            nohup dbus-run-session startxfce4 \
              > /tmp/xfce.log 2>&1 &
          '

          sleep 12

          echo ""
          echo "XFCE processes:"
          pgrep -af xfce || true

          echo ""
          echo "Display:"
          DISPLAY=:99 xdpyinfo 2>/dev/null |
            grep -E "dimensions|depth" |
            head -10 || true


      # ============================================================
      # 7. INSTALL RUSTDESK
      # ============================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          cd /tmp

          RELEASE_JSON="$(
            curl -fsSL \
              https://api.github.com/repos/rustdesk/rustdesk/releases/latest
          )"

          echo "Latest version:"
          echo "$RELEASE_JSON" |
            jq -r '.tag_name'

          DOWNLOAD_URL="$(
            echo "$RELEASE_JSON" |
              jq -r '
                .assets[]
                | select(
                    (.name | test("x86_64|amd64"; "i"))
                    and
                    (.name | endswith(".deb"))
                  )
                | .browser_download_url
              ' |
              head -n 1
          )"

          if [ -z "$DOWNLOAD_URL" ] ||
             [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: RustDesk .deb not found."
            exit 1
          fi

          echo "Downloading:"
          echo "$DOWNLOAD_URL"

          curl -fL "$DOWNLOAD_URL" \
            -o /tmp/rustdesk.deb

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y /tmp/rustdesk.deb

          echo ""
          echo "Installed RustDesk:"
          rustdesk --version


      # ============================================================
      # 8. STOP RUSTDESK BEFORE CONFIGURATION
      # ============================================================
      - name: Stop RustDesk Before Configuration
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " STOPPING RUSTDESK"
          echo "=========================================="

          sudo systemctl stop rustdesk || true

          sleep 3

          sudo pkill -f "rustdesk --service" || true

          sleep 2

          echo ""
          echo "RustDesk processes:"
          pgrep -af rustdesk || true


      # ============================================================
      # 9. CONFIGURE RUSTDESK SERVER
      # ============================================================
      - name: Configure RustDesk Server
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK NETWORK"
          echo "=========================================="

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD is empty."
            exit 1
          fi

          sudo mkdir -p /root/.config/rustdesk

          # --------------------------------------------------------
          # IMPORTANT:
          # RustDesk service runs as ROOT.
          # Therefore configure ROOT RustDesk2.toml.
          #
          # rs-ny.rustdesk.com is a public RustDesk rendezvous
          # endpoint currently used by RustDesk clients.
          # --------------------------------------------------------

          sudo tee /root/.config/rustdesk/RustDesk2.toml >/dev/null <<'EOF'
rendezvous_server = 'rs-ny.rustdesk.com:21116'
nat_type = 1
serial = 0

[options]
allow-linux-headless = 'Y'
custom-rendezvous-server = 'rs-ny.rustdesk.com'
direct-server = 'Y'
verification-method = 'use-permanent-password'
approve-mode = 'password'
EOF

          sudo chmod 600 \
            /root/.config/rustdesk/RustDesk2.toml

          echo ""
          echo "RustDesk2.toml created."

          echo ""
          echo "Configuration:"
          sudo cat /root/.config/rustdesk/RustDesk2.toml

          echo ""
          echo "Starting RustDesk service..."

          sudo systemctl daemon-reload
          sudo systemctl enable rustdesk
          sudo systemctl start rustdesk

          sleep 8

          echo ""
          echo "RustDesk service:"
          sudo systemctl status rustdesk \
            --no-pager \
            -l || true


      # ============================================================
      # 10. SET PERMANENT PASSWORD
      # ============================================================
      - name: Set RustDesk Password
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set +e

          echo "=========================================="
          echo " SETTING RUSTDESK PASSWORD"
          echo "=========================================="

          sudo rustdesk --password "$RUSTDESK_PASSWORD" || true

          echo ""
          echo "Password configuration command completed."

          echo ""
          echo "Restarting RustDesk..."

          sudo systemctl restart rustdesk

          sleep 8


      # ============================================================
      # 11. GET RUSTDESK ID
      # ============================================================
      - name: Get RustDesk ID
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " RUSTDESK ID"
          echo "=========================================="

          echo "Version:"
          rustdesk --version

          echo ""
          echo "ID:"
          sudo rustdesk --get-id || true

          echo ""
          echo "Service:"
          sudo systemctl is-active rustdesk || true

          echo ""
          echo "Process:"
          pgrep -af rustdesk || true


      # ============================================================
      # 12. VERIFY ACTUAL RUSTDESK CONFIG
      # ============================================================
      - name: Verify RustDesk Configuration
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " VERIFYING RUSTDESK CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "Root config files:"
          sudo ls -la /root/.config/rustdesk/ || true

          echo ""
          echo "RustDesk2.toml:"
          sudo cat /root/.config/rustdesk/RustDesk2.toml || true

          echo ""
          echo "RustDesk.toml:"
          sudo cat /root/.config/rustdesk/RustDesk.toml || true

          echo ""
          echo "RustDesk service:"
          sudo systemctl status rustdesk \
            --no-pager \
            -l || true

          echo ""
          echo "RustDesk processes:"
          pgrep -af rustdesk || true


      # ============================================================
      # 13. TEST RUSTDESK RENDEZVOUS SERVER
      # ============================================================
      - name: Test RustDesk Rendezvous Network
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " TESTING RUSTDESK RENDEZVOUS"
          echo "=========================================="

          SERVER="rs-ny.rustdesk.com"

          echo ""
          echo "DNS:"
          getent ahosts "$SERVER" || true

          echo ""
          echo "TCP 21116:"
          timeout 10 bash -c \
            "</dev/tcp/$SERVER/21116" \
            2>/dev/null

          if [ $? -eq 0 ]; then
            echo "TCP 21116: OPEN"
          else
            echo "TCP 21116: NOT OPEN / NOT TESTABLE"
          fi

          echo ""
          echo "TCP 21117:"
          timeout 10 bash -c \
            "</dev/tcp/$SERVER/21117" \
            2>/dev/null

          if [ $? -eq 0 ]; then
            echo "TCP 21117: OPEN"
          else
            echo "TCP 21117: NOT OPEN / NOT TESTABLE"
          fi

          echo ""
          echo "Current network connections:"
          sudo ss -tunap |
            grep -Ei \
              "rustdesk|21116|21117" ||
            true


      # ============================================================
      # 14. CHECK RUSTDESK LOGS
      # ============================================================
      - name: Check RustDesk Logs
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " RUSTDESK LOGS"
          echo "=========================================="

          sudo find \
            /root/.local/share/logs/RustDesk \
            -type f \
            -print \
            2>/dev/null |
            sort

          echo ""
          echo "Recent service log:"
          sudo tail -200 \
            /root/.local/share/logs/RustDesk/service/rustdesk_rCURRENT.log \
            2>/dev/null || true

          echo ""
          echo "Recent get-id log:"
          sudo tail -100 \
            /root/.local/share/logs/RustDesk/get-id/rustdesk_rCURRENT.log \
            2>/dev/null || true


      # ============================================================
      # 15. OPEN XFCE TERMINAL
      # ============================================================
      - name: Open XFCE Terminal
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set +e

          echo "=========================================="
          echo " OPENING XFCE TERMINAL"
          echo "=========================================="

          sudo -u "$UBUNTU_USERNAME" \
            env DISPLAY=:99 \
            nohup xfce4-terminal \
            > /tmp/xfce-terminal.log 2>&1 &

          sleep 3

          pgrep -af xfce4-terminal || true


      # ============================================================
      # 16. FINAL CHECK
      # ============================================================
      - name: Final Check
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id || true

          echo ""
          echo "RustDesk service:"
          sudo systemctl is-active rustdesk || true

          echo ""
          echo "RustDesk process:"
          pgrep -af rustdesk || true

          echo ""
          echo "RustDesk connections:"
          sudo ss -tunap |
            grep -Ei "rustdesk|21116|21117" ||
            true

          echo ""
          echo "Xvfb:"
          pgrep -af Xvfb || true

          echo ""
          echo "XFCE:"
          pgrep -af xfce4-session || true

          echo ""
          echo "Display:"
          DISPLAY=:99 xdpyinfo 2>/dev/null |
            grep "dimensions" ||
            true

          echo ""
          echo "=========================================="
          echo " FINAL RUSTDESK ID"
          echo "=========================================="

          sudo rustdesk --get-id || true


      # ============================================================
      # 17. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RUSTDESK REMOTE DESKTOP READY"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id || true

          echo ""
          echo "Runner will remain active."
          echo "=========================================="

          while true; do
            sleep 60
          done
