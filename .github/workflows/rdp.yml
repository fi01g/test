name: Ubuntu XFCE RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          echo ""
          echo "OS:"
          cat /etc/os-release

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "UID:"
          id

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h /

          echo ""
          echo "Logged users:"
          who || true


      # =========================================================
      # 2. CREATE ABDULRAHMAN
      # =========================================================
      - name: Create Abdulrahman
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
          UBUNTU_PASSWORD: ${{ secrets.UBUNTU_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CREATING ABDULRAHMAN"
          echo "=========================================="

          if [ -z "$UBUNTU_USERNAME" ]; then
            echo "ERROR: UBUNTU_USERNAME is empty."
            exit 1
          fi

          if [ -z "$UBUNTU_PASSWORD" ]; then
            echo "ERROR: UBUNTU_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$UBUNTU_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          echo ""
          echo "Username:"
          echo "$UBUNTU_USERNAME"

          if id "$UBUNTU_USERNAME" >/dev/null 2>&1; then

            echo ""
            echo "User already exists."

            echo ""
            echo "Updating password..."

            printf '%s:%s\n' \
              "$UBUNTU_USERNAME" \
              "$UBUNTU_PASSWORD" | \
              sudo chpasswd

          else

            echo ""
            echo "Creating user..."

            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$UBUNTU_USERNAME"

            printf '%s:%s\n' \
              "$UBUNTU_USERNAME" \
              "$UBUNTU_PASSWORD" | \
              sudo chpasswd

            echo "User created."

          fi

          echo ""
          echo "Adding sudo privileges..."

          sudo usermod \
            --append \
            --groups sudo \
            "$UBUNTU_USERNAME"

          echo ""
          echo "User:"
          id "$UBUNTU_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$UBUNTU_USERNAME"


      # =========================================================
      # 3. VERIFY ABDULRAHMAN
      # =========================================================
      - name: Verify Abdulrahman
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING ABDULRAHMAN"
          echo "=========================================="

          echo ""
          echo "whoami:"
          sudo -u "$UBUNTU_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$UBUNTU_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$UBUNTU_USERNAME"

          echo ""
          echo "Home:"
          getent passwd "$UBUNTU_USERNAME" | cut -d: -f6

          echo ""
          echo "Administrator check:"

          if id -nG "$UBUNTU_USERNAME" | \
             tr ' ' '\n' | \
             grep -qx sudo; then

            echo "SUCCESS: User has sudo privileges."

          else

            echo "ERROR: User does not have sudo privileges."
            exit 1

          fi


      # =========================================================
      # 4. INSTALL LIGHTWEIGHT GUI
      # =========================================================
      - name: Install XFCE GUI
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING LIGHTWEIGHT XFCE GUI"
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils \
            x11-utils \
            xauth \
            xfonts-base \
            xfonts-100dpi \
            xfonts-75dpi \
            xvfb \
            curl \
            wget \
            ca-certificates

          echo ""
          echo "XFCE installed."

          echo ""
          echo "XFCE version:"
          xfce4-session --version || true


      # =========================================================
      # 5. PREPARE USER GUI
      # =========================================================
      - name: Prepare Abdulrahman GUI
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " PREPARING ABDULRAHMAN GUI"
          echo "=========================================="

          HOME_DIR="/home/$UBUNTU_USERNAME"

          sudo mkdir -p "$HOME_DIR/.config/xfce4"

          sudo chown -R \
            "$UBUNTU_USERNAME:$UBUNTU_USERNAME" \
            "$HOME_DIR/.config"

          echo ""
          echo "Home:"
          echo "$HOME_DIR"

          echo ""
          echo "Testing user environment..."

          sudo -u "$UBUNTU_USERNAME" \
            env \
            HOME="$HOME_DIR" \
            USER="$UBUNTU_USERNAME" \
            LOGNAME="$UBUNTU_USERNAME" \
            bash -lc 'echo "HOME=$HOME"; echo "USER=$USER"'


      # =========================================================
      # 6. INSTALL RUSTDESK
      # =========================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            curl \
            jq \
            wget \
            ca-certificates

          echo ""
          echo "Finding latest RustDesk Linux package..."

          API_URL="https://api.github.com/repos/rustdesk/rustdesk/releases/latest"

          RUSTDESK_URL=$(
            curl -fsSL "$API_URL" |
            jq -r '
              .assets[]
              | select(
                  (.name | test("x86_64.*\\.deb$"))
                  or
                  (.name | test("amd64.*\\.deb$"))
                )
              | .browser_download_url
            ' |
            head -n 1
          )

          if [ -z "$RUSTDESK_URL" ] || [ "$RUSTDESK_URL" = "null" ]; then
            echo "ERROR: Could not find RustDesk .deb package."
            exit 1
          fi

          echo ""
          echo "RustDesk package:"
          echo "$RUSTDESK_URL"

          echo ""
          echo "Downloading..."

          wget \
            --show-progress \
            -O /tmp/rustdesk.deb \
            "$RUSTDESK_URL"

          echo ""
          echo "Installing..."

          sudo apt-get install -y \
            /tmp/rustdesk.deb

          echo ""
          echo "RustDesk version:"

          rustdesk --version || true

          echo ""
          echo "RustDesk executable:"

          command -v rustdesk


      # =========================================================
      # 7. START VIRTUAL X11 DISPLAY
      # =========================================================
      - name: Start X11 Desktop
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " STARTING X11 DESKTOP"
          echo "=========================================="

          export DISPLAY=:99

          echo ""
          echo "DISPLAY:"
          echo "$DISPLAY"

          echo ""
          echo "Starting Xvfb..."

          sudo pkill -f "Xvfb :99" || true

          sudo -u "$UBUNTU_USERNAME" \
            nohup Xvfb :99 \
              -screen 0 1920x1080x24 \
              -ac \
              +extension GLX \
              +render \
              -noreset \
              >/tmp/xvfb.log 2>&1 &

          sleep 5

          echo ""
          echo "Xvfb processes:"

          pgrep -af Xvfb || true

          echo ""
          echo "X11 test:"

          DISPLAY=:99 \
            xdpyinfo >/dev/null

          echo "SUCCESS: X11 display is working."


      # =========================================================
      # 8. START XFCE SESSION
      # =========================================================
      - name: Start XFCE Session
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " STARTING XFCE SESSION"
          echo "=========================================="

          HOME_DIR="/home/$UBUNTU_USERNAME"

          echo ""
          echo "Display:"
          echo ":99"

          echo ""
          echo "Starting XFCE..."

          sudo -u "$UBUNTU_USERNAME" \
            env \
            DISPLAY=:99 \
            HOME="$HOME_DIR" \
            USER="$UBUNTU_USERNAME" \
            LOGNAME="$UBUNTU_USERNAME" \
            XDG_SESSION_TYPE=x11 \
            XDG_CURRENT_DESKTOP=XFCE \
            XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg \
            dbus-run-session \
            startxfce4 \
            >/tmp/xfce.log 2>&1 &

          sleep 15

          echo ""
          echo "XFCE processes:"

          pgrep -af xfce || true

          echo ""
          echo "Desktop check:"

          DISPLAY=:99 \
            sudo -u "$UBUNTU_USERNAME" \
            env \
            HOME="$HOME_DIR" \
            dbus-run-session \
            bash -lc '
              echo "Desktop:"
              echo "${XDG_CURRENT_DESKTOP:-unknown}"
            ' || true

          echo ""
          echo "XFCE log:"

          tail -50 /tmp/xfce.log || true


      # =========================================================
      # 9. CONFIGURE RUSTDESK
      # =========================================================
      - name: Configure RustDesk
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK"
          echo "=========================================="

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD is empty."
            exit 1
          fi

          echo ""
          echo "Starting RustDesk..."

          HOME_DIR="/home/$UBUNTU_USERNAME"

          sudo -u "$UBUNTU_USERNAME" \
            env \
            DISPLAY=:99 \
            HOME="$HOME_DIR" \
            USER="$UBUNTU_USERNAME" \
            LOGNAME="$UBUNTU_USERNAME" \
            XDG_SESSION_TYPE=x11 \
            nohup rustdesk \
            >/tmp/rustdesk.log 2>&1 &

          sleep 15

          echo ""
          echo "RustDesk processes:"

          pgrep -af rustdesk || true

          echo ""
          echo "RustDesk ID:"

          ID=$(
            sudo -u "$UBUNTU_USERNAME" \
              env \
              DISPLAY=:99 \
              HOME="$HOME_DIR" \
              rustdesk --get-id \
              2>/dev/null || true
          )

          echo "$ID"

          echo ""
          echo "Setting permanent password..."

          PASSWORD_OUTPUT=$(
            sudo rustdesk \
              --password "$RUSTDESK_PASSWORD" \
              2>&1 || true
          )

          echo "$PASSWORD_OUTPUT"

          echo ""
          echo "Restarting RustDesk..."

          sudo pkill -f rustdesk || true

          sleep 5

          sudo -u "$UBUNTU_USERNAME" \
            env \
            DISPLAY=:99 \
            HOME="$HOME_DIR" \
            USER="$UBUNTU_USERNAME" \
            LOGNAME="$UBUNTU_USERNAME" \
            XDG_SESSION_TYPE=x11 \
            nohup rustdesk \
            >/tmp/rustdesk.log 2>&1 &

          sleep 15

          FINAL_ID=$(
            sudo -u "$UBUNTU_USERNAME" \
              env \
              DISPLAY=:99 \
              HOME="$HOME_DIR" \
              rustdesk --get-id \
              2>/dev/null || true
          )

          echo ""
          echo "=========================================="
          echo " RUSTDESK READY"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          echo "$FINAL_ID"

          echo ""
          echo "RustDesk password:"
          echo "CONFIGURED"


      # =========================================================
      # 10. OPEN XFCE APPLICATIONS
      # =========================================================
      - name: Open XFCE Applications
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " OPENING XFCE APPLICATIONS"
          echo "=========================================="

          HOME_DIR="/home/$UBUNTU_USERNAME"

          echo ""
          echo "Opening terminal..."

          sudo -u "$UBUNTU_USERNAME" \
            env \
            DISPLAY=:99 \
            HOME="$HOME_DIR" \
            XDG_SESSION_TYPE=x11 \
            nohup xfce4-terminal \
            >/tmp/terminal.log 2>&1 &

          sleep 5

          echo ""
          echo "Desktop processes:"

          pgrep -af xfce || true

          echo ""
          echo "Terminal processes:"

          pgrep -af xfce4-terminal || true


      # =========================================================
      # 11. FINAL GUI + RUSTDESK CHECK
      # =========================================================
      - name: Final Check
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}

        run: |
          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          HOME_DIR="/home/$UBUNTU_USERNAME"

          echo ""
          echo "OS:"
          grep PRETTY_NAME /etc/os-release

          echo ""
          echo "Kernel:"
          uname -r

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Abdulrahman:"
          id "$UBUNTU_USERNAME"

          echo ""
          echo "Abdulrahman groups:"
          id -Gn "$UBUNTU_USERNAME"

          echo ""
          echo "DISPLAY:"
          echo ":99"

          echo ""
          echo "X11:"
          DISPLAY=:99 xdpyinfo >/dev/null \
            && echo "X11 OK" \
            || echo "X11 FAILED"

          echo ""
          echo "XFCE:"
          pgrep -af xfce || true

          echo ""
          echo "Xvfb:"
          pgrep -af Xvfb || true

          echo ""
          echo "RustDesk:"
          pgrep -af rustdesk || true

          echo ""
          echo "RustDesk ID:"

          sudo -u "$UBUNTU_USERNAME" \
            env \
            DISPLAY=:99 \
            HOME="$HOME_DIR" \
            rustdesk --get-id \
            2>/dev/null || true

          echo ""
          echo "RustDesk log:"
          tail -30 /tmp/rustdesk.log \
            2>/dev/null || true

          echo ""
          echo "XFCE log:"
          tail -30 /tmp/xfce.log \
            2>/dev/null || true


      # =========================================================
      # 12. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RUSTDESK RUNNER IS ONLINE"
          echo "=========================================="

          echo ""
          echo "The runner will remain online."

          while true
          do

            echo ""
            echo "=========================================="
            echo "[$(date)] Runner alive"
            echo "=========================================="

            echo ""
            echo "Users:"
            who || true

            echo ""
            echo "Xvfb:"
            pgrep -af Xvfb || true

            echo ""
            echo "XFCE:"
            pgrep -af xfce || true

            echo ""
            echo "RustDesk:"
            pgrep -af rustdesk || true

            echo ""
            echo "RustDesk ID:"

            rustdesk \
              --get-id \
              2>/dev/null || true

            echo ""
            echo "X11:"
            DISPLAY=:99 \
              xdpyinfo >/dev/null \
              && echo "X11 OK" \
              || echo "X11 FAILED"

            sleep 300

          done
