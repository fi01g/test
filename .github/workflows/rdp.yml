name: Ubuntu RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================
      - name: System Information
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          cat /etc/os-release
          echo ""
          uname -a
          echo ""
          echo "Architecture:"
          uname -m
          echo ""
          echo "CPU:"
          nproc
          echo ""
          echo "Memory:"
          free -h
          echo ""
          echo "Disk:"
          df -h


      # ============================================================
      # 2. CREATE USER
      # ============================================================
      - name: Create User
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
          UBUNTU_PASSWORD: ${{ secrets.UBUNTU_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CREATING USER"
          echo "=========================================="

          if id "$UBUNTU_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            sudo useradd -m -s /bin/bash "$UBUNTU_USERNAME"
          fi

          echo "$UBUNTU_USERNAME:$UBUNTU_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$UBUNTU_USERNAME"

          echo "$UBUNTU_USERNAME ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/$UBUNTU_USERNAME" >/dev/null

          sudo chmod 440 "/etc/sudoers.d/$UBUNTU_USERNAME"

          sudo chown -R "$UBUNTU_USERNAME:$UBUNTU_USERNAME" \
            "/home/$UBUNTU_USERNAME"

          echo "User ready."


      # ============================================================
      # 3. VERIFY USER
      # ============================================================
      - name: Verify User
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set +e

          echo "=========================================="
          echo " USER VERIFICATION"
          echo "=========================================="

          id "$UBUNTU_USERNAME"

          echo ""
          echo "Groups:"
          groups "$UBUNTU_USERNAME"

          echo ""
          echo "Sudo test:"
          sudo -u "$UBUNTU_USERNAME" sudo -n whoami


      # ============================================================
      # 4. INSTALL XFCE
      # ============================================================
      - name: Install XFCE Desktop
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING XFCE"
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils \
            x11-utils \
            xauth \
            xterm \
            xvfb \
            curl \
            wget \
            ca-certificates \
            jq \
            net-tools \
            iproute2 \
            procps

          echo "XFCE installed."


      # ============================================================
      # 5. START X11
      # ============================================================
      - name: Start X11
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " STARTING X11"
          echo "=========================================="

          sudo pkill Xvfb || true

          sudo Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 5

          if pgrep -x Xvfb >/dev/null; then
            echo "Xvfb is running."
          else
            echo "ERROR: Xvfb failed."
            cat /tmp/xvfb.log || true
            exit 1
          fi


      # ============================================================
      # 6. START XFCE
      # ============================================================
      - name: Start XFCE
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " STARTING XFCE"
          echo "=========================================="

          sudo -u "$UBUNTU_USERNAME" bash -c '
            export DISPLAY=:99
            export XDG_SESSION_TYPE=x11
            export XDG_CURRENT_DESKTOP=XFCE
            export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
            export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

            nohup dbus-run-session startxfce4 \
              > /tmp/xfce.log 2>&1 &
          '

          sleep 12

          echo ""
          echo "XFCE processes:"
          pgrep -af xfce || true

          echo ""
          echo "Display:"
          DISPLAY=:99 xdpyinfo 2>/dev/null | \
            grep -E "dimensions|depth" | \
            head -10 || true


      # ============================================================
      # 7. INSTALL RUSTDESK
      # ============================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          cd /tmp

          RELEASE_JSON="$(curl -fsSL \
            https://api.github.com/repos/rustdesk/rustdesk/releases/latest)"

          echo "Latest version:"
          echo "$RELEASE_JSON" | jq -r '.tag_name'

          DOWNLOAD_URL="$(
            echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(
                  (.name | test("x86_64|amd64"; "i"))
                  and
                  (.name | endswith(".deb"))
                )
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: RustDesk .deb not found."
            exit 1
          fi

          echo "Downloading RustDesk..."

          curl -fL "$DOWNLOAD_URL" \
            -o /tmp/rustdesk.deb

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y /tmp/rustdesk.deb

          echo ""
          echo "RustDesk version:"
          rustdesk --version


      # ============================================================
      # 8. STOP RUSTDESK
      # ============================================================
      - name: Stop RustDesk
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " STOPPING RUSTDESK"
          echo "=========================================="

          sudo systemctl stop rustdesk || true
          sleep 3

          pgrep -af rustdesk || true


      # ============================================================
      # 9. CONFIGURE RUSTDESK
      # ============================================================
      - name: Configure RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK"
          echo "=========================================="

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD is empty."
            exit 1
          fi

          sudo mkdir -p /root/.config/rustdesk

          sudo rustdesk --password "$RUSTDESK_PASSWORD"

          sudo rustdesk \
            --option verification-method \
            use-permanent-password

          sudo rustdesk \
            --option approve-mode \
            password

          sudo rustdesk \
            --option allow-linux-headless \
            Y

          echo "RustDesk options configured."


      # ============================================================
      # 10. START RUSTDESK SERVICE
      # ============================================================
      - name: Start RustDesk Service
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " STARTING RUSTDESK SERVICE"
          echo "=========================================="

          sudo systemctl daemon-reload
          sudo systemctl enable rustdesk
          sudo systemctl restart rustdesk

          sleep 10

          echo ""
          sudo systemctl status rustdesk \
            --no-pager \
            -l || true


      # ============================================================
      # 11. RUSTDESK ID
      # ============================================================
      - name: Get RustDesk ID
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " RUSTDESK ID"
          echo "=========================================="

          echo "Version:"
          rustdesk --version

          echo ""
          echo "ID:"
          sudo rustdesk --get-id || true

          echo ""
          echo "Service:"
          sudo systemctl is-active rustdesk || true

          echo ""
          echo "Process:"
          pgrep -af rustdesk || true


      # ============================================================
      # 12. INSPECT CONFIGURATION
      # ============================================================
      - name: Inspect RustDesk Configuration
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " RUSTDESK CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "RustDesk version:"
          rustdesk --version

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id || true

          echo ""
          echo "=========================================="
          echo " SYSTEMD"
          echo "=========================================="

          sudo systemctl cat rustdesk || true

          echo ""
          echo "Service properties:"

          sudo systemctl show rustdesk \
            -p User \
            -p Group \
            -p ExecStart \
            -p Environment \
            -p WorkingDirectory \
            --no-pager || true

          echo ""
          echo "=========================================="
          echo " ROOT CONFIG FILES"
          echo "=========================================="

          sudo find /root/.config/rustdesk \
            -maxdepth 2 \
            -type f \
            -print 2>/dev/null || true

          echo ""
          echo "RustDesk2.toml:"

          if [ -f /root/.config/rustdesk/RustDesk2.toml ]; then
            sudo cat /root/.config/rustdesk/RustDesk2.toml
          else
            echo "RustDesk2.toml not found."
          fi

          echo ""
          echo "RustDesk.toml:"

          if [ -f /root/.config/rustdesk/RustDesk.toml ]; then
            sudo cat /root/.config/rustdesk/RustDesk.toml
          else
            echo "RustDesk.toml not found."
          fi

          echo ""
          echo "=========================================="
          echo " RUSTDESK LOGS"
          echo "=========================================="

          sudo find \
            /root/.local/share/logs/RustDesk \
            -type f \
            -print \
            2>/dev/null |
            sort || true

          echo ""
          echo "Recent RustDesk logs:"

          sudo find \
            /root/.local/share/logs/RustDesk \
            -type f \
            -print \
            -exec tail -80 {} \; \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo " PROCESSES"
          echo "=========================================="

          pgrep -af rustdesk || true

          echo ""
          echo "=========================================="
          echo " NETWORK"
          echo "=========================================="

          sudo ss -tunap 2>/dev/null |
            grep -Ei "rustdesk|21116|21117" ||
            true

          echo ""
          echo "All established connections:"

          sudo ss -tunap 2>/dev/null |
            grep ESTAB ||
            true

          echo ""
          echo "=========================================="
          echo " JOURNAL"
          echo "=========================================="

          sudo journalctl \
            -u rustdesk \
            --no-pager \
            -n 150 \
            2>/dev/null || true


      # ============================================================
      # 13. OPEN XFCE TERMINAL
      # ============================================================
      - name: Open XFCE Terminal
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set +e

          echo "=========================================="
          echo " OPENING XFCE TERMINAL"
          echo "=========================================="

          sudo -u "$UBUNTU_USERNAME" \
            env DISPLAY=:99 \
            nohup xfce4-terminal \
            > /tmp/xfce-terminal.log 2>&1 &

          sleep 3

          pgrep -af xfce4-terminal || true


      # ============================================================
      # 14. FINAL CHECK
      # ============================================================
      - name: Final Check
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id || true

          echo ""
          echo "RustDesk service:"
          sudo systemctl status rustdesk \
            --no-pager \
            -l || true

          echo ""
          echo "RustDesk process:"
          pgrep -af rustdesk || true

          echo ""
          echo "RustDesk network:"
          sudo ss -tunap 2>/dev/null |
            grep -Ei "rustdesk|21116|21117" ||
            true

          echo ""
          echo "Xvfb:"
          pgrep -af Xvfb || true

          echo ""
          echo "XFCE:"
          pgrep -af xfce4-session || true

          echo ""
          echo "Display:"
          DISPLAY=:99 xdpyinfo 2>/dev/null |
            grep "dimensions" ||
            true


      # ============================================================
      # 15. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RUSTDESK REMOTE DESKTOP READY"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id || true

          echo ""
          echo "Runner will remain active."

          while true; do
            sleep 60
          done
