name: Linux RDP + Tailscale
on:
  workflow_dispatch:
jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Setup Tailscale
        env:
          TS_KEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo -n "$TS_KEY" | tr -d ' \r\n' > /tmp/tskey
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=file:/tmp/tskey --hostname=gh-rdp-$(date +%s)
          rm -f /tmp/tskey
          echo "IP: $(tailscale ip -4)"
      - name: Install XRDP
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-session dbus-x11 xrdp xorgxrdp
          sudo sed -i 's/allowed_users=console/allowed_users=anybody/' /etc/X11/Xwrapper.config
          printf '#!/bin/sh\nunset DBUS_SESSION_BUS_ADDRESS\nunset XDG_RUNTIME_DIR\nstartxfce4\n' | sudo tee /etc/xrdp/startwm.sh
          sudo chmod +x /etc/xrdp/startwm.sh
          sudo useradd -m rdpuser || true
          echo "rdpuser:123456" | sudo chpasswd
          echo "startxfce4" | sudo tee /home/rdpuser/.xsession
          echo "startxfce4" > ~/.xsession
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
          sudo service xrdp restart
          sleep 5
      - name: Keep Alive
        run: |
          echo "IP: $(tailscale ip -4) User: rdpuser Pass: 123456"
          while true; do sleep 60; echo "[$(date)] Running"; done
