name: Ubuntu RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " UBUNTU RUSTDESK"
          echo "=========================================="

          echo ""
          echo "Operating System:"
          cat /etc/os-release

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h


      # ============================================================
      # 2. CREATE USER
      # ============================================================
      - name: Create User
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
          UBUNTU_PASSWORD: ${{ secrets.UBUNTU_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CREATING USER"
          echo "=========================================="

          if id "$UBUNTU_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$UBUNTU_USERNAME"
          fi

          echo "$UBUNTU_USERNAME:$UBUNTU_PASSWORD" | \
            sudo chpasswd

          sudo usermod -aG sudo "$UBUNTU_USERNAME"

          echo "$UBUNTU_USERNAME ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/$UBUNTU_USERNAME" >/dev/null

          sudo chmod 440 \
            "/etc/sudoers.d/$UBUNTU_USERNAME"

          sudo chown -R \
            "$UBUNTU_USERNAME:$UBUNTU_USERNAME" \
            "/home/$UBUNTU_USERNAME"

          echo "User created successfully."


      # ============================================================
      # 3. INSTALL XFCE + XORG DUMMY DISPLAY + LIGHTDM
      # ============================================================
      - name: Install Desktop Environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING XFCE + XORG"
          echo "=========================================="

          sudo apt-get update

          # Tell Debian/Ubuntu to use LightDM as display manager.
          echo "/usr/sbin/lightdm" | \
            sudo tee /etc/X11/default-display-manager >/dev/null

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            lightdm \
            xorg \
            xserver-xorg-core \
            xserver-xorg-video-dummy \
            dbus-x11 \
            x11-xserver-utils \
            x11-utils \
            xauth \
            xterm \
            curl \
            wget \
            ca-certificates \
            jq \
            procps \
            iproute2 \
            net-tools

          echo "Desktop packages installed."


      # ============================================================
      # 4. CONFIGURE VIRTUAL X11 DISPLAY
      # ============================================================
      - name: Configure Virtual X11 Display
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING VIRTUAL DISPLAY"
          echo "=========================================="

          sudo mkdir -p /etc/X11/xorg.conf.d

          sudo tee /etc/X11/xorg.conf.d/10-rustdesk-dummy.conf >/dev/null <<'EOF'
          Section "Device"
              Identifier "RustDeskDummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection

          Section "Monitor"
              Identifier "RustDeskDummyMonitor"
              HorizSync 30-80
              VertRefresh 50-75
          EndSection

          Section "Screen"
              Identifier "RustDeskDummyScreen"
              Device "RustDeskDummyDevice"
              Monitor "RustDeskDummyMonitor"
              DefaultDepth 24

              SubSection "Display"
                  Depth 24
                  Modes "1920x1080"
              EndSubSection
          EndSection

          Section "ServerLayout"
              Identifier "RustDeskDummyLayout"
              Screen 0 "RustDeskDummyScreen"
          EndSection
          EOF

          echo ""
          echo "Xorg configuration:"
          sudo cat /etc/X11/xorg.conf.d/10-rustdesk-dummy.conf


      # ============================================================
      # 5. CONFIGURE LIGHTDM
      # ============================================================
      - name: Configure LightDM
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING LIGHTDM"
          echo "=========================================="

          sudo mkdir -p /etc/lightdm

          sudo tee /etc/lightdm/lightdm.conf >/dev/null <<EOF
          [Seat:*]
          autologin-user=$UBUNTU_USERNAME
          autologin-user-timeout=0
          user-session=xfce
          greeter-session=lightdm-gtk-greeter
          display-setup-script=/usr/bin/xrandr --output DUMMY0 --mode 1920x1080
          EOF

          echo ""
          echo "LightDM configuration:"
          sudo cat /etc/lightdm/lightdm.conf


      # ============================================================
      # 6. ENABLE DESKTOP SERVICES
      # ============================================================
      - name: Enable Desktop
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " ENABLING DESKTOP"
          echo "=========================================="

          sudo systemctl unmask lightdm || true
          sudo systemctl enable lightdm

          sudo systemctl set-default graphical.target

          echo "Desktop services enabled."


      # ============================================================
      # 7. INSTALL RUSTDESK
      # ============================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          cd /tmp

          echo "Getting latest RustDesk release..."

          RELEASE_JSON="$(
            curl -fsSL \
              https://api.github.com/repos/rustdesk/rustdesk/releases/latest
          )"

          RUSTDESK_VERSION="$(
            echo "$RELEASE_JSON" |
              jq -r '.tag_name'
          )"

          echo "RustDesk version:"
          echo "$RUSTDESK_VERSION"

          DOWNLOAD_URL="$(
            echo "$RELEASE_JSON" |
              jq -r '
                .assets[]
                | select(
                    (.name | endswith(".deb"))
                    and
                    (.name | test("x86_64|amd64"; "i"))
                  )
                | .browser_download_url
              ' |
              head -n 1
          )"

          if [ -z "$DOWNLOAD_URL" ] || \
             [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: Could not find x86_64 RustDesk .deb"
            exit 1
          fi

          echo ""
          echo "Downloading:"
          echo "$DOWNLOAD_URL"

          curl -fL \
            "$DOWNLOAD_URL" \
            -o /tmp/rustdesk.deb

          echo ""
          echo "Installing RustDesk..."

          sudo apt-get install -fy \
            /tmp/rustdesk.deb

          echo ""
          echo "Installed version:"
          rustdesk --version


      # ============================================================
      # 8. START LIGHTDM / XFCE
      # ============================================================
      - name: Start Desktop
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " STARTING XFCE DESKTOP"
          echo "=========================================="

          sudo systemctl restart lightdm

          sleep 15

          echo ""
          echo "LightDM:"
          sudo systemctl status lightdm \
            --no-pager \
            -l || true

          echo ""
          echo "Display processes:"
          pgrep -af Xorg || true

          echo ""
          echo "XFCE processes:"
          pgrep -af xfce || true

          echo ""
          echo "DISPLAY sockets:"
          ls -la /tmp/.X11-unix/ 2>/dev/null || true

          echo ""
          echo "Desktop environment:"
          loginctl list-sessions || true


      # ============================================================
      # 9. CONFIGURE RUSTDESK HEADLESS MODE
      # ============================================================
      - name: Configure RustDesk Headless Mode
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK HEADLESS MODE"
          echo "=========================================="

          sudo rustdesk \
            --option \
            allow-linux-headless \
            Y

          echo "RustDesk headless mode enabled."


      # ============================================================
      # 10. SET PERMANENT PASSWORD
      # ============================================================
      - name: Set Permanent RustDesk Password
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " SETTING PERMANENT RUSTDESK PASSWORD"
          echo "=========================================="

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD secret is empty."
            exit 1
          fi

          sudo rustdesk \
            --password \
            "$RUSTDESK_PASSWORD"

          echo "Permanent password configured."


      # ============================================================
      # 11. RESTART RUSTDESK SERVICE
      # ============================================================
      - name: Restart RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " STARTING RUSTDESK SERVICE"
          echo "=========================================="

          sudo systemctl enable rustdesk

          sudo systemctl restart rustdesk

          sleep 10

          echo ""
          echo "RustDesk service:"
          sudo systemctl status rustdesk \
            --no-pager \
            -l


      # ============================================================
      # 12. GET RUSTDESK ID
      # ============================================================
      - name: Get RustDesk ID
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " RUSTDESK CONNECTION INFORMATION"
          echo "=========================================="

          sleep 5

          RUSTDESK_ID="$(sudo rustdesk --get-id)"

          if [ -z "$RUSTDESK_ID" ]; then
            echo "ERROR: RustDesk ID is empty."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo " RUSTDESK ID: $RUSTDESK_ID"
          echo "=========================================="

          echo ""
          echo "Password: configured from GitHub Secret"
          echo ""

          echo "RustDesk version:"
          rustdesk --version

          echo ""
          echo "RustDesk service:"
          sudo systemctl is-active rustdesk

          echo ""
          echo "RustDesk process:"
          pgrep -af rustdesk || true


      # ============================================================
      # 13. VERIFY DESKTOP
      # ============================================================
      - name: Verify Desktop
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " DESKTOP VERIFICATION"
          echo "=========================================="

          echo ""
          echo "Xorg:"
          pgrep -af Xorg || true

          echo ""
          echo "XFCE:"
          pgrep -af xfce4-session || true

          echo ""
          echo "LightDM:"
          sudo systemctl is-active lightdm || true

          echo ""
          echo "RustDesk:"
          sudo systemctl is-active rustdesk || true

          echo ""
          echo "Display sockets:"
          ls -la /tmp/.X11-unix/ 2>/dev/null || true

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id || true


      # ============================================================
      # 14. OPEN XFCE TERMINAL
      # ============================================================
      - name: Open XFCE Terminal
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set +e

          echo "=========================================="
          echo " OPENING XFCE TERMINAL"
          echo "=========================================="

          USER_DISPLAY=":0"

          sudo -u "$UBUNTU_USERNAME" \
            env DISPLAY="$USER_DISPLAY" \
            XAUTHORITY="/home/$UBUNTU_USERNAME/.Xauthority" \
            nohup xfce4-terminal \
            > /tmp/xfce-terminal.log 2>&1 &

          sleep 3

          pgrep -af xfce4-terminal || true


      # ============================================================
      # 15. FINAL INFORMATION
      # ============================================================
      - name: Final Information
        shell: bash
        run: |
          set +e

          echo ""
          echo "=================================================="
          echo "             RUSTDESK READY"
          echo "=================================================="

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id

          echo ""
          echo "RustDesk service:"
          sudo systemctl is-active rustdesk

          echo ""
          echo "LightDM:"
          sudo systemctl is-active lightdm

          echo ""
          echo "Xorg:"
          pgrep -af Xorg || true

          echo ""
          echo "XFCE:"
          pgrep -af xfce4-session || true

          echo ""
          echo "=================================================="
          echo " USE THE ID ABOVE IN YOUR RUSTDESK CLIENT"
          echo "=================================================="


      # ============================================================
      # 16. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo " RUNNER IS ONLINE"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id

          echo ""
          echo "The runner will stay alive until the"
          echo "GitHub Actions job reaches its timeout."

          while true; do
            sleep 60
          done
