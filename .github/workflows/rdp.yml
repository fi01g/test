name: Ubuntu RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================
      - name: System Information
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          echo "OS:"
          cat /etc/os-release

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h

          echo ""
          echo "Architecture:"
          uname -m


      # ============================================================
      # 2. CREATE USER
      # ============================================================
      - name: Create Abdulrahman User
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
          UBUNTU_PASSWORD: ${{ secrets.UBUNTU_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CREATING USER"
          echo "=========================================="

          if id "$UBUNTU_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            sudo useradd -m -s /bin/bash "$UBUNTU_USERNAME"
          fi

          echo "$UBUNTU_USERNAME:$UBUNTU_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$UBUNTU_USERNAME"

          echo "$UBUNTU_USERNAME ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/$UBUNTU_USERNAME" >/dev/null

          sudo chmod 440 "/etc/sudoers.d/$UBUNTU_USERNAME"

          echo "User created successfully."


      # ============================================================
      # 3. VERIFY USER
      # ============================================================
      - name: Verify User
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set +e

          echo "=========================================="
          echo " USER VERIFICATION"
          echo "=========================================="

          id "$UBUNTU_USERNAME"

          echo ""
          echo "Groups:"
          groups "$UBUNTU_USERNAME"

          echo ""
          echo "Sudo:"
          sudo -u "$UBUNTU_USERNAME" sudo -n whoami


      # ============================================================
      # 4. INSTALL XFCE
      # ============================================================
      - name: Install XFCE Desktop
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING XFCE"
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils \
            x11-utils \
            xauth \
            xterm \
            xvfb \
            curl \
            wget \
            ca-certificates \
            gnupg \
            jq \
            unzip \
            net-tools \
            iproute2 \
            procps

          echo "XFCE installation completed."


      # ============================================================
      # 5. PREPARE USER GUI
      # ============================================================
      - name: Prepare XFCE User
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " PREPARING XFCE USER"
          echo "=========================================="

          sudo -u "$UBUNTU_USERNAME" mkdir -p \
            "/home/$UBUNTU_USERNAME/.config/xfce4"

          sudo -u "$UBUNTU_USERNAME" mkdir -p \
            "/home/$UBUNTU_USERNAME/.cache"

          sudo -u "$UBUNTU_USERNAME" mkdir -p \
            "/home/$UBUNTU_USERNAME/.local/share"

          sudo chown -R "$UBUNTU_USERNAME:$UBUNTU_USERNAME" \
            "/home/$UBUNTU_USERNAME"

          echo "XFCE user directories ready."


      # ============================================================
      # 6. START X11 VIRTUAL DISPLAY
      # ============================================================
      - name: Start X11 Desktop
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " STARTING X11 DISPLAY"
          echo "=========================================="

          export DISPLAY=:99

          sudo pkill Xvfb || true

          sudo Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 5

          if pgrep -x Xvfb >/dev/null; then
            echo "Xvfb is running."
          else
            echo "ERROR: Xvfb failed to start."
            cat /tmp/xvfb.log || true
            exit 1
          fi

          echo "DISPLAY=$DISPLAY" | sudo tee /etc/environment >/dev/null


      # ============================================================
      # 7. START XFCE SESSION
      # ============================================================
      - name: Start XFCE Session
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " STARTING XFCE SESSION"
          echo "=========================================="

          sudo -u "$UBUNTU_USERNAME" bash -c '
            export DISPLAY=:99
            export XDG_SESSION_TYPE=x11
            export XDG_CURRENT_DESKTOP=XFCE
            export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
            export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

            nohup dbus-run-session startxfce4 \
              > /tmp/xfce.log 2>&1 &
          '

          sleep 12

          echo "=========================================="
          echo " XFCE PROCESSES"
          echo "=========================================="

          pgrep -af xfce || true

          echo ""
          echo "=========================================="
          echo " DISPLAY TEST"
          echo "=========================================="

          sudo -u "$UBUNTU_USERNAME" env DISPLAY=:99 xdpyinfo \
            | head -20 || true

          echo ""
          echo "XFCE log:"
          tail -100 /tmp/xfce.log || true


      # ============================================================
      # 8. INSTALL RUSTDESK
      # ============================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          cd /tmp

          echo "Fetching latest RustDesk release..."

          RELEASE_JSON="$(curl -fsSL \
            https://api.github.com/repos/rustdesk/rustdesk/releases/latest)"

          echo "$RELEASE_JSON" |
            jq -r '.tag_name'

          DOWNLOAD_URL="$(
            echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(
                  (.name | test("x86_64|amd64"; "i"))
                  and
                  (.name | endswith(".deb"))
                )
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "ERROR: Could not find RustDesk x86_64 .deb"
            exit 1
          fi

          echo "Download URL:"
          echo "$DOWNLOAD_URL"

          curl -fL "$DOWNLOAD_URL" -o rustdesk.deb

          echo ""
          echo "Installing RustDesk..."

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y ./rustdesk.deb

          echo ""
          echo "RustDesk version:"
          rustdesk --version


      # ============================================================
      # 9. ENABLE RUSTDESK SERVICE
      # ============================================================
      - name: Start RustDesk Service
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " STARTING RUSTDESK SERVICE"
          echo "=========================================="

          sudo systemctl daemon-reload

          sudo systemctl enable rustdesk

          sudo systemctl restart rustdesk

          sleep 8

          echo ""
          echo "RustDesk service:"
          sudo systemctl status rustdesk --no-pager || true

          echo ""
          echo "RustDesk process:"
          pgrep -af rustdesk || true


      # ============================================================
      # 10. CONFIGURE RUSTDESK PASSWORD
      # ============================================================
      - name: Configure RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK"
          echo "=========================================="

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD secret is empty."
            exit 1
          fi

          echo "Setting permanent password..."

          sudo rustdesk --password "$RUSTDESK_PASSWORD"

          echo ""
          echo "Setting password verification..."

          sudo rustdesk \
            --option verification-method \
            use-permanent-password

          sudo rustdesk \
            --option approve-mode \
            password

          echo ""
          echo "Enabling Linux headless mode..."

          sudo rustdesk \
            --option allow-linux-headless \
            Y

          echo ""
          echo "Restarting RustDesk..."

          sudo systemctl restart rustdesk

          sleep 8

          echo "RustDesk configured."


      # ============================================================
      # 11. GET RUSTDESK ID
      # ============================================================
      - name: Get RustDesk ID
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " RUSTDESK ID"
          echo "=========================================="

          echo "RustDesk version:"
          rustdesk --version

          echo ""
          echo "RustDesk ID:"

          sudo rustdesk --get-id || true

          echo ""
          echo "RustDesk service:"
          sudo systemctl is-active rustdesk || true

          echo ""
          echo "RustDesk process:"
          pgrep -af rustdesk || true


      # ============================================================
      # 12. INSPECT RUSTDESK CONFIGURATION
      # ============================================================
      - name: Inspect RustDesk Configuration
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " RUSTDESK CONFIGURATION INSPECTION"
          echo "=========================================="

          echo ""
          echo "RustDesk binary:"
          command -v rustdesk

          echo ""
          echo "RustDesk version:"
          rustdesk --version

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id || true

          # --------------------------------------------------------
          # SYSTEMD UNIT
          # --------------------------------------------------------
          echo ""
          echo "=========================================="
          echo " SYSTEMD UNIT"
          echo "=========================================="

          sudo systemctl cat rustdesk || true

          echo ""
          echo "Service properties:"
          sudo systemctl show rustdesk \
            -p User \
            -p Group \
            -p ExecStart \
            -p Environment \
            -p WorkingDirectory \
            --no-pager || true

          # --------------------------------------------------------
          # CONFIG FILE DISCOVERY
          # --------------------------------------------------------
          echo ""
          echo "=========================================="
          echo " CONFIG FILES"
          echo "=========================================="

          sudo find \
            /root \
            "/home/$USER" \
            /home/runner \
            /etc \
            -type f \
            \( \
              -name "RustDesk.toml" \
              -o \
              -name "RustDesk2.toml" \
            \) \
            -print 2>/dev/null || true

          # --------------------------------------------------------
          # ROOT CONFIG
          # --------------------------------------------------------
          echo ""
          echo "=========================================="
          echo " ROOT CONFIG DIRECTORY"
          echo "=========================================="

          sudo ls -la \
            /root/.config/rustdesk \
            2>/dev/null || true

          echo ""
          echo "Root RustDesk2.toml relevant settings:"

          if [ -f /root/.config/rustdesk/RustDesk2.toml ]; then
            sudo grep -Ei \
              'rendezvous|relay|server|verification|approve|headless|direct|key|password' \
              /root/.config/rustdesk/RustDesk2.toml \
              2>/dev/null |
              sed -E \
                's/(key[[:space:]]*=[[:space:]]*).*/\1REDACTED/I;
                 s/(password[[:space:]]*=[[:space:]]*).*/\1REDACTED/I' ||
              true
          else
            echo "No /root/.config/rustdesk/RustDesk2.toml"
          fi

          echo ""
          echo "Root RustDesk.toml relevant settings:"

          if [ -f /root/.config/rustdesk/RustDesk.toml ]; then
            sudo grep -Ei \
              'rendezvous|relay|server|verification|approve|headless|direct|key|password' \
              /root/.config/rustdesk/RustDesk.toml \
              2>/dev/null |
              sed -E \
                's/(key[[:space:]]*=[[:space:]]*).*/\1REDACTED/I;
                 s/(password[[:space:]]*=[[:space:]]*).*/\1REDACTED/I' ||
              true
          else
            echo "No /root/.config/rustdesk/RustDesk.toml"
          fi

          # --------------------------------------------------------
          # RUNNER USER CONFIG
          # --------------------------------------------------------
          echo ""
          echo "=========================================="
          echo " RUNNER USER CONFIG"
          echo "=========================================="

          sudo ls -la \
            /home/runner/.config/rustdesk \
            2>/dev/null || true

          echo ""
          echo "Runner RustDesk2.toml relevant settings:"

          if [ -f /home/runner/.config/rustdesk/RustDesk2.toml ]; then
            sudo grep -Ei \
              'rendezvous|relay|server|verification|approve|headless|direct|key|password' \
              /home/runner/.config/rustdesk/RustDesk2.toml \
              2>/dev/null |
              sed -E \
                's/(key[[:space:]]*=[[:space:]]*).*/\1REDACTED/I;
                 s/(password[[:space:]]*=[[:space:]]*).*/\1REDACTED/I' ||
              true
          else
            echo "No /home/runner/.config/rustdesk/RustDesk2.toml"
          fi

          echo ""
          echo "Runner RustDesk.toml relevant settings:"

          if [ -f /home/runner/.config/rustdesk/RustDesk.toml ]; then
            sudo grep -Ei \
              'rendezvous|relay|server|verification|approve|headless|direct|key|password' \
              /home/runner/.config/rustdesk/RustDesk.toml \
              2>/dev/null |
              sed -E \
                's/(key[[:space:]]*=[[:space:]]*).*/\1REDACTED/I;
                 s/(password[[:space:]]*=[[:space:]]*).*/\1REDACTED/I' ||
              true
          else
            echo "No /home/runner/.config/rustdesk/RustDesk.toml"
          fi

          # --------------------------------------------------------
          # RUSTDESK LOGS
          # --------------------------------------------------------
          echo ""
          echo "=========================================="
          echo " RUSTDESK LOG FILES"
          echo "=========================================="

          sudo find \
            /root/.local/share/logs/RustDesk \
            /home/runner/.local/share/logs/RustDesk \
            /home/runner/.config/rustdesk \
            -type f \
            2>/dev/null |
            sort || true

          echo ""
          echo "Recent RustDesk logs:"

          sudo find \
            /root/.local/share/logs/RustDesk \
            /home/runner/.local/share/logs/RustDesk \
            -type f \
            -print \
            -exec tail -80 {} \; \
            2>/dev/null || true

          # --------------------------------------------------------
          # PROCESSES
          # --------------------------------------------------------
          echo ""
          echo "=========================================="
          echo " RUSTDESK PROCESSES"
          echo "=========================================="

          pgrep -af rustdesk || true

          # --------------------------------------------------------
          # NETWORK
          # --------------------------------------------------------
          echo ""
          echo "=========================================="
          echo " RUSTDESK NETWORK CONNECTIONS"
          echo "=========================================="

          sudo ss -tunap 2>/dev/null |
            grep -i rustdesk ||
            true

          echo ""
          echo "All established connections:"
          sudo ss -tunap 2>/dev/null |
            grep ESTAB ||
            true

          # --------------------------------------------------------
          # DNS
          # --------------------------------------------------------
          echo ""
          echo "=========================================="
          echo " DNS TEST"
          echo "=========================================="

          getent hosts rustdesk.com || true

          # --------------------------------------------------------
          # INTERNET
          # --------------------------------------------------------
          echo ""
          echo "=========================================="
          echo " INTERNET TEST"
          echo "=========================================="

          curl -I \
            --connect-timeout 10 \
            https://rustdesk.com \
            2>&1 |
            head -30 || true

          # --------------------------------------------------------
          # JOURNAL
          # --------------------------------------------------------
          echo ""
          echo "=========================================="
          echo " RUSTDESK JOURNAL"
          echo "=========================================="

          sudo journalctl \
            -u rustdesk \
            --no-pager \
            -n 150 \
            2>/dev/null || true


      # ============================================================
      # 13. OPEN XFCE TERMINAL
      # ============================================================
      - name: Open XFCE Terminal
        shell: bash
        env:
          UBUNTU_USERNAME: ${{ secrets.UBUNTU_USERNAME }}
        run: |
          set +e

          echo "=========================================="
          echo " OPENING XFCE TERMINAL"
          echo "=========================================="

          sudo -u "$UBUNTU_USERNAME" \
            env DISPLAY=:99 \
            nohup xfce4-terminal \
            > /tmp/xfce-terminal.log 2>&1 &

          sleep 3

          pgrep -af xfce4-terminal || true


      # ============================================================
      # 14. FINAL CHECK
      # ============================================================
      - name: Final Check
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id || true

          echo ""
          echo "RustDesk service:"
          sudo systemctl status rustdesk \
            --no-pager \
            -l || true

          echo ""
          echo "Xvfb:"
          pgrep -af Xvfb || true

          echo ""
          echo "XFCE:"
          pgrep -af xfce4-session || true

          echo ""
          echo "Display:"
          DISPLAY=:99 xdpyinfo 2>/dev/null |
            grep -E 'dimensions|depth' ||
            true

          echo ""
          echo "RustDesk processes:"
          pgrep -af rustdesk || true


      # ============================================================
      # 15. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RUSTDESK REMOTE DESKTOP READY"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          sudo rustdesk --get-id || true

          echo ""
          echo "Runner will remain active for the job duration."
          echo "=========================================="

          while true; do
            sleep 60
          done
