name: macOS RDP - Tailscale

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true


      # =========================================================
      # 2. CREATE ABDULRAHMAN
      # =========================================================
      - name: Create Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CREATING ABDULRAHMAN"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo ""
          echo "Adding Administrator privileges..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "User:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"


      # =========================================================
      # 3. VERIFY USER
      # =========================================================
      - name: Verify Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING ABDULRAHMAN"
          echo "=========================================="

          echo ""
          echo "whoami:"
          sudo -u "$MACOS_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Home:"
          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

          echo ""
          echo "Checking Administrator..."

          ADMIN_CHECK=$(
            dseditgroup \
              -o checkmember \
              -m "$MACOS_USERNAME" \
              admin
          )

          echo "$ADMIN_CHECK"

          if echo "$ADMIN_CHECK" | grep -qi "yes"; then
            echo "SUCCESS: Administrator."
          else
            echo "ERROR: Not Administrator."
            exit 1
          fi


      # =========================================================
      # 4. CONFIGURE AUTO LOGIN
      # =========================================================
      - name: Configure Abdulrahman Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            || true

          echo ""
          echo "Auto-login status:"

          sudo sysadminctl \
            -autologin status \
            || true

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "NOTE:"
          echo "Auto-login applies to a future GUI login."
          echo "It does not replace the current GUI session."


      # =========================================================
      # 5. INSTALL TAILSCALE CLI
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING TAILSCALE"
          echo "=========================================="

          brew update

          brew install tailscale

          echo ""
          echo "Tailscale version:"

          tailscale version

          echo ""
          echo "tailscaled:"
          which tailscaled || true

          echo ""
          echo "tailscale:"
          which tailscale


      # =========================================================
      # 6. START TAILSCALE
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |
          set -e

          echo "=========================================="
          echo " STARTING TAILSCALE"
          echo "=========================================="

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY is empty."
            exit 1
          fi

          echo ""
          echo "Starting tailscaled..."

          sudo brew services start tailscale

          sleep 10

          echo ""
          echo "Tailscale daemon:"
          pgrep -fl tailscaled || true

          echo ""
          echo "Authenticating Tailscale..."

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp" \
            --accept-dns=true

          sleep 10

          echo ""
          echo "=========================================="
          echo " TAILSCALE STATUS"
          echo "=========================================="

          sudo tailscale status

          echo ""
          echo "Tailscale IP:"

          TAILSCALE_IP=$(
            sudo tailscale ip -4 | head -1
          )

          echo "$TAILSCALE_IP"

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: Tailscale IPv4 not found."
            exit 1
          fi

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"


      # =========================================================
      # 7. INSTALL RDP SERVER
      # =========================================================
      - name: Install macOS RDP Server
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING macOS RDP SERVER"
          echo "=========================================="

          echo ""
          echo "Installing Rust..."

          brew install rust

          echo ""
          echo "Rust:"
          rustc --version

          echo ""
          echo "Cargo:"
          cargo --version

          echo ""
          echo "Cloning macrdp..."

          cd "$RUNNER_TEMP"

          git clone \
            https://github.com/clintcan/macrdp.git \
            macrdp

          cd macrdp

          echo ""
          echo "Building macrdp..."

          cargo build --release

          echo ""
          echo "Build completed."

          echo ""
          echo "Signing macrdp..."

          codesign \
            -s - \
            --force \
            target/release/macrdp

          echo ""
          echo "Installing binary..."

          sudo mkdir -p /usr/local/bin

          sudo cp \
            target/release/macrdp \
            /usr/local/bin/macrdp

          sudo chmod 755 \
            /usr/local/bin/macrdp

          echo ""
          echo "macrdp version/build:"
          /usr/local/bin/macrdp --help | head -30 || true


      # =========================================================
      # 8. OPEN macOS PRIVACY SETTINGS
      # =========================================================
      - name: Open RDP Privacy Permissions
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " OPENING RDP PRIVACY SETTINGS"
          echo "=========================================="

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Opening Screen Recording..."

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension?Privacy_ScreenCapture" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Opening Accessibility..."

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension?Privacy_Accessibility" \
            2>&1 || true

          sleep 5

          echo ""
          echo "=========================================="
          echo " IMPORTANT"
          echo "=========================================="

          echo ""
          echo "macrdp requires:"
          echo ""
          echo "1. Screen Recording"
          echo "2. Accessibility"
          echo ""
          echo "macOS may require these permissions"
          echo "to be approved manually."


      # =========================================================
      # 9. START macRDPP
      # =========================================================
      - name: Start macOS RDP Server
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " STARTING macOS RDP SERVER"
          echo "=========================================="

          RDP="/usr/local/bin/macrdp"

          if [ ! -x "$RDP" ]; then
            echo "ERROR: macrdp not found."
            exit 1
          fi

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Starting macrdp..."

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            nohup "$RDP" \
              --bind 0.0.0.0:3390 \
              --enable-h264 \
              --adaptive-bitrate \
              >/tmp/macrdp.log 2>&1 &

          sleep 10

          echo ""
          echo "macrdp process:"

          pgrep -fl macrdp || true

          echo ""
          echo "macrdp log:"

          tail -100 \
            /tmp/macrdp.log \
            2>/dev/null || true


      # =========================================================
      # 10. VERIFY RDP PORT
      # =========================================================
      - name: Verify RDP Server
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING RDP SERVER"
          echo "=========================================="

          echo ""
          echo "Listening ports:"

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            || true

          echo ""
          echo "Testing local RDP port..."

          nc \
            -zv \
            127.0.0.1 \
            3390

          echo ""
          echo "RDP port 3390 is OPEN."


      # =========================================================
      # 11. PRINT CONNECTION INFORMATION
      # =========================================================
      - name: RDP Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          echo ""
          echo "=========================================="
          echo "       MACOS RDP IS READY"
          echo "=========================================="

          echo ""
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo ""
          echo "RDP Address:"
          echo "$TAILSCALE_IP:3390"

          echo ""
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "Password:"
          echo "Use MACOS_PASSWORD secret"

          echo ""
          echo "=========================================="
          echo " MICROSOFT REMOTE DESKTOP"
          echo "=========================================="

          echo ""
          echo "PC:"
          echo "$TAILSCALE_IP:3390"

          echo ""
          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "=========================================="

          echo ""
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"


      # =========================================================
      # 12. FINAL CHECK
      # =========================================================
      - name: Final Check
        shell: bash
        run: |
          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true

          echo ""
          echo "Tailscale:"
          sudo tailscale status || true

          echo ""
          echo "Tailscale IP:"
          sudo tailscale ip -4 || true

          echo ""
          echo "macrdp:"
          pgrep -fl macrdp || true

          echo ""
          echo "RDP:"
          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            || true


      # =========================================================
      # 13. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RDP SERVER IS ONLINE"
          echo "=========================================="

          END_TIME=$(( $(date +%s) + 20400 ))

          while [ "$(date +%s)" -lt "$END_TIME" ]
          do

            echo ""
            echo "[$(date)] Server alive"

            echo ""
            echo "Console user:"
            stat -f "%Su" /dev/console \
              2>/dev/null || echo "unknown"

            echo ""
            echo "Tailscale:"
            sudo tailscale status \
              2>/dev/null || true

            echo ""
            echo "Tailscale IP:"
            sudo tailscale ip -4 \
              2>/dev/null || true

            echo ""
            echo "RDP:"
            lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true

            echo ""
            echo "macrdp:"
            pgrep -fl macrdp \
              2>/dev/null || true

            sleep 300

          done

          echo ""
          echo "Keep Alive period finished."


      # =========================================================
      # 14. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo " CLEANUP"
          echo "=========================================="

          echo ""
          echo "Stopping macrdp..."

          sudo pkill -f \
            "/usr/local/bin/macrdp" \
            || true

          echo ""
          echo "Stopping Tailscale..."

          sudo tailscale down \
            || true

          echo ""
          echo "Stopping Tailscale service..."

          sudo brew services stop tailscale \
            || true

          echo ""
          echo "Cleanup finished."


      # =========================================================
      # 15. FINAL
      # =========================================================
      - name: Final
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo " MACOS RDP CYCLE FINISHED"
          echo "=========================================="
