name: macOS RustDesk

on:
  workflow_dispatch:

jobs:
  rustdesk:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      - name: macOS Info
        run: |
          echo "===== macOS ====="
          sw_vers
          echo ""
          echo "===== Architecture ====="
          uname -m

      - name: Install RustDesk
        run: |
          set -e

          ARCH=$(uname -m)

          echo "Architecture: $ARCH"

          if [ "$ARCH" = "arm64" ]; then
            ARCH_NAME="aarch64"
          else
            ARCH_NAME="x86_64"
          fi

          echo "Downloading RustDesk..."

          curl -fsSL \
            https://api.github.com/repos/rustdesk/rustdesk/releases/latest \
            -o /tmp/release.json

          URL=$(python3 -c "
          import json

          data = json.load(open('/tmp/release.json'))

          for asset in data['assets']:
              name = asset['name'].lower()

              if '$ARCH_NAME' in name and name.endswith('.dmg'):
                  print(asset['browser_download_url'])
                  break
          ")

          if [ -z "$URL" ]; then
            echo "ERROR: RustDesk DMG not found."
            echo ""
            echo "Available files:"
            python3 -c "
          import json
          data=json.load(open('/tmp/release.json'))
          for a in data['assets']:
              print(a['name'])
          "
            exit 1
          fi

          echo "Download URL:"
          echo "$URL"

          curl -fL "$URL" -o /tmp/rustdesk.dmg

          echo "RustDesk downloaded successfully."

      - name: Install Application
        run: |
          set -e

          echo "Mounting RustDesk..."

          hdiutil attach /tmp/rustdesk.dmg -nobrowse -readonly

          APP=$(find /Volumes -name "RustDesk.app" -type d -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: RustDesk.app not found."
            exit 1
          fi

          echo "Found:"
          echo "$APP"

          sudo rm -rf /Applications/RustDesk.app

          sudo cp -R "$APP" /Applications/RustDesk.app

          hdiutil detach "$(dirname "$APP")" || true

          echo "RustDesk installed successfully."

      - name: Start RustDesk
        run: |
          echo "Starting RustDesk..."

          open -a "/Applications/RustDesk.app"

          sleep 15

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo ""
          echo "======================================"
          echo "        RUSTDESK INFORMATION"
          echo "======================================"

          if [ -f "$RUSTDESK" ]; then

            ID=$("$RUSTDESK" --get-id 2>/dev/null || true)

            echo "RustDesk ID: $ID"

          else

            echo "RustDesk executable not found."

          fi

          echo "======================================"

      - name: Keep Runner Alive
        run: |
          echo ""
          echo "======================================"
          echo "       MACOS RUNNER ONLINE"
          echo "======================================"
          echo ""

          while true
          do
            echo "Runner alive: $(date)"
            sleep 300
          done
