name: macOS Tailscale RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          sw_vers
          echo
          uname -a
          echo
          whoami
          echo
          id
          echo
          uname -m

      # =========================================================
      # 2. CREATE MACOS USER
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING MACOS USER"
          echo "=================================================="

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            NEXT_UID=$(dscl . -list /Users UniqueID |
              awk '{print $2}' |
              sort -n |
              tail -1)

            NEXT_UID=$((NEXT_UID + 1))

            sudo dscl . -create "/Users/$MACOS_USERNAME"
            sudo dscl . -create "/Users/$MACOS_USERNAME" UserShell /bin/zsh
            sudo dscl . -create "/Users/$MACOS_USERNAME" RealName "$MACOS_USERNAME"
            sudo dscl . -create "/Users/$MACOS_USERNAME" UniqueID "$NEXT_UID"
            sudo dscl . -create "/Users/$MACOS_USERNAME" PrimaryGroupID 20
            sudo dscl . -create "/Users/$MACOS_USERNAME" NFSHomeDirectory "/Users/$MACOS_USERNAME"

            sudo mkdir -p "/Users/$MACOS_USERNAME"

            sudo chown -R \
              "$MACOS_USERNAME:staff" \
              "/Users/$MACOS_USERNAME"

            sudo dscl . -passwd \
              "/Users/$MACOS_USERNAME" \
              "$MACOS_PASSWORD"

            echo "User created."
          fi

          id "$MACOS_USERNAME"

      # =========================================================
      # 3. MAKE USER ADMIN
      # =========================================================
      - name: Make User Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "ADDING USER TO ADMIN GROUP"
          echo "=================================================="

          sudo dseditgroup -o edit \
            -a "$MACOS_USERNAME" \
            -t user admin

          sudo dseditgroup -o checkmember \
            -m "$MACOS_USERNAME" admin || true

      # =========================================================
      # 4. CONFIGURE AUTO LOGIN
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CONFIGURING AUTO LOGIN"
          echo "=================================================="

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            DisableFDEAutoLogin \
            -bool false

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser || true

      # =========================================================
      # 5. INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING TAILSCALE"
          echo "=================================================="

          TAILSCALE_PKG="/tmp/Tailscale.pkg"

          curl -fL \
            "https://pkgs.tailscale.com/stable/Tailscale-latest-macos.pkg" \
            -o "$TAILSCALE_PKG"

          sudo installer \
            -pkg "$TAILSCALE_PKG" \
            -target /

          echo
          echo "Tailscale installed."

          echo
          echo "Tailscale binaries:"

          ls -lah /usr/local/bin/tailscale 2>/dev/null || true
          ls -lah /usr/local/bin/tailscaled 2>/dev/null || true

          echo
          echo "Processes:"
          ps aux | grep -i tailscale | grep -v grep || true

      # =========================================================
      # 6. START TAILSCALED
      # =========================================================
      - name: Start Tailscaled
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "STARTING TAILSCALED"
          echo "=================================================="

          TAILSCALED_BIN="/usr/local/bin/tailscaled"

          if [ ! -x "$TAILSCALED_BIN" ]; then
            echo "ERROR: tailscaled not found:"
            ls -lah /usr/local/bin/ | grep -i tailscale || true
            exit 1
          fi

          echo "tailscaled:"
          echo "$TAILSCALED_BIN"

          echo
          echo "Existing process:"
          ps aux | grep tailscaled | grep -v grep || true

          echo
          echo "LaunchDaemon:"
          sudo ls -lah /Library/LaunchDaemons |
            grep -i tailscale || true

          # If the daemon is already running, don't start another one.
          if pgrep -f "/usr/local/bin/tailscaled" >/dev/null 2>&1; then
            echo
            echo "tailscaled is already running."
          else
            echo
            echo "Starting tailscaled manually..."

            sudo "$TAILSCALED_BIN" \
              --state=/var/lib/tailscale/tailscaled.state \
              >/tmp/tailscaled.stdout 2>/tmp/tailscaled.stderr &

            TAILSCALED_PID=$!

            echo "tailscaled PID:"
            echo "$TAILSCALED_PID"
          fi

          sleep 3

          echo
          echo "Current tailscaled process:"
          ps aux | grep tailscaled | grep -v grep || true

      # =========================================================
      # 7. WAIT FOR TAILSCALED API
      # =========================================================
      - name: Wait For Tailscaled
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "WAITING FOR TAILSCALED"
          echo "=================================================="

          READY=0

          for i in $(seq 1 60); do

            OUTPUT=$(sudo /usr/local/bin/tailscale status \
              2>&1)

            EXIT_CODE=$?

            echo "Waiting... $i/60"

            # IMPORTANT:
            # "Logged out." means the daemon is responding.
            # It does NOT mean tailscaled is broken.
            if echo "$OUTPUT" | grep -qi "Logged out"; then
              echo
              echo "tailscaled is READY."
              echo "Current state: Logged out"
              READY=1
              break
            fi

            # Any valid status response also means the daemon
            # is responding.
            if [ "$EXIT_CODE" -eq 0 ]; then
              echo
              echo "tailscaled is READY."
              echo "$OUTPUT"
              READY=1
              break
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then

            echo
            echo "ERROR: tailscaled did not become ready."

            echo
            echo "tailscale status:"
            sudo /usr/local/bin/tailscale status \
              2>&1 || true

            echo
            echo "tailscaled stdout:"
            cat /tmp/tailscaled.stdout \
              2>/dev/null || true

            echo
            echo "tailscaled stderr:"
            cat /tmp/tailscaled.stderr \
              2>/dev/null || true

            echo
            echo "Processes:"
            ps aux | grep -i tailscale | grep -v grep || true

            exit 1
          fi

      # =========================================================
      # 8. AUTHENTICATE TAILSCALE
      # =========================================================
      - name: Authenticate Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          echo "=================================================="
          echo "AUTHENTICATING TAILSCALE"
          echo "=================================================="

          TAILSCALE_BIN="/usr/local/bin/tailscale"

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY is empty."
            exit 1
          fi

          echo
          echo "Checking current state first..."

          CURRENT_STATUS=$(
            sudo "$TAILSCALE_BIN" status 2>&1
          )

          echo "$CURRENT_STATUS"

          # If already authenticated, DON'T run tailscale up again.
          if ! echo "$CURRENT_STATUS" | grep -qi "Logged out"; then

            echo
            echo "Tailscale appears to be authenticated already."
            echo "Skipping tailscale up."

          else

            echo
            echo "Tailscale is logged out."
            echo "Running tailscale up..."

            sudo "$TAILSCALE_BIN" up \
              --auth-key="$TAILSCALE_AUTH_KEY" \
              --hostname="github-macos-rdp"

            UP_EXIT_CODE=$?

            echo
            echo "tailscale up exit code:"
            echo "$UP_EXIT_CODE"

            if [ "$UP_EXIT_CODE" -ne 0 ]; then
              echo
              echo "ERROR: tailscale up failed."

              echo
              echo "Status after failure:"
              sudo "$TAILSCALE_BIN" status 2>&1 || true

              exit "$UP_EXIT_CODE"
            fi

          fi

      # =========================================================
      # 9. VERIFY TAILSCALE
      # =========================================================
      - name: Verify Tailscale
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "VERIFYING TAILSCALE"
          echo "=================================================="

          TAILSCALE_BIN="/usr/local/bin/tailscale"

          echo
          echo "Status:"
          sudo "$TAILSCALE_BIN" status

          echo
          echo "Waiting for Tailscale IPv4..."

          TAILSCALE_IP=""

          for i in $(seq 1 30); do

            TAILSCALE_IP=$(
              sudo "$TAILSCALE_BIN" ip -4 2>/dev/null |
              head -1
            )

            if [ -n "$TAILSCALE_IP" ]; then
              break
            fi

            echo "Waiting... $i/30"
            sleep 1
          done

          if [ -z "$TAILSCALE_IP" ]; then
            echo
            echo "ERROR: No Tailscale IPv4 address."

            sudo "$TAILSCALE_BIN" status || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "TAILSCALE IPv4:"
          echo "$TAILSCALE_IP"
          echo "=========================================="

          echo
          echo "Tailscale netcheck:"
          sudo "$TAILSCALE_BIN" netcheck || true

      # =========================================================
      # 10. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING RUST"
          echo "=================================================="

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else
            curl --proto '=https' \
              --tlsv1.2 \
              -sSf \
              https://sh.rustup.rs |
              sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

      # =========================================================
      # 11. CLONE MACRDP
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLONING MACRDP"
          echo "=================================================="

          rm -rf "$HOME/macrdp"

          git clone \
            --depth 1 \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          git rev-parse HEAD

      # =========================================================
      # 12. BUILD MACRDP
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          source "$HOME/.cargo/env"

          echo "=================================================="
          echo "BUILDING MACRDP"
          echo "=================================================="

          cd "$HOME/macrdp"

          cargo build --release

          echo
          echo "Build completed."

          find target/release \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -print

      # =========================================================
      # 13. INSTALL MACRDP
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING MACRDP"
          echo "=================================================="

          MACRDP_BIN="$HOME/macrdp/target/release/macrdp"

          if [ ! -x "$MACRDP_BIN" ]; then
            echo "ERROR: macrdp binary not found."
            exit 1
          fi

          sudo install -m 755 \
            "$MACRDP_BIN" \
            /usr/local/bin/macrdp

          ls -lah /usr/local/bin/macrdp

          echo
          echo "macrdp help:"
          /usr/local/bin/macrdp --help || true

      # =========================================================
      # 14. PREPARE MACRDP
      # =========================================================
      - name: Prepare macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "PREPARING MACRDP"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"

          sudo mkdir -p \
            "$USER_HOME/Library/Logs/macrdp" \
            "$USER_HOME/Library/LaunchAgents"

          sudo chown -R \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/Logs/macrdp" \
            "$USER_HOME/Library/LaunchAgents"

      # =========================================================
      # 15. CREATE MACRDP LAUNCHAGENT
      # =========================================================
      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING MACRDP LAUNCHAGENT"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"
          PLIST_TMP="/tmp/com.macrdp.server.plist"

          cat > "$PLIST_TMP" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>Label</key>
              <string>com.macrdp.server</string>

              <key>ProgramArguments</key>
              <array>

                  <string>/usr/local/bin/macrdp</string>

                  <string>--bind</string>
                  <string>0.0.0.0:3390</string>

                  <string>--username</string>
                  <string>$MACOS_USERNAME</string>

                  <string>--password</string>
                  <string>$MACOS_PASSWORD</string>

                  <string>--enable-h264</string>

                  <string>--fps</string>
                  <string>60</string>

                  <string>--bitrate</string>
                  <string>8</string>

                  <string>--keyframe-interval</string>
                  <string>2</string>

                  <string>--flush-frames</string>
                  <string>4</string>

                  <string>--virtual-display</string>

                  <string>--log-dir</string>
                  <string>$USER_HOME/Library/Logs/macrdp</string>

                  <string>--verbose</string>

              </array>

              <key>WorkingDirectory</key>
              <string>$USER_HOME</string>

              <key>EnvironmentVariables</key>
              <dict>

                  <key>PATH</key>
                  <string>/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>

                  <key>HOME</key>
                  <string>$USER_HOME</string>

                  <key>USER</key>
                  <string>$MACOS_USERNAME</string>

              </dict>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <true/>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>ThrottleInterval</key>
              <integer>5</integer>

              <key>StandardOutPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stdout.log</string>

              <key>StandardErrorPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stderr.log</string>

          </dict>
          </plist>
          EOF

          sudo cp \
            "$PLIST_TMP" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chown \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chmod 644 \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo plutil -lint \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

      # =========================================================
      # 16. START MACRDP
      # =========================================================
      - name: Start macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "STARTING MACRDP"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"
          USER_ID=$(id -u "$MACOS_USERNAME")
          PLIST="$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo "User:"
          echo "$MACOS_USERNAME"

          echo "UID:"
          echo "$USER_ID"

          echo
          echo "Bootstrapping LaunchAgent..."

          sudo launchctl bootout \
            "gui/$USER_ID/com.macrdp.server" \
            2>/dev/null || true

          sudo launchctl bootstrap \
            "gui/$USER_ID" \
            "$PLIST"

          BOOTSTRAP_EXIT=$?

          echo
          echo "Bootstrap exit code:"
          echo "$BOOTSTRAP_EXIT"

          sleep 5

          echo
          echo "LaunchAgent status:"

          sudo launchctl print \
            "gui/$USER_ID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "macrdp processes:"

          ps aux | grep macrdp | grep -v grep || true

          echo
          echo "macrdp port:"

          sudo lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN || true

          echo
          echo "stdout:"
          cat "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "stderr:"
          cat "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

      # =========================================================
      # 17. VERIFY RDP
      # =========================================================
      - name: Verify RDP
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "VERIFYING RDP"
          echo "=================================================="

          USER_ID=$(id -u "$MACOS_USERNAME")
          USER_HOME="/Users/$MACOS_USERNAME"

          echo
          echo "Port 3390:"
          sudo lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN || true

          echo
          echo "macrdp:"
          ps aux | grep macrdp | grep -v grep || true

          echo
          echo "LaunchAgent:"
          sudo launchctl print \
            "gui/$USER_ID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "stdout:"
          cat "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "stderr:"
          cat "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

      # =========================================================
      # 18. CONNECTION INFORMATION
      # =========================================================
      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo
          echo "=================================================="
          echo "REMOTE DESKTOP CONNECTION INFORMATION"
          echo "=================================================="

          TAILSCALE_IP=$(
            sudo /usr/local/bin/tailscale ip -4 2>/dev/null |
            head -1
          )

          echo
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo
          echo "RDP address:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "Password:"
          echo "(MACOS_PASSWORD secret)"

          echo
          echo "=================================================="
          echo "MICROSOFT REMOTE DESKTOP"
          echo "=================================================="

          echo
          echo "PC:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "User:"
          echo "$MACOS_USERNAME"

          echo
          echo "=================================================="

          echo
          echo "Tailscale status:"
          sudo /usr/local/bin/tailscale status || true

      # =========================================================
      # 19. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "KEEPING RUNNER ALIVE"
          echo "=================================================="

          echo "Runner will remain alive for approximately 5h 40m."

          END=$((SECONDS + 20400))

          while [ "$SECONDS" -lt "$END" ]; do

            REMAINING=$((END - SECONDS))

            echo
            echo "=================================================="
            echo "REMOTE SESSION STATUS"
            echo "Remaining seconds: $REMAINING"
            echo "=================================================="

            echo
            echo "Tailscale:"
            sudo /usr/local/bin/tailscale status 2>&1 || true

            echo
            echo "Tailscale IP:"
            sudo /usr/local/bin/tailscale ip -4 2>&1 || true

            echo
            echo "RDP port:"
            sudo lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN 2>&1 || true

            echo
            echo "macrdp:"
            ps aux | grep macrdp | grep -v grep || true

            echo
            echo "tailscaled:"
            ps aux | grep tailscaled | grep -v grep || true

            sleep 60

          done

          echo
          echo "5h40m elapsed."

      # =========================================================
      # 20. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          if [ -n "$MACOS_USERNAME" ]; then

            USER_ID=$(id -u "$MACOS_USERNAME" 2>/dev/null)

            if [ -n "$USER_ID" ]; then

              sudo launchctl bootout \
                "gui/$USER_ID/com.macrdp.server" \
                2>/dev/null || true

            fi

          fi

          sudo /usr/local/bin/tailscale down \
            2>/dev/null || true

          echo "Cleanup complete."
