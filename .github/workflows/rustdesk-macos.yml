name: macOS Tailscale RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          sw_vers
          echo
          uname -a
          echo
          whoami
          echo
          id
          echo
          uname -m

      # =========================================================
      # 2. CREATE MACOS USER
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING MACOS USER"
          echo "=================================================="

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then

            echo "User already exists."

          else

            NEXT_UID=$(
              dscl . -list /Users UniqueID |
              awk '{print $2}' |
              sort -n |
              tail -1
            )

            NEXT_UID=$((NEXT_UID + 1))

            sudo dscl . -create "/Users/$MACOS_USERNAME"
            sudo dscl . -create "/Users/$MACOS_USERNAME" UserShell /bin/zsh
            sudo dscl . -create "/Users/$MACOS_USERNAME" RealName "$MACOS_USERNAME"
            sudo dscl . -create "/Users/$MACOS_USERNAME" UniqueID "$NEXT_UID"
            sudo dscl . -create "/Users/$MACOS_USERNAME" PrimaryGroupID 20
            sudo dscl . -create "/Users/$MACOS_USERNAME" NFSHomeDirectory "/Users/$MACOS_USERNAME"

            sudo mkdir -p "/Users/$MACOS_USERNAME"

            sudo chown -R \
              "$MACOS_USERNAME:staff" \
              "/Users/$MACOS_USERNAME"

            sudo dscl . -passwd \
              "/Users/$MACOS_USERNAME" \
              "$MACOS_PASSWORD"

            echo "User created."

          fi

          echo
          id "$MACOS_USERNAME"

      # =========================================================
      # 3. MAKE USER ADMIN
      # =========================================================
      - name: Make User Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "ADDING USER TO ADMIN GROUP"
          echo "=================================================="

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          sudo dseditgroup \
            -o checkmember \
            -m "$MACOS_USERNAME" \
            admin || true

      # =========================================================
      # 4. CONFIGURE AUTO LOGIN
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CONFIGURING AUTO LOGIN"
          echo "=================================================="

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            DisableFDEAutoLogin \
            -bool false

          echo
          echo "Auto-login user:"

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser || true

      # =========================================================
      # 5. INSTALL TAILSCALE STANDALONE
      # =========================================================
      - name: Install Tailscale Standalone
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING TAILSCALE STANDALONE"
          echo "=================================================="

          PKG="/tmp/Tailscale-latest-macos.pkg"

          echo
          echo "Downloading Tailscale..."

          curl -fL \
            "https://pkgs.tailscale.com/stable/Tailscale-latest-macos.pkg" \
            -o "$PKG"

          echo
          echo "Installing Tailscale..."

          sudo installer \
            -pkg "$PKG" \
            -target /

          echo
          echo "Installation completed."

          echo
          echo "Tailscale application:"

          ls -lah \
            "/Applications/Tailscale.app/Contents/MacOS/Tailscale" \
            2>/dev/null || true

          echo
          echo "CLI symlink:"

          ls -lah \
            /usr/local/bin/tailscale \
            2>/dev/null || true

      # =========================================================
      # 6. START TAILSCALE APP
      # =========================================================
      - name: Start Tailscale App
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "STARTING TAILSCALE"
          echo "=================================================="

          TAILSCALE_APP="/Applications/Tailscale.app"
          TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          if [ ! -x "$TAILSCALE_BIN" ]; then
            echo "ERROR: Tailscale executable not found."

            ls -lah \
              "/Applications/Tailscale.app/Contents/MacOS/" \
              2>/dev/null || true

            exit 1
          fi

          echo "CLI:"
          echo "$TAILSCALE_BIN"

          echo
          echo "Existing Tailscale processes:"

          ps aux |
            grep -i tailscale |
            grep -v grep || true

          echo
          echo "Launching Tailscale.app..."

          open -a "$TAILSCALE_APP"

          sleep 8

          echo
          echo "Tailscale processes after launch:"

          ps aux |
            grep -i tailscale |
            grep -v grep || true

      # =========================================================
      # 7. LOCATE TAILSCALE CLI
      # =========================================================
      - name: Locate Tailscale CLI
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "LOCATING TAILSCALE CLI"
          echo "=================================================="

          if [ -x "/Applications/Tailscale.app/Contents/MacOS/Tailscale" ]; then

            echo "/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          elif [ -x "/usr/local/bin/tailscale" ]; then

            echo "/usr/local/bin/tailscale"

          else

            echo "ERROR: Tailscale CLI not found."

            exit 1

          fi

      # =========================================================
      # 8. CHECK EXISTING TAILSCALE STATE
      # =========================================================
      - name: Check Tailscale State
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "CHECKING TAILSCALE STATE"
          echo "=================================================="

          TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          echo "CLI:"
          echo "$TAILSCALE_BIN"

          echo
          echo "Running:"
          ps aux |
            grep -i tailscale |
            grep -v grep || true

          echo
          echo "Checking status..."

          "$TAILSCALE_BIN" status \
            >/tmp/tailscale-status.txt \
            2>/tmp/tailscale-status.err &

          STATUS_PID=$!

          for i in $(seq 1 30); do

            if ! kill -0 "$STATUS_PID" 2>/dev/null; then
              break
            fi

            echo "Waiting for status... $i/30"

            sleep 1

          done

          if kill -0 "$STATUS_PID" 2>/dev/null; then

            echo
            echo "Status command is still running."

            kill "$STATUS_PID" 2>/dev/null || true

          fi

          echo
          echo "TAILSCALE STATUS:"
          cat /tmp/tailscale-status.txt \
            2>/dev/null || true

          echo
          echo "TAILSCALE STATUS STDERR:"
          cat /tmp/tailscale-status.err \
            2>/dev/null || true

      # =========================================================
      # 9. AUTHENTICATE TAILSCALE ONLY IF NEEDED
      # =========================================================
      - name: Authenticate Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          echo "=================================================="
          echo "TAILSCALE AUTHENTICATION"
          echo "=================================================="

          TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY is empty."
            exit 1
          fi

          echo
          echo "Checking current Tailscale state..."

          STATUS=$(
            "$TAILSCALE_BIN" status 2>&1
          )

          STATUS_EXIT=$?

          echo
          echo "Status exit code:"
          echo "$STATUS_EXIT"

          echo
          echo "Status:"
          echo "$STATUS"

          # -----------------------------------------------------
          # If already connected, DO NOT run tailscale up.
          # -----------------------------------------------------

          if echo "$STATUS" |
            grep -Eqi \
            "Logged out|NeedsLogin|not logged in"; then

            echo
            echo "Tailscale is not authenticated."
            echo "Starting authentication..."

            rm -f \
              /tmp/tailscale-up.stdout \
              /tmp/tailscale-up.stderr

            (
              "$TAILSCALE_BIN" up \
                --auth-key="$TAILSCALE_AUTH_KEY" \
                --hostname="github-macos-rdp"
            ) \
              >/tmp/tailscale-up.stdout \
              2>/tmp/tailscale-up.stderr &

            UP_PID=$!

            echo
            echo "tailscale up PID:"
            echo "$UP_PID"

            SUCCESS=0

            for i in $(seq 1 120); do

              if ! kill -0 "$UP_PID" 2>/dev/null; then

                wait "$UP_PID"

                UP_EXIT=$?

                echo
                echo "tailscale up exited:"
                echo "$UP_EXIT"

                if [ "$UP_EXIT" -eq 0 ]; then
                  SUCCESS=1
                fi

                break
              fi

              # Check if authentication has completed even while
              # the process is still alive.

              CURRENT_IP=$(
                "$TAILSCALE_BIN" ip -4 2>/dev/null |
                head -1
              )

              if [ -n "$CURRENT_IP" ]; then

                echo
                echo "Tailscale IP detected:"
                echo "$CURRENT_IP"

                SUCCESS=1

                kill "$UP_PID" 2>/dev/null || true

                break
              fi

              echo "Waiting for authentication... $i/120"

              sleep 1

            done

            if [ "$SUCCESS" -ne 1 ]; then

              echo
              echo "ERROR: Tailscale authentication did not complete."

              echo
              echo "STDOUT:"
              cat /tmp/tailscale-up.stdout \
                2>/dev/null || true

              echo
              echo "STDERR:"
              cat /tmp/tailscale-up.stderr \
                2>/dev/null || true

              echo
              echo "Processes:"
              ps aux |
                grep -i tailscale |
                grep -v grep || true

              exit 1
            fi

          else

            echo
            echo "Tailscale already appears to be authenticated."
            echo "Skipping tailscale up."

          fi

      # =========================================================
      # 10. VERIFY TAILSCALE
      # =========================================================
      - name: Verify Tailscale
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "VERIFYING TAILSCALE"
          echo "=================================================="

          TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          echo
          echo "Status:"

          "$TAILSCALE_BIN" status \
            2>&1 || true

          echo
          echo "Waiting for IPv4..."

          TAILSCALE_IP=""

          for i in $(seq 1 30); do

            TAILSCALE_IP=$(
              "$TAILSCALE_BIN" ip -4 2>/dev/null |
              head -1
            )

            if [ -n "$TAILSCALE_IP" ]; then
              break
            fi

            echo "Waiting... $i/30"

            sleep 1

          done

          if [ -z "$TAILSCALE_IP" ]; then

            echo
            echo "ERROR: Tailscale IPv4 was not found."

            echo
            echo "Status:"
            "$TAILSCALE_BIN" status \
              2>&1 || true

            exit 1
          fi

          echo
          echo "=========================================="
          echo "TAILSCALE IPv4:"
          echo "$TAILSCALE_IP"
          echo "=========================================="

          echo
          echo "Tailscale IPs:"

          "$TAILSCALE_BIN" ip \
            2>&1 || true

      # =========================================================
      # 11. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING RUST"
          echo "=================================================="

          if command -v rustc >/dev/null 2>&1; then

            echo "Rust already installed."

          else

            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf \
              https://sh.rustup.rs |
              sh -s -- -y

          fi

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

      # =========================================================
      # 12. CLONE MACRDP
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLONING MACRDP"
          echo "=================================================="

          rm -rf "$HOME/macrdp"

          git clone \
            --depth 1 \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "Commit:"
          git rev-parse HEAD

      # =========================================================
      # 13. BUILD MACRDP
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILDING MACRDP"
          echo "=================================================="

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          cargo build --release

          echo
          echo "Build completed."

          find target/release \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -print

      # =========================================================
      # 14. INSTALL MACRDP
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING MACRDP"
          echo "=================================================="

          MACRDP_BIN="$HOME/macrdp/target/release/macrdp"

          if [ ! -x "$MACRDP_BIN" ]; then

            echo "ERROR: macrdp binary not found."

            exit 1

          fi

          sudo install \
            -m 755 \
            "$MACRDP_BIN" \
            /usr/local/bin/macrdp

          echo
          echo "Installed:"
          ls -lah /usr/local/bin/macrdp

          echo
          echo "macrdp help:"

          /usr/local/bin/macrdp --help \
            2>&1 || true

      # =========================================================
      # 15. PREPARE MACRDP
      # =========================================================
      - name: Prepare macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "PREPARING MACRDP"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"

          sudo mkdir -p \
            "$USER_HOME/Library/Logs/macrdp" \
            "$USER_HOME/Library/LaunchAgents"

          sudo chown -R \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/Logs/macrdp" \
            "$USER_HOME/Library/LaunchAgents"

      # =========================================================
      # 16. CREATE MACRDP LAUNCHAGENT
      # =========================================================
      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING MACRDP LAUNCHAGENT"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"

          PLIST_TMP="/tmp/com.macrdp.server.plist"

          cat > "$PLIST_TMP" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>Label</key>
              <string>com.macrdp.server</string>

              <key>ProgramArguments</key>
              <array>

                  <string>/usr/local/bin/macrdp</string>

                  <string>--bind</string>
                  <string>0.0.0.0:3390</string>

                  <string>--username</string>
                  <string>$MACOS_USERNAME</string>

                  <string>--password</string>
                  <string>$MACOS_PASSWORD</string>

                  <string>--enable-h264</string>

                  <string>--fps</string>
                  <string>60</string>

                  <string>--bitrate</string>
                  <string>8</string>

                  <string>--keyframe-interval</string>
                  <string>2</string>

                  <string>--flush-frames</string>
                  <string>4</string>

                  <string>--virtual-display</string>

                  <string>--log-dir</string>
                  <string>$USER_HOME/Library/Logs/macrdp</string>

                  <string>--verbose</string>

              </array>

              <key>WorkingDirectory</key>
              <string>$USER_HOME</string>

              <key>EnvironmentVariables</key>
              <dict>

                  <key>PATH</key>
                  <string>/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>

                  <key>HOME</key>
                  <string>$USER_HOME</string>

                  <key>USER</key>
                  <string>$MACOS_USERNAME</string>

              </dict>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <true/>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>ThrottleInterval</key>
              <integer>5</integer>

              <key>StandardOutPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stdout.log</string>

              <key>StandardErrorPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stderr.log</string>

          </dict>
          </plist>
          EOF

          sudo cp \
            "$PLIST_TMP" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chown \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chmod 644 \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "Checking plist:"

          sudo plutil -lint \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

      # =========================================================
      # 17. START MACRDP
      # =========================================================
      - name: Start macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "STARTING MACRDP"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"
          USER_ID=$(id -u "$MACOS_USERNAME")

          PLIST="$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "User:"
          echo "$MACOS_USERNAME"

          echo
          echo "UID:"
          echo "$USER_ID"

          echo
          echo "Bootstrapping..."

          sudo launchctl bootout \
            "gui/$USER_ID/com.macrdp.server" \
            2>/dev/null || true

          sudo launchctl bootstrap \
            "gui/$USER_ID" \
            "$PLIST"

          BOOTSTRAP_EXIT=$?

          echo
          echo "Bootstrap exit code:"
          echo "$BOOTSTRAP_EXIT"

          sleep 5

          echo
          echo "LaunchAgent status:"

          sudo launchctl print \
            "gui/$USER_ID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "macrdp process:"

          ps aux |
            grep macrdp |
            grep -v grep || true

          echo
          echo "Port 3390:"

          sudo lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN || true

          echo
          echo "stdout:"

          cat "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "stderr:"

          cat "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

      # =========================================================
      # 18. VERIFY RDP
      # =========================================================
      - name: Verify RDP
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "VERIFYING RDP"
          echo "=================================================="

          USER_ID=$(id -u "$MACOS_USERNAME")
          USER_HOME="/Users/$MACOS_USERNAME"

          echo
          echo "RDP port:"

          sudo lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN || true

          echo
          echo "macrdp processes:"

          ps aux |
            grep macrdp |
            grep -v grep || true

          echo
          echo "LaunchAgent:"

          sudo launchctl print \
            "gui/$USER_ID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "stdout:"

          cat "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "stderr:"

          cat "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

      # =========================================================
      # 19. CONNECTION INFORMATION
      # =========================================================
      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo
          echo "=================================================="
          echo "REMOTE DESKTOP CONNECTION"
          echo "=================================================="

          TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          TAILSCALE_IP=$(
            "$TAILSCALE_BIN" ip -4 2>/dev/null |
            head -1
          )

          echo
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo
          echo "RDP:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "Password:"
          echo "(MACOS_PASSWORD secret)"

          echo
          echo "=================================================="
          echo "MICROSOFT REMOTE DESKTOP"
          echo "=================================================="

          echo
          echo "PC:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "User:"
          echo "$MACOS_USERNAME"

          echo
          echo "Tailscale status:"

          "$TAILSCALE_BIN" status \
            2>&1 || true

      # =========================================================
      # 20. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "KEEPING RUNNER ALIVE"
          echo "=================================================="

          echo "Approximately 5h 40m."

          END=$((SECONDS + 20400))

          while [ "$SECONDS" -lt "$END" ]; do

            REMAINING=$((END - SECONDS))

            echo
            echo "=================================================="
            echo "REMOTE SESSION STATUS"
            echo "Remaining seconds: $REMAINING"
            echo "=================================================="

            echo
            echo "Tailscale:"

            /Applications/Tailscale.app/Contents/MacOS/Tailscale \
              status \
              2>&1 || true

            echo
            echo "Tailscale IP:"

            /Applications/Tailscale.app/Contents/MacOS/Tailscale \
              ip -4 \
              2>&1 || true

            echo
            echo "RDP port:"

            sudo lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>&1 || true

            echo
            echo "macrdp:"

            ps aux |
              grep macrdp |
              grep -v grep || true

            echo
            echo "Tailscale processes:"

            ps aux |
              grep -i tailscale |
              grep -v grep || true

            sleep 60

          done

          echo
          echo "5h40m elapsed."

      # =========================================================
      # 21. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          if [ -n "$MACOS_USERNAME" ]; then

            USER_ID=$(id -u "$MACOS_USERNAME" 2>/dev/null)

            if [ -n "$USER_ID" ]; then

              sudo launchctl bootout \
                "gui/$USER_ID/com.macrdp.server" \
                2>/dev/null || true

            fi

          fi

          echo
          echo "Stopping Tailscale..."

          /Applications/Tailscale.app/Contents/MacOS/Tailscale \
            down \
            2>/dev/null || true

          echo
          echo "Cleanup complete."
