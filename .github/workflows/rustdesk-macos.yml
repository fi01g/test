name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. System Information
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          echo "===== SYSTEM ====="
          sw_vers
          echo
          echo "===== CURRENT USER ====="
          whoami
          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console
          echo
          echo "===== GUI SESSIONS ====="
          who
          echo
          echo "===== MEMORY ====="
          sysctl hw.memsize
          echo
          echo "===== DISK ====="
          df -h
          echo
          echo "======================"

      # =========================================================
      # 2. Create / Verify User
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "Checking user: $MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo
          echo "User ID:"
          id "$MACOS_USERNAME"

      # =========================================================
      # 3. Make User Administrator
      # =========================================================
      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "Adding $MACOS_USERNAME to admin group..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== USER GROUPS ====="
          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN GROUP ====="
          dscl . -read /Groups/admin GroupMembership

      # =========================================================
      # 4. Configure Auto Login
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "Configuring automatic login..."

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "Auto login configuration:"

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            2>/dev/null || true

          echo
          echo "NOTE:"
          echo "Auto-login applies to a future GUI login."
          echo "Current console session:"
          stat -f "%Su" /dev/console

      # =========================================================
      # 5. Install Homebrew / Tailscale
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Installing Homebrew..."

            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "PATH=$PATH"

          echo
          echo "Installing Tailscale..."

          brew install --quiet tailscale || true

          echo
          echo "Tailscale:"
          tailscale version

      # =========================================================
      # 6. Start Tailscale
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "===== TAILSCALE ====="

          if pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled is already running."
          else
            echo "Starting tailscaled..."

            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            TAILSCALED_PID=$!

            echo "tailscaled PID: $TAILSCALED_PID"

            sleep 5
          fi

          echo
          echo "tailscaled processes:"
          pgrep -fl tailscaled || true

          echo
          echo "tailscaled log:"
          cat /tmp/tailscaled.log 2>/dev/null || true

          echo
          echo "Connecting to Tailscale..."

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          TAILSCALE_EXIT=$?

          if [ "$TAILSCALE_EXIT" -ne 0 ]; then
            echo
            echo "ERROR: tailscale up failed."
            exit "$TAILSCALE_EXIT"
          fi

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status

          echo
          echo "===== TAILSCALE IP ====="

          TAILSCALE_IP=$(
            tailscale ip -4 2>/dev/null |
            head -n 1
          )

          echo "TAILSCALE_IP=$TAILSCALE_IP"

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip

      # =========================================================
      # 7. Install Rust
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else
            echo "Installing Rust..."

            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          echo
          rustc --version
          cargo --version

      # =========================================================
      # 8. Clone macrdp
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "===== MACRDP FILES ====="
          ls -la

      # =========================================================
      # 9. Build macrdp
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          echo "===== CARGO BUILD ====="

          cargo build --release

          echo
          echo "===== BUILD OUTPUT ====="

          find target/release \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -print

      # =========================================================
      # 10. Install macrdp
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          MACRDP_BINARY="$HOME/macrdp/target/release/macrdp"

          if [ ! -f "$MACRDP_BINARY" ]; then
            echo "ERROR: macrdp binary not found."
            exit 1
          fi

          sudo cp \
            "$MACRDP_BINARY" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "===== MACRDP HELP ====="

          /usr/local/bin/macrdp --help

      # =========================================================
      # 11. Prepare macrdp directories
      # =========================================================
      - name: Prepare macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          USER_HOME="/Users/$MACOS_USERNAME"

          echo "===== PREPARING MACRDP ====="

          sudo mkdir -p \
            "$USER_HOME/Library/LaunchAgents" \
            "$USER_HOME/Library/Logs/macrdp"

          sudo chown -R \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/LaunchAgents" \
            "$USER_HOME/Library/Logs/macrdp"

          echo
          echo "Directories ready."

      # =========================================================
      # 12. Create macrdp LaunchAgent
      #
      # IMPORTANT:
      # This agent belongs to MACOS_USERNAME.
      #
      # When MACOS_USERNAME logs into the GUI,
      # launchd runs macrdp INSIDE that user's GUI session.
      # =========================================================
      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "===== CREATING MACRDP LAUNCHAGENT ====="

          USER_HOME="/Users/$MACOS_USERNAME"

          PLIST_TMP="/tmp/com.macrdp.server.plist"

          cat > "$PLIST_TMP" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>Label</key>
              <string>com.macrdp.server</string>

              <key>ProgramArguments</key>

              <array>

                  <string>/usr/local/bin/macrdp</string>

                  <string>--bind</string>
                  <string>0.0.0.0:3390</string>

                  <string>--username</string>
                  <string>$MACOS_USERNAME</string>

                  <string>--password</string>
                  <string>$MACOS_PASSWORD</string>

                  <string>--enable-h264</string>

                  <string>--fps</string>
                  <string>60</string>

                  <string>--bitrate</string>
                  <string>8</string>

                  <string>--keyframe-interval</string>
                  <string>2</string>

                  <string>--flush-frames</string>
                  <string>4</string>

                  <string>--virtual-display</string>

                  <string>--log-dir</string>
                  <string>$USER_HOME/Library/Logs/macrdp</string>

                  <string>--verbose</string>

              </array>

              <key>WorkingDirectory</key>
              <string>$USER_HOME</string>

              <key>EnvironmentVariables</key>

              <dict>

                  <key>PATH</key>
                  <string>/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>

                  <key>HOME</key>
                  <string>$USER_HOME</string>

                  <key>USER</key>
                  <string>$MACOS_USERNAME</string>

              </dict>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <true/>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>ThrottleInterval</key>
              <integer>5</integer>

              <key>StandardOutPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stdout.log</string>

              <key>StandardErrorPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stderr.log</string>

          </dict>

          </plist>
          EOF

          sudo cp \
            "$PLIST_TMP" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chown \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chmod 644 \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "===== PLIST CHECK ====="

          sudo plutil -lint \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

      # =========================================================
      # 13. Open macOS Permissions
      # =========================================================
      - name: Open macOS Permissions
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "===== MACOS PERMISSIONS ====="

          echo
          echo "Opening Screen Recording settings..."

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture"

          sleep 3

          echo
          echo "Opening Accessibility settings..."

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility"

          sleep 3

          echo
          echo "Current console user:"
          stat -f "%Su" /dev/console

      # =========================================================
      # 14. Detect / Start User GUI Session
      #
      # IMPORTANT:
      # We do NOT directly execute macrdp with sudo -u.
      #
      # We bootstrap the LaunchAgent into the target user's
      # GUI launchd domain.
      # =========================================================
      - name: Start macrdp In User GUI Session
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "STARTING MACRDP IN TARGET GUI SESSION"
          echo "=================================================="

          USER_ID=$(id -u "$MACOS_USERNAME")
          USER_HOME="/Users/$MACOS_USERNAME"

          PLIST="$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "Target user:"
          echo "$MACOS_USERNAME"

          echo
          echo "Target UID:"
          echo "$USER_ID"

          echo
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo
          echo "Checking GUI session..."

          GUI_SESSION_FOUND=0

          for i in $(seq 1 30); do

            CURRENT_CONSOLE=$(
              stat -f "%Su" /dev/console
            )

            echo "Console user: $CURRENT_CONSOLE"

            if [ "$CURRENT_CONSOLE" = "$MACOS_USERNAME" ]; then
              GUI_SESSION_FOUND=1
              break
            fi

            echo "Waiting for $MACOS_USERNAME GUI session..."
            sleep 2

          done

          if [ "$GUI_SESSION_FOUND" -eq 1 ]; then

            echo
            echo "Target user is currently the console user."

            echo
            echo "Bootstrapping LaunchAgent..."

            sudo launchctl bootout \
              "gui/$USER_ID/com.macrdp.server" \
              2>/dev/null || true

            sudo launchctl bootstrap \
              "gui/$USER_ID" \
              "$PLIST"

            BOOTSTRAP_EXIT=$?

            echo
            echo "Bootstrap exit:"
            echo "$BOOTSTRAP_EXIT"

          else

            echo
            echo "=================================================="
            echo "TARGET USER IS NOT CURRENT CONSOLE USER"
            echo "=================================================="

            echo
            echo "The LaunchAgent has been installed."

            echo "When $MACOS_USERNAME logs into the GUI,"
            echo "macOS launchd will start macrdp in that user's"
            echo "GUI session."

          fi

          sleep 5

          echo
          echo "===== LAUNCHAGENT STATUS ====="

          sudo launchctl print \
            "gui/$USER_ID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "===== MACRDP PROCESSES ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null || true

          echo
          echo "===== MACRDP STDOUT ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "===== MACRDP STDERR ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

      # =========================================================
      # 15. Monitor Console User
      #
      # This is the IMPORTANT part.
      #
      # If you switch from runner -> MACOS_USERNAME,
      # the workflow detects the new console user and makes
      # sure macrdp is running in THAT GUI session.
      # =========================================================
      - name: Monitor GUI User And RDP
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "GUI SESSION MONITOR"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          USER_HOME="/Users/$MACOS_USERNAME"

          PLIST="$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          END=$((SECONDS + 20400))

          LAST_CONSOLE_USER=""

          while [ "$SECONDS" -lt "$END" ]; do

            CURRENT_CONSOLE_USER=$(
              stat -f "%Su" /dev/console
            )

            REMAINING=$((END - SECONDS))

            echo
            echo "=================================================="
            echo "SESSION STATUS"
            echo "=================================================="

            echo "Remaining seconds:"
            echo "$REMAINING"

            echo
            echo "Current console user:"
            echo "$CURRENT_CONSOLE_USER"

            echo
            echo "Target RDP user:"
            echo "$MACOS_USERNAME"

            # -----------------------------------------------------
            # Console user changed
            # -----------------------------------------------------

            if [ "$CURRENT_CONSOLE_USER" != "$LAST_CONSOLE_USER" ]; then

              echo
              echo "CONSOLE USER CHANGED:"
              echo "$LAST_CONSOLE_USER -> $CURRENT_CONSOLE_USER"

              LAST_CONSOLE_USER="$CURRENT_CONSOLE_USER"

            fi

            # -----------------------------------------------------
            # If target user is currently logged into GUI,
            # make sure its LaunchAgent is bootstrapped.
            # -----------------------------------------------------

            if [ "$CURRENT_CONSOLE_USER" = "$MACOS_USERNAME" ]; then

              echo
              echo "TARGET USER IS ACTIVE."

              echo
              echo "Checking target GUI LaunchAgent..."

              sudo launchctl print \
                "gui/$TARGET_UID/com.macrdp.server" \
                >/tmp/macrdp-launchctl-status \
                2>&1

              LAUNCH_STATUS=$?

              if [ "$LAUNCH_STATUS" -ne 0 ]; then

                echo
                echo "LaunchAgent is not loaded."

                echo
                echo "Bootstrapping into target GUI session..."

                sudo launchctl bootstrap \
                  "gui/$TARGET_UID" \
                  "$PLIST"

                echo
                echo "Bootstrap result:"
                echo "$?"

              else

                echo
                echo "LaunchAgent is already loaded."

              fi

            else

              echo
              echo "Target user is NOT current console user."

              echo "macrdp for target GUI session will be handled"
              echo "when the target user becomes active."

            fi

            # -----------------------------------------------------
            # RDP process
            # -----------------------------------------------------

            echo
            echo "macrdp processes:"

            pgrep -fl macrdp || true

            # -----------------------------------------------------
            # RDP port
            # -----------------------------------------------------

            echo
            echo "Port 3390:"

            lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true

            # -----------------------------------------------------
            # Tailscale
            # -----------------------------------------------------

            echo
            echo "Tailscale IP:"

            tailscale ip -4 \
              2>/dev/null || true

            echo
            echo "Tailscale status:"

            tailscale status \
              2>/dev/null || true

            # -----------------------------------------------------
            # Logs
            # -----------------------------------------------------

            echo
            echo "macrdp stderr:"

            cat \
              "$USER_HOME/Library/Logs/macrdp/stderr.log" \
              2>/dev/null || true

            sleep 30

          done

          echo
          echo "=================================================="
          echo "5 HOURS 40 MINUTES COMPLETE"
          echo "=================================================="

      # =========================================================
      # 16. Final Diagnostic
      # =========================================================
      - name: Final Diagnostic
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "FINAL DIAGNOSTIC"
          echo "=================================================="

          USER_ID=$(id -u "$MACOS_USERNAME")
          USER_HOME="/Users/$MACOS_USERNAME"

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== GUI USERS ====="

          who

          echo
          echo "===== MACRDP ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null || true

          echo
          echo "===== LAUNCHAGENT ====="

          sudo launchctl print \
            "gui/$USER_ID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "===== STDOUT ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "===== STDERR ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

          echo
          echo "===== TAILSCALE ====="

          tailscale status \
            2>&1 || true

          echo
          echo "===== TAILSCALE IP ====="

          tailscale ip -4 \
            2>&1 || true

      # =========================================================
      # 17. Cleanup
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "===== CLEANUP ====="

          USER_ID=$(id -u "$MACOS_USERNAME" 2>/dev/null)

          if [ -n "$USER_ID" ]; then

            sudo launchctl bootout \
              "gui/$USER_ID/com.macrdp.server" \
              2>/dev/null || true

          fi

          echo
          echo "Stopping macrdp..."

          pkill -f macrdp || true

          echo
          echo "Stopping Tailscale..."

          sudo tailscale down || true

          echo
          echo "Cleanup complete."
