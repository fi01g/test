name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. System Information
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          echo "===== SYSTEM ====="
          sw_vers

          echo
          echo "===== CURRENT USER ====="
          whoami

          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console

          echo
          echo "===== GUI SESSIONS ====="
          who

          echo
          echo "===== DISK ====="
          df -h

          echo
          echo "======================"

      # =========================================================
      # 2. Create / Verify macOS User
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "Checking user: $MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo
          echo "===== USER ====="
          id "$MACOS_USERNAME"

      # =========================================================
      # 3. Administrator
      # =========================================================
      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "Adding user to admin group..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== GROUPS ====="
          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN ====="
          dscl . -read /Groups/admin GroupMembership

      # =========================================================
      # 4. Auto Login
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "Auto login user:"
          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser 2>/dev/null || true

      # =========================================================
      # 5. Install Tailscale
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Installing Homebrew..."

            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo
          echo "Installing Tailscale..."

          brew install --quiet tailscale || true

          echo
          tailscale version

      # =========================================================
      # 6. Start Tailscale
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "===== TAILSCALE ====="

          if pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled already running."
          else
            echo "Starting tailscaled..."

            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            sleep 5
          fi

          echo
          echo "tailscaled:"
          pgrep -fl tailscaled || true

          echo
          echo "tailscaled log:"
          cat /tmp/tailscaled.log 2>/dev/null || true

          echo
          echo "Connecting Tailscale..."

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status

          echo
          echo "===== TAILSCALE IP ====="

          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null | head -n 1)

          echo "$TAILSCALE_IP"

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip

      # =========================================================
      # 7. Install Rust
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else
            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          echo
          rustc --version
          cargo --version

      # =========================================================
      # 8. Clone macrdp
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "===== MACRDP ====="
          ls -la

      # =========================================================
      # 9. Build macrdp
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          echo "===== BUILDING MACRDP ====="

          cargo build --release

          echo
          echo "===== BUILD COMPLETE ====="

          ls -lh target/release/macrdp

      # =========================================================
      # 10. Install macrdp
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          MACRDP_BINARY="$HOME/macrdp/target/release/macrdp"

          if [ ! -f "$MACRDP_BINARY" ]; then
            echo "ERROR: macrdp binary not found."
            exit 1
          fi

          sudo cp \
            "$MACRDP_BINARY" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "===== MACRDP HELP ====="

          /usr/local/bin/macrdp --help

      # =========================================================
      # 11. Prepare macOS Permissions
      # =========================================================
      - name: Prepare macOS Permissions
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "Opening Screen Recording settings..."

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture"

          sleep 3

          echo
          echo "Opening Accessibility settings..."

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility"

          sleep 3

          echo
          echo "IMPORTANT:"
          echo "Screen Recording + Accessibility must be enabled for macrdp."
          echo
          echo "Current console user:"
          stat -f "%Su" /dev/console

      # =========================================================
      # 12. Configure macrdp Keychain
      # =========================================================
      - name: Configure macrdp Keychain
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          echo "===== CONFIGURING KEYCHAIN ====="

          #
          # Store the RDP password in the user's Keychain.
          #
          # This is preferable to passing --password every time,
          # because --password can appear in the process list.
          #

          sudo -u "$MACOS_USERNAME" \
            security add-generic-password \
              -U \
              -s macrdp \
              -a "$MACOS_USERNAME" \
              -w "$MACOS_PASSWORD"

          RESULT=$?

          echo
          echo "Keychain result: $RESULT"

          if [ "$RESULT" -eq 0 ]; then
            echo "macrdp Keychain credential configured."
          else
            echo "WARNING: Keychain configuration failed."
          fi

      # =========================================================
      # 13. Create Per-User LaunchAgent
      # =========================================================
      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          USER_HOME=$(dscl . -read \
            /Users/"$MACOS_USERNAME" NFSHomeDirectory \
            | awk '{print $2}')

          USER_UID=$(id -u "$MACOS_USERNAME")

          AGENT_DIR="$USER_HOME/Library/LaunchAgents"

          AGENT="$AGENT_DIR/com.macrdp.server.plist"

          LOG_DIR="$USER_HOME/Library/Logs/macrdp"

          mkdir -p "$AGENT_DIR"
          mkdir -p "$LOG_DIR"

          chown -R "$MACOS_USERNAME":staff \
            "$USER_HOME/Library"

          echo
          echo "User home:"
          echo "$USER_HOME"

          echo
          echo "User UID:"
          echo "$USER_UID"

          echo
          echo "LaunchAgent:"
          echo "$AGENT"

          #
          # Create LaunchAgent
          #

          cat > /tmp/com.macrdp.server.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>Label</key>
              <string>com.macrdp.server</string>

              <key>ProgramArguments</key>
              <array>

                  <string>/usr/local/bin/macrdp</string>

                  <string>--bind</string>
                  <string>0.0.0.0:3390</string>

                  <string>--username</string>
                  <string>$MACOS_USERNAME</string>

                  <string>--keychain</string>

                  <string>--enable-h264</string>

                  <string>--fps</string>
                  <string>60</string>

                  <string>--bitrate</string>
                  <string>8</string>

                  <string>--keyframe-interval</string>
                  <string>2</string>

                  <string>--flush-frames</string>
                  <string>4</string>

                  <string>--log-dir</string>
                  <string>$LOG_DIR</string>

                  <string>--verbose</string>

              </array>

              <key>WorkingDirectory</key>
              <string>$USER_HOME</string>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <true/>

              <key>ThrottleInterval</key>
              <integer>5</integer>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>LimitLoadToSessionType</key>
              <array>
                  <string>Aqua</string>
              </array>

              <key>StandardOutPath</key>
              <string>$LOG_DIR/stdout.log</string>

- name: Create macrdp LaunchAgent
  shell: bash
  env:
    MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
    MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
  run: |
    set -e

    USER_HOME=$(dscl . -read \
      /Users/"$MACOS_USERNAME" NFSHomeDirectory \
      | awk '{print $2}')

    USER_UID=$(id -u "$MACOS_USERNAME")

    AGENT_DIR="$USER_HOME/Library/LaunchAgents"
    AGENT="$AGENT_DIR/com.macrdp.server.plist"
    LOG_DIR="$USER_HOME/Library/Logs/macrdp"

    sudo mkdir -p "$AGENT_DIR"
    sudo mkdir -p "$LOG_DIR"

    sudo chown -R "$MACOS_USERNAME":staff \
      "$USER_HOME/Library"

    echo "User home:"
    echo "$USER_HOME"

    echo "User UID:"
    echo "$USER_UID"

    echo "Creating LaunchAgent..."

    cat > /tmp/com.macrdp.server.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
"http://www.apple.com/DTDs/PropertyList-1.0.dtd">

<plist version="1.0">
<dict>

    <key>Label</key>
    <string>com.macrdp.server</string>

    <key>ProgramArguments</key>
    <array>

        <string>/usr/local/bin/macrdp</string>

        <string>--bind</string>
        <string>0.0.0.0:3390</string>

        <string>--username</string>
        <string>$MACOS_USERNAME</string>

        <string>--password</string>
        <string>$MACOS_PASSWORD</string>

        <string>--enable-h264</string>

        <string>--fps</string>
        <string>60</string>

        <string>--bitrate</string>
        <string>8</string>

        <string>--keyframe-interval</string>
        <string>2</string>

        <string>--flush-frames</string>
        <string>4</string>

        <string>--log-dir</string>
        <string>$LOG_DIR</string>

        <string>--verbose</string>

    </array>

    <key>WorkingDirectory</key>
    <string>$USER_HOME</string>

    <key>RunAtLoad</key>
    <true/>

    <key>KeepAlive</key>
    <true/>

    <key>ThrottleInterval</key>
    <integer>5</integer>

    <key>ProcessType</key>
    <string>Interactive</string>

    <key>LimitLoadToSessionType</key>
    <array>
        <string>Aqua</string>
    </array>

    <key>StandardOutPath</key>
    <string>$LOG_DIR/stdout.log</string>

    <key>StandardErrorPath</key>
    <string>$LOG_DIR/stderr.log</string>

</dict>
</plist>
EOF

    sudo mv \
      /tmp/com.macrdp.server.plist \
      "$AGENT"

    sudo chown \
      "$MACOS_USERNAME":staff \
      "$AGENT"

    sudo chmod 644 "$AGENT"

    echo
    echo "===== LAUNCHAGENT CREATED ====="

    sudo cat "$AGENT"

    echo
    echo "LaunchAgent ready."

      # =========================================================
      # 14. Stop Any Old macrdp
      # =========================================================
      - name: Stop Existing macrdp
        shell: bash
        run: |
          set +e

          echo "Stopping old macrdp processes..."

          pkill -f "/usr/local/bin/macrdp" || true

          sleep 2

          echo
          echo "Remaining macrdp:"
          pgrep -fl macrdp || true

      # =========================================================
      # 15. Start macrdp In Current GUI Session
      # =========================================================
      - name: Start macrdp GUI Session
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "===== CURRENT CONSOLE USER ====="

          CONSOLE_USER=$(stat -f "%Su" /dev/console)

          echo "$CONSOLE_USER"

          echo
          echo "===== CURRENT GUI USERS ====="

          who

          #
          # If Abdulrahman is already the logged-in GUI user,
          # bootstrap his LaunchAgent immediately.
          #

          if id "$CONSOLE_USER" >/dev/null 2>&1; then

            CONSOLE_UID=$(id -u "$CONSOLE_USER")

            USER_HOME=$(dscl . -read \
              /Users/"$CONSOLE_USER" NFSHomeDirectory \
              | awk '{print $2}')

            AGENT="$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

            echo
            echo "Console user:"
            echo "$CONSOLE_USER"

            echo
            echo "UID:"
            echo "$CONSOLE_UID"

            echo
            echo "Agent:"
            echo "$AGENT"

            if [ -f "$AGENT" ]; then

              echo
              echo "Bootstrapping LaunchAgent..."

              sudo launchctl bootout \
                "gui/$CONSOLE_UID/com.macrdp.server" \
                2>/dev/null || true

              sudo launchctl bootstrap \
                "gui/$CONSOLE_UID" \
                "$AGENT"

              sudo launchctl enable \
                "gui/$CONSOLE_UID/com.macrdp.server" \
                2>/dev/null || true

              sudo launchctl kickstart \
                -k \
                "gui/$CONSOLE_UID/com.macrdp.server"

              echo
              echo "LaunchAgent started."

            else

              echo
              echo "WARNING:"
              echo "LaunchAgent not found for $CONSOLE_USER"

            fi

          fi

          sleep 8

          echo
          echo "===== MACRDP PROCESSES ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null || true

      # =========================================================
      # 16. Monitor User Switch
      # =========================================================
      - name: Monitor GUI User And Restart macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo
          echo "======================================================"
          echo " macrdp GUI SESSION MONITOR"
          echo "======================================================"
          echo
          echo "The monitor will detect Switch User."
          echo "When the console user changes, macrdp will be"
          echo "restarted inside the new user's GUI session."
          echo

          LAST_USER=""

          #
          # Function:
          # Start macrdp for a specific logged-in GUI user.
          #

          start_for_user() {

            TARGET_USER="$1"

            echo
            echo "----------------------------------------------"
            echo "Starting macrdp for:"
            echo "$TARGET_USER"
            echo "----------------------------------------------"

            if ! id "$TARGET_USER" >/dev/null 2>&1; then
              echo "User does not exist."
              return
            fi

            TARGET_UID=$(id -u "$TARGET_USER")

            TARGET_HOME=$(dscl . -read \
              /Users/"$TARGET_USER" NFSHomeDirectory \
              | awk '{print $2}')

            AGENT="$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

            echo "UID: $TARGET_UID"
            echo "HOME: $TARGET_HOME"
            echo "AGENT: $AGENT"

            if [ ! -f "$AGENT" ]; then
              echo "LaunchAgent missing."
              return
            fi

            #
            # Stop old instance
            #

            pkill -f "/usr/local/bin/macrdp" || true

            sleep 2

            #
            # Remove old launchd service
            #

            sudo launchctl bootout \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

            sleep 1

            #
            # Bootstrap service into this user's GUI session
            #

            sudo launchctl bootstrap \
              "gui/$TARGET_UID" \
              "$AGENT"

            sleep 2

            #
            # Enable it
            #

            sudo launchctl enable \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

            #
            # Start it
            #

            sudo launchctl kickstart \
              -k \
              "gui/$TARGET_UID/com.macrdp.server"

            echo
            echo "macrdp requested for $TARGET_USER"

            sleep 5

            echo
            echo "Processes:"
            pgrep -fl macrdp || true

            echo
            echo "Port:"
            lsof -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true
          }

          #
          # Initial user
          #

          CURRENT_USER=$(stat -f "%Su" /dev/console)

          if [ -n "$CURRENT_USER" ] && [ "$CURRENT_USER" != "root" ]; then
            LAST_USER="$CURRENT_USER"

            echo "Initial console user:"
            echo "$CURRENT_USER"

            start_for_user "$CURRENT_USER"
          fi

          #
          # Main monitoring loop
          #
          # Every 5 seconds:
          #   /dev/console user is checked.
          #
          # If changed:
          #   old macrdp is killed
          #   new GUI LaunchAgent is bootstrapped
          #

          while true; do

            CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

            if [ -z "$CURRENT_USER" ]; then
              sleep 5
              continue
            fi

            if [ "$CURRENT_USER" = "root" ]; then
              sleep 5
              continue
            fi

            #
            # User changed
            #

            if [ "$CURRENT_USER" != "$LAST_USER" ]; then

              echo
              echo "=================================================="
              echo " GUI USER CHANGED"
              echo "=================================================="

              echo "Old user:"
              echo "$LAST_USER"

              echo
              echo "New user:"
              echo "$CURRENT_USER"

              echo

              LAST_USER="$CURRENT_USER"

              start_for_user "$CURRENT_USER"

            fi

            #
            # Check if macrdp unexpectedly died.
            #

            if ! pgrep -f "/usr/local/bin/macrdp" >/dev/null 2>&1; then

              echo
              echo "macrdp is not running."
              echo "Restarting for current GUI user..."

              start_for_user "$CURRENT_USER"

            fi

            sleep 5

          done

      # =========================================================
      # 17. Connection Information
      # =========================================================
      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          TAILSCALE_IP=$(cat /tmp/tailscale_ip 2>/dev/null)

          if [ -z "$TAILSCALE_IP" ]; then
            TAILSCALE_IP=$(tailscale ip -4 2>/dev/null | head -n 1)
          fi

          echo
          echo "======================================================"
          echo "              RDP CONNECTION INFO"
          echo "======================================================"
          echo
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"
          echo
          echo "RDP Address:"
          echo "$TAILSCALE_IP:3390"
          echo
          echo "Username:"
          echo "$MACOS_USERNAME"
          echo
          echo "Password:"
          echo "Use MACOS_PASSWORD GitHub Secret"
          echo
          echo "======================================================"

      # =========================================================
      # 18. Keep Runner Alive
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo
          echo "======================================================"
          echo "       macOS RDP SESSION IS ACTIVE"
          echo "======================================================"
          echo
          echo "Tailscale + RDP are active."
          echo
          echo "The GUI user monitor is running."
          echo
          echo "Switch User is supported by restarting macrdp"
          echo "inside the new user's GUI session."
          echo
          echo "Runner will stay alive for approximately 5h 40m."
          echo

          sleep 20400

      # =========================================================
      # 19. Cleanup
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "===== CLEANUP ====="

          #
          # Stop macrdp
          #

          pkill -f "/usr/local/bin/macrdp" || true

          #
          # Find console user
          #

          CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

          if [ -n "$CURRENT_USER" ] && [ "$CURRENT_USER" != "root" ]; then

            CURRENT_UID=$(id -u "$CURRENT_USER")

            echo
            echo "Stopping LaunchAgent for:"
            echo "$CURRENT_USER"

            sudo launchctl bootout \
              "gui/$CURRENT_UID/com.macrdp.server" \
              2>/dev/null || true

          fi

          #
          # Tailscale down
          #

          sudo tailscale down || true

          echo
          echo "Cleanup complete."

      # =========================================================
      # 20. Final
      # =========================================================
      - name: Final
        if: always()
        shell: bash
        run: |
          echo
          echo "======================================================"
          echo " Workflow finished"
          echo "======================================================"
