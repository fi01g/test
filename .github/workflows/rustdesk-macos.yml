name: macOS RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      - name: System Information
        run: |
          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="
          sw_vers
          echo ""
          uname -a
          echo ""
          echo "Current user:"
          whoami
          echo ""
          echo "Architecture:"
          uname -m
          echo ""
          echo "Console user:"
          scutil <<< "show State:/Users/ConsoleUser" | grep -E "Name :|UID :" || true


      - name: Create Abdulrahman User
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CREATING / VERIFYING USER"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "Abdulrahman" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "🟢 Administrator membership configured."


      - name: Verify Abdulrahman
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING USER"
          echo "=========================================="

          id "$MACOS_USERNAME"

          echo ""
          echo "Home directory:"
          dscl . -read "/Users/$MACOS_USERNAME" NFSHomeDirectory

          echo ""
          echo "Admin membership:"
          dseditgroup -o checkmember -m "$MACOS_USERNAME" admin || true


      - name: Configure Auto Login
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            2>&1 || true

          echo ""
          echo "Auto-login configuration attempted."


      - name: Install RustDesk
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} INSTALLING RUSTDESK${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          if [ -d "/Applications/RustDesk.app" ]; then
            echo "RustDesk already exists."
          else
            echo "Installing RustDesk using Homebrew..."

            brew install --cask rustdesk
          fi

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -x "$RUSTDESK" ]; then
            echo -e "${RED}ERROR: RustDesk executable not found.${RESET}"
            exit 1
          fi

          echo ""
          echo "RustDesk version:"
          "$RUSTDESK" --version || true

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║       🟢 RUSTDESK INSTALLED             ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"


      - name: Prepare RustDesk Environment
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " PREPARING RUSTDESK ENVIRONMENT"
          echo "=========================================="

          HOME_DIR="$(
            dscl . -read "/Users/$MACOS_USERNAME" NFSHomeDirectory |
            awk '{print $2}'
          )"

          echo "User: $MACOS_USERNAME"
          echo "Home: $HOME_DIR"

          sudo -u "$MACOS_USERNAME" mkdir -p \
            "$HOME_DIR/Library/Application Support/RustDesk"

          sudo -u "$MACOS_USERNAME" mkdir -p \
            "$HOME_DIR/Library/Logs/RustDesk"

          sudo chown -R \
            "$MACOS_USERNAME":staff \
            "$HOME_DIR/Library/Application Support/RustDesk"

          sudo chown -R \
            "$MACOS_USERNAME":staff \
            "$HOME_DIR/Library/Logs/RustDesk"

          echo ""
          echo "🟢 RustDesk environment prepared."


      - name: Get RustDesk ID
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} GETTING RUSTDESK ID${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          RUSTDESK_ID=""

          for i in {1..15}; do

            RUSTDESK_ID="$(
              "$RUSTDESK" --get-id 2>/dev/null |
              tr -d '[:space:]' ||
              true
            )"

            if [ -n "$RUSTDESK_ID" ]; then
              break
            fi

            echo "Waiting for RustDesk ID... ($i/15)"
            sleep 3
          done

          if [ -z "$RUSTDESK_ID" ]; then
            echo -e "${RED}ERROR: RustDesk ID unavailable.${RESET}"
            exit 1
          fi

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║        🟢 RUSTDESK ID READY             ║${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║        ID: $RUSTDESK_ID${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          echo "RUSTDESK_ID=$RUSTDESK_ID" >> "$GITHUB_ENV"


      - name: Start RustDesk Server
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} STARTING RUSTDESK SERVER${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          sudo pkill -f \
            "/Applications/RustDesk.app/Contents/MacOS/RustDesk --server" \
            2>/dev/null ||
            true

          sleep 3

          echo "Starting RustDesk server..."

          sudo "$RUSTDESK" \
            --server \
            > /tmp/rustdesk-server.log \
            2>&1 &

          SERVER_PID=$!

          echo "Server PID: $SERVER_PID"

          echo ""
          echo "Waiting for RustDesk IPC..."
          sleep 10

          echo ""
          echo "RustDesk server process:"
          ps aux | grep -i "[R]ustDesk" || true

          echo ""
          echo -e "${GREEN}🟢 RUSTDESK SERVER STARTED${RESET}"


      - name: Configure Permanent Password
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} CONFIGURING PERMANENT PASSWORD${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo -e "${RED}ERROR: RUSTDESK_PASSWORD is empty.${RESET}"
            exit 1
          fi

          echo ""
          echo "Applying permanent RustDesk password..."

          PASSWORD_OUTPUT="$(
            sudo "$RUSTDESK" \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          )" || {

            echo ""
            echo -e "${RED}ERROR: RustDesk password command failed.${RESET}"
            echo "$PASSWORD_OUTPUT"

            echo ""
            echo "RustDesk server log:"
            cat /tmp/rustdesk-server.log 2>/dev/null || true

            exit 1
          }

          echo "$PASSWORD_OUTPUT"

          if echo "$PASSWORD_OUTPUT" | grep -qi "Done"; then

            echo ""
            echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
            echo -e "${GREEN}║     🟢 PASSWORD CONFIGURED              ║${RESET}"
            echo -e "${GREEN}║     🔐 VALUE HIDDEN                     ║${RESET}"
            echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          else

            echo ""
            echo -e "${RED}ERROR: RustDesk did not return Done!.${RESET}"

            echo ""
            echo "RustDesk server log:"
            cat /tmp/rustdesk-server.log 2>/dev/null || true

            exit 1
          fi


      - name: Start RustDesk GUI
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          HOME_DIR="$(
            dscl . -read "/Users/$MACOS_USERNAME" NFSHomeDirectory |
            awk '{print $2}'
          )"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} STARTING RUSTDESK GUI${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          sudo -u "$MACOS_USERNAME" \
            env \
            HOME="$HOME_DIR" \
            USER="$MACOS_USERNAME" \
            "$RUSTDESK" \
            > /tmp/rustdesk-gui.log \
            2>&1 &

          sleep 8

          echo ""
          echo "RustDesk processes:"
          ps aux | grep -i "[R]ustDesk" || true

          echo ""
          echo -e "${GREEN}🟢 RUSTDESK GUI STARTED${RESET}"


      - name: Install RustDesk Watchdog
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          WATCHDOG="/usr/local/bin/rustdesk-watchdog.sh"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} INSTALLING RUSTDESK WATCHDOG${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          cat > /tmp/rustdesk-watchdog.sh <<EOF
          #!/bin/bash

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          USER_NAME="$MACOS_USERNAME"

          while true; do

            if ! pgrep -f "/Applications/RustDesk.app/Contents/MacOS/RustDesk --server" >/dev/null 2>&1; then

              echo "\$(date) - RustDesk server stopped. Restarting..." >> /tmp/rustdesk-watchdog.log

              sudo "\$RUSTDESK" \
                --server \
                >> /tmp/rustdesk-watchdog.log \
                2>&1 &

              sleep 10

            fi

            if ! pgrep -u "\$USER_NAME" -f "/Applications/RustDesk.app/Contents/MacOS/RustDesk" >/dev/null 2>&1; then

              echo "\$(date) - RustDesk GUI stopped. Restarting..." >> /tmp/rustdesk-watchdog.log

              USER_HOME="\$(dscl . -read "/Users/\$USER_NAME" NFSHomeDirectory | awk '{print \$2}')"

              sudo -u "\$USER_NAME" \
                env \
                HOME="\$USER_HOME" \
                USER="\$USER_NAME" \
                "\$RUSTDESK" \
                >> /tmp/rustdesk-watchdog.log \
                2>&1 &

              sleep 10

            fi

            sleep 10

          done
          EOF

          sudo mkdir -p /usr/local/bin

          sudo cp \
            /tmp/rustdesk-watchdog.sh \
            "$WATCHDOG"

          sudo chmod 755 "$WATCHDOG"

          echo ""
          echo "Starting watchdog..."

          sudo "$WATCHDOG" \
            > /tmp/rustdesk-watchdog-main.log \
            2>&1 &

          sleep 3

          if pgrep -f "/usr/local/bin/rustdesk-watchdog.sh" >/dev/null 2>&1; then

            echo ""
            echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
            echo -e "${GREEN}║      🟢 AUTO-RESTART ENABLED            ║${RESET}"
            echo -e "${GREEN}║      🟢 WATCHDOG RUNNING                ║${RESET}"
            echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          else

            echo -e "${RED}ERROR: Watchdog did not start.${RESET}"
            exit 1

          fi


      - name: Final Verification
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          CURRENT_ID="$(
            "$RUSTDESK" \
              --get-id \
              2>/dev/null |
            tr -d '[:space:]' ||
            true
          )"

          if [ -z "$CURRENT_ID" ]; then
            echo -e "${RED}ERROR: RustDesk ID unavailable.${RESET}"
            exit 1
          fi

          echo ""
          echo -e "${GREEN}================================================${RESET}"
          echo -e "${GREEN}       🟢 RUSTDESK CONNECTION INFO             ${RESET}"
          echo -e "${GREEN}================================================${RESET}"
          echo ""
          echo -e "${GREEN}       RUSTDESK ID: $CURRENT_ID${RESET}"
          echo ""
          echo -e "${GREEN}       PASSWORD: CONFIGURED${RESET}"
          echo ""
          echo -e "${GREEN}       MACOS USER: $MACOS_USERNAME${RESET}"
          echo ""
          echo -e "${GREEN}       AUTO-RESTART: ENABLED${RESET}"
          echo ""
          echo -e "${GREEN}       WATCHDOG: RUNNING${RESET}"
          echo ""
          echo -e "${GREEN}================================================${RESET}"

          echo ""
          echo "RustDesk processes:"
          ps aux | grep -i "[R]ustDesk" || true

          echo ""
          echo "Watchdog:"
          ps aux | grep -i "[r]ustdesk-watchdog" || true

          echo ""
          echo "Password is stored in GitHub Secret:"
          echo "RUSTDESK_PASSWORD"

          echo ""
          echo "The actual password is intentionally hidden."


      - name: Open System Settings
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension" \
            2>/dev/null ||
            true

          echo ""
          echo "System Settings opened if a GUI session is available."


      - name: Keep Runner Alive
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo ""
          echo -e "${GREEN}================================================${RESET}"
          echo -e "${GREEN}       🟢 MACOS RUNNER IS READY               ${RESET}"
          echo -e "${GREEN}================================================${RESET}"

          echo ""
          echo "RustDesk ID:"
          "$RUSTDESK" --get-id 2>/dev/null || true

          echo ""
          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "Password:"
          echo "CONFIGURED"

          echo ""
          echo "Auto-restart:"
          echo "ENABLED"

          echo ""
          echo "Runner will remain alive."

          while true; do

            echo ""
            echo -e "${CYAN}========== STATUS $(date) ==========${RESET}"

            echo ""
            echo "RustDesk processes:"
            ps aux | grep -i "[R]ustDesk" || true

            echo ""
            echo "RustDesk ID:"
            "$RUSTDESK" \
              --get-id \
              2>/dev/null ||
              true

            echo ""
            echo "Watchdog:"

            if pgrep -f \
              "/usr/local/bin/rustdesk-watchdog.sh" \
              >/dev/null 2>&1
            then
              echo -e "${GREEN}🟢 RUNNING${RESET}"
            else
              echo -e "${RED}🔴 NOT RUNNING${RESET}"
            fi

            echo ""
            echo "Watchdog log:"
            tail -10 \
              /tmp/rustdesk-watchdog.log \
              2>/dev/null ||
              true

            echo ""
            echo "Sleeping 5 minutes..."

            sleep 300

          done


