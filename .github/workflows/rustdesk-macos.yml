name: macOS RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================
      - name: System Information
        run: |
          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          sw_vers
          echo ""
          uname -a
          echo ""
          echo "Architecture:"
          uname -m
          echo ""
          echo "Current user:"
          whoami

          echo ""
          echo "Console user:"
          scutil <<< "show State:/Users/ConsoleUser" |
            grep -E "Name :|UID :" || true


      # ============================================================
      # 2. CREATE / VERIFY ABDULRAHMAN
      # ============================================================
      - name: Create Abdulrahman User
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CREATING / VERIFYING USER"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then

            echo "User already exists."

          else

            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "Abdulrahman" \
              -password "$MACOS_PASSWORD"

            echo "User created."

          fi

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "Administrator membership configured."


      # ============================================================
      # 3. VERIFY USER
      # ============================================================
      - name: Verify Abdulrahman
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING USER"
          echo "=========================================="

          id "$MACOS_USERNAME"

          echo ""
          echo "Home directory:"

          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory


      # ============================================================
      # 4. CONFIGURE AUTO LOGIN
      # ============================================================
      - name: Configure Auto Login
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            2>&1 || true

          echo ""
          echo "Auto-login configuration attempted."


      # ============================================================
      # 5. DOWNLOAD OFFICIAL RUSTDESK DMG
      # ============================================================
      - name: Download Official RustDesk
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} DOWNLOADING OFFICIAL RUSTDESK${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          ARCH="$(uname -m)"

          case "$ARCH" in
            arm64)
              RUSTDESK_ARCH="aarch64"
              ;;
            x86_64)
              RUSTDESK_ARCH="x86_64"
              ;;
            *)
              echo -e "${RED}Unsupported architecture: $ARCH${RESET}"
              exit 1
              ;;
          esac

          echo "Architecture: $ARCH"
          echo "RustDesk architecture: $RUSTDESK_ARCH"

          echo ""
          echo "Finding latest stable RustDesk release..."

          RELEASE_JSON="/tmp/rustdesk-release.json"

          curl -fsSL \
            "https://api.github.com/repos/rustdesk/rustdesk/releases/latest" \
            -o "$RELEASE_JSON"

          RUSTDESK_VERSION="$(
            python3 - "$RELEASE_JSON" <<'PY'
import json
import sys

with open(sys.argv[1]) as f:
    data = json.load(f)

print(data["tag_name"])
PY
          )"

          echo "Latest stable release: $RUSTDESK_VERSION"

          DMG_URL="$(
            python3 - "$RELEASE_JSON" "$RUSTDESK_ARCH" <<'PY'
import json
import sys

with open(sys.argv[1]) as f:
    data = json.load(f)

arch = sys.argv[2]

for asset in data.get("assets", []):
    name = asset.get("name", "")
    url = asset.get("browser_download_url", "")

    if name.endswith(f"-{arch}.dmg"):
        print(url)
        break
PY
          )"

          if [ -z "$DMG_URL" ]; then
            echo -e "${RED}ERROR: Could not find RustDesk DMG.${RESET}"
            exit 1
          fi

          echo ""
          echo "Downloading official DMG..."

          curl -fL \
            "$DMG_URL" \
            -o /tmp/RustDesk.dmg

          echo ""
          echo -e "${GREEN}🟢 OFFICIAL RUSTDESK DMG DOWNLOADED${RESET}"


      # ============================================================
      # 6. INSTALL RUSTDESK DMG
      # ============================================================
      - name: Install RustDesk DMG
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} INSTALLING RUSTDESK${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          MOUNT_POINT="/Volumes/RustDesk"

          echo "Mounting DMG..."

          ATTACH_OUTPUT="$(
            hdiutil attach \
              /tmp/RustDesk.dmg \
              -nobrowse \
              -plist
          )"

          MOUNT_POINT="$(
            python3 -c '
import plistlib
import sys

data = plistlib.loads(sys.stdin.buffer.read())

for item in data.get("system-entities", []):
    mount = item.get("mount-point")
    if mount:
        print(mount)
        break
            ' <<< "$ATTACH_OUTPUT"
          )"

          if [ -z "$MOUNT_POINT" ]; then
            echo -e "${RED}ERROR: Could not determine DMG mount point.${RESET}"
            exit 1
          fi

          echo "Mounted at:"
          echo "$MOUNT_POINT"

          echo ""
          echo "Installing RustDesk.app..."

          sudo rm -rf \
            "/Applications/RustDesk.app"

          sudo cp -R \
            "$MOUNT_POINT/RustDesk.app" \
            "/Applications/"

          echo ""
          echo "Unmounting DMG..."

          hdiutil detach \
            "$MOUNT_POINT" \
            -quiet

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -x "$RUSTDESK" ]; then
            echo -e "${RED}ERROR: RustDesk executable not found.${RESET}"
            exit 1
          fi

          echo ""
          echo "RustDesk version:"

          "$RUSTDESK" --version || true

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║     🟢 RUSTDESK INSTALLED               ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"


      # ============================================================
      # 7. PREPARE RUSTDESK USER ENVIRONMENT
      # ============================================================
      - name: Prepare RustDesk User Environment
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " PREPARING RUSTDESK USER ENVIRONMENT"
          echo "=========================================="

          HOME_DIR="$(
            dscl . -read \
              "/Users/$MACOS_USERNAME" \
              NFSHomeDirectory |
              awk '{print $2}'
          )"

          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "Home:"
          echo "$HOME_DIR"

          sudo -u "$MACOS_USERNAME" mkdir -p \
            "$HOME_DIR/Library/Application Support/RustDesk"

          sudo -u "$MACOS_USERNAME" mkdir -p \
            "$HOME_DIR/Library/Logs/RustDesk"

          sudo chown -R \
            "$MACOS_USERNAME":staff \
            "$HOME_DIR/Library/Application Support/RustDesk"

          sudo chown -R \
            "$MACOS_USERNAME":staff \
            "$HOME_DIR/Library/Logs/RustDesk"

          echo ""
          echo "🟢 User environment prepared."


      # ============================================================
      # 8. GET RUSTDESK ID
      # ============================================================
      - name: Get RustDesk ID
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} GETTING RUSTDESK ID${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          RUSTDESK_ID=""

          for i in {1..15}; do

            RUSTDESK_ID="$(
              "$RUSTDESK" \
                --get-id \
                2>/dev/null |
                tr -d '[:space:]' ||
                true
            )"

            if [ -n "$RUSTDESK_ID" ]; then
              break
            fi

            echo "Waiting for RustDesk ID... ($i/15)"
            sleep 2

          done

          if [ -z "$RUSTDESK_ID" ]; then
            echo -e "${RED}ERROR: RustDesk ID not available.${RESET}"
            exit 1
          fi

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║        🟢 RUSTDESK ID READY             ║${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║        ID: $RUSTDESK_ID${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          echo ""
          echo "RUSTDESK_ID=$RUSTDESK_ID" >> "$GITHUB_ENV"


      # ============================================================
      # 9. START ROOT RUSTDESK SERVER + SET PASSWORD
      # ============================================================
      - name: Configure Permanent RustDesk Password
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} CONFIGURING PERMANENT PASSWORD${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo -e "${RED}ERROR: RUSTDESK_PASSWORD is empty.${RESET}"
            exit 1
          fi

          echo ""
          echo "Stopping any old RustDesk server..."

          sudo pkill -f \
            "/Applications/RustDesk.app/Contents/MacOS/RustDesk --server" \
            2>/dev/null ||
            true

          sleep 3

          echo ""
          echo "Starting RustDesk server with administrative privileges..."

          sudo "$RUSTDESK" \
            --server \
            > /tmp/rustdesk-server.log \
            2>&1 &

          SERVER_PID=$!

          echo "Server PID: $SERVER_PID"

          echo ""
          echo "Waiting for RustDesk IPC..."

          sleep 10

          echo ""
          echo "Applying permanent password..."

          PASSWORD_OUTPUT="$(
            sudo "$RUSTDESK" \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          )" || {
            echo ""
            echo -e "${RED}ERROR: Password command failed.${RESET}"
            echo "$PASSWORD_OUTPUT"

            echo ""
            echo "RustDesk server log:"
            cat /tmp/rustdesk-server.log || true

            exit 1
          }

          echo "$PASSWORD_OUTPUT"

          if echo "$PASSWORD_OUTPUT" | grep -qi "Done"; then

            echo ""
            echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
            echo -e "${GREEN}║     🟢 PASSWORD CONFIGURED              ║${RESET}"
            echo -e "${GREEN}║     🔐 PASSWORD VALUE HIDDEN             ║${RESET}"
            echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          else

            echo ""
            echo -e "${RED}ERROR: RustDesk did not return Done!.${RESET}"

            echo ""
            echo "RustDesk server log:"
            cat /tmp/rustdesk-server.log || true

            exit 1

          fi


      # ============================================================
      # 10. START RUSTDESK GUI AS ABDULRAHMAN
      # ============================================================
      - name: Start RustDesk GUI
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          HOME_DIR="$(
            dscl . -read \
              "/Users/$MACOS_USERNAME" \
              NFSHomeDirectory |
              awk '{print $2}'
          )"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} STARTING RUSTDESK GUI${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "Starting RustDesk GUI..."

          sudo -u "$MACOS_USERNAME" \
            env \
            HOME="$HOME_DIR" \
            USER="$MACOS_USERNAME" \
            "$RUSTDESK" \
            > /tmp/rustdesk-gui.log \
            2>&1 &

          sleep 8

          echo ""
          echo "RustDesk processes:"
          ps aux | grep -i "[R]ustDesk" || true

          echo ""
          echo -e "${GREEN}🟢 RUSTDESK GUI STARTED${RESET}"


      # ============================================================
      # 11. INSTALL WATCHDOG
      # ============================================================
      - name: Install RustDesk Watchdog
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          WATCHDOG="/usr/local/bin/rustdesk-watchdog.sh"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} INSTALLING RUSTDESK WATCHDOG${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          cat > /tmp/rustdesk-watchdog.sh <<'WATCHDOG'
          #!/bin/bash

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          USER_NAME="__MACOS_USERNAME__"

          while true; do

            if ! pgrep -f \
              "/Applications/RustDesk.app/Contents/MacOS/RustDesk --server" \
              >/dev/null 2>&1
            then

              echo "$(date) - RustDesk server stopped. Restarting..."

              "$RUSTDESK" \
                --server \
                >> /tmp/rustdesk-watchdog.log \
                2>&1 &

              sleep 10

            fi

            if ! pgrep -u "$USER_NAME" -f \
              "/Applications/RustDesk.app/Contents/MacOS/RustDesk" \
              >/dev/null 2>&1
            then

              echo "$(date) - RustDesk GUI stopped. Restarting..."

              USER_HOME="$(dscl . -read "/Users/$USER_NAME" NFSHomeDirectory | awk '{print $2}')"

              sudo -u "$USER_NAME" \
                env \
                HOME="$USER_HOME" \
                USER="$USER_NAME" \
                "$RUSTDESK" \
                >> /tmp/rustdesk-watchdog-gui.log \
                2>&1 &

              sleep 10

            fi

            sleep 10

          done
          WATCHDOG

          sed \
            -i '' \
            "s/__MACOS_USERNAME__/$MACOS_USERNAME/g" \
            /tmp/rustdesk-watchdog.sh

          sudo mkdir -p /usr/local/bin

          sudo cp \
            /tmp/rustdesk-watchdog.sh \
            "$WATCHDOG"

          sudo chmod 755 \
            "$WATCHDOG"

          echo ""
          echo "Starting watchdog..."

          sudo nohup \
            "$WATCHDOG" \
            > /tmp/rustdesk-watchdog.log \
            2>&1 &

          sleep 3

          if pgrep -f \
            "/usr/local/bin/rustdesk-watchdog.sh" \
            >/dev/null 2>&1
          then

            echo ""
            echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
            echo -e "${GREEN}║      🟢 AUTO-RESTART ENABLED            ║${RESET}"
            echo -e "${GREEN}║      🟢 WATCHDOG RUNNING                ║${RESET}"
            echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          else

            echo "ERROR: Watchdog did not start."
            exit 1

          fi


      # ============================================================
      # 12. FINAL VERIFICATION
      # ============================================================
      - name: Final Verification
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          CURRENT_ID="$(
            "$RUSTDESK" \
              --get-id \
              2>/dev/null |
              tr -d '[:space:]' ||
              true
          )"

          echo ""
          echo -e "${GREEN}================================================${RESET}"
          echo -e "${GREEN}       🟢 RUSTDESK CONNECTION INFO             ${RESET}"
          echo -e "${GREEN}================================================${RESET}"
          echo ""
          echo -e "${GREEN}       RUSTDESK ID: $CURRENT_ID${RESET}"
          echo ""
          echo -e "${GREEN}       PASSWORD: CONFIGURED${RESET}"
          echo ""
          echo -e "${GREEN}       MACOS USER: $MACOS_USERNAME${RESET}"
          echo ""
          echo -e "${GREEN}       AUTO-RESTART: ENABLED${RESET}"
          echo ""
          echo -e "${GREEN}       WATCHDOG: RUNNING${RESET}"
          echo ""
          echo -e "${GREEN}================================================${RESET}"

          echo ""
          echo "RustDesk processes:"
          ps aux | grep -i "[R]ustDesk" || true

          echo ""
          echo "Watchdog:"
          ps aux | grep -i "[r]ustdesk-watchdog" || true

          echo ""
          echo "Password is stored in GitHub Secret:"
          echo "RUSTDESK_PASSWORD"

          echo ""
          echo "The actual password is intentionally hidden."


      # ============================================================
      # 13. OPEN SYSTEM SETTINGS
      # ============================================================
      - name: Open System Settings
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension" \
            2>/dev/null ||
            true

          echo ""
          echo "System Settings opened if a GUI session is available."


      # ============================================================
      # 14. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo ""
          echo -e "${GREEN}================================================${RESET}"
          echo -e "${GREEN}       🟢 MACOS RUNNER IS READY               ${RESET}"
          echo -e "${GREEN}================================================${RESET}"

          echo ""
          echo "RustDesk ID:"
          "$RUSTDESK" --get-id 2>/dev/null || true

          echo ""
          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "Password:"
          echo "CONFIGURED"

          echo ""
          echo "Auto-restart:"
          echo "ENABLED"

          echo ""
          echo "Runner will remain alive."

          while true; do

            echo ""
            echo -e "${CYAN}========== STATUS $(date) ==========${RESET}"

            echo ""
            echo "RustDesk processes:"
            ps aux | grep -i "[R]ustDesk" || true

            echo ""
            echo "RustDesk ID:"
            "$RUSTDESK" \
              --get-id \
              2>/dev/null ||
              true

            echo ""
            echo "Watchdog:"
            if pgrep -f \
              "/usr/local/bin/rustdesk-watchdog.sh" \
              >/dev/null 2>&1
            then
              echo -e "${GREEN}🟢 RUNNING${RESET}"
            else
              echo -e "${RED}🔴 NOT RUNNING${RESET}"
            fi

            echo ""
            echo "Watchdog log:"
            tail -10 \
              /tmp/rustdesk-watchdog.log \
              2>/dev/null ||
              true

            echo ""
            echo "Sleeping 5 minutes..."

            sleep 300

          done


