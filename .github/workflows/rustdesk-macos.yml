name: macOS RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          YELLOW='\033[1;33m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} SYSTEM INFORMATION${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true


      # =========================================================
      # 2. CREATE ABDULRAHMAN
      # =========================================================
      - name: Create Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} CREATING ABDULRAHMAN${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          if [ -z "$MACOS_USERNAME" ]; then
            echo -e "${RED}ERROR: MACOS_USERNAME is empty.${RESET}"
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo -e "${RED}ERROR: MACOS_PASSWORD is empty.${RESET}"
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo -e "${RED}ERROR: Invalid username.${RESET}"
            exit 1
          fi

          echo ""
          echo "Username:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then

            echo ""
            echo -e "${GREEN}User already exists.${RESET}"

          else

            echo ""
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo -e "${GREEN}User created.${RESET}"

          fi

          echo ""
          echo "Adding Administrator privileges..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "User ID:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"


      # =========================================================
      # 3. VERIFY ABDULRAHMAN
      # =========================================================
      - name: Verify Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} VERIFYING ABDULRAHMAN${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "whoami:"
          sudo -u "$MACOS_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Home:"
          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

          echo ""
          echo "Checking Administrator membership..."

          ADMIN_CHECK=$(
            dseditgroup \
              -o checkmember \
              -m "$MACOS_USERNAME" \
              admin
          )

          echo "$ADMIN_CHECK"

          if echo "$ADMIN_CHECK" | grep -qi "yes"; then
            echo ""
            echo -e "${GREEN}SUCCESS: Abdulrahman is an Administrator.${RESET}"
          else
            echo ""
            echo "ERROR: Abdulrahman is NOT an Administrator."
            exit 1
          fi


      # =========================================================
      # 4. SET AUTO LOGIN
      # =========================================================
      - name: Configure Abdulrahman Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Target:"
          echo "$MACOS_USERNAME"

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            || true

          echo ""
          echo "Auto-login status:"

          sudo sysadminctl \
            -autologin status \
            || true

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "IMPORTANT:"
          echo "Auto-login applies to a future login."


      # =========================================================
      # 5. INSTALL RUSTDESK
      # =========================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          brew update

          brew install --cask rustdesk

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -f "$RUSTDESK" ]; then
            echo "ERROR: RustDesk executable not found."
            exit 1
          fi

          echo ""
          echo "RustDesk version:"
          "$RUSTDESK" --version || true


      # =========================================================
      # 6. CONFIGURE RUSTDESK PASSWORD
      # =========================================================
      - name: Configure RustDesk Password
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} CONFIGURING RUSTDESK PASSWORD${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo -e "${RED}ERROR: RUSTDESK_PASSWORD is empty.${RESET}"
            exit 1
          fi

          echo ""
          echo "Running RustDesk password configuration..."

          PASSWORD_OUTPUT=$(
            sudo -u "$MACOS_USERNAME" -H \
              env \
              HOME="/Users/$MACOS_USERNAME" \
              USER="$MACOS_USERNAME" \
              LOGNAME="$MACOS_USERNAME" \
              "$RUSTDESK" \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          )

          echo "$PASSWORD_OUTPUT"

          if echo "$PASSWORD_OUTPUT" | grep -qi "done"; then
            echo ""
            echo -e "${GREEN}==========================================${RESET}"
            echo -e "${GREEN} PASSWORD CONFIGURATION SUCCESS${RESET}"
            echo -e "${GREEN}==========================================${RESET}"
          else
            echo ""
            echo -e "${RED}WARNING: RustDesk did not report Done.${RESET}"
          fi


      # =========================================================
      # 7. START RUSTDESK AS ABDULRAHMAN
      # =========================================================
      - name: Start RustDesk As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} STARTING RUSTDESK${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "Starting RustDesk server..."

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            "$RUSTDESK" \
            --server \
            >/tmp/rustdesk-abdulrahman.log 2>&1 &

          sleep 10

          echo ""
          echo "RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "Getting RustDesk ID..."

          ID=""

          for i in {1..10}
          do
            ID=$(
              sudo -u "$MACOS_USERNAME" -H \
                env \
                HOME="/Users/$MACOS_USERNAME" \
                USER="$MACOS_USERNAME" \
                LOGNAME="$MACOS_USERNAME" \
                "$RUSTDESK" \
                --get-id \
                2>/dev/null || true
            )

            if [ -n "$ID" ]; then
              break
            fi

            sleep 2
          done

          if [ -n "$ID" ]; then

            echo ""
            echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
            echo -e "${GREEN}║          🟢 RUSTDESK READY              ║${RESET}"
            echo -e "${GREEN}╠══════════════════════════════════════════╣${RESET}"
            echo -e "${GREEN}║                                          ║${RESET}"
            echo -e "${GREEN}║  RUSTDESK ID:                            ║${RESET}"
            echo -e "${GREEN}║  $ID${RESET}"
            echo -e "${GREEN}║                                          ║${RESET}"
            echo -e "${GREEN}║  PASSWORD: CONFIGURED                    ║${RESET}"
            echo -e "${GREEN}║  USER: $MACOS_USERNAME${RESET}"
            echo -e "${GREEN}║                                          ║${RESET}"
            echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          else

            echo ""
            echo -e "${RED}ERROR: Could not retrieve RustDesk ID.${RESET}"

            echo ""
            echo "RustDesk log:"
            tail -100 \
              /tmp/rustdesk-abdulrahman.log \
              2>/dev/null || true

            exit 1
          fi


      # =========================================================
      # 8. INSTALL LAUNCHDAEMON AUTO RESTART
      # =========================================================
      - name: Install RustDesk Auto Restart
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          PLIST="/Library/LaunchDaemons/com.abdulrahman.rustdesk.server.plist"
          LOG="/tmp/rustdesk-launchdaemon.log"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} INSTALLING AUTO RESTART${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "Creating LaunchDaemon..."

          sudo tee "$PLIST" >/dev/null <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>Label</key>
              <string>com.abdulrahman.rustdesk.server</string>

              <key>UserName</key>
              <string>$MACOS_USERNAME</string>

              <key>ProgramArguments</key>
              <array>
                  <string>$RUSTDESK</string>
                  <string>--server</string>
              </array>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <true/>

              <key>ThrottleInterval</key>
              <integer>5</integer>

              <key>StandardOutPath</key>
              <string>$LOG</string>

              <key>StandardErrorPath</key>
              <string>$LOG</string>

          </dict>
          </plist>
          EOF

          sudo chown root:wheel "$PLIST"
          sudo chmod 644 "$PLIST"

          echo ""
          echo "Validating plist..."

          sudo plutil -lint "$PLIST"

          echo ""
          echo "Loading LaunchDaemon..."

          sudo launchctl bootout \
            system/com.abdulrahman.rustdesk.server \
            2>/dev/null || true

          sudo launchctl bootstrap \
            system \
            "$PLIST"

          sleep 5

          echo ""
          echo -e "${GREEN}==========================================${RESET}"
          echo -e "${GREEN} AUTO RESTART SERVICE INSTALLED${RESET}"
          echo -e "${GREEN}==========================================${RESET}"

          echo ""
          echo "LaunchDaemon status:"

          sudo launchctl print \
            system/com.abdulrahman.rustdesk.server \
            2>/dev/null || true


      # =========================================================
      # 9. VERIFY RUSTDESK + PASSWORD + ID
      # =========================================================
      - name: Final RustDesk Verification
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} FINAL RUSTDESK VERIFICATION${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          sleep 5

          ID=$(
            sudo -u "$MACOS_USERNAME" -H \
              env \
              HOME="/Users/$MACOS_USERNAME" \
              USER="$MACOS_USERNAME" \
              LOGNAME="$MACOS_USERNAME" \
              "$RUSTDESK" \
              --get-id \
              2>/dev/null || true
          )

          echo ""
          echo "RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "LaunchDaemon:"
          sudo launchctl print \
            system/com.abdulrahman.rustdesk.server \
            2>/dev/null || true

          echo ""

          if [ -n "$ID" ]; then

            echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
            echo -e "${GREEN}║          🟢 CONNECTION INFO             ║${RESET}"
            echo -e "${GREEN}╠══════════════════════════════════════════╣${RESET}"
            echo -e "${GREEN}║                                          ║${RESET}"
            echo -e "${GREEN}║  RUSTDESK ID:                            ║${RESET}"
            echo -e "${GREEN}║  $ID${RESET}"
            echo -e "${GREEN}║                                          ║${RESET}"
            echo -e "${GREEN}║  PASSWORD: CONFIGURED                    ║${RESET}"
            echo -e "${GREEN}║  USER: $MACOS_USERNAME${RESET}"
            echo -e "${GREEN}║  AUTO-RESTART: ENABLED                   ║${RESET}"
            echo -e "${GREEN}║                                          ║${RESET}"
            echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          else

            echo -e "${RED}ERROR: RustDesk ID unavailable.${RESET}"
            exit 1

          fi


      # =========================================================
      # 10. OPEN SYSTEM SETTINGS
      # =========================================================
      - name: Open System Settings As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " OPENING SYSTEM SETTINGS"
          echo "=========================================="

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            /usr/bin/open \
            -a "System Settings" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "GUI sessions:"
          who || true


      # =========================================================
      # 11. FINAL CHECK
      # =========================================================
      - name: Final Check
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true

          echo ""
          echo "Current Actions user:"
          whoami

          echo ""
          echo "Abdulrahman:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Abdulrahman groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "RustDesk:"
          pgrep -fl RustDesk || true

          echo ""
          echo "RustDesk ID:"

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            "$RUSTDESK" \
            --get-id \
            2>/dev/null || true

          echo ""
          echo "LaunchDaemon:"

          sudo launchctl print \
            system/com.abdulrahman.rustdesk.server \
            2>/dev/null || true


      # =========================================================
      # 12. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RUNNER IS ONLINE"
          echo "=========================================="

          while true
          do

            echo ""
            echo "[$(date)] Runner alive"

            echo ""
            echo "Console user:"
            stat -f "%Su" /dev/console \
              2>/dev/null || echo "unknown"

            echo ""
            echo "Logged users:"
            who || true

            echo ""
            echo "RustDesk processes:"
            pgrep -fl RustDesk || true

            echo ""
            echo "RustDesk ID:"

            RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

            "$RUSTDESK" \
              --get-id \
              2>/dev/null || true

            echo ""
            echo "Auto-Restart Service:"

            sudo launchctl print \
              system/com.abdulrahman.rustdesk.server \
              2>/dev/null | \
              grep -E \
              "state =|pid =|path =|program =" \
              || true

            echo ""
            echo "------------------------------------------"

            sleep 300

          done


