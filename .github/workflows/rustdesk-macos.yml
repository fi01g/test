name: macOS - RustDesk + NoMachine

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. SYSTEM INFO
      # ==========================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          sw_vers
          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true


      # ==========================================
      # 2. CREATE ABDULRAHMAN
      # ==========================================
      - name: Create Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CREATING MACOS USER"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD is empty."
            exit 1
          fi

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo ""
          echo "Adding administrator privileges..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "User information:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"


      # ==========================================
      # 3. VERIFY USER
      # ==========================================
      - name: Verify User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING USER"
          echo "=========================================="

          echo ""
          echo "Username:"
          sudo -u "$MACOS_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Home:"
          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory


      # ==========================================
      # 4. INSTALL NOMACHINE
      # ==========================================
      - name: Install NoMachine
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING NOMACHINE"
          echo "=========================================="

          ARCH="$(uname -m)"

          echo ""
          echo "Architecture:"
          echo "$ARCH"

          if [ "$ARCH" = "arm64" ]; then
            NOMACHINE_URL="https://download.nomachine.com/download/8.18/MacOSX/nomachine_8.18.4_1_arm64.dmg"
          else
            NOMACHINE_URL="https://download.nomachine.com/download/8.18/MacOSX/nomachine_8.18.4_1_x86_64.dmg"
          fi

          echo ""
          echo "Downloading NoMachine..."

          curl -L \
            --fail \
            --retry 3 \
            "$NOMACHINE_URL" \
            -o /tmp/nomachine.dmg

          echo ""
          echo "Mounting NoMachine DMG..."

          MOUNT_POINT=$(
            hdiutil attach \
              /tmp/nomachine.dmg \
              -nobrowse \
              | awk '/Volumes/ {print substr($0,index($0,$3))}'
          )

          echo ""
          echo "Mounted at:"
          echo "$MOUNT_POINT"

          echo ""
          echo "DMG contents:"
          ls -la "$MOUNT_POINT"

          echo ""
          echo "Installing NoMachine..."

          INSTALLER="$MOUNT_POINT/NoMachine.app"

          if [ -d "$INSTALLER" ]; then
            sudo cp -R \
              "$INSTALLER" \
              /Applications/NoMachine.app
          else
            echo "ERROR: NoMachine.app not found."
            hdiutil detach "$MOUNT_POINT" || true
            exit 1
          fi

          echo ""
          echo "Unmounting..."

          hdiutil detach "$MOUNT_POINT" || true

          echo ""
          echo "NoMachine installed."

          ls -la /Applications/NoMachine.app


      # ==========================================
      # 5. START NOMACHINE
      # ==========================================
      - name: Start NoMachine
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " STARTING NOMACHINE"
          echo "=========================================="

          echo ""
          echo "Searching for NoMachine server..."

          find /Applications/NoMachine.app \
            -maxdepth 5 \
            -type f \
            \( \
              -name "nxserver" \
              -o \
              -name "nxnode" \
            \) \
            2>/dev/null || true

          echo ""
          echo "Starting NoMachine application..."

          sudo open -a "/Applications/NoMachine.app" || true

          sleep 10

          echo ""
          echo "NoMachine processes:"

          ps aux | grep -i nomachine | grep -v grep || true

          echo ""
          echo "Listening ports:"

          sudo lsof -nP -iTCP -sTCP:LISTEN \
            2>/dev/null \
            | grep -Ei "nx|4000|nomachine" \
            || true


      # ==========================================
      # 6. NETWORK INFORMATION
      # ==========================================
      - name: Network Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " NETWORK INFORMATION"
          echo "=========================================="

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "Local IP addresses:"

          ifconfig \
            | grep "inet " \
            | grep -v "127.0.0.1" \
            || true

          echo ""
          echo "Listening TCP ports:"

          sudo lsof \
            -nP \
            -iTCP \
            -sTCP:LISTEN \
            2>/dev/null \
            || true


      # ==========================================
      # 7. INSTALL RUSTDESK
      # ==========================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          brew update

          brew install --cask rustdesk

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -f "$RUSTDESK" ]; then
            echo "ERROR: RustDesk executable not found."
            exit 1
          fi

          echo ""
          echo "RustDesk version:"

          "$RUSTDESK" --version || true


      # ==========================================
      # 8. CONFIGURE RUSTDESK
      # ==========================================
      - name: Configure RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD is empty."
            exit 1
          fi

          echo ""
          echo "Starting RustDesk server..."

          "$RUSTDESK" \
            --server \
            >/tmp/rustdesk-server.log 2>&1 &

          sleep 10

          echo ""
          echo "RustDesk ID:"

          ID=$(
            "$RUSTDESK" \
              --get-id \
              2>/dev/null \
              || true
          )

          echo "$ID"

          echo ""
          echo "Setting permanent password..."

          "$RUSTDESK" \
            --password "$RUSTDESK_PASSWORD" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Restarting RustDesk..."

          pkill -f \
            "/Applications/RustDesk.app/Contents/MacOS/RustDesk" \
            || true

          sleep 5

          nohup "$RUSTDESK" \
            >/tmp/rustdesk.log 2>&1 &

          sleep 10

          FINAL_ID=$(
            "$RUSTDESK" \
              --get-id \
              2>/dev/null \
              || true
          )

          echo ""
          echo "=========================================="
          echo " RUSTDESK READY"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          echo "$FINAL_ID"

          echo ""
          echo "RustDesk process:"

          pgrep -fl RustDesk || true


      # ==========================================
      # 9. START RUSTDESK AS ABDULRAHMAN
      # ==========================================
      - name: Start RustDesk As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " STARTING RUSTDESK AS USER"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo ""
          echo "Starting as:"
          echo "$MACOS_USERNAME"

          sudo -u "$MACOS_USERNAME" \
            -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            nohup "$RUSTDESK" \
            >/tmp/rustdesk-user.log 2>&1 &

          sleep 10

          echo ""
          echo "RustDesk processes:"

          pgrep -fl RustDesk || true


      # ==========================================
      # 10. FINAL STATUS
      # ==========================================
      - name: Final Status
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          echo "=========================================="
          echo " FINAL STATUS"
          echo "=========================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Created user:"
          id "$MACOS_USERNAME"

          echo ""
          echo "RustDesk:"
          pgrep -fl RustDesk || true

          echo ""
          echo "NoMachine:"
          ps aux | grep -i nomachine | grep -v grep || true

          echo ""
          echo "Listening ports:"
          sudo lsof \
            -nP \
            -iTCP \
            -sTCP:LISTEN \
            2>/dev/null \
            | grep -E "4000|nx|RustDesk" \
            || true

          echo ""
          echo "=========================================="
          echo " REMOTE ACCESS SERVICES STARTED"
          echo "=========================================="


      # ==========================================
      # 11. KEEP RUNNER ALIVE
      # ==========================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " MACOS RUNNER ONLINE"
          echo "=========================================="

          while true
          do
            echo ""
            echo "[$(date)] Runner alive"

            echo ""
            echo "Console user:"
            stat -f "%Su" /dev/console \
              2>/dev/null || true

            echo ""
            echo "RustDesk:"
            pgrep -fl RustDesk || true

            echo ""
            echo "NoMachine:"
            ps aux \
              | grep -i nomachine \
              | grep -v grep \
              || true

            echo ""
            echo "Listening ports:"
            sudo lsof \
              -nP \
              -iTCP \
              -sTCP:LISTEN \
              2>/dev/null \
              | grep -E "4000|nx|RustDesk" \
              || true

            sleep 300
          done
