name: macOS RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================
      - name: System Information
        run: |
          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          sw_vers
          echo ""
          uname -a
          echo ""
          echo "Current user:"
          whoami

          echo ""
          echo "Console user:"
          scutil <<< "show State:/Users/ConsoleUser" | grep -E "Name :|UID :" || true

      # ============================================================
      # 2. CREATE / VERIFY USER
      # ============================================================
      - name: Create Abdulrahman User
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CREATING / VERIFYING USER"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ] || [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_USERNAME or MACOS_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "Abdulrahman" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo "Administrator membership configured."

      # ============================================================
      # 3. VERIFY USER
      # ============================================================
      - name: Verify Abdulrahman
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING USER"
          echo "=========================================="

          id "$MACOS_USERNAME"

          echo ""
          echo "Admin membership:"
          dseditgroup -o checkmember -m "$MACOS_USERNAME" admin || true

          echo ""
          echo "Home directory:"
          dscl . -read "/Users/$MACOS_USERNAME" NFSHomeDirectory

      # ============================================================
      # 4. CONFIGURE AUTO LOGIN
      # ============================================================
      - name: Configure Auto Login
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            2>&1 || true

          echo ""
          echo "Auto-login configuration attempted."

      # ============================================================
      # 5. INSTALL RUSTDESK
      # ============================================================
      - name: Install RustDesk
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          if [ ! -d "/Applications/RustDesk.app" ]; then
            brew install --cask rustdesk
          else
            echo "RustDesk already installed."
          fi

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -x "$RUSTDESK" ]; then
            echo "ERROR: RustDesk executable not found."
            exit 1
          fi

          echo ""
          echo "RustDesk executable:"
          ls -lh "$RUSTDESK"

          echo ""
          echo "RustDesk version:"
          "$RUSTDESK" --version || true

      # ============================================================
      # 6. INITIALIZE RUSTDESK
      # ============================================================
      - name: Initialize RustDesk
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} INITIALIZING RUSTDESK${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          HOME_DIR="$(dscl . -read "/Users/$MACOS_USERNAME" NFSHomeDirectory | awk '{print $2}')"

          echo "RustDesk home:"
          echo "$HOME_DIR"

          echo ""
          echo "Creating RustDesk preference directories..."

          sudo -u "$MACOS_USERNAME" mkdir -p \
            "$HOME_DIR/Library/Preferences/com.carriez.RustDesk"

          sudo -u "$MACOS_USERNAME" mkdir -p \
            "$HOME_DIR/Library/Logs/RustDesk"

          sudo chown -R "$MACOS_USERNAME":staff \
            "$HOME_DIR/Library/Preferences/com.carriez.RustDesk"

          sudo chown -R "$MACOS_USERNAME":staff \
            "$HOME_DIR/Library/Logs/RustDesk"

          echo ""
          echo "Starting RustDesk once as target user..."

          sudo -u "$MACOS_USERNAME" \
            env HOME="$HOME_DIR" \
            USER="$MACOS_USERNAME" \
            "$RUSTDESK" --server \
            > /tmp/rustdesk-initial.log 2>&1 &

          sleep 8

          echo ""
          echo "Initial RustDesk log:"
          cat /tmp/rustdesk-initial.log || true

          echo ""
          echo -e "${GREEN}🟢 RUSTDESK INITIALIZED${RESET}"

      # ============================================================
      # 7. GET INITIAL RUSTDESK ID
      # ============================================================
      - name: Get RustDesk ID
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} GETTING RUSTDESK ID${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          RUSTDESK_ID=""

          for i in {1..15}; do

            RUSTDESK_ID=$(
              "$RUSTDESK" --get-id 2>/dev/null |
              tr -d '[:space:]' || true
            )

            if [ -n "$RUSTDESK_ID" ]; then
              break
            fi

            echo "Waiting for RustDesk ID... ($i/15)"
            sleep 3

          done

          if [ -z "$RUSTDESK_ID" ]; then
            echo -e "${RED}ERROR: RustDesk ID could not be obtained.${RESET}"
            echo ""
            echo "RustDesk processes:"
            ps aux | grep -i "[R]ustDesk" || true
            exit 1
          fi

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║        🟢 RUSTDESK ID READY             ║${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║        ID: $RUSTDESK_ID${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          echo ""
          echo "RUSTDESK_ID=$RUSTDESK_ID" >> "$GITHUB_ENV"

      # ============================================================
      # 8. CONFIGURE PERMANENT PASSWORD
      # ============================================================
      - name: Configure Permanent Password
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} CONFIGURING PERMANENT PASSWORD${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo -e "${RED}ERROR: RUSTDESK_PASSWORD is empty.${RESET}"
            exit 1
          fi

          echo ""
          echo "Stopping temporary RustDesk server..."

          pkill -f "/Applications/RustDesk.app/Contents/MacOS/RustDesk --server" \
            2>/dev/null || true

          sleep 3

          echo ""
          echo "Starting RustDesk server..."

          "$RUSTDESK" --server \
            > /tmp/rustdesk-password-server.log 2>&1 &

          sleep 8

          echo ""
          echo "Applying permanent password..."

          PASSWORD_OUTPUT=$(
            sudo "$RUSTDESK" \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          ) || {
            echo ""
            echo -e "${RED}ERROR: RustDesk password command failed.${RESET}"
            echo "$PASSWORD_OUTPUT"
            echo ""
            echo "RustDesk password server log:"
            cat /tmp/rustdesk-password-server.log || true
            exit 1
          }

          echo "$PASSWORD_OUTPUT"

          if echo "$PASSWORD_OUTPUT" | grep -qi "Done"; then

            echo ""
            echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
            echo -e "${GREEN}║     🟢 PASSWORD CONFIGURED              ║${RESET}"
            echo -e "${GREEN}║     🔐 VALUE HIDDEN                     ║${RESET}"
            echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          else

            echo ""
            echo -e "${RED}ERROR: RustDesk did not confirm password configuration.${RESET}"
            exit 1

          fi

      # ============================================================
      # 9. INSTALL RUSTDESK SERVICE
      # ============================================================
      - name: Install RustDesk Service
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} INSTALLING RUSTDESK SERVICE${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "Installing RustDesk service..."

          sudo "$RUSTDESK" --install-service 2>&1 || true

          sleep 5

          DAEMON="/Library/LaunchDaemons/com.carriez.RustDesk_service.plist"
          AGENT="/Library/LaunchAgents/com.carriez.RustDesk_server.plist"

          echo ""
          echo "Checking service files..."

          if [ ! -f "$DAEMON" ]; then
            echo -e "${RED}ERROR: RustDesk LaunchDaemon was not created.${RESET}"
            exit 1
          fi

          if [ ! -f "$AGENT" ]; then
            echo -e "${RED}ERROR: RustDesk LaunchAgent was not created.${RESET}"
            exit 1
          fi

          echo ""
          echo "Daemon:"
          ls -lh "$DAEMON"

          echo ""
          echo "Agent:"
          ls -lh "$AGENT"

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║     🟢 RUSTDESK SERVICE INSTALLED       ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

      # ============================================================
      # 10. LOAD RUSTDESK SYSTEM SERVICE
      # ============================================================
      - name: Load RustDesk System Service
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          DAEMON="/Library/LaunchDaemons/com.carriez.RustDesk_service.plist"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} LOADING RUSTDESK SYSTEM SERVICE${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          sudo launchctl bootout \
            system/com.carriez.RustDesk_service \
            2>/dev/null || true

          sudo launchctl bootstrap \
            system \
            "$DAEMON"

          sudo launchctl enable \
            system/com.carriez.RustDesk_service \
            2>/dev/null || true

          sudo launchctl kickstart \
            -k \
            system/com.carriez.RustDesk_service \
            2>/dev/null || true

          sleep 5

          echo ""
          echo "RustDesk service status:"

          sudo launchctl print \
            system/com.carriez.RustDesk_service \
            2>/dev/null || true

          echo ""
          echo -e "${GREEN}🟢 RUSTDESK SYSTEM SERVICE ACTIVE${RESET}"

      # ============================================================
      # 11. VERIFY RUSTDESK
      # ============================================================
      - name: Verify RustDesk
        run: |
          set -e

          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RED='\033[0;31m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} FINAL RUSTDESK VERIFICATION${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "RustDesk processes:"
          ps aux | grep -i "[R]ustDesk" || true

          echo ""
          echo "RustDesk service:"
          sudo launchctl print \
            system/com.carriez.RustDesk_service \
            2>/dev/null | grep -E "state =|pid =|path =" || true

          echo ""
          echo "RustDesk ID:"
          CURRENT_ID=$(
            "$RUSTDESK" --get-id 2>/dev/null |
            tr -d '[:space:]' || true
          )

          if [ -z "$CURRENT_ID" ]; then
            echo -e "${RED}ERROR: RustDesk ID disappeared after service installation.${RESET}"
            exit 1
          fi

          echo "$CURRENT_ID"

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║       🟢 RUSTDESK READY                 ║${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║       ID: $CURRENT_ID${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║       PASSWORD: CONFIGURED               ║${RESET}"
          echo -e "${GREEN}║       SERVICE: RUNNING                   ║${RESET}"
          echo -e "${GREEN}║       AUTO-RESTART: ENABLED              ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          echo ""
          echo "RUSTDESK_ID=$CURRENT_ID" >> "$GITHUB_ENV"

      # ============================================================
      # 12. OPEN SYSTEM SETTINGS
      # ============================================================
      - name: Open System Settings
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension" \
            2>/dev/null || true

          echo ""
          echo "System Settings opened if a GUI session is available."

      # ============================================================
      # 13. FINAL CONNECTION INFORMATION
      # ============================================================
      - name: Final Connection Information
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          GREEN='\033[0;32m'
          RESET='\033[0m'

          echo ""
          echo -e "${GREEN}================================================${RESET}"
          echo -e "${GREEN}       🟢 RUSTDESK CONNECTION INFO             ${RESET}"
          echo -e "${GREEN}================================================${RESET}"
          echo ""
          echo -e "${GREEN}       RUSTDESK ID: $RUSTDESK_ID${RESET}"
          echo ""
          echo -e "${GREEN}       PASSWORD: CONFIGURED${RESET}"
          echo ""
          echo -e "${GREEN}       MACOS USER: $MACOS_USERNAME${RESET}"
          echo ""
          echo -e "${GREEN}       AUTO-RESTART: ENABLED${RESET}"
          echo ""
          echo -e "${GREEN}       SERVICE: RUNNING${RESET}"
          echo ""
          echo -e "${GREEN}================================================${RESET}"
          echo ""
          echo "Use the password stored in GitHub Secret:"
          echo "RUSTDESK_PASSWORD"
          echo ""
          echo "The actual password is intentionally hidden."

      # ============================================================
      # 14. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          echo -e "${GREEN}================================================${RESET}"
          echo -e "${GREEN}       🟢 MACOS RUNNER IS READY               ${RESET}"
          echo -e "${GREEN}================================================${RESET}"

          echo ""
          echo "RustDesk ID:"
          echo "$RUSTDESK_ID"

          echo ""
          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "Runner will remain alive."

          while true; do

            echo ""
            echo -e "${CYAN}========== STATUS $(date) ==========${RESET}"

            echo ""
            echo "RustDesk processes:"
            ps aux | grep -i "[R]ustDesk" || true

            echo ""
            echo "RustDesk ID:"
            /Applications/RustDesk.app/Contents/MacOS/RustDesk \
              --get-id \
              2>/dev/null || true

            echo ""
            echo "RustDesk service:"
            sudo launchctl print \
              system/com.carriez.RustDesk_service \
              2>/dev/null | grep -E "state =|pid =|path =" || true

            echo ""
            echo "Sleeping 5 minutes..."

            sleep 300

          done


