name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          echo
          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== CURRENT PROCESS USER ====="
          whoami

          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console

          echo
          echo "===== GUI SESSIONS ====="
          who || true

          echo
          echo "===== USERS ====="
          dscl . -list /Users | tail -20

          echo
          echo "=================================================="

      # =========================================================
      # 2. CREATE / VERIFY USER
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATE / VERIFY USER"
          echo "=================================================="

          echo
          echo "Target user:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo
            echo "User already exists."
          else
            echo
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo
            echo "User created."
          fi

          echo
          echo "===== USER INFO ====="

          id "$MACOS_USERNAME"

          echo
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo
          echo "HOME:"
          dscl . -read "/Users/$MACOS_USERNAME" NFSHomeDirectory

      # =========================================================
      # 3. ADMINISTRATOR
      # =========================================================
      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "CONFIGURE ADMINISTRATOR"
          echo "=================================================="

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== USER GROUPS ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN GROUP ====="

          dscl . -read /Groups/admin GroupMembership

      # =========================================================
      # 4. AUTO LOGIN CONFIGURATION
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "AUTO LOGIN CONFIGURATION"
          echo "=================================================="

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "===== AUTO LOGIN VALUE ====="

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            2>/dev/null || true

          echo
          echo "===== CURRENT CONSOLE USER ====="

          stat -f "%Su" /dev/console

      # =========================================================
      # 5. INSTALL HOMEBREW / TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL TAILSCALE"
          echo "=================================================="

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Installing Homebrew..."

            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo
          echo "Installing Tailscale..."

          brew install --quiet tailscale || true

          echo
          echo "===== TAILSCALE VERSION ====="

          tailscale version

      # =========================================================
      # 6. START TAILSCALE
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          echo "=================================================="
          echo "START TAILSCALE"
          echo "=================================================="

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if pgrep -x tailscaled >/dev/null 2>&1; then

            echo "tailscaled already running."

          else

            echo "Starting tailscaled..."

            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            TAILSCALED_PID=$!

            echo "tailscaled PID:"
            echo "$TAILSCALED_PID"

            sleep 5

          fi

          echo
          echo "===== TAILSCALED PROCESSES ====="

          pgrep -fl tailscaled || true

          echo
          echo "===== TAILSCALED LOG ====="

          cat \
            /tmp/tailscaled.log \
            2>/dev/null || true

          echo
          echo "===== TAILSCALE UP ====="

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status

          echo
          echo "===== TAILSCALE IP ====="

          TAILSCALE_IP=$(
            sudo tailscale ip -4 2>/dev/null |
            head -n 1
          )

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: Tailscale IP not found."
            exit 1
          fi

          echo
          echo "TAILSCALE_IP=$TAILSCALE_IP"

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip

      # =========================================================
      # 7. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL RUST"
          echo "=================================================="

          if command -v rustc >/dev/null 2>&1; then

            echo "Rust already installed."

          else

            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y

          fi

          source "$HOME/.cargo/env"

          echo
          rustc --version

          echo
          cargo --version

      # =========================================================
      # 8. CLONE MACRDP
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLONE MACRDP"
          echo "=================================================="

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "===== MACRDP FILES ====="

          ls -la

      # =========================================================
      # 9. BUILD MACRDP
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILD MACRDP"
          echo "=================================================="

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          cargo build --release

          echo
          echo "===== BUILD OUTPUT ====="

          find \
            target/release \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -print

      # =========================================================
      # 10. INSTALL MACRDP
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL MACRDP"
          echo "=================================================="

          MACRDP_BINARY="$HOME/macrdp/target/release/macrdp"

          if [ ! -f "$MACRDP_BINARY" ]; then

            echo "ERROR: macrdp binary not found."

            exit 1

          fi

          sudo cp \
            "$MACRDP_BINARY" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "===== INSTALLED BINARY ====="

          ls -lh /usr/local/bin/macrdp

          echo
          echo "===== MACRDP HELP ====="

          /usr/local/bin/macrdp --help

      # =========================================================
      # 11. PREPARE USER DIRECTORIES
      # =========================================================
      - name: Prepare User Environment
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "PREPARE USER ENVIRONMENT"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"

          echo
          echo "User home:"
          echo "$USER_HOME"

          sudo mkdir -p \
            "$USER_HOME/Library/LaunchAgents" \
            "$USER_HOME/Library/Logs/macrdp"

          sudo chown -R \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/LaunchAgents" \
            "$USER_HOME/Library/Logs/macrdp"

          sudo chmod 700 \
            "$USER_HOME/Library/LaunchAgents"

          echo
          echo "===== DIRECTORIES ====="

          sudo ls -ld \
            "$USER_HOME/Library/LaunchAgents" \
            "$USER_HOME/Library/Logs/macrdp"

      # =========================================================
      # 12. CREATE MACRDP LAUNCHAGENT
      # =========================================================
      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATE MACRDP LAUNCHAGENT"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"

          PLIST_TMP="/tmp/com.macrdp.server.plist"

          cat > "$PLIST_TMP" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>Label</key>
              <string>com.macrdp.server</string>

              <key>ProgramArguments</key>

              <array>

                  <string>/usr/local/bin/macrdp</string>

                  <string>--bind</string>
                  <string>0.0.0.0:3390</string>

                  <string>--username</string>
                  <string>$MACOS_USERNAME</string>

                  <string>--password</string>
                  <string>$MACOS_PASSWORD</string>

                  <string>--enable-h264</string>

                  <string>--fps</string>
                  <string>60</string>

                  <string>--bitrate</string>
                  <string>8</string>

                  <string>--keyframe-interval</string>
                  <string>2</string>

                  <string>--flush-frames</string>
                  <string>4</string>

                  <string>--virtual-display</string>

                  <string>--width</string>
                  <string>1920</string>

                  <string>--height</string>
                  <string>1080</string>

                  <string>--log-dir</string>
                  <string>$USER_HOME/Library/Logs/macrdp</string>

                  <string>--verbose</string>

              </array>

              <key>WorkingDirectory</key>
              <string>$USER_HOME</string>

              <key>EnvironmentVariables</key>

              <dict>

                  <key>PATH</key>
                  <string>/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>

                  <key>HOME</key>
                  <string>$USER_HOME</string>

                  <key>USER</key>
                  <string>$MACOS_USERNAME</string>

                  <key>LOGNAME</key>
                  <string>$MACOS_USERNAME</string>

              </dict>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <true/>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>ThrottleInterval</key>
              <integer>5</integer>

              <key>StandardOutPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stdout.log</string>

              <key>StandardErrorPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stderr.log</string>

          </dict>

          </plist>
          EOF

          sudo cp \
            "$PLIST_TMP" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chown \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chmod 644 \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "===== PLIST VALIDATION ====="

          sudo plutil -lint \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "LaunchAgent prepared."

      # =========================================================
      # 13. PREPARE MACOS PRIVACY SETTINGS
      # =========================================================
      - name: Prepare macOS Privacy Settings
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "PREPARE MACOS PRIVACY SETTINGS"
          echo "=================================================="

          echo
          echo "Opening Screen Recording settings..."

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture" \
            2>/dev/null || true

          sleep 2

          echo
          echo "Opening Accessibility settings..."

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility" \
            2>/dev/null || true

          sleep 2

          echo
          echo "Current console user:"

          stat -f "%Su" /dev/console

      # =========================================================
      # 14. START INITIAL MACRDP
      #
      # This server is used so we can connect initially,
      # perform Switch User, then transition to the target
      # user's GUI session.
      # =========================================================
      - name: Start Initial macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          echo "=================================================="
          echo "START INITIAL MACRDP"
          echo "=================================================="

          rm -rf /tmp/macrdp-initial

          mkdir -p /tmp/macrdp-initial

          echo
          echo "Starting macrdp in current runner GUI session..."

          /usr/local/bin/macrdp \
            --bind 0.0.0.0:3390 \
            --username "$MACOS_USERNAME" \
            --password "$MACOS_PASSWORD" \
            --enable-h264 \
            --fps 60 \
            --bitrate 8 \
            --keyframe-interval 2 \
            --flush-frames 4 \
            --virtual-display \
            --width 1920 \
            --height 1080 \
            --log-dir /tmp/macrdp-initial \
            --verbose \
            > /tmp/macrdp-initial/console.log 2>&1 &

          MACRDP_PID=$!

          echo "$MACRDP_PID" > /tmp/macrdp-initial.pid

          echo
          echo "Initial macrdp PID:"
          echo "$MACRDP_PID"

          echo
          echo "Waiting for port 3390..."

          PORT_READY=0

          for i in $(seq 1 30); do

            if ! kill -0 "$MACRDP_PID" 2>/dev/null; then

              echo
              echo "ERROR: Initial macrdp exited."

              echo
              echo "===== LOG ====="

              cat \
                /tmp/macrdp-initial/console.log \
                2>/dev/null || true

              exit 1

            fi

            if lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              >/tmp/macrdp-initial-port.txt \
              2>&1; then

              PORT_READY=1

              echo
              echo "PORT 3390 IS LISTENING."

              cat /tmp/macrdp-initial-port.txt

              break

            fi

            echo "Waiting... $i/30"

            sleep 2

          done

          if [ "$PORT_READY" -ne 1 ]; then

            echo
            echo "ERROR: Port 3390 did not open."

            cat \
              /tmp/macrdp-initial/console.log \
              2>/dev/null || true

            exit 1

          fi

          echo
          echo "=================================================="
          echo "INITIAL RDP IS READY"
          echo "=================================================="

          echo
          echo "RDP ADDRESS:"

          cat /tmp/tailscale_ip

          echo ":3390"

          echo
          echo "RDP USER:"
          echo "$MACOS_USERNAME"

      # =========================================================
      # 15. VERIFY INITIAL RDP
      # =========================================================
      - name: Verify Initial RDP
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "VERIFY INITIAL RDP"
          echo "=================================================="

          echo
          echo "===== PROCESS ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== LOCAL TCP TEST ====="

          nc \
            -vz \
            127.0.0.1 \
            3390 \
            2>&1

          echo
          echo "===== TAILSCALE IP ====="

          cat /tmp/tailscale_ip

          echo
          echo "===== CURRENT CONSOLE ====="

          stat -f "%Su" /dev/console

      # =========================================================
      # 16. WAIT FOR SWITCH USER
      #
      # IMPORTANT:
      #
      # At this point you can connect through RDP.
      #
      # Then use macOS:
      #
      # Apple Menu
      # -> Lock Screen / Switch User
      # -> MACOS_USERNAME
      #
      # The workflow detects the new console user.
      # =========================================================
      - name: Wait For Target User Switch
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "WAITING FOR TARGET USER"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          echo
          echo "Target user:"
          echo "$MACOS_USERNAME"

          echo
          echo "Target UID:"
          echo "$TARGET_UID"

          echo
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo
          echo "=================================================="
          echo "YOU CAN NOW SWITCH USER"
          echo "=================================================="

          echo
          echo "Switch to:"
          echo "$MACOS_USERNAME"

          echo
          echo "The workflow will automatically detect it."

          echo
          echo "=================================================="

          END=$((SECONDS + 1200))

          LAST_USER=""

          while [ "$SECONDS" -lt "$END" ]; do

            CURRENT_USER=$(
              stat -f "%Su" /dev/console
            )

            if [ "$CURRENT_USER" != "$LAST_USER" ]; then

              echo
              echo "------------------------------------------"
              echo "CONSOLE USER CHANGED"
              echo "------------------------------------------"

              echo "Previous:"
              echo "$LAST_USER"

              echo "Current:"
              echo "$CURRENT_USER"

              LAST_USER="$CURRENT_USER"

            fi

            if [ "$CURRENT_USER" = "$MACOS_USERNAME" ]; then

              echo
              echo "=================================================="
              echo "TARGET USER DETECTED"
              echo "=================================================="

              echo
              echo "Console user:"
              echo "$CURRENT_USER"

              echo
              echo "Target UID:"
              echo "$TARGET_UID"

              echo
              echo "Target user GUI session detected."

              break

            fi

            sleep 3

          done

          CURRENT_USER=$(
            stat -f "%Su" /dev/console
          )

          if [ "$CURRENT_USER" != "$MACOS_USERNAME" ]; then

            echo
            echo "ERROR:"
            echo "Target user did not become console user."

            echo
            echo "Current console user:"
            echo "$CURRENT_USER"

            exit 1

          fi

      # =========================================================
      # 17. STOP INITIAL MACRDP
      #
      # The old macrdp owns TCP 3390.
      #
      # We must stop it before starting macrdp
      # inside the target user's GUI session.
      # =========================================================
      - name: Stop Initial macrdp
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "STOP INITIAL MACRDP"
          echo "=================================================="

          if [ -f /tmp/macrdp-initial.pid ]; then

            PID=$(cat /tmp/macrdp-initial.pid)

            echo
            echo "Initial macrdp PID:"
            echo "$PID"

            echo
            echo "Stopping..."

            kill "$PID" 2>/dev/null || true

            sleep 3

          fi

          echo
          echo "Force checking macrdp processes..."

          pgrep -fl macrdp || true

          echo
          echo "Port 3390:"

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "Initial macrdp stopped."

      # =========================================================
      # 18. START MACRDP INSIDE TARGET GUI SESSION
      #
      # This is the critical transition.
      # =========================================================
      - name: Start macrdp In Target GUI Session
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "START MACRDP IN TARGET GUI SESSION"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          USER_HOME="/Users/$MACOS_USERNAME"

          PLIST="$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "Target user:"
          echo "$MACOS_USERNAME"

          echo
          echo "Target UID:"
          echo "$TARGET_UID"

          echo
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo
          echo "LaunchAgent:"
          echo "$PLIST"

          echo
          echo "=================================================="
          echo "GUI DOMAIN CHECK"
          echo "=================================================="

          sudo launchctl print \
            "gui/$TARGET_UID" \
            >/tmp/target-gui-domain.txt \
            2>&1

          GUI_EXIT=$?

          echo
          echo "GUI domain check exit:"
          echo "$GUI_EXIT"

          cat \
            /tmp/target-gui-domain.txt \
            2>/dev/null || true

          echo
          echo "=================================================="
          echo "BOOTSTRAPPING TARGET LAUNCHAGENT"
          echo "=================================================="

          sudo launchctl bootout \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>/dev/null || true

          sleep 2

          sudo launchctl bootstrap \
            "gui/$TARGET_UID" \
            "$PLIST"

          BOOTSTRAP_EXIT=$?

          echo
          echo "Bootstrap exit:"
          echo "$BOOTSTRAP_EXIT"

          if [ "$BOOTSTRAP_EXIT" -ne 0 ]; then

            echo
            echo "ERROR: Could not bootstrap target LaunchAgent."

            echo
            echo "===== GUI DOMAIN ====="

            sudo launchctl print \
              "gui/$TARGET_UID" \
              2>&1 || true

            echo
            echo "===== PLIST ====="

            sudo plutil -p \
              "$PLIST" \
              2>&1 || true

            exit 1

          fi

          echo
          echo "Waiting for target macrdp..."

          sleep 5

          echo
          echo "===== TARGET LAUNCHAGENT ====="

          sudo launchctl print \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "===== MACRDP PROCESSES ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== TARGET STDOUT ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "===== TARGET STDERR ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

      # =========================================================
      # 19. VERIFY TARGET RDP
      # =========================================================
      - name: Verify Target RDP
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "VERIFY TARGET RDP"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          USER_HOME="/Users/$MACOS_USERNAME"

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== TARGET UID ====="

          echo "$TARGET_UID"

          echo
          echo "===== MACRDP PROCESSES ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== LOCAL TCP TEST ====="

          nc \
            -vz \
            127.0.0.1 \
            3390 \
            2>&1

          LOCAL_EXIT=$?

          echo
          echo "Local TCP exit:"
          echo "$LOCAL_EXIT"

          echo
          echo "===== TAILSCALE IP ====="

          cat /tmp/tailscale_ip

          echo
          echo "===== TARGET LAUNCHAGENT ====="

          sudo launchctl print \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "===== TARGET STDOUT ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "===== TARGET STDERR ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

          echo
          echo "=================================================="

          if [ "$LOCAL_EXIT" -eq 0 ]; then

            echo "TARGET RDP TCP: PASS"

          else

            echo "TARGET RDP TCP: FAIL"

          fi

      # =========================================================
      # 20. MONITOR TARGET SESSION
      # =========================================================
      - name: Monitor Target GUI And RDP
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "TARGET GUI / RDP MONITOR"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          USER_HOME="/Users/$MACOS_USERNAME"

          END=$((SECONDS + 20400))

          LAST_CONSOLE_USER=""

          while [ "$SECONDS" -lt "$END" ]; do

            CURRENT_CONSOLE_USER=$(
              stat -f "%Su" /dev/console
            )

            REMAINING=$((END - SECONDS))

            echo
            echo "=================================================="
            echo "STATUS"
            echo "=================================================="

            echo
            echo "Time remaining:"
            echo "$REMAINING seconds"

            echo
            echo "Console user:"
            echo "$CURRENT_CONSOLE_USER"

            echo
            echo "Target user:"
            echo "$MACOS_USERNAME"

            if [ "$CURRENT_CONSOLE_USER" != "$LAST_CONSOLE_USER" ]; then

              echo
              echo "CONSOLE USER CHANGED:"
              echo "$LAST_CONSOLE_USER -> $CURRENT_CONSOLE_USER"

              LAST_CONSOLE_USER="$CURRENT_CONSOLE_USER"

            fi

            # -----------------------------------------------------
            # If target user is active, make sure its LaunchAgent
            # is loaded.
            # -----------------------------------------------------

            if [ "$CURRENT_CONSOLE_USER" = "$MACOS_USERNAME" ]; then

              echo
              echo "Target user GUI session is ACTIVE."

              sudo launchctl print \
                "gui/$TARGET_UID/com.macrdp.server" \
                >/tmp/target-launch-status.txt \
                2>&1

              LAUNCH_EXIT=$?

              if [ "$LAUNCH_EXIT" -ne 0 ]; then

                echo
                echo "LaunchAgent is not loaded."

                echo
                echo "Attempting bootstrap..."

                sudo launchctl bootstrap \
                  "gui/$TARGET_UID" \
                  "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

                echo
                echo "Bootstrap exit:"
                echo "$?"

                sleep 5

              else

                echo
                echo "Target LaunchAgent is loaded."

              fi

            else

              echo
              echo "Target user is not the current console user."

            fi

            echo
            echo "===== MACRDP ====="

            pgrep -fl macrdp || true

            echo
            echo "===== PORT 3390 ====="

            lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true

            echo
            echo "===== TAILSCALE IP ====="

            sudo tailscale ip -4 \
              2>/dev/null || true

            echo
            echo "===== TAILSCALE STATUS ====="

            sudo tailscale status \
              2>/dev/null || true

            echo
            echo "===== TARGET STDERR ====="

            tail -50 \
              "$USER_HOME/Library/Logs/macrdp/stderr.log" \
              2>/dev/null || true

            sleep 30

          done

          echo
          echo "=================================================="
          echo "MONITOR COMPLETE"
          echo "=================================================="

      # =========================================================
      # 21. FINAL DIAGNOSTIC
      # =========================================================
      - name: Final Diagnostic
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "FINAL DIAGNOSTIC"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          USER_HOME="/Users/$MACOS_USERNAME"

          echo
          echo "===== CURRENT USER ====="

          whoami

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== GUI SESSIONS ====="

          who || true

          echo
          echo "===== MACRDP PROCESSES ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== TAILSCALE IP ====="

          cat \
            /tmp/tailscale_ip \
            2>/dev/null || true

          echo
          echo "===== TARGET LAUNCHAGENT ====="

          sudo launchctl print \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "===== TARGET STDOUT ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "===== TARGET STDERR ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status \
            2>&1 || true

          echo
          echo "===== TAILSCALED LOG ====="

          cat \
            /tmp/tailscaled.log \
            2>/dev/null || true

      # =========================================================
      # 22. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME" 2>/dev/null)

          if [ -n "$TARGET_UID" ]; then

            echo
            echo "Stopping target LaunchAgent..."

            sudo launchctl bootout \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

          fi

          echo
          echo "Stopping macrdp processes..."

          pkill -f macrdp || true

          echo
          echo "Stopping Tailscale..."

          sudo tailscale down \
            2>/dev/null || true

          echo
          echo "Cleanup complete."
