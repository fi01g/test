name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          echo
          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== PROCESS USER ====="
          whoami

          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console

          echo
          echo "===== LOGIN SESSIONS ====="
          who || true

          echo
          echo "===== WINDOWSERVER ====="
          pgrep -fl WindowServer || true

          echo
          echo "===== LOGINWINDOW ====="
          pgrep -fl loginwindow || true


      # =========================================================
      # 2. CREATE / VERIFY ADMIN USER
      # =========================================================
      - name: Create Administrator User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATE / VERIFY ADMINISTRATOR USER"
          echo "=================================================="

          echo
          echo "Target username:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          echo
          echo "===== USER INFO ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== UID ====="

          echo "$TARGET_UID"


      # =========================================================
      # 3. ADMIN GROUP
      # =========================================================
      - name: Configure Administrator Group
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "CONFIGURE ADMINISTRATOR GROUP"
          echo "=================================================="

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== USER GROUPS ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN MEMBERSHIP ====="

          dseditgroup \
            -o checkmember \
            -m "$MACOS_USERNAME" \
            admin


      # =========================================================
      # 4. VERIFY ADMINISTRATION
      # =========================================================
      - name: Verify Administrator Access
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          echo "=================================================="
          echo "VERIFY ADMINISTRATOR ACCESS"
          echo "=================================================="

          echo
          echo "===== ID ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN CHECK ====="

          dseditgroup \
            -o checkmember \
            -m "$MACOS_USERNAME" \
            admin

          ADMIN_EXIT=$?

          echo
          echo "Admin membership exit:"
          echo "$ADMIN_EXIT"

          if [ "$ADMIN_EXIT" -ne 0 ]; then
            echo
            echo "ERROR: Target user is not an administrator."
            exit 1
          fi

          echo
          echo "Administrator membership: PASS"

          echo
          echo "===== SUDO POLICY ====="

          sudo -l \
            -U "$MACOS_USERNAME" \
            2>&1 || true

          echo
          echo "===== SUDOERS ====="

          sudo -l \
            -U "$MACOS_USERNAME" \
            2>&1 || true


      # =========================================================
      # 5. INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL TAILSCALE"
          echo "=================================================="

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Installing Homebrew..."

            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          brew install --quiet tailscale || true

          echo
          echo "===== TAILSCALE ====="

          tailscale version


      # =========================================================
      # 6. START TAILSCALE + TELEGRAM ONLINE
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e

          echo "=================================================="
          echo "START TAILSCALE"
          echo "=================================================="

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled already running."
          else

            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            echo "tailscaled PID: $!"

            sleep 5

          fi

          echo
          echo "===== TAILSCALE UP ====="

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          echo
          echo "===== STATUS ====="

          sudo tailscale status

          echo
          echo "===== IP ====="

          TAILSCALE_IP=$(
            sudo tailscale ip -4 2>/dev/null |
            head -n 1
          )

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: No Tailscale IP."
            exit 1
          fi

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip

          echo
          echo "RDP ADDRESS:"
          echo "$TAILSCALE_IP:3390"


          # =====================================================
          # TELEGRAM ONLINE MESSAGE
          # =====================================================

          echo
          echo "===== TELEGRAM ONLINE ====="

          TELEGRAM_TEXT="🟢 <b>macOS RDP ONLINE</b>

🖥 <b>System:</b> macOS
🌐 <b>Tailscale IP:</b> <code>${TAILSCALE_IP}</code>
🔌 <b>RDP Port:</b> <code>3390</code>

📡 <b>RDP Address:</b>
<code>${TAILSCALE_IP}:3390</code>

⚡ <b>Status:</b> Online"

          REPLY_MARKUP=$(cat <<EOF
{"inline_keyboard":[[{"text":"📋 Copy IP","copy_text":{"text":"${TAILSCALE_IP}"}},{"text":"📋 Copy RDP","copy_text":{"text":"${TAILSCALE_IP}:3390"}}]]}
EOF
          )

          TELEGRAM_RESPONSE=$(
            curl -sS \
              --fail \
              --request POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${TELEGRAM_TEXT}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "reply_markup=${REPLY_MARKUP}"
          )

          echo
          echo "Telegram response:"
          echo "$TELEGRAM_RESPONSE"

          TELEGRAM_MESSAGE_ID=$(
            echo "$TELEGRAM_RESPONSE" |
            sed -nE 's/.*"message_id":([0-9]+).*/\1/p' |
            head -n 1
          )

          if [ -z "$TELEGRAM_MESSAGE_ID" ]; then
            echo "ERROR: Could not get Telegram message ID."
            exit 1
          fi

          echo "$TELEGRAM_MESSAGE_ID" > /tmp/telegram_message_id

          echo
          echo "Telegram message ID:"
          echo "$TELEGRAM_MESSAGE_ID"

          echo
          echo "Telegram notification sent successfully."


      # =========================================================
      # 7. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL RUST"
          echo "=================================================="

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else
            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version


      # =========================================================
      # 8. CLONE MACRDP
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLONE MACRDP"
          echo "=================================================="

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          git status


      # =========================================================
      # 9. BUILD MACRDP
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILD MACRDP"
          echo "=================================================="

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          cargo build --release

          echo
          echo "===== BUILD OUTPUT ====="

          ls -lh \
            target/release/macrdp


      # =========================================================
      # 10. INSTALL MACRDP
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL MACRDP"
          echo "=================================================="

          sudo cp \
            "$HOME/macrdp/target/release/macrdp" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "===== MACRDP HELP ====="

          /usr/local/bin/macrdp --help


      # =========================================================
      # 11. PREPARE MACRDP LOG
      # =========================================================
      - name: Prepare macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "PREPARE MACRDP"
          echo "=================================================="

          rm -rf /tmp/macrdp

          mkdir -p /tmp/macrdp


      # =========================================================
      # 12. START MACRDP
      # =========================================================
      - name: Start macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          echo "=================================================="
          echo "START MACRDP"
          echo "=================================================="

          /usr/local/bin/macrdp \
            --bind 0.0.0.0:3390 \
            --username "$MACOS_USERNAME" \
            --password "$MACOS_PASSWORD" \
            --enable-h264 \
            --fps 60 \
            --bitrate 8 \
            --keyframe-interval 2 \
            --flush-frames 4 \
            --virtual-display \
            --width 1920 \
            --height 1080 \
            --log-dir /tmp/macrdp \
            --verbose \
            > /tmp/macrdp/console.log 2>&1 &

          PID=$!

          echo "$PID" > /tmp/macrdp.pid

          echo
          echo "macrdp PID:"
          echo "$PID"

          echo
          echo "Waiting for port 3390..."

          READY=0

          for i in $(seq 1 30); do

            if ! kill -0 "$PID" 2>/dev/null; then

              echo
              echo "ERROR: macrdp exited."

              cat \
                /tmp/macrdp/console.log \
                2>/dev/null || true

              exit 1

            fi

            if lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              >/tmp/macrdp/port.txt \
              2>&1; then

              READY=1

              echo
              echo "PORT 3390 IS READY."

              cat /tmp/macrdp/port.txt

              break

            fi

            sleep 2

          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Port 3390 did not open."
            exit 1
          fi


      # =========================================================
      # 13. VERIFY GUI + ADMIN USER
      # =========================================================
      - name: Verify GUI And Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "VERIFY GUI AND ADMINISTRATOR"
          echo "=================================================="

          echo
          echo "===== ACTIVE GUI USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== LOGIN SESSIONS ====="

          who || true

          echo
          echo "===== TARGET USER ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN MEMBERSHIP ====="

          dseditgroup \
            -o checkmember \
            -m "$MACOS_USERNAME" \
            admin

          echo
          echo "===== MACRDP ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== TAILSCALE IP ====="

          cat /tmp/tailscale_ip

          echo
          echo "=================================================="
          echo "RDP CONNECTION"
          echo "=================================================="

          echo
          echo "PC:"
          cat /tmp/tailscale_ip

          echo ":3390"

          echo
          echo "RDP username:"
          echo "$MACOS_USERNAME"

          echo
          echo "RDP password:"
          echo "Use the MACOS_PASSWORD secret."

          echo
          echo "IMPORTANT:"
          echo "Do NOT use Switch User."


      # =========================================================
      # 14. KEEP RDP ALIVE
      # =========================================================
      - name: Keep RDP Alive
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "RDP SESSION ACTIVE"
          echo "=================================================="

          END=$((SECONDS + 20400))

          while [ "$SECONDS" -lt "$END" ]; do

            REMAINING=$((END - SECONDS))

            echo
            echo "=================================================="
            echo "STATUS"
            echo "=================================================="

            echo
            echo "Remaining:"
            echo "$REMAINING seconds"

            echo
            echo "Console:"
            stat -f "%Su" /dev/console

            echo
            echo "GUI sessions:"
            who || true

            echo
            echo "===== MACRDP ====="

            pgrep -fl macrdp || true

            echo
            echo "===== PORT 3390 ====="

            lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true

            echo
            echo "===== TAILSCALE ====="

            sudo tailscale status \
              2>/dev/null || true

            echo
            echo "===== MACRDP LOG ====="

            tail -50 \
              /tmp/macrdp/console.log \
              2>/dev/null || true

            sleep 30

          done


      # =========================================================
      # 15. FINAL DIAGNOSTIC
      # =========================================================
      - name: Final Diagnostic
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "FINAL DIAGNOSTIC"
          echo "=================================================="

          echo
          echo "===== macOS ====="

          sw_vers

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== WHO ====="

          who || true

          echo
          echo "===== TARGET USER ====="

          id "$MACOS_USERNAME" || true

          echo
          echo "===== ADMIN MEMBERSHIP ====="

          dseditgroup \
            -o checkmember \
            -m "$MACOS_USERNAME" \
            admin \
            2>&1 || true

          echo
          echo "===== WINDOWSERVER ====="

          pgrep -fl WindowServer || true

          echo
          echo "===== LOGINWINDOW ====="

          pgrep -fl loginwindow || true

          echo
          echo "===== MACRDP ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== TAILSCALE IP ====="

          cat \
            /tmp/tailscale_ip \
            2>/dev/null || true

          echo
          echo "===== MACRDP LOG ====="

          cat \
            /tmp/macrdp/console.log \
            2>/dev/null || true

          echo
          echo "===== TAILSCALED LOG ====="

          cat \
            /tmp/tailscaled.log \
            2>/dev/null || true


      # =========================================================
      # 16. CLEANUP + TELEGRAM OFFLINE + AUTO RESTART
      # =========================================================
      - name: Cleanup And Restart
        if: always()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e

          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          # =====================================================
          # READ TAILSCALE IP
          # =====================================================

          TAILSCALE_IP=""

          if [ -f /tmp/tailscale_ip ]; then
            TAILSCALE_IP=$(cat /tmp/tailscale_ip)
          fi


          # =====================================================
          # TELEGRAM OFFLINE UPDATE
          # =====================================================

          if [ -f /tmp/telegram_message_id ]; then

            TELEGRAM_MESSAGE_ID=$(cat /tmp/telegram_message_id)

            echo
            echo "===== TELEGRAM OFFLINE UPDATE ====="

            if [ -n "$TAILSCALE_IP" ]; then

              OFFLINE_TEXT="🔴 <b>macOS RDP OFFLINE</b>

🖥 <b>System:</b> macOS
🌐 <b>Last Tailscale IP:</b> <code>${TAILSCALE_IP}</code>
🔌 <b>RDP Port:</b> <code>3390</code>

📡 <b>Last RDP Address:</b>
<code>${TAILSCALE_IP}:3390</code>

⛔ <b>Status:</b> Runner stopped"

              REPLY_MARKUP=$(cat <<EOF
{"inline_keyboard":[[{"text":"📋 Copy IP","copy_text":{"text":"${TAILSCALE_IP}"}},{"text":"📋 Copy RDP","copy_text":{"text":"${TAILSCALE_IP}:3390"}}]]}
EOF
              )

            else

              OFFLINE_TEXT="🔴 <b>macOS RDP OFFLINE</b>

⛔ <b>Status:</b> Runner stopped"

              REPLY_MARKUP='{"inline_keyboard":[]}'

            fi


            TELEGRAM_UPDATE_RESPONSE=$(
              curl -sS \
                --fail \
                --request POST \
                "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "message_id=${TELEGRAM_MESSAGE_ID}" \
                --data-urlencode "text=${OFFLINE_TEXT}" \
                --data-urlencode "parse_mode=HTML" \
                --data-urlencode "reply_markup=${REPLY_MARKUP}"
            )

            echo
            echo "Telegram update response:"
            echo "$TELEGRAM_UPDATE_RESPONSE"

          else

            echo
            echo "No Telegram message ID found."

          fi


          # =====================================================
          # STOP MACRDP
          # =====================================================

          if [ -f /tmp/macrdp.pid ]; then

            PID=$(cat /tmp/macrdp.pid)

            kill "$PID" \
              2>/dev/null || true

          fi

          pkill -f macrdp || true


          # =====================================================
          # STOP TAILSCALE
          # =====================================================

          sudo tailscale down \
            2>/dev/null || true


          # =====================================================
          # AUTO RESTART
          # =====================================================

          echo
          echo "=================================================="
          echo "AUTO RESTART"
          echo "=================================================="

          echo
          echo "Waiting 15 seconds before starting next runner..."

          sleep 15

          echo
          echo "Starting next workflow run..."

          gh workflow run \
            "${{ github.workflow }}" \
            --ref "${{ github.ref_name }}"

          RESTART_EXIT=$?

          echo
          echo "Restart command exit:"
          echo "$RESTART_EXIT"

          if [ "$RESTART_EXIT" -eq 0 ]; then
            echo
            echo "Next macOS RDP runner has been requested."
          else
            echo
            echo "WARNING: Failed to start next workflow."
          fi

          echo
          echo "Cleanup complete."
