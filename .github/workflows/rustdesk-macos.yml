name: macOS RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          CYAN='\033[0;36m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} SYSTEM INFORMATION${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true


      # =========================================================
      # 2. CREATE ABDULRAHMAN
      # =========================================================
      - name: Create Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} CREATING ABDULRAHMAN${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          if [ -z "$MACOS_USERNAME" ]; then
            echo -e "${RED}ERROR: MACOS_USERNAME is empty.${RESET}"
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo -e "${RED}ERROR: MACOS_PASSWORD is empty.${RESET}"
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo -e "${RED}ERROR: Invalid username.${RESET}"
            exit 1
          fi

          echo ""
          echo "Username:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then

            echo ""
            echo -e "${GREEN}User already exists.${RESET}"

          else

            echo ""
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo -e "${GREEN}User created.${RESET}"

          fi

          echo ""
          echo "Adding Administrator privileges..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "User ID:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"


      # =========================================================
      # 3. VERIFY ABDULRAHMAN
      # =========================================================
      - name: Verify Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} VERIFYING ABDULRAHMAN${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "whoami:"
          sudo -u "$MACOS_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Home:"
          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

          echo ""
          echo "Checking Administrator membership..."

          ADMIN_CHECK=$(
            dseditgroup \
              -o checkmember \
              -m "$MACOS_USERNAME" \
              admin
          )

          echo "$ADMIN_CHECK"

          if echo "$ADMIN_CHECK" | grep -qi "yes"; then
            echo ""
            echo -e "${GREEN}SUCCESS: Abdulrahman is an Administrator.${RESET}"
          else
            echo ""
            echo -e "${RED}ERROR: Abdulrahman is NOT an Administrator.${RESET}"
            exit 1
          fi


      # =========================================================
      # 4. SET AUTO LOGIN
      # =========================================================
      - name: Configure Abdulrahman Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Target:"
          echo "$MACOS_USERNAME"

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            || true

          echo ""
          echo "Auto-login status:"

          sudo sysadminctl \
            -autologin status \
            || true


      # =========================================================
      # 5. INSTALL RUSTDESK
      # =========================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} INSTALLING RUSTDESK${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          brew update

          brew install --cask rustdesk

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -f "$RUSTDESK" ]; then
            echo -e "${RED}ERROR: RustDesk executable not found.${RESET}"
            exit 1
          fi

          echo ""
          echo "RustDesk version:"
          "$RUSTDESK" --version || true

          echo ""
          echo -e "${GREEN}RustDesk application installed successfully.${RESET}"


      # =========================================================
      # 6. INSTALL RUSTDESK SERVICE
      # =========================================================
      - name: Install RustDesk Service
        shell: bash
        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} INSTALLING RUSTDESK SERVICE${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "Installing RustDesk system service..."

          SERVICE_OUTPUT=$(
            sudo "$RUSTDESK" \
              --install-service \
              2>&1
          ) || {
            echo ""
            echo -e "${RED}ERROR: RustDesk service installation failed.${RESET}"
            echo "$SERVICE_OUTPUT"
            exit 1
          }

          echo "$SERVICE_OUTPUT"

          echo ""
          echo -e "${GREEN}==========================================${RESET}"
          echo -e "${GREEN} RUSTDESK SERVICE INSTALLED${RESET}"
          echo -e "${GREEN}==========================================${RESET}"


      # =========================================================
      # 7. CONFIGURE RUSTDESK PERMANENT PASSWORD
      # =========================================================
      - name: Configure RustDesk Password
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} CONFIGURING RUSTDESK PASSWORD${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo -e "${RED}ERROR: RUSTDESK_PASSWORD is empty.${RESET}"
            exit 1
          fi

          echo ""
          echo "Setting permanent RustDesk password as administrator..."

          PASSWORD_OUTPUT=$(
            sudo "$RUSTDESK" \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          ) || {
            echo ""
            echo -e "${RED}ERROR: RustDesk password command failed.${RESET}"
            echo "$PASSWORD_OUTPUT"
            exit 1
          }

          echo "$PASSWORD_OUTPUT"

          if echo "$PASSWORD_OUTPUT" | grep -qi "Done"; then

            echo ""
            echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
            echo -e "${GREEN}║     🟢 PASSWORD CONFIGURED              ║${RESET}"
            echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          else

            echo ""
            echo -e "${RED}ERROR: RustDesk did not confirm password configuration.${RESET}"
            exit 1

          fi


      # =========================================================
      # 8. START RUSTDESK
      # =========================================================
      - name: Start RustDesk
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} STARTING RUSTDESK${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "Starting RustDesk server..."

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            "$RUSTDESK" \
            --server \
            >/tmp/rustdesk-abdulrahman.log 2>&1 &

          sleep 10

          echo ""
          echo "RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "Getting RustDesk ID..."

          ID=""

          for i in {1..10}
          do

            ID=$(
              sudo -u "$MACOS_USERNAME" -H \
                env \
                HOME="/Users/$MACOS_USERNAME" \
                USER="$MACOS_USERNAME" \
                LOGNAME="$MACOS_USERNAME" \
                "$RUSTDESK" \
                --get-id \
                2>/dev/null || true
            )

            if [ -n "$ID" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$ID" ]; then
            echo ""
            echo -e "${RED}ERROR: Could not retrieve RustDesk ID.${RESET}"

            echo ""
            echo "RustDesk log:"
            tail -100 \
              /tmp/rustdesk-abdulrahman.log \
              2>/dev/null || true

            exit 1
          fi

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║          🟢 RUSTDESK READY              ║${RESET}"
          echo -e "${GREEN}╠══════════════════════════════════════════╣${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║  RUSTDESK ID:                            ║${RESET}"
          echo -e "${GREEN}║  $ID${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║  PASSWORD: CONFIGURED                    ║${RESET}"
          echo -e "${GREEN}║  SERVICE: INSTALLED                      ║${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"


      # =========================================================
      # 9. VERIFY RUSTDESK SERVICE
      # =========================================================
      - name: Verify RustDesk Service
        shell: bash
        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} VERIFYING RUSTDESK SERVICE${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "LaunchDaemons:"
          sudo launchctl list | grep -i rustdesk || true

          echo ""
          echo "LaunchAgents:"
          launchctl list | grep -i rustdesk || true

          echo ""
          echo "RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "RustDesk service status:"

          if sudo launchctl list | grep -qi rustdesk; then

            echo -e "${GREEN}==========================================${RESET}"
            echo -e "${GREEN} 🟢 RUSTDESK SERVICE IS RUNNING${RESET}"
            echo -e "${GREEN}==========================================${RESET}"

          else

            echo -e "${RED}WARNING: RustDesk service was not found in launchctl list.${RESET}"

          fi


      # =========================================================
      # 10. OPEN SYSTEM SETTINGS
      # =========================================================
      - name: Open System Settings As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " OPENING SYSTEM SETTINGS"
          echo "=========================================="

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            /usr/bin/open \
            -a "System Settings" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "GUI sessions:"
          who || true


      # =========================================================
      # 11. FINAL CONNECTION INFORMATION
      # =========================================================
      - name: Final Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} FINAL CONNECTION INFORMATION${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          ID=$(
            sudo -u "$MACOS_USERNAME" -H \
              env \
              HOME="/Users/$MACOS_USERNAME" \
              USER="$MACOS_USERNAME" \
              LOGNAME="$MACOS_USERNAME" \
              "$RUSTDESK" \
              --get-id \
              2>/dev/null || true
          )

          if [ -z "$ID" ]; then
            echo -e "${RED}ERROR: RustDesk ID unavailable.${RESET}"
            exit 1
          fi

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║        🟢 RUSTDESK CONNECTION            ║${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}╠══════════════════════════════════════════╣${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║  ID: $ID${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║  PASSWORD: CONFIGURED                    ║${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║  USER: $MACOS_USERNAME${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║  AUTO-RESTART: ENABLED                   ║${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║  SERVICE: RUNNING                        ║${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          echo ""
          echo -e "${GREEN}🟢 USE THE RUSTDESK ID ABOVE${RESET}"
          echo -e "${GREEN}🟢 PASSWORD IS THE VALUE OF RUSTDESK_PASSWORD SECRET${RESET}"
          echo ""


      # =========================================================
      # 12. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RUNNER IS ONLINE"
          echo "=========================================="

          while true
          do

            echo ""
            echo "[$(date)] Runner alive"

            echo ""
            echo "Console user:"
            stat -f "%Su" /dev/console \
              2>/dev/null || echo "unknown"

            echo ""
            echo "Logged users:"
            who || true

            echo ""
            echo "RustDesk processes:"
            pgrep -fl RustDesk || true

            echo ""
            echo "RustDesk ID:"

            RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

            "$RUSTDESK" \
              --get-id \
              2>/dev/null || true

            echo ""
            echo "RustDesk service:"

            sudo launchctl list \
              2>/dev/null | \
              grep -i rustdesk \
              || true

            echo ""
            echo "------------------------------------------"

            sleep 300

          done


