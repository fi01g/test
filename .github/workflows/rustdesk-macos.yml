name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          echo
          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== PROCESS USER ====="
          whoami

          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console

          echo
          echo "===== LOGIN SESSIONS ====="
          who || true

          echo
          echo "===== WINDOWSERVER ====="
          pgrep -fl WindowServer || true

          echo
          echo "===== LOGINWINDOW ====="
          pgrep -fl loginwindow || true

      # =========================================================
      # 2. CREATE / VERIFY USER
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATE / VERIFY USER"
          echo "=================================================="

          echo
          echo "Target username:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo
          echo "===== USER INFO ====="

          id "$MACOS_USERNAME"

          echo
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo
          echo "HOME:"

          dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

      # =========================================================
      # 3. ADMINISTRATOR
      # =========================================================
      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "CONFIGURE ADMINISTRATOR"
          echo "=================================================="

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== USER GROUPS ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN GROUP ====="

          dscl . \
            -read /Groups/admin \
            GroupMembership

      # =========================================================
      # 4. AUTO LOGIN
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CONFIGURE AUTO LOGIN"
          echo "=================================================="

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "===== AUTO LOGIN ====="

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            2>/dev/null || true

          echo
          echo "===== CURRENT CONSOLE ====="

          stat -f "%Su" /dev/console

      # =========================================================
      # 5. INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL TAILSCALE"
          echo "=================================================="

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Installing Homebrew..."

            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          brew install --quiet tailscale || true

          echo
          echo "===== TAILSCALE VERSION ====="

          tailscale version

      # =========================================================
      # 6. START TAILSCALE
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          echo "=================================================="
          echo "START TAILSCALE"
          echo "=================================================="

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled already running."
          else
            echo "Starting tailscaled..."

            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            echo "tailscaled PID: $!"

            sleep 5
          fi

          echo
          echo "===== TAILSCALED ====="

          pgrep -fl tailscaled || true

          echo
          echo "===== TAILSCALED LOG ====="

          cat \
            /tmp/tailscaled.log \
            2>/dev/null || true

          echo
          echo "===== TAILSCALE UP ====="

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          echo
          echo "===== STATUS ====="

          sudo tailscale status

          echo
          echo "===== IP ====="

          TAILSCALE_IP=$(
            sudo tailscale ip -4 2>/dev/null |
            head -n 1
          )

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: No Tailscale IP."
            exit 1
          fi

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip

          echo
          echo "RDP ADDRESS:"
          echo "$TAILSCALE_IP:3390"

      # =========================================================
      # 7. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL RUST"
          echo "=================================================="

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else
            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

      # =========================================================
      # 8. CLONE MACRDP
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLONE MACRDP"
          echo "=================================================="

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          ls -la

      # =========================================================
      # 9. BUILD MACRDP
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILD MACRDP"
          echo "=================================================="

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          cargo build --release

          echo
          echo "===== BUILD OUTPUT ====="

          find \
            target/release \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -print

      # =========================================================
      # 10. INSTALL MACRDP
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL MACRDP"
          echo "=================================================="

          MACRDP_BINARY="$HOME/macrdp/target/release/macrdp"

          if [ ! -f "$MACRDP_BINARY" ]; then
            echo "ERROR: macrdp binary not found."
            exit 1
          fi

          sudo cp \
            "$MACRDP_BINARY" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "===== BINARY ====="

          ls -lh /usr/local/bin/macrdp

          echo
          echo "===== HELP ====="

          /usr/local/bin/macrdp --help

      # =========================================================
      # 11. PREPARE TARGET USER
      # =========================================================
      - name: Prepare Target User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "PREPARE TARGET USER"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"

          sudo mkdir -p \
            "$USER_HOME/Library/LaunchAgents" \
            "$USER_HOME/Library/Logs/macrdp"

          sudo chown -R \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/LaunchAgents" \
            "$USER_HOME/Library/Logs/macrdp"

          echo
          echo "User home:"
          echo "$USER_HOME"

          echo
          echo "UID:"
          id -u "$MACOS_USERNAME"

      # =========================================================
      # 12. CREATE TARGET LAUNCHAGENT
      # =========================================================
      - name: Create Target LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATE TARGET LAUNCHAGENT"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"

          PLIST_TMP="/tmp/com.macrdp.server.plist"

          cat > "$PLIST_TMP" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>Label</key>
              <string>com.macrdp.server</string>

              <key>ProgramArguments</key>

              <array>

                  <string>/usr/local/bin/macrdp</string>

                  <string>--bind</string>
                  <string>0.0.0.0:3390</string>

                  <string>--username</string>
                  <string>$MACOS_USERNAME</string>

                  <string>--password</string>
                  <string>$MACOS_PASSWORD</string>

                  <string>--enable-h264</string>

                  <string>--fps</string>
                  <string>60</string>

                  <string>--bitrate</string>
                  <string>8</string>

                  <string>--keyframe-interval</string>
                  <string>2</string>

                  <string>--flush-frames</string>
                  <string>4</string>

                  <string>--virtual-display</string>

                  <string>--width</string>
                  <string>1920</string>

                  <string>--height</string>
                  <string>1080</string>

                  <string>--log-dir</string>
                  <string>$USER_HOME/Library/Logs/macrdp</string>

                  <string>--verbose</string>

              </array>

              <key>WorkingDirectory</key>
              <string>$USER_HOME</string>

              <key>EnvironmentVariables</key>

              <dict>

                  <key>PATH</key>
                  <string>/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>

                  <key>HOME</key>
                  <string>$USER_HOME</string>

                  <key>USER</key>
                  <string>$MACOS_USERNAME</string>

                  <key>LOGNAME</key>
                  <string>$MACOS_USERNAME</string>

              </dict>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <true/>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>ThrottleInterval</key>
              <integer>5</integer>

              <key>StandardOutPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stdout.log</string>

              <key>StandardErrorPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stderr.log</string>

          </dict>

          </plist>
          EOF

          sudo cp \
            "$PLIST_TMP" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chown \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chmod 644 \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "===== PLIST VALIDATION ====="

          sudo plutil -lint \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

      # =========================================================
      # 13. START INITIAL MACRDP
      # =========================================================
      - name: Start Initial macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          echo "=================================================="
          echo "START INITIAL MACRDP"
          echo "=================================================="

          rm -rf /tmp/macrdp-initial

          mkdir -p /tmp/macrdp-initial

          /usr/local/bin/macrdp \
            --bind 0.0.0.0:3390 \
            --username "$MACOS_USERNAME" \
            --password "$MACOS_PASSWORD" \
            --enable-h264 \
            --fps 60 \
            --bitrate 8 \
            --keyframe-interval 2 \
            --flush-frames 4 \
            --virtual-display \
            --width 1920 \
            --height 1080 \
            --log-dir /tmp/macrdp-initial \
            --verbose \
            > /tmp/macrdp-initial/console.log 2>&1 &

          PID=$!

          echo "$PID" > /tmp/macrdp-initial.pid

          echo
          echo "Initial macrdp PID:"
          echo "$PID"

          echo
          echo "Waiting for port 3390..."

          READY=0

          for i in $(seq 1 30); do

            if ! kill -0 "$PID" 2>/dev/null; then

              echo
              echo "ERROR: macrdp exited."

              cat \
                /tmp/macrdp-initial/console.log \
                2>/dev/null || true

              exit 1

            fi

            if lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              >/tmp/macrdp-initial-port.txt \
              2>&1; then

              READY=1

              echo
              echo "PORT 3390 IS READY."

              cat /tmp/macrdp-initial-port.txt

              break

            fi

            sleep 2

          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Port 3390 did not open."
            exit 1
          fi

          echo
          echo "===== RDP ADDRESS ====="

          cat /tmp/tailscale_ip

          echo ":3390"

      # =========================================================
      # 14. WAIT FOR SWITCH USER
      # =========================================================
      - name: Wait For Target User Switch
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "WAITING FOR TARGET USER SWITCH"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          echo
          echo "Target username:"
          echo "$MACOS_USERNAME"

          echo
          echo "Target UID:"
          echo "$TARGET_UID"

          echo
          echo "=================================================="
          echo "YOU CAN NOW SWITCH USER"
          echo "=================================================="

          echo
          echo "Switch to:"
          echo "$MACOS_USERNAME"

          echo
          echo "DO NOT SWITCH BACK."

          echo
          echo "=================================================="

          END=$((SECONDS + 1200))

          LAST_USER=""

          TARGET_FOUND=0

          while [ "$SECONDS" -lt "$END" ]; do

            CURRENT_USER=$(
              stat -f "%Su" /dev/console
            )

            echo
            echo "Current console user:"
            echo "$CURRENT_USER"

            if [ "$CURRENT_USER" != "$LAST_USER" ]; then

              echo
              echo "------------------------------------------"
              echo "CONSOLE USER CHANGE"
              echo "------------------------------------------"

              echo "Previous:"
              echo "$LAST_USER"

              echo "Current:"
              echo "$CURRENT_USER"

              LAST_USER="$CURRENT_USER"

            fi

            # -----------------------------------------------------
            # Ignore root.
            # -----------------------------------------------------

            if [ "$CURRENT_USER" = "root" ]; then

              echo
              echo "Temporary root console state detected."

              sleep 2

              continue

            fi

            # -----------------------------------------------------
            # Target user detected.
            # -----------------------------------------------------

            if [ "$CURRENT_USER" = "$MACOS_USERNAME" ]; then

              echo
              echo "=================================================="
              echo "TARGET USER DETECTED"
              echo "=================================================="

              echo
              echo "Console:"
              echo "$CURRENT_USER"

              echo
              echo "UID:"
              echo "$TARGET_UID"

              echo
              echo "===== LOGINWINDOW ====="

              pgrep -fl loginwindow || true

              echo
              echo "===== WINDOWSERVER ====="

              pgrep -fl WindowServer || true

              echo
              echo "===== WHO ====="

              who || true

              echo
              echo "Checking GUI launchd domain..."

              sudo launchctl print \
                "gui/$TARGET_UID" \
                >/tmp/target-gui.txt \
                2>&1

              GUI_EXIT=$?

              echo
              echo "GUI domain exit:"
              echo "$GUI_EXIT"

              cat \
                /tmp/target-gui.txt \
                2>/dev/null || true

              if [ "$GUI_EXIT" -eq 0 ]; then

                TARGET_FOUND=1

                echo
                echo "TARGET GUI DOMAIN IS READY."

                break

              fi

              echo
              echo "Target console user detected but GUI domain"
              echo "is not ready yet."

            fi

            sleep 3

          done

          if [ "$TARGET_FOUND" -ne 1 ]; then

            echo
            echo "=================================================="
            echo "TARGET GUI SESSION NOT READY"
            echo "=================================================="

            echo
            echo "Final console user:"
            stat -f "%Su" /dev/console

            echo
            echo "Final GUI domain check:"

            sudo launchctl print \
              "gui/$TARGET_UID" \
              2>&1 || true

            exit 1

          fi

      # =========================================================
      # 15. WAIT FOR GUI STABILITY
      # =========================================================
      - name: Wait For GUI Stability
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "WAIT FOR GUI STABILITY"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          echo
          echo "Waiting 15 seconds for GUI session..."

          sleep 15

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== TARGET GUI DOMAIN ====="

          sudo launchctl print \
            "gui/$TARGET_UID" \
            2>&1 || true

          echo
          echo "===== LOGINWINDOW ====="

          pgrep -fl loginwindow || true

          echo
          echo "===== WINDOWSERVER ====="

          pgrep -fl WindowServer || true

          echo
          echo "===== WHO ====="

          who || true

      # =========================================================
      # 16. STOP INITIAL MACRDP
      # =========================================================
      - name: Stop Initial macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "STOP INITIAL MACRDP"
          echo "=================================================="

          if [ -f /tmp/macrdp-initial.pid ]; then

            PID=$(cat /tmp/macrdp-initial.pid)

            echo
            echo "Initial PID:"
            echo "$PID"

            kill "$PID" \
              2>/dev/null || true

            sleep 5

          fi

          echo
          echo "===== REMAINING MACRDP ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

      # =========================================================
      # 17. BOOTSTRAP TARGET MACRDP
      # =========================================================
      - name: Bootstrap Target macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "BOOTSTRAP TARGET MACRDP"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          USER_HOME="/Users/$MACOS_USERNAME"

          PLIST="$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "Target:"
          echo "$MACOS_USERNAME"

          echo
          echo "UID:"
          echo "$TARGET_UID"

          echo
          echo "Console:"
          stat -f "%Su" /dev/console

          echo
          echo "===== GUI DOMAIN ====="

          sudo launchctl print \
            "gui/$TARGET_UID" \
            2>&1 || true

          echo
          echo "===== BOOTSTRAP ====="

          sudo launchctl bootout \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>/dev/null || true

          sleep 2

          sudo launchctl bootstrap \
            "gui/$TARGET_UID" \
            "$PLIST"

          BOOTSTRAP_EXIT=$?

          echo
          echo "Bootstrap exit:"
          echo "$BOOTSTRAP_EXIT"

          if [ "$BOOTSTRAP_EXIT" -ne 0 ]; then

            echo
            echo "ERROR: Target LaunchAgent bootstrap failed."

            echo
            echo "===== LAUNCHCTL DOMAIN ====="

            sudo launchctl print \
              "gui/$TARGET_UID" \
              2>&1 || true

            echo
            echo "===== PLIST ====="

            sudo plutil -p \
              "$PLIST" \
              2>&1 || true

            exit 1

          fi

          echo
          echo "Waiting for target macrdp..."

          sleep 10

          echo
          echo "===== TARGET SERVICE ====="

          sudo launchctl print \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "===== PROCESSES ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== TARGET STDOUT ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "===== TARGET STDERR ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

      # =========================================================
      # 18. VERIFY TARGET MACRDP
      # =========================================================
      - name: Verify Target macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "VERIFY TARGET MACRDP"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          USER_HOME="/Users/$MACOS_USERNAME"

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== TARGET UID ====="

          echo "$TARGET_UID"

          echo
          echo "===== MACRDP ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== LOCAL TEST ====="

          nc \
            -vz \
            127.0.0.1 \
            3390 \
            2>&1

          LOCAL_EXIT=$?

          echo
          echo "Local TCP exit:"
          echo "$LOCAL_EXIT"

          echo
          echo "===== TARGET SERVICE ====="

          sudo launchctl print \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "===== TARGET STDOUT ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "===== TARGET STDERR ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

          if [ "$LOCAL_EXIT" -ne 0 ]; then

            echo
            echo "WARNING:"
            echo "Target macrdp is not accepting TCP connections."

          else

            echo
            echo "TARGET RDP TCP: PASS"

          fi

      # =========================================================
      # 19. TARGET SESSION MONITOR
      # =========================================================
      - name: Monitor Target Session
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "TARGET SESSION MONITOR"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          USER_HOME="/Users/$MACOS_USERNAME"

          END=$((SECONDS + 20400))

          while [ "$SECONDS" -lt "$END" ]; do

            CURRENT_USER=$(
              stat -f "%Su" /dev/console
            )

            REMAINING=$((END - SECONDS))

            echo
            echo "=================================================="
            echo "STATUS"
            echo "=================================================="

            echo
            echo "Remaining:"
            echo "$REMAINING seconds"

            echo
            echo "Console:"
            echo "$CURRENT_USER"

            echo
            echo "Target:"
            echo "$MACOS_USERNAME"

            echo
            echo "===== MACRDP ====="

            pgrep -fl macrdp || true

            echo
            echo "===== PORT 3390 ====="

            lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true

            echo
            echo "===== TARGET SERVICE ====="

            sudo launchctl print \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>&1 || true

            echo
            echo "===== TAILSCALE ====="

            sudo tailscale status \
              2>/dev/null || true

            echo
            echo "===== MACRDP STDERR ====="

            tail -50 \
              "$USER_HOME/Library/Logs/macrdp/stderr.log" \
              2>/dev/null || true

            sleep 30

          done

      # =========================================================
      # 20. FINAL DIAGNOSTIC
      # =========================================================
      - name: Final Diagnostic
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "FINAL DIAGNOSTIC"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          USER_HOME="/Users/$MACOS_USERNAME"

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== WHO ====="

          who || true

          echo
          echo "===== WINDOWSERVER ====="

          pgrep -fl WindowServer || true

          echo
          echo "===== LOGINWINDOW ====="

          pgrep -fl loginwindow || true

          echo
          echo "===== MACRDP ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== TAILSCALE IP ====="

          cat \
            /tmp/tailscale_ip \
            2>/dev/null || true

          echo
          echo "===== TARGET GUI DOMAIN ====="

          sudo launchctl print \
            "gui/$TARGET_UID" \
            2>&1 || true

          echo
          echo "===== TARGET MACRDP SERVICE ====="

          sudo launchctl print \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>&1 || true

          echo
          echo "===== TARGET STDOUT ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "===== TARGET STDERR ====="

          cat \
            "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status \
            2>&1 || true

          echo
          echo "===== TAILSCALED LOG ====="

          cat \
            /tmp/tailscaled.log \
            2>/dev/null || true

      # =========================================================
      # 21. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME" 2>/dev/null)

          if [ -n "$TARGET_UID" ]; then

            sudo launchctl bootout \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

          fi

          pkill -f macrdp || true

          sudo tailscale down \
            2>/dev/null || true

          echo
          echo "Cleanup complete."
