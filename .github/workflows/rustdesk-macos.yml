name: macOS RustDesk

on:
  workflow_dispatch:

jobs:
  rustdesk:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      - name: macOS Info
        run: |
          sw_vers
          echo "Architecture: $(uname -m)"

            - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "Installing RustDesk with Homebrew..."

          brew update

          brew install --cask rustdesk

          echo "RustDesk installation completed."

          ls -la /Applications/RustDesk.app

          echo "RustDesk installed."

      - name: Start RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          open -a "/Applications/RustDesk.app"

          sleep 15

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo "RustDesk executable:"
          echo "$RUSTDESK"

          echo ""
          echo "RustDesk version:"
          "$RUSTDESK" --version || true

          echo ""
          echo "RustDesk ID:"

          ID=$("$RUSTDESK" --get-id 2>/dev/null || true)

          echo "$ID"

          echo ""
          echo "Checking available RustDesk commands..."

          "$RUSTDESK" --help 2>&1 | head -100 || true

      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "macOS Runner is online."

          while true
          do
            echo "Runner alive: $(date)"
            sleep 300
          done
