name: macOS RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true


      # =========================================================
      # 2. CREATE ABDULRAHMAN
      # =========================================================
      - name: Create Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CREATING ABDULRAHMAN"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          echo ""
          echo "Username:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo ""
            echo "User already exists."
          else
            echo ""
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo ""
          echo "Adding Administrator privileges..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "User ID:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"


      # =========================================================
      # 3. VERIFY PASSWORD + ADMIN
      # =========================================================
      - name: Verify Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING ABDULRAHMAN"
          echo "=========================================="

          echo ""
          echo "whoami:"
          sudo -u "$MACOS_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Home:"
          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

          echo ""
          echo "Checking Administrator membership..."

          ADMIN_CHECK=$(
            dseditgroup \
              -o checkmember \
              -m "$MACOS_USERNAME" \
              admin
          )

          echo "$ADMIN_CHECK"

          if echo "$ADMIN_CHECK" | grep -qi "yes"; then
            echo ""
            echo "SUCCESS: Abdulrahman is an Administrator."
          else
            echo ""
            echo "ERROR: Abdulrahman is NOT an Administrator."
            exit 1
          fi


      # =========================================================
      # 4. SET AUTO LOGIN
      # =========================================================
      - name: Configure Abdulrahman Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Target:"
          echo "$MACOS_USERNAME"

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            || true

          echo ""
          echo "Auto-login status:"

          sudo sysadminctl \
            -autologin status \
            || true

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "IMPORTANT:"
          echo "Auto-login applies to a future login."
          echo "It does not replace the current GUI session."


      # =========================================================
      # 5. INSTALL RUSTDESK
      # =========================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          brew update

          brew install --cask rustdesk

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -f "$RUSTDESK" ]; then
            echo "ERROR: RustDesk executable not found."
            exit 1
          fi

          echo ""
          echo "RustDesk version:"
          "$RUSTDESK" --version || true


      # =========================================================
      # 6. CONFIGURE RUSTDESK
      # =========================================================
      - name: Configure RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD is empty."
            exit 1
          fi

          echo ""
          echo "RustDesk ID:"

          ID=$(
            "$RUSTDESK" \
              --get-id \
              2>/dev/null || true
          )

          echo "$ID"

          echo ""
          echo "Starting RustDesk server..."

          "$RUSTDESK" \
            --server \
            >/tmp/rustdesk-server.log 2>&1 &

          sleep 10

          echo ""
          echo "Setting permanent password..."

          PASSWORD_OUTPUT=$(
            sudo "$RUSTDESK" \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          )

          echo "$PASSWORD_OUTPUT"

          if echo "$PASSWORD_OUTPUT" | grep -qi "done"; then
            echo ""
            echo "SUCCESS: RustDesk password configured."
          else
            echo ""
            echo "WARNING: RustDesk did not report Done."
            cat /tmp/rustdesk-server.log || true
          fi

          echo ""
          echo "Stopping temporary RustDesk server..."

          pkill -f \
            "/Applications/RustDesk.app/Contents/MacOS/RustDesk" \
            || true

          sleep 5

          echo ""
          echo "Configured RustDesk successfully."


      # =========================================================
      # 7. CREATE RUSTDESK LAUNCHDAEMON
      # =========================================================
      - name: Install RustDesk Auto Restart Service
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          PLIST="/Library/LaunchDaemons/com.abdulrahman.rustdesk.server.plist"
          LOG="/tmp/rustdesk-launchdaemon.log"

          echo "=========================================="
          echo " INSTALLING RUSTDESK AUTO RESTART"
          echo "=========================================="

          USER_UID=$(id -u "$MACOS_USERNAME")

          echo ""
          echo "RustDesk:"
          echo "$RUSTDESK"

          echo ""
          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "UID:"
          echo "$USER_UID"

          echo ""
          echo "Creating LaunchDaemon..."

          sudo tee "$PLIST" >/dev/null <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>Label</key>
              <string>com.abdulrahman.rustdesk.server</string>

              <key>UserName</key>
              <string>$MACOS_USERNAME</string>

              <key>ProgramArguments</key>
              <array>
                  <string>$RUSTDESK</string>
                  <string>--server</string>
              </array>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <true/>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>StandardOutPath</key>
              <string>$LOG</string>

              <key>StandardErrorPath</key>
              <string>$LOG</string>

          </dict>
          </plist>
          EOF

          echo ""
          echo "Fixing plist permissions..."

          sudo chown root:wheel "$PLIST"
          sudo chmod 644 "$PLIST"

          echo ""
          echo "Validating plist..."

          sudo plutil -lint "$PLIST"

          echo ""
          echo "Loading LaunchDaemon..."

          sudo launchctl bootout system/com.abdulrahman.rustdesk.server \
            2>/dev/null || true

          sudo launchctl bootstrap system "$PLIST"

          echo ""
          echo "Starting LaunchDaemon..."

          sudo launchctl kickstart \
            -k system/com.abdulrahman.rustdesk.server

          sleep 10

          echo ""
          echo "LaunchDaemon status:"

          sudo launchctl print \
            system/com.abdulrahman.rustdesk.server \
            || true

          echo ""
          echo "RustDesk processes:"

          pgrep -fl RustDesk || true


      # =========================================================
      # 8. VERIFY RUSTDESK ID
      # =========================================================
      - name: Verify RustDesk ID
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo "=========================================="
          echo " VERIFYING RUSTDESK"
          echo "=========================================="

          sleep 5

          echo ""
          echo "RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "RustDesk ID:"

          ID=""

          for i in {1..10}
          do

            ID=$(
              sudo -u "$MACOS_USERNAME" -H \
                env \
                HOME="/Users/$MACOS_USERNAME" \
                USER="$MACOS_USERNAME" \
                LOGNAME="$MACOS_USERNAME" \
                "$RUSTDESK" \
                --get-id \
                2>/dev/null || true
            )

            if [ -n "$ID" ]; then
              break
            fi

            sleep 3

          done

          if [ -n "$ID" ]; then
            echo ""
            echo "=========================================="
            echo " RUSTDESK READY"
            echo "=========================================="
            echo ""
            echo "RustDesk ID:"
            echo "$ID"
            echo ""
            echo "=========================================="
          else
            echo ""
            echo "ERROR: Could not retrieve RustDesk ID."

            echo ""
            echo "RustDesk log:"
            tail -100 \
              /tmp/rustdesk-launchdaemon.log \
              2>/dev/null || true

            exit 1
          fi


      # =========================================================
      # 9. OPEN SYSTEM SETTINGS
      # =========================================================
      - name: Open System Settings As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " OPENING SYSTEM SETTINGS"
          echo "=========================================="

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            /usr/bin/open \
            -a "System Settings" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "GUI sessions:"
          who || true


      # =========================================================
      # 10. FINAL CHECK
      # =========================================================
      - name: Final Check
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true

          echo ""
          echo "Current Actions user:"
          whoami

          echo ""
          echo "Abdulrahman:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Abdulrahman groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "RustDesk ID:"

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            "$RUSTDESK" \
            --get-id \
            2>/dev/null || true

          echo ""
          echo "LaunchDaemon:"

          sudo launchctl print \
            system/com.abdulrahman.rustdesk.server \
            2>/dev/null || true


      # =========================================================
      # 11. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RUNNER IS ONLINE"
          echo "=========================================="

          while true
          do

            echo ""
            echo "[$(date)] Runner alive"

            echo ""
            echo "Console user:"
            stat -f "%Su" /dev/console \
              2>/dev/null || echo "unknown"

            echo ""
            echo "Logged users:"
            who || true

            echo ""
            echo "RustDesk processes:"
            pgrep -fl RustDesk || true

            echo ""
            echo "RustDesk ID:"

            RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

            "$RUSTDESK" \
              --get-id \
              2>/dev/null || true

            echo ""
            echo "LaunchDaemon status:"

            sudo launchctl print \
              system/com.abdulrahman.rustdesk.server \
              2>/dev/null | \
              grep -E \
              "state =|pid =|path =|program =" \
              || true

            echo ""
            echo "Recent RustDesk log:"

            tail -10 \
              /tmp/rustdesk-launchdaemon.log \
              2>/dev/null || true

            echo ""
            echo "------------------------------------------"

            sleep 300

          done


