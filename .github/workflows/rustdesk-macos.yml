name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          echo
          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== PROCESS USER ====="
          whoami

          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console

          echo
          echo "===== LOGIN SESSIONS ====="
          who || true

          echo
          echo "===== WINDOWSERVER ====="
          pgrep -fl WindowServer || true

          echo
          echo "===== LOGINWINDOW ====="
          pgrep -fl loginwindow || true

      # =========================================================
      # 2. CREATE / VERIFY USER
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATE / VERIFY USER"
          echo "=================================================="

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo
          echo "===== USER INFO ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== UID ====="

          id -u "$MACOS_USERNAME"

          echo
          echo "===== HOME ====="

          dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

      # =========================================================
      # 3. ADMINISTRATOR
      # =========================================================
      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "CONFIGURE ADMINISTRATOR"
          echo "=================================================="

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== USER ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN GROUP ====="

          dscl . \
            -read /Groups/admin \
            GroupMembership

      # =========================================================
      # 4. CONFIGURE AUTO LOGIN
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CONFIGURE AUTO LOGIN"
          echo "=================================================="

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "===== AUTO LOGIN CONFIG ====="

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            2>/dev/null || true

          echo
          echo "NOTE:"
          echo "Auto Login applies during startup."
          echo "It does not switch the current GUI session."

      # =========================================================
      # 5. INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL TAILSCALE"
          echo "=================================================="

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Installing Homebrew..."

            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          brew install --quiet tailscale || true

          echo
          echo "===== TAILSCALE VERSION ====="

          tailscale version

      # =========================================================
      # 6. START TAILSCALE
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          echo "=================================================="
          echo "START TAILSCALE"
          echo "=================================================="

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled already running."
          else
            echo "Starting tailscaled..."

            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            echo "tailscaled PID: $!"

            sleep 5
          fi

          echo
          echo "===== TAILSCALED ====="

          pgrep -fl tailscaled || true

          echo
          echo "===== TAILSCALED LOG ====="

          cat /tmp/tailscaled.log 2>/dev/null || true

          echo
          echo "===== TAILSCALE UP ====="

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          echo
          echo "===== STATUS ====="

          sudo tailscale status

          echo
          echo "===== IP ====="

          TAILSCALE_IP=$(
            sudo tailscale ip -4 2>/dev/null |
            head -n 1
          )

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: No Tailscale IP."
            exit 1
          fi

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip

          echo
          echo "=================================================="
          echo "RDP ADDRESS"
          echo "=================================================="

          echo "$TAILSCALE_IP:3390"

      # =========================================================
      # 7. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL RUST"
          echo "=================================================="

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else
            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

      # =========================================================
      # 8. CLONE MACRDP
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLONE MACRDP"
          echo "=================================================="

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          git status

      # =========================================================
      # 9. BUILD MACRDP
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILD MACRDP"
          echo "=================================================="

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          cargo build --release

          echo
          echo "===== BUILD OUTPUT ====="

          ls -lh \
            target/release/macrdp

      # =========================================================
      # 10. INSTALL MACRDP
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALL MACRDP"
          echo "=================================================="

          sudo cp \
            "$HOME/macrdp/target/release/macrdp" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "===== MACRDP VERSION / HELP ====="

          /usr/local/bin/macrdp --help

      # =========================================================
      # 11. PREPARE LOG DIRECTORY
      # =========================================================
      - name: Prepare macrdp Logs
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "PREPARE MACRDP LOGS"
          echo "=================================================="

          rm -rf /tmp/macrdp

          mkdir -p \
            /tmp/macrdp

      # =========================================================
      # 12. START MACRDP
      # =========================================================
      - name: Start macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          echo "=================================================="
          echo "START MACRDP"
          echo "=================================================="

          /usr/local/bin/macrdp \
            --bind 0.0.0.0:3390 \
            --username "$MACOS_USERNAME" \
            --password "$MACOS_PASSWORD" \
            --enable-h264 \
            --fps 60 \
            --bitrate 8 \
            --keyframe-interval 2 \
            --flush-frames 4 \
            --virtual-display \
            --width 1920 \
            --height 1080 \
            --log-dir /tmp/macrdp \
            --verbose \
            > /tmp/macrdp/console.log 2>&1 &

          PID=$!

          echo "$PID" > /tmp/macrdp.pid

          echo
          echo "macrdp PID:"
          echo "$PID"

          echo
          echo "Waiting for TCP 3390..."

          READY=0

          for i in $(seq 1 30); do

            if ! kill -0 "$PID" 2>/dev/null; then

              echo
              echo "ERROR: macrdp exited."

              cat \
                /tmp/macrdp/console.log \
                2>/dev/null || true

              exit 1

            fi

            if lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              >/tmp/macrdp/port.txt \
              2>&1; then

              READY=1

              echo
              echo "TCP 3390 IS READY."

              cat /tmp/macrdp/port.txt

              break

            fi

            sleep 2

          done

          if [ "$READY" -ne 1 ]; then
            echo
            echo "ERROR: TCP 3390 did not open."
            exit 1
          fi

      # =========================================================
      # 13. VERIFY RDP
      # =========================================================
      - name: Verify RDP
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "VERIFY RDP"
          echo "=================================================="

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== LOGIN SESSIONS ====="

          who || true

          echo
          echo "===== WINDOWSERVER ====="

          pgrep -fl WindowServer || true

          echo
          echo "===== LOGINWINDOW ====="

          pgrep -fl loginwindow || true

          echo
          echo "===== MACRDP ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== LOCAL TCP TEST ====="

          nc \
            -vz \
            127.0.0.1 \
            3390 \
            2>&1

          echo
          echo "===== TAILSCALE IP ====="

          cat /tmp/tailscale_ip

          echo
          echo "=================================================="
          echo "CONNECT USING MICROSOFT REMOTE DESKTOP"
          echo "=================================================="

          echo
          echo "PC:"
          echo "$(cat /tmp/tailscale_ip):3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

      # =========================================================
      # 14. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep RDP Alive
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "RDP SESSION ACTIVE"
          echo "=================================================="

          echo
          echo "IMPORTANT:"
          echo "Do NOT use Switch User."
          echo "The active GUI session is runner."

          END=$((SECONDS + 20400))

          while [ "$SECONDS" -lt "$END" ]; do

            REMAINING=$((END - SECONDS))

            echo
            echo "=================================================="
            echo "STATUS"
            echo "=================================================="

            echo
            echo "Remaining:"
            echo "$REMAINING seconds"

            echo
            echo "Console:"
            stat -f "%Su" /dev/console

            echo
            echo "GUI sessions:"
            who || true

            echo
            echo "===== MACRDP ====="

            pgrep -fl macrdp || true

            echo
            echo "===== PORT 3390 ====="

            lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true

            echo
            echo "===== TAILSCALE ====="

            sudo tailscale status \
              2>/dev/null || true

            echo
            echo "===== MACRDP LOG ====="

            tail -50 \
              /tmp/macrdp/console.log \
              2>/dev/null || true

            sleep 30

          done

      # =========================================================
      # 15. FINAL DIAGNOSTIC
      # =========================================================
      - name: Final Diagnostic
        if: always()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "FINAL DIAGNOSTIC"
          echo "=================================================="

          echo
          echo "===== macOS ====="

          sw_vers

          echo
          echo "===== PROCESS USER ====="

          whoami

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== WHO ====="

          who || true

          echo
          echo "===== WINDOWSERVER ====="

          pgrep -fl WindowServer || true

          echo
          echo "===== LOGINWINDOW ====="

          pgrep -fl loginwindow || true

          echo
          echo "===== MACRDP ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== TAILSCALE IP ====="

          cat \
            /tmp/tailscale_ip \
            2>/dev/null || true

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status \
            2>&1 || true

          echo
          echo "===== MACRDP LOG ====="

          cat \
            /tmp/macrdp/console.log \
            2>/dev/null || true

          echo
          echo "===== TAILSCALED LOG ====="

          cat \
            /tmp/tailscaled.log \
            2>/dev/null || true

      # =========================================================
      # 16. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          if [ -f /tmp/macrdp.pid ]; then

            PID=$(cat /tmp/macrdp.pid)

            echo "Stopping macrdp PID: $PID"

            kill "$PID" \
              2>/dev/null || true

          fi

          pkill -f macrdp || true

          sudo tailscale down \
            2>/dev/null || true

          echo
          echo "Cleanup complete."
