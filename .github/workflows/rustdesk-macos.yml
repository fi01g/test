name: macOS RDP - Tailscale

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true


      # =========================================================
      # 2. CREATE ABDULRAHMAN
      # =========================================================
      - name: Create Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CREATING ABDULRAHMAN"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          echo ""
          echo "Username:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo ""
            echo "User already exists."
          else
            echo ""
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo ""
          echo "Adding Administrator privileges..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "User ID:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"


      # =========================================================
      # 3. VERIFY PASSWORD + ADMIN
      # =========================================================
      - name: Verify Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING ABDULRAHMAN"
          echo "=========================================="

          echo ""
          echo "whoami:"
          sudo -u "$MACOS_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Home:"
          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

          echo ""
          echo "Checking Administrator membership..."

          ADMIN_CHECK=$(
            dseditgroup \
              -o checkmember \
              -m "$MACOS_USERNAME" \
              admin
          )

          echo "$ADMIN_CHECK"

          if echo "$ADMIN_CHECK" | grep -qi "yes"; then
            echo ""
            echo "SUCCESS: Abdulrahman is an Administrator."
          else
            echo ""
            echo "ERROR: Abdulrahman is NOT an Administrator."
            exit 1
          fi


      # =========================================================
      # 4. SET AUTO LOGIN
      # =========================================================
      - name: Configure Abdulrahman Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Target:"
          echo "$MACOS_USERNAME"

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            || true

          echo ""
          echo "Auto-login status:"

          sudo sysadminctl \
            -autologin status \
            || true

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "IMPORTANT:"
          echo "Auto-login applies to a future login."
          echo "It does not replace the current GUI session."


      # =========================================================
      # 5. INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING TAILSCALE"
          echo "=========================================="

          brew update

          brew install tailscale

          echo ""
          echo "Tailscale version:"
          tailscale version

          echo ""
          echo "tailscaled:"
          which tailscaled || true

          echo ""
          echo "tailscale:"
          which tailscale


      # =========================================================
      # 6. START TAILSCALE
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |
          set -e

          echo "=========================================="
          echo " STARTING TAILSCALE"
          echo "=========================================="

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY is empty."
            exit 1
          fi

          echo ""
          echo "Starting tailscaled..."

          sudo brew services start tailscale

          sleep 10

          echo ""
          echo "Tailscale daemon:"
          pgrep -fl tailscaled || true

          echo ""
          echo "Authenticating Tailscale..."

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp" \
            --accept-dns=true

          sleep 10

          echo ""
          echo "=========================================="
          echo " TAILSCALE STATUS"
          echo "=========================================="

          sudo tailscale status

          echo ""
          echo "Tailscale IP:"

          TAILSCALE_IP=$(
            sudo tailscale ip -4 | head -1
          )

          echo "$TAILSCALE_IP"

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: Tailscale IPv4 not found."
            exit 1
          fi

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"


      # =========================================================
      # 7. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUST"
          echo "=========================================="

          brew install rust

          echo ""
          rustc --version

          echo ""
          cargo --version


      # =========================================================
      # 8. DOWNLOAD macrdp
      # =========================================================
      - name: Download macrdp
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " DOWNLOADING macrdp"
          echo "=========================================="

          cd "$RUNNER_TEMP"

          rm -rf macrdp

          git clone \
            https://github.com/clintcan/macrdp.git \
            macrdp

          cd macrdp

          echo ""
          echo "Repository:"
          git remote -v

          echo ""
          echo "Commit:"
          git rev-parse HEAD


      # =========================================================
      # 9. INSPECT macrdp CLI
      # =========================================================
      - name: Inspect macrdp
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " INSPECTING macrdp"
          echo "=========================================="

          cd "$RUNNER_TEMP/macrdp"

          echo ""
          echo "Files:"
          find . -maxdepth 2 -type f | sort | head -100

          echo ""
          echo "Cargo.toml:"
          cat Cargo.toml

          echo ""
          echo "Building macrdp..."

          cargo build --release

          BUILD_EXIT=$?

          echo ""
          echo "Build exit code:"
          echo "$BUILD_EXIT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "macrdp BUILD FAILED."
            exit 1
          fi

          echo ""
          echo "Built binaries:"

          find target/release \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -print

          echo ""
          echo "Testing help..."

          ./target/release/macrdp --help

          HELP_EXIT=$?

          echo ""
          echo "Help exit code:"
          echo "$HELP_EXIT"

          if [ "$HELP_EXIT" -ne 0 ]; then
            echo ""
            echo "macrdp --help returned an error."
          fi


      # =========================================================
      # 10. INSTALL macrdp
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING macrdp"
          echo "=========================================="

          cd "$RUNNER_TEMP/macrdp"

          if [ ! -f "target/release/macrdp" ]; then
            echo "ERROR: target/release/macrdp not found."
            exit 1
          fi

          echo ""
          echo "Signing binary..."

          codesign \
            -s - \
            --force \
            target/release/macrdp \
            || true

          echo ""
          echo "Installing binary..."

          sudo mkdir -p /usr/local/bin

          sudo cp \
            target/release/macrdp \
            /usr/local/bin/macrdp

          sudo chmod 755 \
            /usr/local/bin/macrdp

          echo ""
          echo "Installed binary:"

          ls -lah /usr/local/bin/macrdp

          echo ""
          echo "macrdp help:"

          /usr/local/bin/macrdp \
            --help \
            2>&1 || true


      # =========================================================
      # 11. OPEN PRIVACY SETTINGS
      # =========================================================
      - name: Open RDP Privacy Permissions
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " OPENING RDP PRIVACY SETTINGS"
          echo "=========================================="

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Opening Screen Recording..."

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension?Privacy_ScreenCapture" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Opening Accessibility..."

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension?Privacy_Accessibility" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Privacy settings requested."


      # =========================================================
      # 12. START macrdp - DEBUG MODE
      # =========================================================
      - name: Start macOS RDP Server
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set +e

          echo "=========================================="
          echo " STARTING macOS RDP SERVER"
          echo "=========================================="

          RDP="/usr/local/bin/macrdp"

          echo ""
          echo "Binary:"
          ls -lah "$RDP"

          echo ""
          echo "macrdp help:"
          "$RDP" --help 2>&1

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Current GUI sessions:"
          who

          echo ""
          echo "Starting macrdp..."

          rm -f /tmp/macrdp.log

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            nohup "$RDP" \
              --bind 0.0.0.0:3390 \
              >/tmp/macrdp.log 2>&1 &

          MACRDP_PID=$!

          echo ""
          echo "macrdp PID:"
          echo "$MACRDP_PID"

          sleep 5

          echo ""
          echo "=========================================="
          echo " macrdp PROCESS"
          echo "=========================================="

          pgrep -fl macrdp || true

          echo ""
          echo "=========================================="
          echo " macrdp LOG"
          echo "=========================================="

          cat /tmp/macrdp.log \
            2>/dev/null || true

          echo ""
          echo "=========================================="
          echo " macrdp HELP"
          echo "=========================================="

          "$RDP" --help \
            2>&1 || true

          echo ""
          echo "=========================================="
          echo " PORT 3390"
          echo "=========================================="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo ""
          echo "netstat:"
          netstat \
            -an \
            2>/dev/null | grep 3390 \
            || true

          echo ""
          echo "=========================================="
          echo " END RDP DEBUG"
          echo "=========================================="


      # =========================================================
      # 13. VERIFY RDP SERVER
      # =========================================================
      - name: Verify RDP Server
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo " VERIFYING RDP SERVER"
          echo "=========================================="

          echo ""
          echo "macrdp process:"
          pgrep -fl macrdp || true

          echo ""
          echo "macrdp log:"
          cat /tmp/macrdp.log \
            2>/dev/null || true

          echo ""
          echo "Listening ports:"
          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            || true

          echo ""
          echo "Testing local RDP port..."

          nc \
            -zv \
            127.0.0.1 \
            3390

          RESULT=$?

          echo ""
          echo "nc exit code:"
          echo "$RESULT"

          if [ "$RESULT" -eq 0 ]; then
            echo ""
            echo "=========================================="
            echo " RDP PORT IS OPEN"
            echo "=========================================="
          else
            echo ""
            echo "=========================================="
            echo " RDP PORT IS NOT OPEN"
            echo "=========================================="

            echo ""
            echo "This is NOT a Tailscale problem."
            echo "macrdp is not listening on TCP 3390."

            echo ""
            echo "Full macrdp log:"
            cat /tmp/macrdp.log \
              2>/dev/null || true
          fi

          # Do NOT fail here.
          # We need the workflow to continue so the
          # diagnostic information remains available.


      # =========================================================
      # 14. CONNECTION INFORMATION
      # =========================================================
      - name: RDP Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          echo "=========================================="
          echo " CONNECTION INFORMATION"
          echo "=========================================="

          echo ""
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo ""
          echo "RDP Address:"
          echo "$TAILSCALE_IP:3390"

          echo ""
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "Password:"
          echo "Use your MACOS_PASSWORD secret."

          echo ""
          echo "=========================================="
          echo " MICROSOFT REMOTE DESKTOP"
          echo "=========================================="

          echo ""
          echo "PC:"
          echo "$TAILSCALE_IP:3390"

          echo ""
          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "=========================================="


      # =========================================================
      # 15. FINAL CHECK
      # =========================================================
      - name: Final Check
        shell: bash
        run: |
          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true

          echo ""
          echo "Tailscale:"
          sudo tailscale status || true

          echo ""
          echo "Tailscale IP:"
          sudo tailscale ip -4 || true

          echo ""
          echo "macrdp:"
          pgrep -fl macrdp || true

          echo ""
          echo "RDP port:"
          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            || true

          echo ""
          echo "macrdp log:"
          cat /tmp/macrdp.log \
            2>/dev/null || true


      # =========================================================
      # 16. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RDP SERVER IS ONLINE"
          echo "=========================================="

          END_TIME=$(( $(date +%s) + 20400 ))

          while [ "$(date +%s)" -lt "$END_TIME" ]
          do

            echo ""
            echo "[$(date)] Server alive"

            echo ""
            echo "Console user:"
            stat -f "%Su" /dev/console \
              2>/dev/null || echo "unknown"

            echo ""
            echo "Tailscale IP:"
            sudo tailscale ip -4 \
              2>/dev/null || true

            echo ""
            echo "RDP:"
            lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true

            echo ""
            echo "macrdp:"
            pgrep -fl macrdp \
              2>/dev/null || true

            sleep 300

          done

          echo ""
          echo "Keep Alive period finished."


      # =========================================================
      # 17. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo " CLEANUP"
          echo "=========================================="

          echo ""
          echo "Stopping macrdp..."

          sudo pkill -f \
            "/usr/local/bin/macrdp" \
            || true

          echo ""
          echo "Stopping Tailscale..."

          sudo tailscale down \
            || true

          echo ""
          echo "Stopping Tailscale service..."

          sudo brew services stop tailscale \
            || true

          echo ""
          echo "Cleanup finished."


      # =========================================================
      # 18. FINAL
      # =========================================================
      - name: Final
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo " MACOS RDP CYCLE FINISHED"
          echo "=========================================="
