name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. System Information
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          echo "===== SYSTEM ====="
          sw_vers

          echo
          echo "===== CURRENT USER ====="
          whoami

          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console

          echo
          echo "===== GUI SESSIONS ====="
          who || true

          echo
          echo "===== MEMORY ====="
          sysctl hw.memsize

          echo
          echo "===== DISK ====="
          df -h

          echo
          echo "======================"

      # =========================================================
      # 2. Create / Verify User
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "Checking user: $MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo
          echo "===== USER ====="

          id "$MACOS_USERNAME"

      # =========================================================
      # 3. Administrator
      # =========================================================
      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== USER GROUPS ====="

          id "$MACOS_USERNAME"

      # =========================================================
      # 4. Auto Login
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "===== AUTO LOGIN ====="

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            2>/dev/null || true

          echo
          echo "Current console user:"
          stat -f "%Su" /dev/console

      # =========================================================
      # 5. Install Homebrew / Tailscale
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Installing Homebrew..."

            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo
          echo "Installing Tailscale..."

          brew install --quiet tailscale || true

          echo
          echo "===== TAILSCALE VERSION ====="

          tailscale version

      # =========================================================
      # 6. Start Tailscale
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "=================================================="
          echo "STARTING TAILSCALE"
          echo "=================================================="

          if pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled already running."
          else
            echo "Starting tailscaled..."

            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            TAILSCALED_PID=$!

            echo "tailscaled PID: $TAILSCALED_PID"

            sleep 5
          fi

          echo
          echo "===== TAILSCALED PROCESSES ====="

          pgrep -fl tailscaled || true

          echo
          echo "===== TAILSCALED LOG ====="

          cat /tmp/tailscaled.log 2>/dev/null || true

          echo
          echo "===== TAILSCALE UP ====="

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status

          echo
          echo "===== TAILSCALE IP ====="

          TAILSCALE_IP=$(
            sudo tailscale ip -4 2>/dev/null |
            head -n 1
          )

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: Tailscale IP not found."
            exit 1
          fi

          echo "TAILSCALE_IP=$TAILSCALE_IP"

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip

      # =========================================================
      # 7. Install Rust
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else
            echo "Installing Rust..."

            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          echo
          rustc --version

          echo
          cargo --version

      # =========================================================
      # 8. Clone macrdp
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "===== MACRDP FILES ====="

          ls -la

      # =========================================================
      # 9. Build macrdp
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          echo "===== CARGO BUILD ====="

          cargo build --release

          echo
          echo "===== BUILD OUTPUT ====="

          find target/release \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -print

      # =========================================================
      # 10. Install macrdp
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          MACRDP_BINARY="$HOME/macrdp/target/release/macrdp"

          if [ ! -f "$MACRDP_BINARY" ]; then
            echo "ERROR: macrdp binary not found."
            exit 1
          fi

          sudo cp \
            "$MACRDP_BINARY" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "===== MACRDP HELP ====="

          /usr/local/bin/macrdp --help

      # =========================================================
      # 11. Prepare logs
      # =========================================================
      - name: Prepare macrdp Logs
        shell: bash
        run: |
          set -e

          rm -rf /tmp/macrdp-logs

          mkdir -p /tmp/macrdp-logs

          echo "macrdp log directory:"
          ls -ld /tmp/macrdp-logs

      # =========================================================
      # 12. Check TCC / GUI Environment
      # =========================================================
      - name: Check GUI Environment
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "GUI ENVIRONMENT"
          echo "=================================================="

          echo
          echo "Current user:"
          whoami

          echo
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo
          echo "DISPLAY:"
          echo "${DISPLAY:-<empty>}"

          echo
          echo "USER:"
          echo "$USER"

          echo
          echo "HOME:"
          echo "$HOME"

          echo
          echo "GUI sessions:"
          who || true

          echo
          echo "WindowServer:"
          pgrep -fl WindowServer || true

      # =========================================================
      # 13. Start macrdp
      #
      # IMPORTANT:
      # Run it in the current GitHub runner GUI session.
      #
      # virtual-display creates a headless RDP display.
      # =========================================================
      - name: Start macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          echo "=================================================="
          echo "STARTING MACRDP"
          echo "=================================================="

          MACRDP="/usr/local/bin/macrdp"

          echo
          echo "Binary:"
          ls -l "$MACRDP"

          echo
          echo "Starting server..."

          "$MACRDP" \
            --bind 0.0.0.0:3390 \
            --username "$MACOS_USERNAME" \
            --password "$MACOS_PASSWORD" \
            --enable-h264 \
            --fps 60 \
            --bitrate 8 \
            --keyframe-interval 2 \
            --flush-frames 4 \
            --virtual-display \
            --log-dir /tmp/macrdp-logs \
            --verbose \
            > /tmp/macrdp-logs/console.log 2>&1 &

          MACRDP_PID=$!

          echo "$MACRDP_PID" > /tmp/macrdp.pid

          echo
          echo "macrdp PID:"
          echo "$MACRDP_PID"

          echo
          echo "Waiting for macrdp..."

          for i in $(seq 1 30); do

            if ! kill -0 "$MACRDP_PID" 2>/dev/null; then
              echo
              echo "ERROR: macrdp exited."

              echo
              echo "===== CONSOLE LOG ====="

              cat /tmp/macrdp-logs/console.log 2>/dev/null || true

              exit 1
            fi

            if lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              >/tmp/macrdp-port.txt \
              2>&1; then

              echo
              echo "RDP PORT IS LISTENING."

              cat /tmp/macrdp-port.txt

              break
            fi

            echo "Waiting... $i/30"

            sleep 2

          done

          echo
          echo "===== MACRDP PROCESS ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== MACRDP LOG ====="

          cat /tmp/macrdp-logs/console.log \
            2>/dev/null || true

          echo
          echo "===== LOG FILES ====="

          find /tmp/macrdp-logs \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null || true

      # =========================================================
      # 14. Local RDP TCP Test
      # =========================================================
      - name: Test Local RDP
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "LOCAL RDP TEST"
          echo "=================================================="

          echo
          echo "===== LISTENING SOCKET ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== TEST 127.0.0.1:3390 ====="

          nc -vz \
            127.0.0.1 \
            3390 \
            2>&1

          LOCAL_EXIT=$?

          echo
          echo "nc exit code:"
          echo "$LOCAL_EXIT"

          echo
          echo "===== TEST TAILSCALE IP ====="

          TAILSCALE_IP=$(cat /tmp/tailscale_ip 2>/dev/null)

          echo "Testing:"
          echo "$TAILSCALE_IP:3390"

          nc -vz \
            "$TAILSCALE_IP" \
            3390 \
            2>&1

          TS_EXIT=$?

          echo
          echo "Tailscale-IP nc exit code:"
          echo "$TS_EXIT"

          echo
          echo "===== RESULT ====="

          if [ "$LOCAL_EXIT" -eq 0 ]; then
            echo "LOCAL RDP TCP: PASS"
          else
            echo "LOCAL RDP TCP: FAIL"
          fi

          if [ "$TS_EXIT" -eq 0 ]; then
            echo "TAILSCALE RDP TCP: PASS"
          else
            echo "TAILSCALE RDP TCP: FAIL"
          fi

      # =========================================================
      # 15. Tailscale Diagnostics
      # =========================================================
      - name: Tailscale Diagnostics
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "TAILSCALE DIAGNOSTICS"
          echo "=================================================="

          echo
          echo "===== STATUS ====="

          sudo tailscale status 2>&1 || true

          echo
          echo "===== IP ====="

          sudo tailscale ip -4 2>&1 || true

          echo
          echo "===== NETCHECK ====="

          sudo tailscale netcheck 2>&1 || true

          echo
          echo "===== TAILSCALE PREFS ====="

          sudo tailscale debug prefs 2>&1 \
            | grep -Ei \
              "shields|accept|relay|exit|hostname" \
            || true

          echo
          echo "===== INTERFACES ====="

          ifconfig \
            | grep \
              -A 6 \
              -B 2 \
              "utun" \
            || true

      # =========================================================
      # 16. Final RDP Diagnostic
      # =========================================================
      - name: Final RDP Diagnostic
        if: always()
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "FINAL RDP DIAGNOSTIC"
          echo "=================================================="

          echo
          echo "===== CURRENT USER ====="

          whoami

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== MACRDP PROCESSES ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>&1 || true

          echo
          echo "===== TAILSCALE IP ====="

          cat /tmp/tailscale_ip \
            2>/dev/null || true

          echo
          echo "===== MACRDP CONSOLE LOG ====="

          cat \
            /tmp/macrdp-logs/console.log \
            2>/dev/null || true

          echo
          echo "===== ALL MACRDP LOGS ====="

          find \
            /tmp/macrdp-logs \
            -type f \
            -maxdepth 2 \
            -print \
            -exec sh -c 'echo "----- $1 -----"; cat "$1"' _ {} \; \
            2>/dev/null || true

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status \
            2>&1 || true

      # =========================================================
      # 17. Keep Runner Alive
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=================================================="
          echo "RDP SERVER IS RUNNING"
          echo "=================================================="

          TAILSCALE_IP=$(cat /tmp/tailscale_ip)

          echo
          echo "RDP ADDRESS:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "RDP USER:"
          echo "${{ secrets.MACOS_USERNAME }}"

          echo
          echo "=================================================="

          END=$((SECONDS + 20400))

          while [ "$SECONDS" -lt "$END" ]; do

            echo
            echo "===== STATUS ====="

            echo "Time remaining:"
            echo "$((END - SECONDS)) seconds"

            echo
            echo "macrdp:"

            pgrep -fl macrdp || true

            echo
            echo "Port:"

            lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true

            echo
            echo "Tailscale:"

            sudo tailscale status \
              2>/dev/null || true

            sleep 60

          done

      # =========================================================
      # 18. Cleanup
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== CLEANUP ====="

          if [ -f /tmp/macrdp.pid ]; then
            MACRDP_PID=$(cat /tmp/macrdp.pid)

            echo "Stopping macrdp PID: $MACRDP_PID"

            kill "$MACRDP_PID" 2>/dev/null || true
          fi

          pkill -f macrdp || true

          echo
          echo "Stopping Tailscale..."

          sudo tailscale down 2>/dev/null || true

          echo
          echo "Cleanup complete."
