name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFO
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          sw_vers

          echo
          echo "Current user:"
          whoami

          echo
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo
          echo "Architecture:"
          arch

          echo
          echo "=================================================="


      # =========================================================
      # 2. CREATE / VERIFY MACOS USER
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING / VERIFYING MACOS USER"
          echo "=================================================="

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then

            echo "User already exists:"
            id "$MACOS_USERNAME"

          else

            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."

          fi

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo
          echo "Home:"
          dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

          echo
          echo "=================================================="


      # =========================================================
      # 3. MAKE USER ADMIN
      # =========================================================
      - name: Make User Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "ADDING USER TO ADMIN GROUP"
          echo "=================================================="

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "Admin membership:"

          dseditgroup \
            -o checkmember \
            -m "$MACOS_USERNAME" \
            admin || true

          echo
          echo "=================================================="


      # =========================================================
      # 4. AUTO LOGIN
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "CONFIGURING AUTO LOGIN"
          echo "=================================================="

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "Auto login configured for:"
          echo "$MACOS_USERNAME"

          echo
          echo "=================================================="


      # =========================================================
      # 5. INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING TAILSCALE"
          echo "=================================================="

          if [ -d "/Applications/Tailscale.app" ]; then

            echo "Tailscale.app already exists."

          else

            echo "Downloading latest stable Tailscale..."

            TAILSCALE_PKG="/tmp/Tailscale-macos.pkg"

            rm -f "$TAILSCALE_PKG"

            curl -fL \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              "https://pkgs.tailscale.com/stable/Tailscale-latest-macos.pkg" \
              -o "$TAILSCALE_PKG"

            echo
            echo "Package downloaded:"
            ls -lh "$TAILSCALE_PKG"

            echo
            echo "Installing Tailscale..."

            sudo installer \
              -pkg "$TAILSCALE_PKG" \
              -target /

          fi

          echo
          echo "Installation completed."

          echo
          echo "=================================================="


      # =========================================================
      # 6. DISCOVER TAILSCALE FILES
      # =========================================================
      - name: Discover Tailscale Installation
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "DISCOVERING TAILSCALE INSTALLATION"
          echo "=================================================="

          echo
          echo "Applications:"
          ls -lah /Applications/Tailscale.app \
            2>/dev/null || true

          echo
          echo "Contents:"
          find \
            /Applications/Tailscale.app/Contents \
            -maxdepth 5 \
            -type f \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "Executable files:"

          find \
            /Applications/Tailscale.app \
            -type f \
            -perm -111 \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "tailscale files on system:"

          find \
            /usr/local \
            /usr/bin \
            /opt \
            /Applications \
            -name "tailscale" \
            -o \
            -name "tailscaled" \
            2>/dev/null \
            | sort \
            || true

          echo
          echo "PATH lookup:"

          which tailscale \
            2>/dev/null || true

          which tailscaled \
            2>/dev/null || true

          echo
          echo "LaunchDaemons containing tailscale:"

          ls -lah \
            /Library/LaunchDaemons \
            2>/dev/null \
            | grep -i tailscale \
            || true

          echo
          echo "LaunchAgents containing tailscale:"

          ls -lah \
            /Library/LaunchAgents \
            2>/dev/null \
            | grep -i tailscale \
            || true

          echo
          echo "=================================================="


      # =========================================================
      # 7. FIND TAILSCALED
      # =========================================================
      - name: Find Tailscale Daemon
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "FINDING TAILSCALED"
          echo "=================================================="

          TAILSCALED=""

          CANDIDATES=(

            "/usr/local/bin/tailscaled"

            "/usr/local/sbin/tailscaled"

            "/opt/homebrew/bin/tailscaled"

            "/opt/homebrew/sbin/tailscaled"

            "/Applications/Tailscale.app/Contents/MacOS/tailscaled"

            "/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          )

          for CANDIDATE in "${CANDIDATES[@]}"; do

            if [ -x "$CANDIDATE" ]; then

              echo
              echo "FOUND:"
              echo "$CANDIDATE"

              TAILSCALED="$CANDIDATE"

              break

            fi

          done

          if [ -z "$TAILSCALED" ]; then

            echo
            echo "tailscaled was not found in standard locations."

            echo
            echo "Searching entire filesystem."

            FOUND=$(sudo find \
              / \
              -type f \
              -name "tailscaled" \
              -perm -111 \
              2>/dev/null \
              | head -20)

            echo
            echo "$FOUND"

            if [ -n "$FOUND" ]; then

              TAILSCALED=$(echo "$FOUND" | head -1)

              echo
              echo "Using discovered daemon:"
              echo "$TAILSCALED"

            fi

          fi

          if [ -z "$TAILSCALED" ]; then

            echo
            echo "=================================================="
            echo "NO TAILSCALED FOUND"
            echo "=================================================="

            echo
            echo "Installed Tailscale package information:"

            pkgutil --pkgs \
              | grep -i tailscale \
              || true

            echo
            echo "Tailscale app information:"

            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "/Applications/Tailscale.app/Contents/Info.plist" \
              2>/dev/null \
              || true

            echo
            echo "=================================================="

            exit 1

          fi

          echo
          echo "tailscaled path:"
          echo "$TAILSCALED"

          echo
          echo "File:"
          file "$TAILSCALED"

          echo
          echo "=================================================="


      # =========================================================
      # 8. TAILSCALE CLI
      # =========================================================
      - name: Locate Tailscale CLI
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "LOCATING TAILSCALE CLI"
          echo "=================================================="

          if [ -x "/usr/local/bin/tailscale" ]; then

            TAILSCALE_BIN="/usr/local/bin/tailscale"

          elif [ -x "/Applications/Tailscale.app/Contents/MacOS/Tailscale" ]; then

            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          else

            echo "ERROR: tailscale CLI not found."

            exit 1

          fi

          echo
          echo "Tailscale CLI:"
          echo "$TAILSCALE_BIN"

          echo
          echo "File:"
          file "$TAILSCALE_BIN"

          echo
          echo "=================================================="


      # =========================================================
      # 9. START TAILSCALE
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          echo "=================================================="
          echo "STARTING TAILSCALE"
          echo "=================================================="

          TAILSCALE_BIN="/usr/local/bin/tailscale"

          if [ ! -x "$TAILSCALE_BIN" ]; then
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "CLI:"
          echo "$TAILSCALE_BIN"

          echo
          echo "Checking existing Tailscale processes:"

          ps aux | grep -i '[t]ailscale' || true

          echo
          echo "Checking Tailscale LaunchDaemons:"

          sudo launchctl list \
            | grep -i tailscale \
            || true

          echo
          echo "Attempting authentication."

          rm -f /tmp/tailscale-up.stdout
          rm -f /tmp/tailscale-up.stderr

          (
            sudo "$TAILSCALE_BIN" \
              up \
              --authkey="$TAILSCALE_AUTH_KEY" \
              --hostname="github-macos-rdp"
          ) \
            > /tmp/tailscale-up.stdout \
            2> /tmp/tailscale-up.stderr &

          PID=$!

          echo
          echo "tailscale PID:"
          echo "$PID"

          for i in {1..60}; do

            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi

            echo "Waiting... $i/60"

            sleep 1

          done

          if kill -0 "$PID" 2>/dev/null; then

            echo
            echo "ERROR: Tailscale is still running after 60 seconds."

            kill "$PID" 2>/dev/null || true

            sleep 2

            kill -9 "$PID" 2>/dev/null || true

          fi

          wait "$PID" 2>/dev/null

          EXIT_CODE=$?

          echo
          echo "Exit code:"
          echo "$EXIT_CODE"

          echo
          echo "=================================================="
          echo "TAILSCALE STDOUT"
          echo "=================================================="

          cat /tmp/tailscale-up.stdout \
            2>/dev/null || true

          echo
          echo "=================================================="
          echo "TAILSCALE STDERR"
          echo "=================================================="

          cat /tmp/tailscale-up.stderr \
            2>/dev/null || true

          echo
          echo "=================================================="

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo
            echo "Tailscale did not start successfully."

            echo
            echo "Current processes:"

            ps aux | grep -i '[t]ailscale' || true

            echo
            echo "Launch services:"

            sudo launchctl list \
              | grep -i tailscale \
              || true

            exit "$EXIT_CODE"

          fi

          echo
          echo "Tailscale authentication completed."


      # =========================================================
      # 10. VERIFY TAILSCALE
      # =========================================================
      - name: Verify Tailscale
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "VERIFYING TAILSCALE"
          echo "=================================================="

          TAILSCALE_BIN="/usr/local/bin/tailscale"

          if [ ! -x "$TAILSCALE_BIN" ]; then
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "Status:"

          "$TAILSCALE_BIN" status \
            2>&1 || true

          echo
          echo "IPv4:"

          "$TAILSCALE_BIN" ip -4 \
            2>&1 || true

          echo
          echo "Processes:"

          ps aux | grep -i '[t]ailscale' || true

          echo
          echo "=================================================="


      # =========================================================
      # 11. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING RUST"
          echo "=================================================="

          if ! command -v cargo >/dev/null 2>&1; then

            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf \
              https://sh.rustup.rs \
              | sh -s -- -y

          fi

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

          echo
          echo "=================================================="


      # =========================================================
      # 12. CLONE MACRDP
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLONING MACRDP"
          echo "=================================================="

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "=================================================="


      # =========================================================
      # 13. BUILD MACRDP
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILDING MACRDP"
          echo "=================================================="

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          cargo build --release

          echo
          echo "Build completed."

          ls -lh target/release/

          echo
          echo "=================================================="


      # =========================================================
      # 14. INSTALL MACRDP
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING MACRDP"
          echo "=================================================="

          sudo cp \
            "$HOME/macrdp/target/release/macrdp" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "macrdp installed."

          echo
          echo "=================================================="


      # =========================================================
      # 15. PREPARE MACRDP
      # =========================================================
      - name: Prepare macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          TARGET_HOME=$(dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            | awk '{print $2}')

          sudo mkdir -p \
            "$TARGET_HOME/Library/Logs/macrdp"

          sudo mkdir -p \
            "$TARGET_HOME/Library/LaunchAgents"

          sudo chown -R \
            "$MACOS_USERNAME":staff \
            "$TARGET_HOME/Library/Logs/macrdp"

          sudo chown -R \
            "$MACOS_USERNAME":staff \
            "$TARGET_HOME/Library/LaunchAgents"

          echo
          echo "macrdp directories ready."


      # =========================================================
      # 16. CREATE MACRDP LAUNCHAGENT
      # =========================================================
      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING MACRDP LAUNCHAGENT"
          echo "=================================================="

          TARGET_HOME=$(dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            | awk '{print $2}')

          TMP_PLIST="/tmp/com.macrdp.server.plist"

          rm -f "$TMP_PLIST"

          cat > "$TMP_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>Label</key>
              <string>com.macrdp.server</string>

              <key>ProgramArguments</key>

              <array>

                  <string>/usr/local/bin/macrdp</string>

                  <string>--bind</string>
                  <string>0.0.0.0:3390</string>

                  <string>--username</string>
                  <string>$MACOS_USERNAME</string>

                  <string>--password</string>
                  <string>$MACOS_PASSWORD</string>

                  <string>--virtual-display</string>

                  <string>--enable-h264</string>

                  <string>--fps</string>
                  <string>60</string>

                  <string>--bitrate</string>
                  <string>8</string>

                  <string>--keyframe-interval</string>
                  <string>2</string>

                  <string>--flush-frames</string>
                  <string>4</string>

                  <string>--log-dir</string>
                  <string>$TARGET_HOME/Library/Logs/macrdp</string>

                  <string>--verbose</string>

              </array>

              <key>WorkingDirectory</key>
              <string>$TARGET_HOME</string>

              <key>EnvironmentVariables</key>

              <dict>

                  <key>HOME</key>
                  <string>$TARGET_HOME</string>

                  <key>USER</key>
                  <string>$MACOS_USERNAME</string>

                  <key>LOGNAME</key>
                  <string>$MACOS_USERNAME</string>

                  <key>PATH</key>
                  <string>/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>

              </dict>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <false/>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>StandardOutPath</key>
              <string>$TARGET_HOME/Library/Logs/macrdp/stdout.log</string>

              <key>StandardErrorPath</key>
              <string>$TARGET_HOME/Library/Logs/macrdp/stderr.log</string>

          </dict>

          </plist>
          EOF

          sudo cp \
            "$TMP_PLIST" \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chown \
            "$MACOS_USERNAME":staff \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          chmod 644 \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          plutil -lint \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "LaunchAgent created."


      # =========================================================
      # 17. START MACRDP
      # =========================================================
      - name: Start macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "STARTING MACRDP"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          TARGET_HOME=$(dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            | awk '{print $2}')

          sudo -u "$MACOS_USERNAME" \
            launchctl bootout \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>/dev/null || true

          sleep 2

          sudo -u "$MACOS_USERNAME" \
            launchctl bootstrap \
            "gui/$TARGET_UID" \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          BOOTSTRAP=$?

          echo
          echo "Bootstrap:"
          echo "$BOOTSTRAP"

          if [ "$BOOTSTRAP" -ne 0 ]; then
            exit "$BOOTSTRAP"
          fi

          sudo -u "$MACOS_USERNAME" \
            launchctl kickstart \
            -k \
            "gui/$TARGET_UID/com.macrdp.server" \
            || true

          sleep 10

          echo
          echo "=================================================="
          echo "MACRDP PROCESS"
          echo "=================================================="

          ps aux | grep '[m]acrdp' || true

          echo
          echo "=================================================="
          echo "PORT 3390"
          echo "=================================================="

          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            || true

          echo
          echo "=================================================="
          echo "SERVICE"
          echo "=================================================="

          sudo -u "$MACOS_USERNAME" \
            launchctl print \
            "gui/$TARGET_UID/com.macrdp.server" \
            || true

          echo
          echo "=================================================="
          echo "MACRDP LOGS"
          echo "=================================================="

          for LOG in \
            "$TARGET_HOME/Library/Logs/macrdp/stdout.log" \
            "$TARGET_HOME/Library/Logs/macrdp/stderr.log" \
            "$TARGET_HOME/Library/Logs/macrdp/macrdp.log"
          do

            echo
            echo "--------------------------------------------------"
            echo "$LOG"
            echo "--------------------------------------------------"

            if [ -f "$LOG" ]; then
              tail -n 300 "$LOG"
            else
              echo "Log does not exist."
            fi

          done


      # =========================================================
      # 18. CONNECTION INFORMATION
      # =========================================================
      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CONNECTION INFORMATION"
          echo "=================================================="

          TAILSCALE_BIN="/usr/local/bin/tailscale"

          if [ ! -x "$TAILSCALE_BIN" ]; then
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "Tailscale IP:"

          "$TAILSCALE_BIN" \
            ip -4 \
            2>/dev/null || true

          echo
          echo "RDP Port:"
          echo "3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "=================================================="


      # =========================================================
      # 19. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=================================================="
          echo "KEEPING RUNNER ALIVE"
          echo "=================================================="

          DURATION=20400

          END=$(( $(date +%s) + DURATION ))

          while [ "$(date +%s)" -lt "$END" ]; do

            echo
            echo "=================================================="
            echo "TIME: $(date)"
            echo "CONSOLE USER: $(stat -f "%Su" /dev/console)"
            echo "=================================================="

            echo
            echo "Tailscale:"

            timeout 10 \
              /usr/local/bin/tailscale \
              status \
              2>&1 || true

            echo
            echo "macrdp:"

            ps aux | grep '[m]acrdp' \
              || echo "macrdp not running"

            echo
            echo "Port 3390:"

            lsof -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              || echo "3390 not listening"

            sleep 60

          done


      # =========================================================
      # 20. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          pkill -f '/usr/local/bin/macrdp' \
            2>/dev/null || true

          pkill -f tailscaled \
            2>/dev/null || true

          TARGET_UID=$(id -u "$MACOS_USERNAME" 2>/dev/null || true)

          if [ -n "$TARGET_UID" ]; then

            sudo -u "$MACOS_USERNAME" \
              launchctl bootout \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

          fi

          echo
          echo "Cleanup complete."


      # =========================================================
      # 21. FINAL
      # =========================================================
      - name: Final
        if: always()
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "WORKFLOW FINISHED"
          echo "=================================================="
