name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFO
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          sw_vers

          echo
          echo "Current user:"
          whoami

          echo
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo
          echo "Architecture:"
          arch

          echo
          echo "=================================================="


      # =========================================================
      # 2. CREATE / VERIFY MACOS USER
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING / VERIFYING MACOS USER"
          echo "=================================================="

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists:"
            id "$MACOS_USERNAME"
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo
          echo "Home:"
          dscl . -read "/Users/$MACOS_USERNAME" NFSHomeDirectory

          echo
          echo "=================================================="


      # =========================================================
      # 3. MAKE USER ADMIN
      # =========================================================
      - name: Make User Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "ADDING USER TO ADMIN GROUP"
          echo "=================================================="

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "Admin membership:"
          dseditgroup \
            -o checkmember \
            -m "$MACOS_USERNAME" \
            admin || true

          echo
          echo "=================================================="


      # =========================================================
      # 4. CONFIGURE AUTO LOGIN
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "CONFIGURING AUTO LOGIN"
          echo "=================================================="

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "Auto login configured for:"
          echo "$MACOS_USERNAME"

          echo
          echo "=================================================="


      # =========================================================
      # 5. INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING TAILSCALE"
          echo "=================================================="

          if [ -d "/Applications/Tailscale.app" ]; then

            echo "Tailscale.app already exists."

          else

            echo "Downloading latest stable Tailscale macOS package..."

            TAILSCALE_PKG="/tmp/Tailscale-macos.pkg"

            rm -f "$TAILSCALE_PKG"

            curl -fL \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              "https://pkgs.tailscale.com/stable/Tailscale-latest-macos.pkg" \
              -o "$TAILSCALE_PKG"

            echo
            echo "Downloaded package:"
            ls -lh "$TAILSCALE_PKG"

            echo
            echo "Installing Tailscale..."

            sudo installer \
              -pkg "$TAILSCALE_PKG" \
              -target /

            echo
            echo "Tailscale installation completed."

          fi

          echo
          echo "Checking Tailscale application..."

          if [ -d "/Applications/Tailscale.app" ]; then
            echo "Tailscale.app FOUND."
          else
            echo "ERROR: Tailscale.app was not installed."
            exit 1
          fi

          echo
          echo "Checking CLI path..."

          if [ -x "/usr/local/bin/tailscale" ]; then
            echo "/usr/local/bin/tailscale exists."
            ls -l /usr/local/bin/tailscale
          else
            echo "/usr/local/bin/tailscale does not exist yet."
          fi

          echo
          echo "=================================================="


      # =========================================================
      # 6. START TAILSCALE APP
      # =========================================================
      - name: Start Tailscale App
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "STARTING TAILSCALE APP"
          echo "=================================================="

          echo "Launching Tailscale.app..."

          open -a "Tailscale"

          echo
          echo "Waiting for Tailscale..."

          sleep 10

          echo
          echo "Tailscale processes:"

          ps aux | grep -i '[T]ailscale' || true

          echo
          echo "Tailscale application processes:"

          pgrep -alf "Tailscale" || true

          echo
          echo "=================================================="


      # =========================================================
      # 7. LOCATE TAILSCALE CLI
      # =========================================================
      - name: Locate Tailscale CLI
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "LOCATING TAILSCALE CLI"
          echo "=================================================="

          if [ -x "/usr/local/bin/tailscale" ]; then

            TAILSCALE_BIN="/usr/local/bin/tailscale"

          elif [ -x "/Applications/Tailscale.app/Contents/MacOS/Tailscale" ]; then

            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          else

            echo "ERROR: Tailscale CLI not found."

            echo
            echo "Searching filesystem..."

            find /Applications/Tailscale.app \
              -type f \
              -perm -111 \
              2>/dev/null | head -50 || true

            exit 1

          fi

          echo
          echo "Tailscale CLI:"
          echo "$TAILSCALE_BIN"

          echo
          echo "File information:"
          file "$TAILSCALE_BIN"

          echo
          echo "Permissions:"
          ls -l "$TAILSCALE_BIN"

          echo
          echo "=================================================="


      # =========================================================
      # 8. TEST TAILSCALE CLI WITHOUT HANGING
      # =========================================================
      - name: Test Tailscale CLI
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "TESTING TAILSCALE CLI"
          echo "=================================================="

          if [ -x "/usr/local/bin/tailscale" ]; then
            TAILSCALE_BIN="/usr/local/bin/tailscale"
          else
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "Testing:"
          echo "$TAILSCALE_BIN version"

          echo
          echo "Version command timeout: 10 seconds"

          timeout 10 "$TAILSCALE_BIN" version

          VERSION_EXIT=$?

          echo
          echo "Version exit code:"
          echo "$VERSION_EXIT"

          if [ "$VERSION_EXIT" -ne 0 ]; then
            echo
            echo "WARNING: tailscale version did not complete normally."
            echo "Continuing because this command is not required for authentication."
          else
            echo
            echo "Tailscale CLI is responding."
          fi

          echo
          echo "=================================================="


      # =========================================================
      # 9. AUTHENTICATE TAILSCALE
      # =========================================================
      - name: Authenticate Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          echo "=================================================="
          echo "AUTHENTICATING TAILSCALE"
          echo "=================================================="

          if [ -x "/usr/local/bin/tailscale" ]; then
            TAILSCALE_BIN="/usr/local/bin/tailscale"
          else
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "Using:"
          echo "$TAILSCALE_BIN"

          echo
          echo "Running tailscale up..."

          sudo "$TAILSCALE_BIN" up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp" \
            --timeout=60s

          echo
          echo "Tailscale authentication command completed."

          echo
          echo "=================================================="


      # =========================================================
      # 10. WAIT FOR TAILSCALE NETWORK
      # =========================================================
      - name: Wait for Tailscale Network
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "WAITING FOR TAILSCALE NETWORK"
          echo "=================================================="

          if [ -x "/usr/local/bin/tailscale" ]; then
            TAILSCALE_BIN="/usr/local/bin/tailscale"
          else
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "Waiting for Tailscale interface..."

          sudo "$TAILSCALE_BIN" wait \
            --timeout=60s

          echo
          echo "Tailscale network is ready."

          echo
          echo "Tailscale IP:"

          "$TAILSCALE_BIN" ip -4

          echo
          echo "=================================================="


      # =========================================================
      # 11. TAILSCALE STATUS
      # =========================================================
      - name: Tailscale Status
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "TAILSCALE STATUS"
          echo "=================================================="

          if [ -x "/usr/local/bin/tailscale" ]; then
            TAILSCALE_BIN="/usr/local/bin/tailscale"
          else
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "IP:"
          "$TAILSCALE_BIN" ip -4 || true

          echo
          echo "Status:"
          "$TAILSCALE_BIN" status || true

          echo
          echo "=================================================="


      # =========================================================
      # 12. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING RUST"
          echo "=================================================="

          if ! command -v cargo >/dev/null 2>&1; then

            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf \
              https://sh.rustup.rs \
              | sh -s -- -y

          fi

          source "$HOME/.cargo/env"

          echo
          rustc --version

          echo
          cargo --version

          echo
          echo "=================================================="


      # =========================================================
      # 13. CLONE MACRDP
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLONING MACRDP"
          echo "=================================================="

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "=================================================="


      # =========================================================
      # 14. BUILD MACRDP
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILDING MACRDP"
          echo "=================================================="

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          cargo build --release

          echo
          echo "Build completed."

          ls -lh target/release/

          echo
          echo "=================================================="


      # =========================================================
      # 15. INSTALL MACRDP
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING MACRDP"
          echo "=================================================="

          sudo cp \
            "$HOME/macrdp/target/release/macrdp" \
            /usr/local/bin/macrdp

          sudo chmod +x /usr/local/bin/macrdp

          echo
          echo "macrdp installed."

          echo
          echo "=================================================="


      # =========================================================
      # 16. OPEN MACOS PERMISSIONS
      # =========================================================
      - name: Open macOS Permissions
        shell: bash
        run: |
          echo "=================================================="
          echo "OPENING MACOS PERMISSIONS"
          echo "=================================================="

          open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture" \
            || true

          open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility" \
            || true

          echo
          echo "Permission settings opened."

          echo
          echo "=================================================="


      # =========================================================
      # 17. PREPARE MACRDP DIRECTORIES
      # =========================================================
      - name: Prepare macrdp Logs
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "PREPARING MACRDP DIRECTORIES"
          echo "=================================================="

          TARGET_HOME=$(dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            | awk '{print $2}')

          sudo mkdir -p \
            "$TARGET_HOME/Library/Logs/macrdp"

          sudo mkdir -p \
            "$TARGET_HOME/Library/LaunchAgents"

          sudo chown -R \
            "$MACOS_USERNAME":staff \
            "$TARGET_HOME/Library/Logs/macrdp"

          sudo chown -R \
            "$MACOS_USERNAME":staff \
            "$TARGET_HOME/Library/LaunchAgents"

          echo
          echo "Directories ready."

          echo
          echo "=================================================="


      # =========================================================
      # 18. CREATE MACRDP LAUNCHAGENT
      # =========================================================
      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING MACRDP LAUNCHAGENT"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          TARGET_HOME=$(dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            | awk '{print $2}')

          TMP_PLIST="/tmp/com.macrdp.server.plist"

          rm -f "$TMP_PLIST"

          cat > "$TMP_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>Label</key>
              <string>com.macrdp.server</string>

              <key>ProgramArguments</key>

              <array>

                  <string>/usr/local/bin/macrdp</string>

                  <string>--bind</string>
                  <string>0.0.0.0:3390</string>

                  <string>--username</string>
                  <string>$MACOS_USERNAME</string>

                  <string>--password</string>
                  <string>$MACOS_PASSWORD</string>

                  <string>--virtual-display</string>

                  <string>--enable-h264</string>

                  <string>--fps</string>
                  <string>60</string>

                  <string>--bitrate</string>
                  <string>8</string>

                  <string>--keyframe-interval</string>
                  <string>2</string>

                  <string>--flush-frames</string>
                  <string>4</string>

                  <string>--log-dir</string>
                  <string>$TARGET_HOME/Library/Logs/macrdp</string>

                  <string>--verbose</string>

              </array>

              <key>WorkingDirectory</key>
              <string>$TARGET_HOME</string>

              <key>EnvironmentVariables</key>

              <dict>

                  <key>HOME</key>
                  <string>$TARGET_HOME</string>

                  <key>USER</key>
                  <string>$MACOS_USERNAME</string>

                  <key>LOGNAME</key>
                  <string>$MACOS_USERNAME</string>

                  <key>PATH</key>
                  <string>/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>

              </dict>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <false/>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>StandardOutPath</key>
              <string>$TARGET_HOME/Library/Logs/macrdp/stdout.log</string>

              <key>StandardErrorPath</key>
              <string>$TARGET_HOME/Library/Logs/macrdp/stderr.log</string>

          </dict>

          </plist>
          EOF

          sudo cp \
            "$TMP_PLIST" \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chown \
            "$MACOS_USERNAME":staff \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          chmod 644 \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "Validating plist..."

          plutil -lint \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "LaunchAgent created."

          echo
          echo "=================================================="


      # =========================================================
      # 19. TEST MACRDP DIRECTLY
      # =========================================================
      - name: Test macrdp Directly
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          echo "=================================================="
          echo "DIRECT MACRDP TEST"
          echo "=================================================="

          TARGET_HOME=$(dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            | awk '{print $2}')

          mkdir -p /tmp/macrdp-debug

          rm -f /tmp/macrdp-debug/*

          echo
          echo "Starting macrdp..."

          sudo -u "$MACOS_USERNAME" \
            env \
              HOME="$TARGET_HOME" \
              USER="$MACOS_USERNAME" \
              LOGNAME="$MACOS_USERNAME" \
              PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            /usr/local/bin/macrdp \
              --bind 127.0.0.1:3390 \
              --username "$MACOS_USERNAME" \
              --password "$MACOS_PASSWORD" \
              --virtual-display \
              --verbose \
              > /tmp/macrdp-debug/direct.stdout.log \
              2> /tmp/macrdp-debug/direct.stderr.log &

          MACRDP_PID=$!

          echo
          echo "PID:"
          echo "$MACRDP_PID"

          sleep 8

          echo
          echo "=================================================="
          echo "MACRDP PROCESS"
          echo "=================================================="

          ps aux | grep '[m]acrdp' || true

          echo
          echo "=================================================="
          echo "PORT"
          echo "=================================================="

          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            || true

          echo
          echo "=================================================="
          echo "DIRECT STDOUT"
          echo "=================================================="

          cat \
            /tmp/macrdp-debug/direct.stdout.log \
            2>/dev/null \
            || true

          echo
          echo "=================================================="
          echo "DIRECT STDERR"
          echo "=================================================="

          cat \
            /tmp/macrdp-debug/direct.stderr.log \
            2>/dev/null \
            || true

          echo
          echo "=================================================="
          echo "MACRDP INTERNAL LOGS"
          echo "=================================================="

          for LOG in \
            "$TARGET_HOME/Library/Logs/macrdp/stdout.log" \
            "$TARGET_HOME/Library/Logs/macrdp/stderr.log" \
            "$TARGET_HOME/Library/Logs/macrdp/macrdp.log"
          do

            echo
            echo "--------------------------------------------------"
            echo "$LOG"
            echo "--------------------------------------------------"

            if [ -f "$LOG" ]; then
              tail -n 300 "$LOG"
            else
              echo "Log does not exist."
            fi

          done

          echo
          echo "=================================================="
          echo "STOPPING TEST PROCESS"
          echo "=================================================="

          kill "$MACRDP_PID" 2>/dev/null || true

          pkill -f '/usr/local/bin/macrdp' 2>/dev/null || true

          sleep 2


      # =========================================================
      # 20. START MACRDP LAUNCHAGENT
      # =========================================================
      - name: Start macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "STARTING MACRDP LAUNCHAGENT"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          TARGET_HOME=$(dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            | awk '{print $2}')

          echo
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo
          echo "Target user:"
          echo "$MACOS_USERNAME"

          echo
          echo "UID:"
          echo "$TARGET_UID"

          echo
          echo "Booting LaunchAgent..."

          sudo -u "$MACOS_USERNAME" \
            launchctl bootout \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>/dev/null || true

          sleep 2

          sudo -u "$MACOS_USERNAME" \
            launchctl bootstrap \
            "gui/$TARGET_UID" \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "Bootstrap result: $?"

          sudo -u "$MACOS_USERNAME" \
            launchctl kickstart \
            -k \
            "gui/$TARGET_UID/com.macrdp.server" \
            || true

          echo
          echo "Waiting..."

          sleep 10

          echo
          echo "=================================================="
          echo "PROCESS"
          echo "=================================================="

          ps aux | grep '[m]acrdp' || true

          echo
          echo "=================================================="
          echo "PORT"
          echo "=================================================="

          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            || true

          echo
          echo "=================================================="
          echo "SERVICE"
          echo "=================================================="

          sudo -u "$MACOS_USERNAME" \
            launchctl print \
            "gui/$TARGET_UID/com.macrdp.server" \
            || true

          echo
          echo "=================================================="


      # =========================================================
      # 21. CONNECTION INFORMATION
      # =========================================================
      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CONNECTION INFORMATION"
          echo "=================================================="

          if [ -x "/usr/local/bin/tailscale" ]; then
            TAILSCALE_BIN="/usr/local/bin/tailscale"
          else
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "Tailscale IP:"
          "$TAILSCALE_BIN" ip -4 || true

          echo
          echo "RDP Port:"
          echo "3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "RDP Address:"

          IP=$("$TAILSCALE_BIN" ip -4 2>/dev/null)

          echo "$IP:3390"

          echo
          echo "=================================================="


      # =========================================================
      # 22. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=================================================="
          echo "KEEPING RUNNER ALIVE"
          echo "=================================================="

          DURATION=20400

          END=$(( $(date +%s) + DURATION ))

          while [ "$(date +%s)" -lt "$END" ]; do

            echo
            echo "=================================================="
            echo "TIME: $(date)"
            echo "CONSOLE USER: $(stat -f "%Su" /dev/console)"
            echo "=================================================="

            echo
            echo "macrdp:"
            ps aux | grep '[m]acrdp' || \
              echo "macrdp not running"

            echo
            echo "Port 3390:"
            lsof -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              || echo "3390 not listening"

            sleep 60

          done

          echo
          echo "=================================================="
          echo "KEEP-ALIVE FINISHED"
          echo "=================================================="


      # =========================================================
      # 23. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          pkill -f '/usr/local/bin/macrdp' \
            2>/dev/null || true

          TARGET_UID=$(id -u "$MACOS_USERNAME" 2>/dev/null || true)

          if [ -n "$TARGET_UID" ]; then

            sudo -u "$MACOS_USERNAME" \
              launchctl bootout \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

          fi

          echo
          echo "Cleanup complete."

          echo
          echo "=================================================="


      # =========================================================
      # 24. FINAL
      # =========================================================
      - name: Final
        if: always()
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "WORKFLOW FINISHED"
          echo "=================================================="
