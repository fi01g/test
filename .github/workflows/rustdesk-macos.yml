name: macOS GUI Session Test - Abdulrahman

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          echo
          echo "===== macOS ====="
          sw_vers

          echo
          echo "===== KERNEL ====="
          uname -a

          echo
          echo "===== PROCESS USER ====="
          whoami

          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console

          echo
          echo "===== CONSOLE DEVICE ====="
          stat -f "%Sp %Su %Sg %N" /dev/console

          echo
          echo "===== LOGIN SESSIONS ====="
          who || true

          echo
          echo "===== LOGIN WINDOW ====="
          pgrep -fl loginwindow || true

          echo
          echo "===== WINDOW SERVER ====="
          pgrep -fl WindowServer || true

      # =========================================================
      # 2. CREATE TARGET USER
      # =========================================================
      - name: Create Target User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATE TARGET USER"
          echo "=================================================="

          echo
          echo "Target username:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo
            echo "User already exists."
          else
            echo
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo
            echo "User created."
          fi

          echo
          echo "===== TARGET USER ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== TARGET UID ====="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          echo "$TARGET_UID"

          echo
          echo "===== TARGET HOME ====="

          dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

      # =========================================================
      # 3. CONFIGURE ADMIN
      # =========================================================
      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "CONFIGURE ADMINISTRATOR"
          echo "=================================================="

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== USER GROUPS ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN GROUP ====="

          dscl . \
            -read /Groups/admin \
            GroupMembership

      # =========================================================
      # 4. USER RECORD DIAGNOSTICS
      # =========================================================
      - name: Target User Diagnostics
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "TARGET USER DIAGNOSTICS"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "UID:"
          echo "$TARGET_UID"

          echo
          echo "===== DSCL USER RECORD ====="

          dscl . \
            -read "/Users/$MACOS_USERNAME" \
            2>&1 || true

          echo
          echo "===== AUTHORITY ====="

          sudo dscl . \
            -read "/Users/$MACOS_USERNAME" \
            AuthenticationAuthority \
            2>&1 || true

          echo
          echo "===== NFS HOME ====="

          dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            2>&1 || true

          echo
          echo "===== USER SHELL ====="

          dscl . \
            -read "/Users/$MACOS_USERNAME" \
            UserShell \
            2>&1 || true

      # =========================================================
      # 5. AUTO LOGIN
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CONFIGURE AUTO LOGIN"
          echo "=================================================="

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "===== AUTO LOGIN VALUE ====="

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            2>&1 || true

          echo
          echo "===== LOGINWINDOW PREFERENCES ====="

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            2>&1 || true

      # =========================================================
      # 6. GUI DOMAIN BEFORE ANY ACTION
      # =========================================================
      - name: Check Target GUI Before Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "GUI DOMAIN BEFORE LOGIN"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          echo
          echo "Target UID:"
          echo "$TARGET_UID"

          echo
          echo "===== CURRENT CONSOLE ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== WHO ====="

          who || true

          echo
          echo "===== GUI DOMAIN ====="

          sudo launchctl print \
            "gui/$TARGET_UID" \
            2>&1

          GUI_EXIT=$?

          echo
          echo "GUI domain exit:"
          echo "$GUI_EXIT"

          echo
          echo "===== TARGET GUI SERVICE ====="

          sudo launchctl print \
            "gui/$TARGET_UID/com.apple.loginwindow" \
            2>&1 || true

      # =========================================================
      # 7. LOGINWINDOW DIAGNOSTICS
      # =========================================================
      - name: LoginWindow Diagnostics
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "LOGINWINDOW DIAGNOSTICS"
          echo "=================================================="

          echo
          echo "===== LOGINWINDOW PROCESS ====="

          pgrep -fl loginwindow || true

          echo
          echo "===== LOGINWINDOW PROCESS DETAILS ====="

          ps auxww | grep -i \
            "[l]oginwindow" || true

          echo
          echo "===== WINDOWSERVER PROCESS ====="

          pgrep -fl WindowServer || true

          echo
          echo "===== WINDOWSERVER DETAILS ====="

          ps auxww | grep -i \
            "[W]indowServer" || true

      # =========================================================
      # 8. CHECK USER SESSION DATABASE
      # =========================================================
      - name: Check User Sessions
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CHECK USER SESSIONS"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          echo
          echo "===== WHO ====="

          who || true

          echo
          echo "===== USERS ====="

          users || true

          echo
          echo "===== LAST ====="

          last -10 2>&1 || true

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== TARGET UID ====="

          echo "$TARGET_UID"

          echo
          echo "===== PROCESSES FOR TARGET UID ====="

          ps -axo user,pid,ppid,stat,command \
            | awk -v user="$MACOS_USERNAME" \
              '$1 == user {print}' \
            || true

      # =========================================================
      # 9. WAIT WITHOUT SWITCH USER
      # =========================================================
      - name: Wait For GUI Session
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "WAIT FOR GUI SESSION"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          END=$((SECONDS + 300))

          echo
          echo "Target username:"
          echo "$MACOS_USERNAME"

          echo
          echo "Target UID:"
          echo "$TARGET_UID"

          echo
          echo "No Switch User will be performed."
          echo "Waiting to see whether a GUI session appears."

          while [ "$SECONDS" -lt "$END" ]; do

            CURRENT_USER=$(
              stat -f "%Su" /dev/console
            )

            echo
            echo "------------------------------------------"

            echo "Time:"
            date

            echo "Console user:"
            echo "$CURRENT_USER"

            echo "GUI domain:"

            sudo launchctl print \
              "gui/$TARGET_UID" \
              >/tmp/gui-domain.txt \
              2>&1

            GUI_EXIT=$?

            echo "Exit:"
            echo "$GUI_EXIT"

            if [ "$GUI_EXIT" -eq 0 ]; then

              echo
              echo "=================================================="
              echo "TARGET GUI DOMAIN APPEARED"
              echo "=================================================="

              cat /tmp/gui-domain.txt

              exit 0

            fi

            echo
            echo "Target GUI domain does not exist yet."

            sleep 10

          done

          echo
          echo "=================================================="
          echo "TARGET GUI DOMAIN DID NOT APPEAR"
          echo "=================================================="

          echo
          echo "Final console:"
          stat -f "%Su" /dev/console

          echo
          echo "Final sessions:"
          who || true

          echo
          echo "Final GUI domain:"

          sudo launchctl print \
            "gui/$TARGET_UID" \
            2>&1 || true

          echo
          echo "Target processes:"

          ps -axo user,pid,ppid,stat,command \
            | awk -v user="$MACOS_USERNAME" \
              '$1 == user {print}' \
            || true

      # =========================================================
      # 10. FINAL DIAGNOSTIC
      # =========================================================
      - name: Final Diagnostic
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "FINAL DIAGNOSTIC"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME" 2>/dev/null)

          echo
          echo "===== macOS ====="

          sw_vers

          echo
          echo "===== PROCESS USER ====="

          whoami

          echo
          echo "===== CONSOLE USER ====="

          stat -f "%Su" /dev/console

          echo
          echo "===== WHO ====="

          who || true

          echo
          echo "===== USERS ====="

          users || true

          echo
          echo "===== TARGET UID ====="

          echo "$TARGET_UID"

          echo
          echo "===== TARGET PROCESSES ====="

          ps -axo user,pid,ppid,stat,command \
            | awk -v user="$MACOS_USERNAME" \
              '$1 == user {print}' \
            || true

          echo
          echo "===== WINDOWSERVER ====="

          pgrep -fl WindowServer || true

          echo
          echo "===== LOGINWINDOW ====="

          pgrep -fl loginwindow || true

          echo
          echo "===== TARGET GUI DOMAIN ====="

          if [ -n "$TARGET_UID" ]; then

            sudo launchctl print \
              "gui/$TARGET_UID" \
              2>&1 || true

          fi

          echo
          echo "===== LOGINWINDOW PREFERENCES ====="

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            2>&1 || true

          echo
          echo "===== TARGET USER RECORD ====="

          dscl . \
            -read "/Users/$MACOS_USERNAME" \
            2>&1 || true

      # =========================================================
      # 11. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          echo
          echo "Removing Auto Login setting..."

          sudo defaults delete \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            2>/dev/null || true

          echo
          echo "Cleanup complete."
