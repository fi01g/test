name: macOS RustDesk - Abdulrahman & Runner

on:
  workflow_dispatch:

jobs:
  rustdesk:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. macOS Information
      # =========================================================
      - name: macOS Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " macOS Runner Information"
          echo "=========================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged in users:"
          who || true


      # =========================================================
      # 2. Create Abdulrahman
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " Creating macOS User"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME secret is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD secret is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          echo ""
          echo "Target username:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo ""
          echo "Adding user to admin group..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "User information:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"


      # =========================================================
      # 3. Configure Auto Login
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " Configuring Auto Login"
          echo "=========================================="

          echo ""
          echo "Console user BEFORE:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Setting auto-login user:"
          echo "$MACOS_USERNAME"

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" || true

          echo ""
          echo "Auto-login status:"

          sudo sysadminctl -autologin status || true

          echo ""
          echo "Console user AFTER:"
          stat -f "%Su" /dev/console


      # =========================================================
      # 4. Verify Abdulrahman
      # =========================================================
      - name: Verify Abdulrahman Account
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " Verifying Abdulrahman Account"
          echo "=========================================="

          echo ""
          echo "Username:"
          sudo -u "$MACOS_USERNAME" whoami

          echo ""
          echo "UID:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Home directory:"
          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

          echo ""
          echo "Environment:"

          sudo -u "$MACOS_USERNAME" -H sh -c '
            echo "whoami=$(whoami)"
            echo "HOME=$HOME"
            echo "USER=$USER"
            echo "LOGNAME=$LOGNAME"
          '

          echo ""
          echo "Current GUI console user:"
          stat -f "%Su" /dev/console


      # =========================================================
      # 5. Test GUI Session As Abdulrahman
      # =========================================================
      - name: Test Abdulrahman GUI Session
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " Testing Abdulrahman GUI Session"
          echo "=========================================="

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Current GUI sessions:"
          who || true

          echo ""
          echo "Abdulrahman UID:"
          id -u "$MACOS_USERNAME"

          echo ""
          echo "Testing environment as Abdulrahman:"

          sudo -u "$MACOS_USERNAME" -H sh -c '
            echo "whoami=$(whoami)"
            echo "id=$(id)"
            echo "HOME=$HOME"
            echo "USER=$USER"
            echo "LOGNAME=$LOGNAME"
          '

          echo ""
          echo "Attempting to open System Settings as Abdulrahman..."

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            /usr/bin/open -a "System Settings" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Processes belonging to Abdulrahman:"

          ps aux | grep "$MACOS_USERNAME" | grep -v grep || true

          echo ""
          echo "Final console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged in users:"
          who || true


      # =========================================================
      # 6. Install RustDesk
      # =========================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Installing RustDesk"
          echo "=========================================="

          brew update

          brew install --cask rustdesk

          if [ ! -d "/Applications/RustDesk.app" ]; then
            echo "ERROR: RustDesk.app was not found."
            exit 1
          fi

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -f "$RUSTDESK" ]; then
            echo "ERROR: RustDesk executable was not found."
            exit 1
          fi

          "$RUSTDESK" --version || true


      # =========================================================
      # 7. Configure RustDesk
      # =========================================================
      - name: Configure RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " Configuring RustDesk"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD secret is empty."
            exit 1
          fi

          echo ""
          echo "Getting RustDesk ID..."

          ID=$(
            "$RUSTDESK" --get-id 2>/dev/null || true
          )

          echo "RustDesk ID: $ID"

          echo ""
          echo "Starting RustDesk server..."

          "$RUSTDESK" \
            --server \
            >/tmp/rustdesk-server.log 2>&1 &

          sleep 10

          echo ""
          echo "Setting permanent password..."

          PASSWORD_OUTPUT=$(
            sudo "$RUSTDESK" \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          )

          echo "$PASSWORD_OUTPUT"

          if echo "$PASSWORD_OUTPUT" | grep -qi "done"; then
            echo "SUCCESS: Permanent password configured."
          else
            echo "WARNING: RustDesk did not report success."
            cat /tmp/rustdesk-server.log || true
          fi

          echo ""
          echo "Restarting RustDesk..."

          pkill -f \
            "/Applications/RustDesk.app/Contents/MacOS/RustDesk" \
            || true

          sleep 5

          nohup "$RUSTDESK" \
            >/tmp/rustdesk.log 2>&1 &

          RUSTDESK_PID=$!

          sleep 10

          if kill -0 "$RUSTDESK_PID" 2>/dev/null; then
            echo "RustDesk is running."
          else
            echo "RustDesk failed to start."
            cat /tmp/rustdesk.log || true
            exit 1
          fi

          FINAL_ID=$(
            "$RUSTDESK" --get-id 2>/dev/null || true
          )

          echo ""
          echo "=========================================="
          echo " RustDesk Ready"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          echo "$FINAL_ID"

          echo ""
          echo "Password:"
          echo "CONFIGURED"


      # =========================================================
      # 8. Test RustDesk As Abdulrahman
      # =========================================================
      - name: Test RustDesk As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " Testing RustDesk As Abdulrahman"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Current RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "Starting RustDesk as:"
          echo "$MACOS_USERNAME"

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            nohup "$RUSTDESK" \
            >/tmp/rustdesk-abdulrahman.log 2>&1 &

          sleep 10

          echo ""
          echo "RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "RustDesk processes owned by Abdulrahman:"

          ps aux | grep "$MACOS_USERNAME" | grep RustDesk || true

          echo ""
          echo "RustDesk Abdulrahman log:"

          tail -50 \
            /tmp/rustdesk-abdulrahman.log \
            2>/dev/null || true

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console


      # =========================================================
      # 9. CHANGE RUNNER PASSWORD
      # =========================================================
      - name: Change Runner Password
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
          RUNNER_PASSWORD: ${{ secrets.RUNNER_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " Changing Runner Password"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$RUNNER_PASSWORD" ]; then
            echo "ERROR: RUNNER_PASSWORD is empty."
            exit 1
          fi

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Checking accounts..."

          echo "Admin account:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Target account:"
          id runner

          echo ""
          echo "Resetting runner password using"
          echo "the Abdulrahman administrator account..."

          sudo sysadminctl \
            -adminUser "$MACOS_USERNAME" \
            -adminPassword "$MACOS_PASSWORD" \
            -resetPasswordFor runner \
            -newPassword "$RUNNER_PASSWORD"

          echo ""
          echo "=========================================="
          echo " Runner Password Reset Completed"
          echo "=========================================="

          echo ""
          echo "Runner account:"
          id runner

          echo ""
          echo "The new runner password is stored"
          echo "in GitHub Secret: RUNNER_PASSWORD"


      # =========================================================
      # 10. Final Status
      # =========================================================
      - name: Final Status
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          echo "=========================================="
          echo " FINAL STATUS"
          echo "=========================================="

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged in users:"
          who || true

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Abdulrahman:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Runner:"
          id runner

          echo ""
          echo "RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "RustDesk log:"
          tail -50 /tmp/rustdesk.log \
            2>/dev/null || true


      # =========================================================
      # 11. Keep Runner Alive
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " macOS Runner is now running"
          echo "=========================================="

          echo ""
          echo "The GitHub Actions job will remain active."
          echo ""

          while true
          do
            echo ""
            echo "[$(date)] Runner alive"

            echo "Console user:"
            stat -f "%Su" /dev/console \
              2>/dev/null || echo "unknown"

            echo "Logged in users:"
            who || true

            echo "RustDesk:"
            pgrep -fl RustDesk || true

            sleep 300
          done
