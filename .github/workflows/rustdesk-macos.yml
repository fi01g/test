name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. System Information
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          echo "===== SYSTEM ====="
          sw_vers
          echo
          echo "===== CURRENT USER ====="
          whoami
          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console
          echo
          echo "===== GUI SESSIONS ====="
          who
          echo
          echo "===== MEMORY ====="
          sysctl hw.memsize
          echo
          echo "===== DISK ====="
          df -h
          echo
          echo "======================"

      # =========================================================
      # 2. Create / Verify Abdulrahman User
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "Checking user: $MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo "User ID:"
          id "$MACOS_USERNAME"

      # =========================================================
      # 3. Make User Administrator
      # =========================================================
      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "Adding $MACOS_USERNAME to admin group..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== USER GROUPS ====="
          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN GROUP ====="
          dscl . -read /Groups/admin GroupMembership

      # =========================================================
      # 4. Configure Auto Login
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          echo "Configuring automatic login..."

          sudo defaults write /Library/Preferences/com.apple.loginwindow \
            autoLoginUser "$MACOS_USERNAME"

          echo
          echo "Auto login configuration:"
          sudo defaults read /Library/Preferences/com.apple.loginwindow \
            autoLoginUser 2>/dev/null || true

          echo
          echo "NOTE:"
          echo "Auto-login affects a future GUI login."
          echo "The current GitHub runner console session may still be 'runner'."

      # =========================================================
      # 5. Install Homebrew / Tailscale
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Installing Homebrew..."

            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "PATH=$PATH"

          echo
          echo "Installing Tailscale..."

          brew install --quiet tailscale || true

          echo
          echo "Tailscale version:"
          tailscale version

      # =========================================================
      # 6. Start Tailscale
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "===== TAILSCALE ====="

          if pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled is already running."
          else
            echo "Starting tailscaled..."

            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            TAILSCALED_PID=$!

            echo "tailscaled PID: $TAILSCALED_PID"

            sleep 5
          fi

          echo
          echo "tailscaled processes:"
          pgrep -fl tailscaled || true

          echo
          echo "tailscaled log:"
          cat /tmp/tailscaled.log 2>/dev/null || true

          echo
          echo "Connecting to Tailscale..."

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status

          echo
          echo "===== TAILSCALE IP ====="

          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null | head -n 1)

          echo "TAILSCALE_IP=$TAILSCALE_IP"

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip

      # =========================================================
      # 7. Install Rust
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else
            echo "Installing Rust..."

            curl --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          echo
          rustc --version
          cargo --version

      # =========================================================
      # 8. Clone macrdp
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "===== MACRDP FILES ====="
          ls -la

      # =========================================================
      # 9. Build macrdp
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          echo "===== CARGO BUILD ====="

          cargo build --release

          echo
          echo "===== BUILD OUTPUT ====="

          find target/release \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -print

      # =========================================================
      # 10. Install macrdp
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          MACRDP_BINARY="$HOME/macrdp/target/release/macrdp"

          if [ ! -f "$MACRDP_BINARY" ]; then
            echo "ERROR: macrdp binary not found."
            exit 1
          fi

          sudo cp "$MACRDP_BINARY" /usr/local/bin/macrdp

          sudo chmod +x /usr/local/bin/macrdp

          echo
          echo "===== MACRDP VERSION / HELP ====="

          /usr/local/bin/macrdp --help

      # =========================================================
      # 11. Open macOS Permissions
      # =========================================================
      - name: Open macOS Permissions
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "Opening Screen Recording settings..."

          sudo -u "$MACOS_USERNAME" \
            open "x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture"

          sleep 3

          echo
          echo "Opening Accessibility settings..."

          sudo -u "$MACOS_USERNAME" \
            open "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility"

          sleep 3

          echo
          echo "Current console user:"
          stat -f "%Su" /dev/console

      # =========================================================
      # 12. Start macOS RDP Server
      # =========================================================
      - name: Start macOS RDP Server
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          RDP="/usr/local/bin/macrdp"

          echo "===== MACRDP START ====="

          echo
          echo "macrdp path:"
          ls -l "$RDP"

          echo
          echo "macrdp version/help:"
          "$RDP" --help | head -n 80

          echo
          echo "===== CURRENT USER ====="
          whoami

          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console

          echo
          echo "===== GUI SESSIONS ====="
          who

          echo
          echo "===== STARTING MACRDP ====="

          rm -f /tmp/macrdp.log

          rm -rf /tmp/macrdp-logs
          mkdir -p /tmp/macrdp-logs

          #
          # IMPORTANT:
          # Do NOT use:
          #   nohup
          #   sudo -u
          #
          # The previous version failed with:
          #   nohup: can't detach from console:
          #   Inappropriate ioctl for device
          #
          "$RDP" \
            --bind 0.0.0.0:3390 \
            --username "$MACOS_USERNAME" \
            --password "$MACOS_PASSWORD" \
            --enable-h264 \
            --fps 60 \
            --bitrate 8 \
            --keyframe-interval 2 \
            --flush-frames 4 \
            --log-dir "/tmp/macrdp-logs" \
            --verbose \
            > /tmp/macrdp.log 2>&1 &

          MACRDP_PID=$!

          echo "macrdp PID: $MACRDP_PID"

          echo
          echo "Waiting for macrdp..."
          sleep 10

          echo
          echo "===== MACRDP PROCESS ====="

          ps -p "$MACRDP_PID" \
            -o pid,ppid,user,%cpu,%mem,stat,command \
            2>/dev/null || true

          echo
          echo "===== ALL MACRDP PROCESSES ====="

          pgrep -fl macrdp || true

          echo
          echo "===== MACRDP LOG ====="

          cat /tmp/macrdp.log 2>/dev/null || true

          echo
          echo "===== MACRDP LOG DIRECTORY ====="

          find /tmp/macrdp-logs \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null || true

          echo
          echo "===== PORT 3390 ====="

          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null || true

          echo
          echo "===== NETSTAT ====="

          netstat -an \
            2>/dev/null \
            | grep 3390 \
            || true

          echo
          echo "===== END MACRDP START ====="

      # =========================================================
      # 13. Verify RDP Server
      # =========================================================
      - name: Verify RDP Server
        shell: bash
        run: |
          set +e

          echo "===== VERIFY MACRDP ====="

          echo
          echo "Processes:"
          pgrep -fl macrdp || true

          echo
          echo "Listening port:"
          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null || true

          echo
          echo "Testing localhost:3390..."

          nc -zv 127.0.0.1 3390

          RESULT=$?

          echo
          echo "nc result: $RESULT"

          if [ "$RESULT" -eq 0 ]; then
            echo
            echo "======================================"
            echo "RDP SERVER IS LISTENING ON PORT 3390"
            echo "======================================"
          else
            echo
            echo "======================================"
            echo "RDP SERVER IS NOT LISTENING"
            echo "======================================"
          fi

          echo
          echo "===== MACRDP LOG ====="

          cat /tmp/macrdp.log 2>/dev/null || true

          echo
          echo "===== END VERIFY ====="

          #
          # Don't fail the whole workflow here.
          # We want the logs even if macrdp failed.
          #
          exit 0

      # =========================================================
      # 14. Connection Information
      # =========================================================
      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo
          echo "======================================================"
          echo "                 RDP CONNECTION INFO"
          echo "======================================================"

          echo
          echo "Tailscale IPv4:"

          TAILSCALE_IP=$(cat /tmp/tailscale_ip 2>/dev/null)

          if [ -z "$TAILSCALE_IP" ]; then
            TAILSCALE_IP=$(tailscale ip -4 2>/dev/null | head -n 1)
          fi

          echo "$TAILSCALE_IP"

          echo
          echo "RDP Address:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "Password:"
          echo "Use the value stored in GitHub Secret MACOS_PASSWORD"

          echo
          echo "======================================================"
          echo " Microsoft Remote Desktop"
          echo "======================================================"

          echo
          echo "PC:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "User:"
          echo "$MACOS_USERNAME"

          echo
          echo "======================================================"

      # =========================================================
      # 15. Final Diagnostic Check
      # =========================================================
      - name: Final Diagnostic Check
        shell: bash
        run: |
          set +e

          echo "===== FINAL CHECK ====="

          echo
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo
          echo "Logged-in users:"
          who

          echo
          echo "macrdp:"
          pgrep -fl macrdp || true

          echo
          echo "Port 3390:"
          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null || true

          echo
          echo "Tailscale:"
          tailscale status 2>/dev/null || true

          echo
          echo "Tailscale IP:"
          tailscale ip -4 2>/dev/null || true

          echo
          echo "===== FINAL CHECK COMPLETE ====="

      # =========================================================
      # 16. Keep Runner Alive
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo
          echo "======================================================"
          echo " macOS RDP SESSION IS ACTIVE"
          echo "======================================================"
          echo
          echo "The GitHub runner will stay alive."
          echo "Connect using Microsoft Remote Desktop through Tailscale."
          echo
          echo "Duration: approximately 5 hours 40 minutes"
          echo

          sleep 20400

      # =========================================================
      # 17. Cleanup
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== CLEANUP ====="

          echo
          echo "Stopping macrdp..."

          pkill -f macrdp || true

          echo
          echo "Stopping Tailscale..."

          sudo tailscale down || true

          echo
          echo "Cleanup complete."

      # =========================================================
      # 18. Final
      # =========================================================
      - name: Final
        if: always()
        shell: bash
        run: |
          echo
          echo "======================================================"
          echo " Workflow finished"
          echo "======================================================"
