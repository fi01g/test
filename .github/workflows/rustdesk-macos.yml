name: macOS RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true


      # =========================================================
      # 2. CREATE ABDULRAHMAN
      # =========================================================
      - name: Create Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CREATING ABDULRAHMAN"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          echo ""
          echo "Username:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo ""
            echo "User already exists."
          else
            echo ""
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo ""
          echo "Adding Administrator privileges..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "User ID:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"


      # =========================================================
      # 3. VERIFY PASSWORD + ADMIN
      # =========================================================
      - name: Verify Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING ABDULRAHMAN"
          echo "=========================================="

          echo ""
          echo "whoami:"
          sudo -u "$MACOS_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Home:"
          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

          echo ""
          echo "Checking Administrator membership..."

          ADMIN_CHECK=$(
            dseditgroup \
              -o checkmember \
              -m "$MACOS_USERNAME" \
              admin
          )

          echo "$ADMIN_CHECK"

          if echo "$ADMIN_CHECK" | grep -qi "yes"; then
            echo ""
            echo "SUCCESS: Abdulrahman is an Administrator."
          else
            echo ""
            echo "ERROR: Abdulrahman is NOT an Administrator."
            exit 1
          fi


      # =========================================================
      # 4. SET AUTO LOGIN
      # =========================================================
      - name: Configure Abdulrahman Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Target:"
          echo "$MACOS_USERNAME"

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            || true

          echo ""
          echo "Auto-login status:"

          sudo sysadminctl \
            -autologin status \
            || true

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "IMPORTANT:"
          echo "Auto-login applies to a future login."
          echo "It does not replace the current GUI session."


      # =========================================================
      # 5. INSTALL RUSTDESK
      # =========================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          brew update

          brew install --cask rustdesk

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -f "$RUSTDESK" ]; then
            echo "ERROR: RustDesk executable not found."
            exit 1
          fi

          echo ""
          echo "RustDesk version:"
          "$RUSTDESK" --version || true


      # =========================================================
      # 6. CONFIGURE RUSTDESK
      # =========================================================
      - name: Configure RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD is empty."
            exit 1
          fi

          echo ""
          echo "RustDesk ID:"

          ID=$(
            "$RUSTDESK" \
              --get-id \
              2>/dev/null || true
          )

          echo "$ID"

          echo ""
          echo "Starting RustDesk server..."

          "$RUSTDESK" \
            --server \
            >/tmp/rustdesk-server.log 2>&1 &

          sleep 10

          echo ""
          echo "Setting permanent password..."

          PASSWORD_OUTPUT=$(
            sudo "$RUSTDESK" \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          )

          echo "$PASSWORD_OUTPUT"

          if echo "$PASSWORD_OUTPUT" | grep -qi "done"; then
            echo ""
            echo "SUCCESS: RustDesk password configured."
          else
            echo ""
            echo "WARNING: RustDesk did not report Done."
            cat /tmp/rustdesk-server.log || true
          fi

          echo ""
          echo "Restarting RustDesk..."

          pkill -f \
            "/Applications/RustDesk.app/Contents/MacOS/RustDesk" \
            || true

          sleep 5

          nohup "$RUSTDESK" \
            >/tmp/rustdesk.log 2>&1 &

          sleep 10

          FINAL_ID=$(
            "$RUSTDESK" \
              --get-id \
              2>/dev/null || true
          )

          echo ""
          echo "=========================================="
          echo " RUSTDESK READY"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          echo "$FINAL_ID"

          # Save ID for Telegram step
          echo "FINAL_RUSTDESK_ID=$FINAL_ID" >> "$GITHUB_ENV"


      # =========================================================
      # 7. START RUSTDESK AS ABDULRAHMAN
      # =========================================================
      - name: Start RustDesk As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " STARTING RUSTDESK AS ABDULRAHMAN"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Starting RustDesk using:"
          echo "$MACOS_USERNAME"

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            nohup "$RUSTDESK" \
            >/tmp/rustdesk-abdulrahman.log 2>&1 &

          sleep 10

          echo ""
          echo "RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "RustDesk owned by Abdulrahman:"
          ps aux | grep "$MACOS_USERNAME" | grep RustDesk || true

          echo ""
          echo "RustDesk log:"
          tail -50 \
            /tmp/rustdesk-abdulrahman.log \
            2>/dev/null || true


      # =========================================================
      # 8. OPEN SYSTEM SETTINGS AS ABDULRAHMAN
      # =========================================================
      - name: Open System Settings As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " OPENING SYSTEM SETTINGS"
          echo "=========================================="

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            /usr/bin/open \
            -a "System Settings" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "GUI sessions:"
          who || true


      # =========================================================
      # 9. SEND RUSTDESK DATA TO TELEGRAM
      # =========================================================
      - name: Send Telegram With Copy Buttons
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " SENDING RUSTDESK DATA TO TELEGRAM"
          echo "=========================================="

          ID="$FINAL_RUSTDESK_ID"
          PASSWORD="$RUSTDESK_PASSWORD"

          if [ -z "$ID" ]; then
            echo "ERROR: RustDesk ID is empty."
            exit 1
          fi

          if [ -z "$PASSWORD" ]; then
            echo "ERROR: RustDesk password is empty."
            exit 1
          fi

          if [ -z "$BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is empty."
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID is empty."
            exit 1
          fi

          export ID
          export PASSWORD

          python3 <<'PY'
          import os
          import json
          import urllib.request

          bot_token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          rustdesk_id = os.environ["ID"]
          password = os.environ["PASSWORD"]

          keyboard = {
              "inline_keyboard": [
                  [
                      {
                          "text": "📋 نسخ ID",
                          "copy_text": {
                              "text": rustdesk_id
                          }
                      }
                  ],
                  [
                      {
                          "text": "🔑 نسخ الباسورد",
                          "copy_text": {
                              "text": password
                          }
                      }
                  ]
              ]
          }

          text = (
              "✅ macOS RustDesk جاهز\n\n"
              f"🆔 ID: {rustdesk_id}\n"
              f"🔐 Password: {password}\n\n"
              "اضغط على الزر لنسخ البيانات."
          )

          payload = {
              "chat_id": chat_id,
              "text": text,
              "reply_markup": keyboard
          }

          data = json.dumps(payload).encode("utf-8")

          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode("utf-8"))

          if not result.get("ok"):
              raise RuntimeError(result)

          message_id = result["result"]["message_id"]

          print(f"Telegram message sent: {message_id}")

          with open("/tmp/telegram_message_id.txt", "w") as f:
              f.write(str(message_id))

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"TELEGRAM_MESSAGE_ID={message_id}\n")
          PY


      # =========================================================
      # 10. FINAL CHECK
      # =========================================================
      - name: Final Check
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true

          echo ""
          echo "Current Actions user:"
          whoami

          echo ""
          echo "Abdulrahman:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Abdulrahman groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "RustDesk:"
          pgrep -fl RustDesk || true

          echo ""
          echo "Final RustDesk ID:"
          echo "$FINAL_RUSTDESK_ID"


      # =========================================================
      # 11. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RUNNER IS ONLINE"
          echo "=========================================="

          # حوالي 5 ساعات و40 دقيقة
          # ثم تبدأ خطوات النهاية وإعادة التشغيل
          END_TIME=$(( $(date +%s) + 20400 ))

          while [ "$(date +%s)" -lt "$END_TIME" ]
          do
            echo ""
            echo "[$(date)] Runner alive"

            echo "Console user:"
            stat -f "%Su" /dev/console \
              2>/dev/null || echo "unknown"

            echo "Logged users:"
            who || true

            echo "RustDesk:"
            pgrep -fl RustDesk || true

            sleep 300
          done

          echo ""
          echo "Keep Alive period finished."


      # =========================================================
      # 12. EDIT TELEGRAM MESSAGE TO EXPIRED
      # =========================================================
      - name: Edit Telegram Expired
        if: always()
        shell: bash
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          echo "=========================================="
          echo " MARKING TELEGRAM MESSAGE AS EXPIRED"
          echo "=========================================="

          MSG_ID="$TELEGRAM_MESSAGE_ID"

          if [ -z "$MSG_ID" ] && [ -f /tmp/telegram_message_id.txt ]; then
            MSG_ID=$(cat /tmp/telegram_message_id.txt)
          fi

          if [ -z "$MSG_ID" ]; then
            echo "No Telegram message ID found."
            exit 0
          fi

          python3 <<'PY'
          import os
          import json
          import urllib.request

          bot_token = os.environ["BOT_TOKEN"]
          chat_id = os.environ["CHAT_ID"]
          message_id = os.environ["MSG_ID"]

          text = (
              "❌ macOS RustDesk انتهى\n\n"
              "🆔 الـID السابق لم يعد متاحًا.\n"
              "🔄 سيتم تشغيل سيرفر macOS جديد تلقائيًا.\n\n"
              "انتظر الرسالة الجديدة."
          )

          payload = {
              "chat_id": chat_id,
              "message_id": int(message_id),
              "text": text
          }

          data = json.dumps(payload).encode("utf-8")

          url = f"https://api.telegram.org/bot{bot_token}/editMessageText"

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  print(response.read().decode("utf-8"))
          except Exception as e:
              print(f"Telegram edit warning: {e}")
          PY
        env:
          MSG_ID: ${{ env.TELEGRAM_MESSAGE_ID }}


      # =========================================================
      # 13. TRIGGER NEXT MACOS RUN
      # =========================================================
      - name: Trigger Next Run
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          echo "=========================================="
          echo " STARTING NEXT MACOS RUN"
          echo "=========================================="

          gh workflow run rustdesk-macos.yml

          echo ""
          echo "SUCCESS: Next macOS workflow triggered."


      # =========================================================
      # 14. FINAL
      # =========================================================
      - name: Restart Information
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo " MACOS CYCLE FINISHED"
          echo "=========================================="

          echo ""
          echo "The current macOS runner is ending."

          echo ""
          echo "A new run of:"
          echo "rustdesk-macos.yml"

          echo "has been requested."

          echo ""
          echo "The new run will create a new RustDesk ID"
          echo "and send a new Telegram message."
