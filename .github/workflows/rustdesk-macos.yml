name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. System Information
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          echo "===== SYSTEM ====="
          sw_vers

          echo
          echo "===== CURRENT USER ====="
          whoami

          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console

          echo
          echo "===== GUI SESSIONS ====="
          who

          echo
          echo "===== DISK ====="
          df -h

          echo
          echo "======================"

      # =========================================================
      # 2. Create / Verify macOS User
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "Checking user: $MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo
          echo "===== USER ====="
          id "$MACOS_USERNAME"

      # =========================================================
      # 3. Configure Administrator
      # =========================================================
      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "Adding $MACOS_USERNAME to admin group..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== GROUPS ====="
          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN GROUP ====="
          dscl . -read /Groups/admin GroupMembership

      # =========================================================
      # 4. Configure Auto Login
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "Configuring auto login..."

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "Auto login user:"

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser 2>/dev/null || true

      # =========================================================
      # 5. Install Tailscale
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Installing Homebrew..."

            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo
          echo "Installing Tailscale..."

          brew install --quiet tailscale || true

          echo
          echo "===== TAILSCALE VERSION ====="

          tailscale version

      # =========================================================
      # 6. Start Tailscale
      # =========================================================
      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "===== TAILSCALE ====="

          if pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled already running."
          else
            echo "Starting tailscaled..."

            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            TAILSCALED_PID=$!

            echo "tailscaled PID: $TAILSCALED_PID"

            sleep 5
          fi

          echo
          echo "===== TAILSCALED PROCESS ====="

          pgrep -fl tailscaled || true

          echo
          echo "===== TAILSCALED LOG ====="

          cat /tmp/tailscaled.log 2>/dev/null || true

          echo
          echo "===== TAILSCALE UP ====="

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status

          echo
          echo "===== TAILSCALE IPv4 ====="

          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null | head -n 1)

          echo "$TAILSCALE_IP"

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip

      # =========================================================
      # 7. Install Rust
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else
            echo "Installing Rust..."

            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          echo
          echo "Rust:"
          rustc --version

          echo
          echo "Cargo:"
          cargo --version

      # =========================================================
      # 8. Clone macrdp
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "===== MACRDP FILES ====="

          ls -la

      # =========================================================
      # 9. Build macrdp
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          echo "===== CARGO BUILD ====="

          cargo build --release

          echo
          echo "===== BUILD OUTPUT ====="

          ls -lh target/release/macrdp

      # =========================================================
      # 10. Install macrdp
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          MACRDP_BINARY="$HOME/macrdp/target/release/macrdp"

          if [ ! -f "$MACRDP_BINARY" ]; then
            echo "ERROR: macrdp binary not found."
            exit 1
          fi

          sudo cp \
            "$MACRDP_BINARY" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "===== MACRDP INSTALLED ====="

          ls -lh /usr/local/bin/macrdp

          echo
          echo "===== MACRDP HELP ====="

          /usr/local/bin/macrdp --help

      # =========================================================
      # 11. Open macOS Permission Settings
      # =========================================================
      - name: Open macOS Permission Settings
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "Opening Screen Recording settings..."

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture"

          sleep 3

          echo
          echo "Opening Accessibility settings..."

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility"

          sleep 3

          echo
          echo "Current console user:"

          stat -f "%Su" /dev/console

      # =========================================================
      # 12. Create macrdp LaunchAgent
      # =========================================================
      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "===== CREATE LAUNCHAGENT ====="

          USER_HOME=$(dscl . -read \
            /Users/"$MACOS_USERNAME" NFSHomeDirectory \
            | awk '{print $2}')

          USER_UID=$(id -u "$MACOS_USERNAME")

          AGENT_DIR="$USER_HOME/Library/LaunchAgents"

          AGENT="$AGENT_DIR/com.macrdp.server.plist"

          LOG_DIR="$USER_HOME/Library/Logs/macrdp"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "UID:"
          echo "$USER_UID"

          echo
          echo "Home:"
          echo "$USER_HOME"

          echo
          echo "Agent:"
          echo "$AGENT"

          echo
          echo "Log directory:"
          echo "$LOG_DIR"

          sudo mkdir -p "$AGENT_DIR"
          sudo mkdir -p "$LOG_DIR"

          sudo chown \
            "$MACOS_USERNAME":staff \
            "$AGENT_DIR"

          sudo chown \
            "$MACOS_USERNAME":staff \
            "$LOG_DIR"

          # -----------------------------------------------------
          # Create plist
          # -----------------------------------------------------

          cat > /tmp/com.macrdp.server.plist <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
"http://www.apple.com/DTDs/PropertyList-1.0.dtd">

<plist version="1.0">

<dict>

    <key>Label</key>
    <string>com.macrdp.server</string>


    <key>ProgramArguments</key>

    <array>

        <string>/usr/local/bin/macrdp</string>

        <string>--bind</string>
        <string>0.0.0.0:3390</string>

        <string>--username</string>
        <string>$MACOS_USERNAME</string>

        <string>--password</string>
        <string>$MACOS_PASSWORD</string>

        <string>--enable-h264</string>

        <string>--fps</string>
        <string>60</string>

        <string>--bitrate</string>
        <string>8</string>

        <string>--keyframe-interval</string>
        <string>2</string>

        <string>--flush-frames</string>
        <string>4</string>

        <string>--log-dir</string>
        <string>$LOG_DIR</string>

        <string>--verbose</string>

    </array>


    <key>WorkingDirectory</key>
    <string>$USER_HOME</string>


    <key>RunAtLoad</key>
    <true/>


    <key>KeepAlive</key>
    <true/>


    <key>ThrottleInterval</key>
    <integer>5</integer>


    <key>ProcessType</key>
    <string>Interactive</string>


    <key>LimitLoadToSessionType</key>

    <array>
        <string>Aqua</string>
    </array>


    <key>StandardOutPath</key>
    <string>$LOG_DIR/stdout.log</string>


    <key>StandardErrorPath</key>
    <string>$LOG_DIR/stderr.log</string>

</dict>

</plist>
EOF

          # -----------------------------------------------------
          # Install plist
          # -----------------------------------------------------

          sudo mv \
            /tmp/com.macrdp.server.plist \
            "$AGENT"

          sudo chown \
            "$MACOS_USERNAME":staff \
            "$AGENT"

          sudo chmod 644 "$AGENT"

          echo
          echo "===== PLIST CREATED ====="

          sudo cat "$AGENT"

          echo
          echo "===== PLIST VALIDATION ====="

          plutil -lint "$AGENT"

      # =========================================================
      # 13. Stop Any Existing macrdp
      # =========================================================
      - name: Stop Existing macrdp
        shell: bash
        run: |
          set +e

          echo "Stopping existing macrdp..."

          pkill -f "/usr/local/bin/macrdp" || true

          sleep 2

          echo
          echo "Remaining processes:"

          pgrep -fl macrdp || true

      # =========================================================
      # 14. Start macrdp Inside GUI Session
      # =========================================================
      - name: Start macrdp GUI Session
        shell: bash
        run: |
          set +e

          echo "===== START MACRDP GUI SESSION ====="

          CONSOLE_USER=$(stat -f "%Su" /dev/console)

          echo
          echo "Console user:"
          echo "$CONSOLE_USER"

          echo
          echo "GUI sessions:"
          who

          if [ -z "$CONSOLE_USER" ] || [ "$CONSOLE_USER" = "root" ]; then

            echo
            echo "No normal GUI user detected."

          else

            if id "$CONSOLE_USER" >/dev/null 2>&1; then

              CONSOLE_UID=$(id -u "$CONSOLE_USER")

              USER_HOME=$(dscl . -read \
                /Users/"$CONSOLE_USER" NFSHomeDirectory \
                | awk '{print $2}')

              AGENT="$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

              echo
              echo "Console UID:"
              echo "$CONSOLE_UID"

              echo
              echo "LaunchAgent:"
              echo "$AGENT"

              if [ -f "$AGENT" ]; then

                echo
                echo "Booting LaunchAgent..."

                sudo launchctl bootout \
                  "gui/$CONSOLE_UID/com.macrdp.server" \
                  2>/dev/null || true

                sleep 1

                sudo launchctl bootstrap \
                  "gui/$CONSOLE_UID" \
                  "$AGENT"

                echo
                echo "Enabling LaunchAgent..."

                sudo launchctl enable \
                  "gui/$CONSOLE_UID/com.macrdp.server" \
                  2>/dev/null || true

                echo
                echo "Starting LaunchAgent..."

                sudo launchctl kickstart \
                  -k \
                  "gui/$CONSOLE_UID/com.macrdp.server"

                echo
                echo "LaunchAgent started."

              else

                echo
                echo "ERROR:"
                echo "LaunchAgent does not exist."

              fi

            fi

          fi

          sleep 8

          echo
          echo "===== MACRDP PROCESSES ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null || true

          echo
          echo "===== MACRDP LOGS ====="

          find /tmp \
            -maxdepth 2 \
            -iname "*macrdp*" \
            -type f \
            -print \
            2>/dev/null || true

      # =========================================================
      # 15. Monitor GUI User / Switch User
      # =========================================================
      - name: Monitor GUI User And Restart macrdp
        shell: bash
        run: |
          set +e

          echo
          echo "======================================================"
          echo "       MACRDP GUI SESSION MONITOR"
          echo "======================================================"
          echo
          echo "Monitoring /dev/console for user changes."
          echo

          LAST_USER=""

          # -----------------------------------------------------
          # Function: Start macrdp for current GUI user
          # -----------------------------------------------------

          start_for_user() {

            TARGET_USER="$1"

            echo
            echo "=================================================="
            echo "STARTING MACRDP FOR USER"
            echo "=================================================="

            echo "User:"
            echo "$TARGET_USER"

            if ! id "$TARGET_USER" >/dev/null 2>&1; then

              echo "User does not exist."
              return

            fi

            TARGET_UID=$(id -u "$TARGET_USER")

            TARGET_HOME=$(dscl . -read \
              /Users/"$TARGET_USER" NFSHomeDirectory \
              | awk '{print $2}')

            AGENT="$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

            echo
            echo "UID:"
            echo "$TARGET_UID"

            echo
            echo "HOME:"
            echo "$TARGET_HOME"

            echo
            echo "AGENT:"
            echo "$AGENT"

            if [ ! -f "$AGENT" ]; then

              echo
              echo "LaunchAgent missing."

              return

            fi

            # -------------------------------------------------
            # Stop old macrdp
            # -------------------------------------------------

            echo
            echo "Stopping previous macrdp..."

            pkill -f "/usr/local/bin/macrdp" || true

            sleep 2

            # -------------------------------------------------
            # Stop old LaunchAgent
            # -------------------------------------------------

            sudo launchctl bootout \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

            sleep 1

            # -------------------------------------------------
            # Bootstrap into CURRENT GUI SESSION
            # -------------------------------------------------

            echo
            echo "Bootstrapping LaunchAgent..."

            sudo launchctl bootstrap \
              "gui/$TARGET_UID" \
              "$AGENT"

            BOOT_RESULT=$?

            echo
            echo "Bootstrap result:"
            echo "$BOOT_RESULT"

            # -------------------------------------------------
            # Enable
            # -------------------------------------------------

            sudo launchctl enable \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

            # -------------------------------------------------
            # Start
            # -------------------------------------------------

            echo
            echo "Kickstarting macrdp..."

            sudo launchctl kickstart \
              -k \
              "gui/$TARGET_UID/com.macrdp.server"

            KICK_RESULT=$?

            echo
            echo "Kickstart result:"
            echo "$KICK_RESULT"

            sleep 6

            # -------------------------------------------------
            # Diagnostics
            # -------------------------------------------------

            echo
            echo "===== MACRDP PROCESS ====="

            pgrep -fl macrdp || true

            echo
            echo "===== PORT 3390 ====="

            lsof -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true

            echo
            echo "===== LAUNCHCTL STATUS ====="

            sudo launchctl print \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

            echo
            echo "===== USER LOGS ====="

            find "$TARGET_HOME/Library/Logs/macrdp" \
              -type f \
              -maxdepth 2 \
              -print \
              2>/dev/null || true

          }

          # -----------------------------------------------------
          # Initial GUI User
          # -----------------------------------------------------

          CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

          echo
          echo "Initial console user:"
          echo "$CURRENT_USER"

          if [ -n "$CURRENT_USER" ] && [ "$CURRENT_USER" != "root" ]; then

            LAST_USER="$CURRENT_USER"

            start_for_user "$CURRENT_USER"

          fi

          # -----------------------------------------------------
          # Monitoring loop
          # -----------------------------------------------------

          while true; do

            CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

            if [ -z "$CURRENT_USER" ]; then
              sleep 5
              continue
            fi

            if [ "$CURRENT_USER" = "root" ]; then
              sleep 5
              continue
            fi

            # -------------------------------------------------
            # Detect Switch User
            # -------------------------------------------------

            if [ "$CURRENT_USER" != "$LAST_USER" ]; then

              echo
              echo
              echo "=================================================="
              echo "              USER SWITCH DETECTED"
              echo "=================================================="

              echo
              echo "Previous user:"
              echo "$LAST_USER"

              echo
              echo "New console user:"
              echo "$CURRENT_USER"

              echo

              LAST_USER="$CURRENT_USER"

              start_for_user "$CURRENT_USER"

            fi

            # -------------------------------------------------
            # Restart if macrdp unexpectedly died
            # -------------------------------------------------

            if ! pgrep -f "/usr/local/bin/macrdp" >/dev/null 2>&1; then

              echo
              echo "=================================================="
              echo "macrdp IS NOT RUNNING"
              echo "RESTARTING..."
              echo "=================================================="

              start_for_user "$CURRENT_USER"

            fi

            sleep 5

          done

      # =========================================================
      # 16. Connection Information
      # =========================================================
      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          TAILSCALE_IP=$(cat /tmp/tailscale_ip 2>/dev/null)

          if [ -z "$TAILSCALE_IP" ]; then
            TAILSCALE_IP=$(tailscale ip -4 2>/dev/null | head -n 1)
          fi

          echo
          echo "======================================================"
          echo "              RDP CONNECTION INFO"
          echo "======================================================"

          echo
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo
          echo "RDP Address:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "Password:"
          echo "Use GitHub Secret MACOS_PASSWORD"

          echo
          echo "======================================================"
          echo "Microsoft Remote Desktop"
          echo "======================================================"

          echo
          echo "PC:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "User:"
          echo "$MACOS_USERNAME"

          echo
          echo "======================================================"

      # =========================================================
      # 17. Final Diagnostic
      # =========================================================
      - name: Final Diagnostic
        shell: bash
        run: |
          set +e

          echo
          echo "===== FINAL DIAGNOSTIC ====="

          echo
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo
          echo "Logged users:"
          who

          echo
          echo "macrdp processes:"
          pgrep -fl macrdp || true

          echo
          echo "Port 3390:"
          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null || true

          echo
          echo "Tailscale:"
          tailscale status 2>/dev/null || true

          echo
          echo "Tailscale IP:"
          tailscale ip -4 2>/dev/null || true

          echo
          echo "===== DIAGNOSTIC COMPLETE ====="

      # =========================================================
      # 18. Keep Runner Alive
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo
          echo "======================================================"
          echo "             macOS RDP SESSION ACTIVE"
          echo "======================================================"
          echo
          echo "Tailscale is active."
          echo "macrdp is active."
          echo
          echo "GUI session monitor is active."
          echo
          echo "Switch User detection is active."
          echo
          echo "macrdp will be restarted when the console user changes."
          echo
          echo "Runner will stay alive for approximately 5h 40m."
          echo

          sleep 20400

      # =========================================================
      # 19. Cleanup
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "===== CLEANUP ====="

          # Stop macrdp

          pkill -f "/usr/local/bin/macrdp" || true

          # Find current GUI user

          CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

          if [ -n "$CURRENT_USER" ] && [ "$CURRENT_USER" != "root" ]; then

            CURRENT_UID=$(id -u "$CURRENT_USER")

            echo
            echo "Stopping LaunchAgent for:"
            echo "$CURRENT_USER"

            sudo launchctl bootout \
              "gui/$CURRENT_UID/com.macrdp.server" \
              2>/dev/null || true

          fi

          # Disconnect Tailscale

          echo
          echo "Stopping Tailscale..."

          sudo tailscale down || true

          echo
          echo "Cleanup complete."

      # =========================================================
      # 20. Final
      # =========================================================
      - name: Final
        if: always()
        shell: bash
        run: |
          echo
          echo "======================================================"
          echo "              WORKFLOW FINISHED"
          echo "======================================================"
