name: macOS RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================
      - name: System Information
        run: |
          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          sw_vers
          echo ""
          uname -a
          echo ""
          echo "Current user:"
          whoami
          echo ""
          echo "Console user:"
          scutil <<< "show State:/Users/ConsoleUser" | grep -E "Name :|UID :"
          echo ""

      # ============================================================
      # 2. CREATE ABDULRAHMAN USER
      # ============================================================
      - name: Create Abdulrahman User
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CREATING / VERIFYING USER"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ] || [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_USERNAME or MACOS_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."

          else
            echo "Creating user: $MACOS_USERNAME"

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "Abdulrahman" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo "User is an administrator."

      # ============================================================
      # 3. VERIFY USER
      # ============================================================
      - name: Verify Abdulrahman
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING USER"
          echo "=========================================="

          id "$MACOS_USERNAME"

          echo ""
          echo "Admin membership:"
          dseditgroup -o checkmember -m "$MACOS_USERNAME" admin

          echo ""
          echo "Home directory:"
          dscl . -read "/Users/$MACOS_USERNAME" NFSHomeDirectory

      # ============================================================
      # 4. CONFIGURE AUTO LOGIN
      # ============================================================
      - name: Configure Auto Login
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            2>&1 || true

          echo ""
          echo "Auto-login configuration attempted."

      # ============================================================
      # 5. INSTALL RUSTDESK
      # ============================================================
      - name: Install RustDesk
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          if [ ! -d "/Applications/RustDesk.app" ]; then
            brew install --cask rustdesk
          else
            echo "RustDesk already installed."
          fi

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -x "$RUSTDESK" ]; then
            echo "ERROR: RustDesk binary not found."
            exit 1
          fi

          echo ""
          echo "RustDesk binary:"
          ls -lh "$RUSTDESK"

          echo ""
          echo "RustDesk version:"
          "$RUSTDESK" --version || true

      # ============================================================
      # 6. INSTALL OFFICIAL RUSTDESK MACOS SERVICE
      # ============================================================
      - name: Install Official RustDesk Service
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} INSTALLING OFFICIAL RUSTDESK SERVICE${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          INSTALL_SCRIPT="/tmp/rustdesk-install-service.sh"

          echo "Downloading official RustDesk service installer..."

          curl -fsSL \
            "https://raw.githubusercontent.com/rustdesk/rustdesk/master/install_service.sh" \
            -o "$INSTALL_SCRIPT"

          chmod +x "$INSTALL_SCRIPT"

          echo ""
          echo "Installing service for user: $MACOS_USERNAME"

          sudo bash "$INSTALL_SCRIPT" \
            -u "$MACOS_USERNAME"

          echo ""
          echo "Checking official RustDesk plist files..."

          DAEMON="/Library/LaunchDaemons/com.carriez.RustDesk_service.plist"
          AGENT="/Library/LaunchAgents/com.carriez.RustDesk_server.plist"

          if [ ! -f "$DAEMON" ]; then
            echo -e "${RED}ERROR: RustDesk LaunchDaemon was not created.${RESET}"
            exit 1
          fi

          if [ ! -f "$AGENT" ]; then
            echo -e "${RED}ERROR: RustDesk LaunchAgent was not created.${RESET}"
            exit 1
          fi

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║     🟢 RUSTDESK SERVICE INSTALLED       ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          echo ""
          echo "Daemon:"
          ls -lh "$DAEMON"

          echo ""
          echo "Agent:"
          ls -lh "$AGENT"

      # ============================================================
      # 7. START RUSTDESK SERVICE
      # ============================================================
      - name: Start RustDesk Service
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          DAEMON="/Library/LaunchDaemons/com.carriez.RustDesk_service.plist"
          AGENT="/Library/LaunchAgents/com.carriez.RustDesk_server.plist"

          USER_ID="$(id -u "$MACOS_USERNAME")"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} STARTING RUSTDESK SERVICES${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "UID:"
          echo "$USER_ID"

          echo ""
          echo "Starting system daemon..."

          sudo launchctl bootstrap system "$DAEMON" 2>/dev/null || true

          sudo launchctl enable \
            "system/com.carriez.RustDesk_service" \
            2>/dev/null || true

          sudo launchctl kickstart \
            -k \
            "system/com.carriez.RustDesk_service" \
            2>/dev/null || true

          echo ""
          echo "Starting user agent..."

          sudo launchctl bootstrap \
            "gui/$USER_ID" \
            "$AGENT" \
            2>/dev/null || true

          sudo launchctl enable \
            "gui/$USER_ID/com.carriez.RustDesk_server" \
            2>/dev/null || true

          sudo launchctl kickstart \
            -k \
            "gui/$USER_ID/com.carriez.RustDesk_server" \
            2>/dev/null || true

          echo ""
          echo "Waiting for RustDesk service..."
          sleep 8

          echo ""
          echo "System service:"
          sudo launchctl print \
            "system/com.carriez.RustDesk_service" \
            2>/dev/null || true

          echo ""
          echo "User server:"
          sudo launchctl print \
            "gui/$USER_ID/com.carriez.RustDesk_server" \
            2>/dev/null || true

          echo ""
          echo -e "${GREEN}🟢 RUSTDESK SERVICES STARTED${RESET}"

      # ============================================================
      # 8. CONFIGURE PERMANENT PASSWORD
      # ============================================================
      - name: Configure RustDesk Permanent Password
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} CONFIGURING PERMANENT PASSWORD${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo -e "${RED}ERROR: RUSTDESK_PASSWORD is empty.${RESET}"
            exit 1
          fi

          echo ""
          echo "Using the official RustDesk service installer to configure password..."

          INSTALL_SCRIPT="/tmp/rustdesk-install-service.sh"

          if [ ! -x "$INSTALL_SCRIPT" ]; then
            echo -e "${RED}ERROR: Official RustDesk installer not found.${RESET}"
            exit 1
          fi

          PASSWORD_OUTPUT=$(
            sudo bash "$INSTALL_SCRIPT" \
              -u "$MACOS_USERNAME" \
              -p "$RUSTDESK_PASSWORD" \
              2>&1
          ) || {
            echo ""
            echo -e "${RED}ERROR: Password configuration command failed.${RESET}"
            echo "$PASSWORD_OUTPUT"
            exit 1
          }

          echo "$PASSWORD_OUTPUT"

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║     🟢 PASSWORD CONFIGURED              ║${RESET}"
          echo -e "${GREEN}║     🔐 PASSWORD VALUE HIDDEN             ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

      # ============================================================
      # 9. GET RUSTDESK ID
      # ============================================================
      - name: Get RustDesk ID
        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} GETTING RUSTDESK ID${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          RUSTDESK_ID=""

          for i in {1..10}; do
            RUSTDESK_ID=$("$RUSTDESK" --get-id 2>/dev/null | tr -d '[:space:]' || true)

            if [ -n "$RUSTDESK_ID" ]; then
              break
            fi

            echo "Waiting for RustDesk ID..."
            sleep 3
          done

          if [ -z "$RUSTDESK_ID" ]; then
            echo -e "${RED}ERROR: Could not obtain RustDesk ID.${RESET}"
            exit 1
          fi

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║        🟢 RUSTDESK READY                ║${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║        ID: $RUSTDESK_ID${RESET}"
          echo -e "${GREEN}║                                          ║${RESET}"
          echo -e "${GREEN}║        PASSWORD: CONFIGURED              ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

          echo ""
          echo "RUSTDESK_ID=$RUSTDESK_ID" >> "$GITHUB_ENV"

      # ============================================================
      # 10. VERIFY AUTO-RESTART SERVICES
      # ============================================================
      - name: Verify RustDesk Auto Restart
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          GREEN='\033[0;32m'
          RED='\033[0;31m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          USER_ID="$(id -u "$MACOS_USERNAME")"

          echo -e "${CYAN}==========================================${RESET}"
          echo -e "${CYAN} VERIFYING AUTO-RESTART${RESET}"
          echo -e "${CYAN}==========================================${RESET}"

          echo ""
          echo "System RustDesk service:"
          sudo launchctl print \
            "system/com.carriez.RustDesk_service" \
            2>/dev/null || true

          echo ""
          echo "User RustDesk server:"
          sudo launchctl print \
            "gui/$USER_ID/com.carriez.RustDesk_server" \
            2>/dev/null || true

          echo ""
          echo "RustDesk processes:"
          ps aux | grep -i "[R]ustDesk" || true

          echo ""
          echo -e "${GREEN}╔══════════════════════════════════════════╗${RESET}"
          echo -e "${GREEN}║      🟢 AUTO-RESTART ENABLED            ║${RESET}"
          echo -e "${GREEN}║      🟢 LAUNCHD SERVICE ACTIVE          ║${RESET}"
          echo -e "${GREEN}╚══════════════════════════════════════════╝${RESET}"

      # ============================================================
      # 11. OPEN SYSTEM SETTINGS
      # ============================================================
      - name: Open System Settings
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension" \
            2>/dev/null || true

          echo ""
          echo "System Settings opened if a GUI session is available."

      # ============================================================
      # 12. FINAL CONNECTION INFORMATION
      # ============================================================
      - name: Final Connection Information
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          GREEN='\033[0;32m'
          RESET='\033[0m'

          USER_ID="$(id -u "$MACOS_USERNAME")"

          echo ""
          echo -e "${GREEN}================================================${RESET}"
          echo -e "${GREEN}        🟢 RUSTDESK CONNECTION INFO            ${RESET}"
          echo -e "${GREEN}================================================${RESET}"
          echo ""
          echo -e "${GREEN}        RUSTDESK ID: $RUSTDESK_ID${RESET}"
          echo ""
          echo -e "${GREEN}        PASSWORD: CONFIGURED${RESET}"
          echo ""
          echo -e "${GREEN}        MACOS USER: $MACOS_USERNAME${RESET}"
          echo ""
          echo -e "${GREEN}        AUTO-RESTART: ENABLED${RESET}"
          echo ""
          echo -e "${GREEN}        SERVICE: RUNNING${RESET}"
          echo ""
          echo -e "${GREEN}================================================${RESET}"
          echo ""
          echo "IMPORTANT:"
          echo "Use the password stored in GitHub Secret RUSTDESK_PASSWORD."
          echo "The password itself is intentionally NOT printed in the log."

      # ============================================================
      # 13. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          GREEN='\033[0;32m'
          CYAN='\033[0;36m'
          RESET='\033[0m'

          echo -e "${GREEN}================================================${RESET}"
          echo -e "${GREEN}        🟢 MACOS RUNNER IS READY              ${RESET}"
          echo -e "${GREEN}================================================${RESET}"

          echo ""
          echo "RustDesk ID:"
          echo "$RUSTDESK_ID"

          echo ""
          echo "User:"
          echo "$MACOS_USERNAME"

          echo ""
          echo "The runner will remain alive."

          while true; do

            echo ""
            echo -e "${CYAN}========== STATUS $(date) ==========${RESET}"

            echo ""
            echo "RustDesk processes:"
            ps aux | grep -i "[R]ustDesk" || true

            echo ""
            echo "RustDesk ID:"
            /Applications/RustDesk.app/Contents/MacOS/RustDesk \
              --get-id \
              2>/dev/null || true

            echo ""
            echo "RustDesk system service:"
            sudo launchctl print \
              "system/com.carriez.RustDesk_service" \
              2>/dev/null | grep -E "state =|pid =|path =" || true

            echo ""
            echo "RustDesk user server:"
            USER_ID="$(id -u "$MACOS_USERNAME")"

            sudo launchctl print \
              "gui/$USER_ID/com.carriez.RustDesk_server" \
              2>/dev/null | grep -E "state =|pid =|path =" || true

            echo ""
            echo "Sleeping 5 minutes..."

            sleep 300

          done


