name: macOS RustDesk - Abdulrahman

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " SYSTEM INFORMATION"
          echo "=========================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Actions user:"
          whoami

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true


      # =========================================================
      # 2. CREATE ABDULRAHMAN
      # =========================================================
      - name: Create Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CREATING ABDULRAHMAN"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          echo ""
          echo "Username:"
          echo "$MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then

            echo ""
            echo "User already exists."

          else

            echo ""
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."

          fi

          echo ""
          echo "Adding Administrator privileges..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "User ID:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"


      # =========================================================
      # 3. VERIFY PASSWORD + ADMIN
      # =========================================================
      - name: Verify Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING ABDULRAHMAN"
          echo "=========================================="

          echo ""
          echo "whoami:"
          sudo -u "$MACOS_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Home:"
          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

          echo ""
          echo "Checking Administrator membership..."

          ADMIN_CHECK=$(
            dseditgroup \
              -o checkmember \
              -m "$MACOS_USERNAME" \
              admin
          )

          echo "$ADMIN_CHECK"

          if echo "$ADMIN_CHECK" | grep -qi "yes"; then
            echo ""
            echo "SUCCESS: Abdulrahman is an Administrator."
          else
            echo ""
            echo "ERROR: Abdulrahman is NOT an Administrator."
            exit 1
          fi


      # =========================================================
      # 4. SET AUTO LOGIN
      # =========================================================
      - name: Configure Abdulrahman Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Target:"
          echo "$MACOS_USERNAME"

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            || true

          echo ""
          echo "Auto-login status:"

          sudo sysadminctl \
            -autologin status \
            || true

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "IMPORTANT:"
          echo "Auto-login applies to a future login."
          echo "It does not replace the current GUI session."


      # =========================================================
      # 5. INSTALL RUSTDESK
      # =========================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          brew update

          brew install --cask rustdesk

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -f "$RUSTDESK" ]; then
            echo "ERROR: RustDesk executable not found."
            exit 1
          fi

          echo ""
          echo "RustDesk version:"
          "$RUSTDESK" --version || true


      # =========================================================
      # 6. CONFIGURE RUSTDESK
      # =========================================================
      - name: Configure RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD is empty."
            exit 1
          fi

          echo ""
          echo "RustDesk ID:"

          ID=$(
            "$RUSTDESK" \
              --get-id \
              2>/dev/null || true
          )

          echo "$ID"

          echo ""
          echo "Starting RustDesk server..."

          "$RUSTDESK" \
            --server \
            >/tmp/rustdesk-server.log 2>&1 &

          sleep 10

          echo ""
          echo "Setting permanent password..."

          PASSWORD_OUTPUT=$(
            sudo "$RUSTDESK" \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          )

          echo "$PASSWORD_OUTPUT"

          if echo "$PASSWORD_OUTPUT" | grep -qi "done"; then
            echo ""
            echo "SUCCESS: RustDesk password configured."
          else
            echo ""
            echo "WARNING: RustDesk did not report Done."
            cat /tmp/rustdesk-server.log || true
          fi

          echo ""
          echo "Restarting RustDesk..."

          pkill -f \
            "/Applications/RustDesk.app/Contents/MacOS/RustDesk" \
            || true

          sleep 5

          nohup "$RUSTDESK" \
            >/tmp/rustdesk.log 2>&1 &

          sleep 10

          FINAL_ID=$(
            "$RUSTDESK" \
              --get-id \
              2>/dev/null || true
          )

          echo ""
          echo "=========================================="
          echo " RUSTDESK READY"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          echo "$FINAL_ID"


      # =========================================================
      # 7. START RUSTDESK AS ABDULRAHMAN
      # =========================================================
      - name: Start RustDesk As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " STARTING RUSTDESK AS ABDULRAHMAN"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Starting RustDesk using:"
          echo "$MACOS_USERNAME"

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            nohup "$RUSTDESK" \
            >/tmp/rustdesk-abdulrahman.log 2>&1 &

          sleep 10

          echo ""
          echo "RustDesk processes:"
          pgrep -fl RustDesk || true

          echo ""
          echo "RustDesk owned by Abdulrahman:"
          ps aux | grep "$MACOS_USERNAME" | grep RustDesk || true

          echo ""
          echo "RustDesk log:"
          tail -50 \
            /tmp/rustdesk-abdulrahman.log \
            2>/dev/null || true


      # =========================================================
      # 8. START RUSTDESK WATCHDOG IN BACKGROUND
      # =========================================================
      - name: Start RustDesk Watchdog
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -u

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          LOG="/tmp/rustdesk-watchdog.log"

          echo "=========================================="
          echo " STARTING RUSTDESK WATCHDOG"
          echo "=========================================="

          (
            while true
            do

              if pgrep -x "RustDesk" >/dev/null 2>&1
              then
                echo "[$(date)] RustDesk is RUNNING."

              else
                echo "[$(date)] RustDesk is NOT running!"
                echo "[$(date)] Restarting RustDesk..."

                sudo -u "$MACOS_USERNAME" -H \
                  env \
                  HOME="/Users/$MACOS_USERNAME" \
                  USER="$MACOS_USERNAME" \
                  LOGNAME="$MACOS_USERNAME" \
                  open -n "/Applications/RustDesk.app" \
                  >>"$LOG" 2>&1 &

                sleep 10

                if pgrep -x "RustDesk" >/dev/null 2>&1
                then
                  echo "[$(date)] SUCCESS: RustDesk restarted."
                else
                  echo "[$(date)] ERROR: RustDesk failed to restart."
                  echo "----- RustDesk log -----"
                  tail -50 "$LOG" 2>/dev/null || true
                fi
              fi

              sleep 30

            done
          ) >/tmp/rustdesk-watchdog-output.log 2>&1 &

          WATCHDOG_PID=$!

          echo ""
          echo "Watchdog started."
          echo "Watchdog PID:"
          echo "$WATCHDOG_PID"

          sleep 2

          if kill -0 "$WATCHDOG_PID" 2>/dev/null
          then
            echo "SUCCESS: Watchdog is running in background."
          else
            echo "ERROR: Watchdog failed to start."
            cat /tmp/rustdesk-watchdog-output.log || true
            exit 1
          fi


      # =========================================================
      # 9. OPEN SYSTEM SETTINGS AS ABDULRAHMAN
      # =========================================================
      - name: Open System Settings As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " OPENING SYSTEM SETTINGS"
          echo "=========================================="

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            /usr/bin/open \
            -a "System Settings" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "GUI sessions:"
          who || true


      # =========================================================
      # 10. FINAL CHECK
      # =========================================================
      - name: Final Check
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true

          echo ""
          echo "Current Actions user:"
          whoami

          echo ""
          echo "Abdulrahman:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Abdulrahman groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "RustDesk:"
          pgrep -fl RustDesk || true

          echo ""
          echo "Watchdog:"
          pgrep -fl "rustdesk-watchdog" || true


      # =========================================================
      # 11. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " RUNNER IS ONLINE"
          echo "=========================================="

          while true
          do
            echo ""
            echo "[$(date)] Runner alive"

            echo "Console user:"
            stat -f "%Su" /dev/console \
              2>/dev/null || echo "unknown"

            echo "Logged users:"
            who || true

            echo "RustDesk:"
            pgrep -fl RustDesk || true

            echo "Watchdog:"
            pgrep -fl "rustdesk-watchdog" || true

            sleep 300
          done


