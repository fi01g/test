name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFO
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          sw_vers

          echo
          echo "Current user:"
          whoami

          echo
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo
          echo "Architecture:"
          arch

          echo
          echo "=================================================="


      # =========================================================
      # 2. CREATE / VERIFY MACOS USER
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING / VERIFYING MACOS USER"
          echo "=================================================="

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists:"
            id "$MACOS_USERNAME"
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo
          echo "Home:"
          dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory

          echo
          echo "=================================================="


      # =========================================================
      # 3. MAKE USER ADMIN
      # =========================================================
      - name: Make User Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "ADDING USER TO ADMIN GROUP"
          echo "=================================================="

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "Admin membership:"

          dseditgroup \
            -o checkmember \
            -m "$MACOS_USERNAME" \
            admin || true

          echo
          echo "=================================================="


      # =========================================================
      # 4. AUTO LOGIN
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "CONFIGURING AUTO LOGIN"
          echo "=================================================="

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "Auto login configured for:"
          echo "$MACOS_USERNAME"

          echo
          echo "=================================================="


      # =========================================================
      # 5. INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING TAILSCALE"
          echo "=================================================="

          if [ -d "/Applications/Tailscale.app" ]; then

            echo "Tailscale.app already exists."

          else

            echo "Downloading latest stable Tailscale..."

            TAILSCALE_PKG="/tmp/Tailscale-macos.pkg"

            rm -f "$TAILSCALE_PKG"

            curl -fL \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              "https://pkgs.tailscale.com/stable/Tailscale-latest-macos.pkg" \
              -o "$TAILSCALE_PKG"

            echo
            echo "Package downloaded:"
            ls -lh "$TAILSCALE_PKG"

            echo
            echo "Installing..."

            sudo installer \
              -pkg "$TAILSCALE_PKG" \
              -target /

          fi

          echo
          echo "Checking application..."

          test -d "/Applications/Tailscale.app"

          echo "Tailscale.app FOUND."

          echo
          echo "CLI:"

          if [ -x "/usr/local/bin/tailscale" ]; then
            ls -l /usr/local/bin/tailscale
          else
            echo "CLI symlink not found yet."
          fi

          echo
          echo "=================================================="


      # =========================================================
      # 6. START TAILSCALE GUI
      # =========================================================
      - name: Start Tailscale GUI
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "STARTING TAILSCALE GUI"
          echo "=================================================="

          open -a "Tailscale"

          echo
          echo "Waiting for Tailscale..."

          for i in {1..30}; do

            echo
            echo "Attempt $i/30"

            if pgrep -f "Tailscale" >/dev/null 2>&1; then
              echo "Tailscale process detected."
              break
            fi

            sleep 2

          done

          echo
          echo "Tailscale processes:"

          pgrep -alf "Tailscale" || true

          echo
          echo "=================================================="


      # =========================================================
      # 7. FIND TAILSCALE CLI
      # =========================================================
      - name: Locate Tailscale CLI
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "LOCATING TAILSCALE CLI"
          echo "=================================================="

          if [ -x "/usr/local/bin/tailscale" ]; then

            TAILSCALE_BIN="/usr/local/bin/tailscale"

          elif [ -x "/Applications/Tailscale.app/Contents/MacOS/Tailscale" ]; then

            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"

          else

            echo "ERROR: Tailscale CLI not found."

            find \
              /Applications/Tailscale.app \
              -type f \
              -perm -111 \
              2>/dev/null \
              | head -50

            exit 1

          fi

          echo
          echo "Tailscale CLI:"
          echo "$TAILSCALE_BIN"

          echo
          echo "Binary information:"
          file "$TAILSCALE_BIN"

          echo
          echo "=================================================="


      # =========================================================
      # 8. CHECK TAILSCALE DAEMON
      # =========================================================
      - name: Check Tailscale Daemon
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "CHECKING TAILSCALE DAEMON"
          echo "=================================================="

          echo
          echo "Processes:"

          ps aux | grep -i '[t]ailscale' || true

          echo
          echo "LaunchDaemons:"

          sudo launchctl list \
            | grep -i tailscale \
            || true

          echo
          echo "System extensions:"

          systemextensionsctl list \
            2>/dev/null \
            | grep -i tailscale \
            || true

          echo
          echo "Network interfaces:"

          ifconfig \
            | grep -A4 -B2 -i tailscale \
            || true

          echo
          echo "=================================================="


      # =========================================================
      # 9. AUTHENTICATE TAILSCALE - HARD TIMEOUT
      # =========================================================
      - name: Authenticate Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          echo "=================================================="
          echo "AUTHENTICATING TAILSCALE"
          echo "=================================================="

          TAILSCALE_BIN="/usr/local/bin/tailscale"

          if [ ! -x "$TAILSCALE_BIN" ]; then
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "Using:"
          echo "$TAILSCALE_BIN"

          echo
          echo "Starting tailscale up..."

          rm -f /tmp/tailscale-up.stdout
          rm -f /tmp/tailscale-up.stderr

          (
            sudo "$TAILSCALE_BIN" up \
              --authkey="$TAILSCALE_AUTH_KEY" \
              --hostname="github-macos-rdp" \
              > /tmp/tailscale-up.stdout \
              2> /tmp/tailscale-up.stderr
          ) &

          TAILSCALE_PID=$!

          echo
          echo "PID:"
          echo "$TAILSCALE_PID"

          echo
          echo "Waiting maximum 45 seconds..."

          FINISHED=0

          for i in {1..45}; do

            if ! kill -0 "$TAILSCALE_PID" 2>/dev/null; then
              FINISHED=1
              break
            fi

            echo "Waiting... $i/45"

            sleep 1

          done

          if [ "$FINISHED" -eq 0 ]; then

            echo
            echo "ERROR: tailscale up timed out."

            kill "$TAILSCALE_PID" \
              2>/dev/null || true

            sleep 2

            kill -9 "$TAILSCALE_PID" \
              2>/dev/null || true

          fi

          wait "$TAILSCALE_PID" \
            2>/dev/null

          EXIT_CODE=$?

          echo
          echo "tailscale up exit code:"
          echo "$EXIT_CODE"

          echo
          echo "=================================================="
          echo "TAILSCALE STDOUT"
          echo "=================================================="

          cat /tmp/tailscale-up.stdout \
            2>/dev/null || true

          echo
          echo "=================================================="
          echo "TAILSCALE STDERR"
          echo "=================================================="

          cat /tmp/tailscale-up.stderr \
            2>/dev/null || true

          echo
          echo "=================================================="

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo
            echo "Tailscale authentication did not complete."
            echo "Stopping here so we can see the exact error."
            exit "$EXIT_CODE"
          fi

          echo
          echo "Tailscale authentication completed."


      # =========================================================
      # 10. VERIFY TAILSCALE
      # =========================================================
      - name: Verify Tailscale
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "VERIFYING TAILSCALE"
          echo "=================================================="

          TAILSCALE_BIN="/usr/local/bin/tailscale"

          if [ ! -x "$TAILSCALE_BIN" ]; then
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "Tailscale status:"

          "$TAILSCALE_BIN" status \
            2>&1 || true

          echo
          echo "Tailscale IP:"

          "$TAILSCALE_BIN" ip -4 \
            2>&1 || true

          echo
          echo "Tailscale interfaces:"

          ifconfig \
            | grep -A5 -B2 -i tailscale \
            || true

          echo
          echo "=================================================="


      # =========================================================
      # 11. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING RUST"
          echo "=================================================="

          if ! command -v cargo >/dev/null 2>&1; then

            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf \
              https://sh.rustup.rs \
              | sh -s -- -y

          fi

          source "$HOME/.cargo/env"

          echo
          rustc --version

          echo
          cargo --version

          echo
          echo "=================================================="


      # =========================================================
      # 12. CLONE MACRDP
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLONING MACRDP"
          echo "=================================================="

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "Commit:"
          git rev-parse HEAD

          echo
          echo "=================================================="


      # =========================================================
      # 13. BUILD MACRDP
      # =========================================================
      - name: Build macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "BUILDING MACRDP"
          echo "=================================================="

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          cargo build --release

          echo
          echo "Build completed."

          ls -lh target/release/

          echo
          echo "=================================================="


      # =========================================================
      # 14. INSTALL MACRDP
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING MACRDP"
          echo "=================================================="

          sudo cp \
            "$HOME/macrdp/target/release/macrdp" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "macrdp installed."

          echo
          echo "=================================================="


      # =========================================================
      # 15. OPEN MACOS PERMISSIONS
      # =========================================================
      - name: Open macOS Permissions
        shell: bash
        run: |
          echo "=================================================="
          echo "OPENING MACOS PERMISSIONS"
          echo "=================================================="

          open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture" \
            || true

          open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility" \
            || true

          echo
          echo "Permission settings opened."

          echo
          echo "=================================================="


      # =========================================================
      # 16. PREPARE MACRDP DIRECTORIES
      # =========================================================
      - name: Prepare macrdp Logs
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          TARGET_HOME=$(dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            | awk '{print $2}')

          sudo mkdir -p \
            "$TARGET_HOME/Library/Logs/macrdp"

          sudo mkdir -p \
            "$TARGET_HOME/Library/LaunchAgents"

          sudo chown -R \
            "$MACOS_USERNAME":staff \
            "$TARGET_HOME/Library/Logs/macrdp"

          sudo chown -R \
            "$MACOS_USERNAME":staff \
            "$TARGET_HOME/Library/LaunchAgents"

          echo
          echo "Directories ready."


      # =========================================================
      # 17. CREATE MACRDP LAUNCHAGENT
      # =========================================================
      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING MACRDP LAUNCHAGENT"
          echo "=================================================="

          TARGET_HOME=$(dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            | awk '{print $2}')

          TMP_PLIST="/tmp/com.macrdp.server.plist"

          rm -f "$TMP_PLIST"

          cat > "$TMP_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>

          <!DOCTYPE plist PUBLIC
          "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">

          <dict>

              <key>Label</key>
              <string>com.macrdp.server</string>

              <key>ProgramArguments</key>

              <array>

                  <string>/usr/local/bin/macrdp</string>

                  <string>--bind</string>
                  <string>0.0.0.0:3390</string>

                  <string>--username</string>
                  <string>$MACOS_USERNAME</string>

                  <string>--password</string>
                  <string>$MACOS_PASSWORD</string>

                  <string>--virtual-display</string>

                  <string>--enable-h264</string>

                  <string>--fps</string>
                  <string>60</string>

                  <string>--bitrate</string>
                  <string>8</string>

                  <string>--keyframe-interval</string>
                  <string>2</string>

                  <string>--flush-frames</string>
                  <string>4</string>

                  <string>--log-dir</string>
                  <string>$TARGET_HOME/Library/Logs/macrdp</string>

                  <string>--verbose</string>

              </array>

              <key>WorkingDirectory</key>
              <string>$TARGET_HOME</string>

              <key>EnvironmentVariables</key>

              <dict>

                  <key>HOME</key>
                  <string>$TARGET_HOME</string>

                  <key>USER</key>
                  <string>$MACOS_USERNAME</string>

                  <key>LOGNAME</key>
                  <string>$MACOS_USERNAME</string>

                  <key>PATH</key>
                  <string>/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>

              </dict>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <false/>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>StandardOutPath</key>
              <string>$TARGET_HOME/Library/Logs/macrdp/stdout.log</string>

              <key>StandardErrorPath</key>
              <string>$TARGET_HOME/Library/Logs/macrdp/stderr.log</string>

          </dict>

          </plist>
          EOF

          sudo cp \
            "$TMP_PLIST" \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chown \
            "$MACOS_USERNAME":staff \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          chmod 644 \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          plutil -lint \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "LaunchAgent ready."

          echo
          echo "=================================================="


      # =========================================================
      # 18. START MACRDP
      # =========================================================
      - name: Start macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "STARTING MACRDP"
          echo "=================================================="

          TARGET_UID=$(id -u "$MACOS_USERNAME")

          TARGET_HOME=$(dscl . \
            -read "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory \
            | awk '{print $2}')

          sudo -u "$MACOS_USERNAME" \
            launchctl bootout \
            "gui/$TARGET_UID/com.macrdp.server" \
            2>/dev/null || true

          sleep 2

          sudo -u "$MACOS_USERNAME" \
            launchctl bootstrap \
            "gui/$TARGET_UID" \
            "$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          BOOTSTRAP_EXIT=$?

          echo
          echo "Bootstrap exit:"
          echo "$BOOTSTRAP_EXIT"

          sudo -u "$MACOS_USERNAME" \
            launchctl kickstart \
            -k \
            "gui/$TARGET_UID/com.macrdp.server"

          echo
          echo "Waiting 10 seconds..."

          sleep 10

          echo
          echo "=================================================="
          echo "MACRDP PROCESS"
          echo "=================================================="

          ps aux | grep '[m]acrdp' || true

          echo
          echo "=================================================="
          echo "PORT 3390"
          echo "=================================================="

          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            || true

          echo
          echo "=================================================="
          echo "SERVICE STATUS"
          echo "=================================================="

          sudo -u "$MACOS_USERNAME" \
            launchctl print \
            "gui/$TARGET_UID/com.macrdp.server" \
            || true

          echo
          echo "=================================================="
          echo "MACRDP LOGS"
          echo "=================================================="

          for LOG in \
            "$TARGET_HOME/Library/Logs/macrdp/stdout.log" \
            "$TARGET_HOME/Library/Logs/macrdp/stderr.log" \
            "$TARGET_HOME/Library/Logs/macrdp/macrdp.log"
          do

            echo
            echo "--------------------------------------------------"
            echo "$LOG"
            echo "--------------------------------------------------"

            if [ -f "$LOG" ]; then
              tail -n 300 "$LOG"
            else
              echo "Log does not exist."
            fi

          done

          echo
          echo "=================================================="


      # =========================================================
      # 19. CONNECTION INFORMATION
      # =========================================================
      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CONNECTION INFORMATION"
          echo "=================================================="

          TAILSCALE_BIN="/usr/local/bin/tailscale"

          if [ ! -x "$TAILSCALE_BIN" ]; then
            TAILSCALE_BIN="/Applications/Tailscale.app/Contents/MacOS/Tailscale"
          fi

          echo
          echo "Tailscale IP:"

          "$TAILSCALE_BIN" ip -4 \
            2>/dev/null || true

          echo
          echo "RDP Port:"
          echo "3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "=================================================="


      # =========================================================
      # 20. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=================================================="
          echo "KEEPING RUNNER ALIVE"
          echo "=================================================="

          DURATION=20400

          END=$(( $(date +%s) + DURATION ))

          while [ "$(date +%s)" -lt "$END" ]; do

            echo
            echo "=================================================="
            echo "TIME: $(date)"
            echo "CONSOLE USER: $(stat -f "%Su" /dev/console)"
            echo "=================================================="

            echo
            echo "macrdp:"

            ps aux | grep '[m]acrdp' || \
              echo "macrdp not running"

            echo
            echo "Port 3390:"

            lsof -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              || echo "3390 not listening"

            sleep 60

          done

          echo
          echo "=================================================="
          echo "KEEP-ALIVE FINISHED"
          echo "=================================================="


      # =========================================================
      # 21. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          pkill -f '/usr/local/bin/macrdp' \
            2>/dev/null || true

          TARGET_UID=$(id -u "$MACOS_USERNAME" 2>/dev/null || true)

          if [ -n "$TARGET_UID" ]; then

            sudo -u "$MACOS_USERNAME" \
              launchctl bootout \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

          fi

          echo
          echo "Cleanup complete."

          echo
          echo "=================================================="


      # =========================================================
      # 22. FINAL
      # =========================================================
      - name: Final
        if: always()
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "WORKFLOW FINISHED"
          echo "=================================================="
