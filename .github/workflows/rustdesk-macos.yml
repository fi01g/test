name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. System Information
      # =========================================================

      - name: System Information
        shell: bash
        run: |
          echo "===== SYSTEM ====="
          sw_vers

          echo
          echo "===== CURRENT USER ====="
          whoami

          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console

          echo
          echo "===== GUI SESSIONS ====="
          who

          echo
          echo "===== DISK ====="
          df -h


      # =========================================================
      # 2. Create / Verify macOS User
      # =========================================================

      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "Checking user: $MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo
          echo "===== USER ====="

          id "$MACOS_USERNAME"


      # =========================================================
      # 3. Configure Administrator
      # =========================================================

      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "Adding user to admin group..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== USER GROUPS ====="

          id "$MACOS_USERNAME"

          echo
          echo "===== ADMIN GROUP ====="

          dscl . -read /Groups/admin GroupMembership


      # =========================================================
      # 4. Configure Auto Login
      # =========================================================

      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "Configuring auto login..."

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          echo "===== AUTO LOGIN ====="

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            2>/dev/null || true


      # =========================================================
      # 5. Install Tailscale
      # =========================================================

      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Installing Homebrew..."

            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo
          echo "Installing Tailscale..."

          brew install --quiet tailscale || true

          echo
          echo "===== TAILSCALE VERSION ====="

          tailscale version


      # =========================================================
      # 6. Start Tailscale
      # =========================================================

      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          echo "===== TAILSCALE ====="

          if pgrep -x tailscaled >/dev/null 2>&1; then
            echo "tailscaled already running."
          else

            echo "Starting tailscaled..."

            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            TAILSCALED_PID=$!

            echo "tailscaled PID: $TAILSCALED_PID"

            sleep 5

          fi

          echo
          echo "===== TAILSCALED PROCESS ====="

          pgrep -fl tailscaled || true

          echo
          echo "===== TAILSCALED LOG ====="

          cat /tmp/tailscaled.log 2>/dev/null || true

          echo
          echo "===== TAILSCALE UP ====="

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status

          echo
          echo "===== TAILSCALE IP ====="

          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null | head -n 1)

          echo "$TAILSCALE_IP"

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip


      # =========================================================
      # 7. Install Rust
      # =========================================================

      - name: Install Rust
        shell: bash
        run: |
          set -e

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else

            echo "Installing Rust..."

            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y

          fi

          source "$HOME/.cargo/env"

          echo
          echo "===== RUST ====="

          rustc --version
          cargo --version


      # =========================================================
      # 8. Clone macrdp
      # =========================================================

      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "===== MACRDP FILES ====="

          ls -la


      # =========================================================
      # 9. Build macrdp
      # =========================================================

      - name: Build macrdp
        shell: bash
        run: |
          set -e

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          echo "===== BUILDING MACRDP ====="

          cargo build --release

          echo
          echo "===== BUILD OUTPUT ====="

          ls -lh target/release/macrdp


      # =========================================================
      # 10. Install macrdp
      # =========================================================

      - name: Install macrdp
        shell: bash
        run: |
          set -e

          MACRDP_BINARY="$HOME/macrdp/target/release/macrdp"

          if [ ! -f "$MACRDP_BINARY" ]; then
            echo "ERROR: macrdp binary not found."
            exit 1
          fi

          sudo cp \
            "$MACRDP_BINARY" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "===== MACRDP INSTALLED ====="

          ls -lh /usr/local/bin/macrdp

          echo
          echo "===== MACRDP HELP ====="

          /usr/local/bin/macrdp --help


      # =========================================================
      # 11. Open macOS Permission Settings
      # =========================================================

      - name: Open macOS Permission Settings
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "Opening Screen Recording settings..."

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture"

          sleep 3

          echo
          echo "Opening Accessibility settings..."

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility"

          sleep 3

          echo
          echo "===== CURRENT CONSOLE USER ====="

          stat -f "%Su" /dev/console


      # =========================================================
      # 12. Create LaunchAgent For MACOS_USERNAME
      # =========================================================

      - name: Create macrdp LaunchAgent For Target User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "===== TARGET USER LAUNCHAGENT ====="

          USER_HOME=$(dscl . -read \
            /Users/"$MACOS_USERNAME" NFSHomeDirectory \
            | awk '{print $2}')

          AGENT_DIR="$USER_HOME/Library/LaunchAgents"

          AGENT="$AGENT_DIR/com.macrdp.server.plist"

          LOG_DIR="$USER_HOME/Library/Logs/macrdp"

          echo
          echo "User:"
          echo "$MACOS_USERNAME"

          echo
          echo "Home:"
          echo "$USER_HOME"

          echo
          echo "Agent:"
          echo "$AGENT"

          echo
          echo "Log directory:"
          echo "$LOG_DIR"

          sudo mkdir -p "$AGENT_DIR"
          sudo mkdir -p "$LOG_DIR"

          sudo chown \
            "$MACOS_USERNAME":staff \
            "$AGENT_DIR"

          sudo chown \
            "$MACOS_USERNAME":staff \
            "$LOG_DIR"

          echo
          echo "Creating plist..."

          python3 \
            - "$MACOS_USERNAME" "$MACOS_PASSWORD" "$LOG_DIR" \
            > /tmp/macrdp-target.plist <<'PY'
          import plistlib
          import sys

          username = sys.argv[1]
          password = sys.argv[2]
          log_dir = sys.argv[3]

          plist = {
              "Label": "com.macrdp.server",

              "ProgramArguments": [
                  "/usr/local/bin/macrdp",
                  "--bind",
                  "0.0.0.0:3390",
                  "--username",
                  username,
                  "--password",
                  password,
                  "--enable-h264",
                  "--fps",
                  "60",
                  "--bitrate",
                  "8",
                  "--keyframe-interval",
                  "2",
                  "--flush-frames",
                  "4",
                  "--log-dir",
                  log_dir,
                  "--verbose"
              ],

              "RunAtLoad": True,
              "KeepAlive": True,
              "ThrottleInterval": 5,
              "ProcessType": "Interactive",
              "LimitLoadToSessionType": ["Aqua"],

              "StandardOutPath":
                  f"{log_dir}/stdout.log",

              "StandardErrorPath":
                  f"{log_dir}/stderr.log"
          }

          plistlib.dump(
              plist,
              sys.stdout.buffer
          )
          PY

          sudo mv \
            /tmp/macrdp-target.plist \
            "$AGENT"

          sudo chown \
            "$MACOS_USERNAME":staff \
            "$AGENT"

          sudo chmod 644 \
            "$AGENT"

          echo
          echo "===== TARGET PLIST ====="

          sudo plutil -p "$AGENT"

          echo
          echo "===== VALIDATION ====="

          sudo plutil -lint "$AGENT"


      # =========================================================
      # 13. Create LaunchAgent For GitHub Runner
      # =========================================================

      - name: Create macrdp LaunchAgent For Runner
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "===== RUNNER LAUNCHAGENT ====="

          RUNNER_USER=$(whoami)

          RUNNER_HOME="$HOME"

          RUNNER_AGENT_DIR="$RUNNER_HOME/Library/LaunchAgents"

          RUNNER_AGENT="$RUNNER_AGENT_DIR/com.macrdp.server.plist"

          RUNNER_LOG_DIR="$RUNNER_HOME/Library/Logs/macrdp"

          echo
          echo "Runner:"
          echo "$RUNNER_USER"

          echo
          echo "Runner home:"
          echo "$RUNNER_HOME"

          echo
          echo "Runner agent:"
          echo "$RUNNER_AGENT"

          mkdir -p "$RUNNER_AGENT_DIR"
          mkdir -p "$RUNNER_LOG_DIR"

          python3 \
            - "$MACOS_USERNAME" "$MACOS_PASSWORD" "$RUNNER_LOG_DIR" \
            > /tmp/macrdp-runner.plist <<'PY'
          import plistlib
          import sys

          username = sys.argv[1]
          password = sys.argv[2]
          log_dir = sys.argv[3]

          plist = {
              "Label": "com.macrdp.server",

              "ProgramArguments": [
                  "/usr/local/bin/macrdp",
                  "--bind",
                  "0.0.0.0:3390",
                  "--username",
                  username,
                  "--password",
                  password,
                  "--enable-h264",
                  "--fps",
                  "60",
                  "--bitrate",
                  "8",
                  "--keyframe-interval",
                  "2",
                  "--flush-frames",
                  "4",
                  "--log-dir",
                  log_dir,
                  "--verbose"
              ],

              "RunAtLoad": True,
              "KeepAlive": True,
              "ThrottleInterval": 5,
              "ProcessType": "Interactive",
              "LimitLoadToSessionType": ["Aqua"],

              "StandardOutPath":
                  f"{log_dir}/stdout.log",

              "StandardErrorPath":
                  f"{log_dir}/stderr.log"
          }

          plistlib.dump(
              plist,
              sys.stdout.buffer
          )
          PY

          mv \
            /tmp/macrdp-runner.plist \
            "$RUNNER_AGENT"

          chmod 644 \
            "$RUNNER_AGENT"

          echo
          echo "===== RUNNER PLIST ====="

          plutil -p "$RUNNER_AGENT"

          echo
          echo "===== VALIDATION ====="

          plutil -lint "$RUNNER_AGENT"


      # =========================================================
      # 14. Stop Existing macrdp
      # =========================================================

      - name: Stop Existing macrdp
        shell: bash
        run: |
          set +e

          echo "Stopping existing macrdp..."

          pkill \
            -f "/usr/local/bin/macrdp" \
            || true

          sleep 2

          echo
          echo "Remaining processes:"

          pgrep -fl macrdp || true


      # =========================================================
      # 15. Start macrdp For Current Console User
      # =========================================================

      - name: Start macrdp
        shell: bash
        run: |
          set +e

          echo "===== START MACRDP ====="

          CONSOLE_USER=$(stat -f "%Su" /dev/console)

          echo
          echo "Console user:"
          echo "$CONSOLE_USER"

          echo
          echo "GUI sessions:"
          who

          if [ -z "$CONSOLE_USER" ] || [ "$CONSOLE_USER" = "root" ]; then

            echo
            echo "No normal GUI user detected."

            exit 0

          fi

          if ! id "$CONSOLE_USER" >/dev/null 2>&1; then

            echo
            echo "Console user does not exist."

            exit 0

          fi

          CONSOLE_UID=$(id -u "$CONSOLE_USER")

          CONSOLE_HOME=$(dscl . -read \
            /Users/"$CONSOLE_USER" NFSHomeDirectory \
            | awk '{print $2}')

          AGENT="$CONSOLE_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "UID:"
          echo "$CONSOLE_UID"

          echo
          echo "Home:"
          echo "$CONSOLE_HOME"

          echo
          echo "Agent:"
          echo "$AGENT"

          if [ ! -f "$AGENT" ]; then

            echo
            echo "WARNING:"
            echo "LaunchAgent does not exist for $CONSOLE_USER."

            echo
            echo "This should only happen if the console user"
            echo "is a temporary system user."

            exit 0

          fi

          echo
          echo "Booting LaunchAgent..."

          sudo launchctl bootout \
            "gui/$CONSOLE_UID/com.macrdp.server" \
            2>/dev/null \
            || true

          sleep 1

          sudo launchctl bootstrap \
            "gui/$CONSOLE_UID" \
            "$AGENT"

          BOOT_RESULT=$?

          echo
          echo "Bootstrap result:"
          echo "$BOOT_RESULT"

          if [ "$BOOT_RESULT" -ne 0 ]; then

            echo
            echo "WARNING:"
            echo "Bootstrap failed."

          fi

          echo
          echo "Enabling service..."

          sudo launchctl enable \
            "gui/$CONSOLE_UID/com.macrdp.server" \
            2>/dev/null \
            || true

          echo
          echo "Kickstarting service..."

          sudo launchctl kickstart \
            -k \
            "gui/$CONSOLE_UID/com.macrdp.server"

          sleep 8

          echo
          echo "===== MACRDP PROCESS ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null \
            || true

          echo
          echo "===== LAUNCHCTL STATUS ====="

          sudo launchctl print \
            "gui/$CONSOLE_UID/com.macrdp.server" \
            2>/dev/null \
            || true


      # =========================================================
      # 16. Monitor User Switch
      # =========================================================

      - name: Monitor GUI User
        shell: bash
        run: |
          set +e

          echo
          echo "======================================================"
          echo "             GUI USER MONITOR STARTED"
          echo "======================================================"

          LAST_USER=""

          start_macrdp_for_user() {

            TARGET_USER="$1"

            echo
            echo "=================================================="
            echo "Starting macrdp for GUI user:"
            echo "$TARGET_USER"
            echo "=================================================="

            if ! id "$TARGET_USER" >/dev/null 2>&1; then

              echo "User does not exist."

              return

            fi

            TARGET_UID=$(id -u "$TARGET_USER")

            TARGET_HOME=$(dscl . -read \
              /Users/"$TARGET_USER" NFSHomeDirectory \
              | awk '{print $2}')

            AGENT="$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

            echo
            echo "UID:"
            echo "$TARGET_UID"

            echo
            echo "HOME:"
            echo "$TARGET_HOME"

            echo
            echo "AGENT:"
            echo "$AGENT"

            if [ ! -f "$AGENT" ]; then

              echo
              echo "LaunchAgent not found."

              echo
              echo "Cannot start macrdp for this GUI user."

              return

            fi

            echo
            echo "Stopping existing macrdp..."

            pkill \
              -f "/usr/local/bin/macrdp" \
              || true

            sleep 2

            echo
            echo "Removing old LaunchAgent instance..."

            sudo launchctl bootout \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null \
              || true

            sleep 1

            echo
            echo "Bootstrapping LaunchAgent..."

            sudo launchctl bootstrap \
              "gui/$TARGET_UID" \
              "$AGENT"

            BOOT_RESULT=$?

            echo
            echo "Bootstrap result:"
            echo "$BOOT_RESULT"

            if [ "$BOOT_RESULT" -ne 0 ]; then

              echo
              echo "Bootstrap failed."

              return

            fi

            echo
            echo "Enabling service..."

            sudo launchctl enable \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null \
              || true

            echo
            echo "Starting service..."

            sudo launchctl kickstart \
              -k \
              "gui/$TARGET_UID/com.macrdp.server"

            sleep 6

            echo
            echo "===== MACRDP PROCESS ====="

            pgrep -fl macrdp || true

            echo
            echo "===== PORT 3390 ====="

            lsof \
              -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null \
              || true

            echo
            echo "===== SERVICE STATUS ====="

            sudo launchctl print \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null \
              || true

            echo
            echo "===== USER LOGS ====="

            find \
              "$TARGET_HOME/Library/Logs/macrdp" \
              -type f \
              -maxdepth 2 \
              -print \
              2>/dev/null \
              || true
          }


          # =====================================================
          # Initial User
          # =====================================================

          CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

          echo
          echo "Initial console user:"
          echo "$CURRENT_USER"

          if [ -n "$CURRENT_USER" ] && [ "$CURRENT_USER" != "root" ]; then

            LAST_USER="$CURRENT_USER"

            start_macrdp_for_user "$CURRENT_USER"

          fi


          # =====================================================
          # Main Monitor
          # =====================================================

          while true; do

            CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

            if [ -z "$CURRENT_USER" ]; then

              sleep 5

              continue

            fi

            if [ "$CURRENT_USER" = "root" ]; then

              sleep 5

              continue

            fi


            # ---------------------------------------------------
            # Detect Switch User
            # ---------------------------------------------------

            if [ "$CURRENT_USER" != "$LAST_USER" ]; then

              echo
              echo
              echo "=================================================="
              echo "             SWITCH USER DETECTED"
              echo "=================================================="

              echo
              echo "Previous user:"
              echo "$LAST_USER"

              echo
              echo "New console user:"
              echo "$CURRENT_USER"

              echo

              LAST_USER="$CURRENT_USER"

              start_macrdp_for_user "$CURRENT_USER"

            fi


            # ---------------------------------------------------
            # Detect macrdp crash
            # ---------------------------------------------------

            if ! pgrep \
              -f "/usr/local/bin/macrdp" \
              >/dev/null 2>&1; then

              echo
              echo "=================================================="
              echo "macrdp is not running."
              echo "Restarting..."
              echo "=================================================="

              start_macrdp_for_user "$CURRENT_USER"

            fi

            sleep 5

          done


      # =========================================================
      # 17. Connection Information
      # =========================================================

      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          TAILSCALE_IP=$(cat /tmp/tailscale_ip 2>/dev/null)

          if [ -z "$TAILSCALE_IP" ]; then

            TAILSCALE_IP=$(tailscale ip -4 2>/dev/null | head -n 1)

          fi

          echo
          echo "======================================================"
          echo "              RDP CONNECTION INFO"
          echo "======================================================"

          echo
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo
          echo "RDP Address:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "Password:"
          echo "Use MACOS_PASSWORD GitHub Secret"

          echo
          echo "======================================================"

          echo
          echo "Microsoft Remote Desktop PC:"

          echo "$TAILSCALE_IP:3390"

          echo
          echo "======================================================"


      # =========================================================
      # 18. Final Diagnostic
      # =========================================================

      - name: Final Diagnostic
        shell: bash
        run: |
          set +e

          echo
          echo "===== FINAL DIAGNOSTIC ====="

          echo
          echo "Console user:"

          stat -f "%Su" /dev/console

          echo
          echo "Logged users:"

          who

          echo
          echo "macrdp processes:"

          pgrep -fl macrdp || true

          echo
          echo "Port 3390:"

          lsof \
            -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null \
            || true

          echo
          echo "Tailscale status:"

          tailscale status \
            2>/dev/null \
            || true

          echo
          echo "Tailscale IP:"

          tailscale ip -4 \
            2>/dev/null \
            || true

          echo
          echo "===== DIAGNOSTIC COMPLETE ====="


      # =========================================================
      # 19. Keep Runner Alive
      # =========================================================

      - name: Keep Runner Alive
        shell: bash
        run: |
          echo
          echo "======================================================"
          echo "             macOS RDP SESSION ACTIVE"
          echo "======================================================"

          echo
          echo "Tailscale: ACTIVE"

          echo
          echo "macrdp: ACTIVE"

          echo
          echo "GUI user monitor: ACTIVE"

          echo
          echo "Switch User detection: ACTIVE"

          echo
          echo "Runner will stay alive."

          echo

          sleep 20400


      # =========================================================
      # 20. Cleanup
      # =========================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo
          echo "===== CLEANUP ====="

          echo
          echo "Stopping macrdp..."

          pkill \
            -f "/usr/local/bin/macrdp" \
            || true

          CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

          if [ -n "$CURRENT_USER" ] && [ "$CURRENT_USER" != "root" ]; then

            CURRENT_UID=$(id -u "$CURRENT_USER")

            echo
            echo "Stopping LaunchAgent for:"
            echo "$CURRENT_USER"

            sudo launchctl bootout \
              "gui/$CURRENT_UID/com.macrdp.server" \
              2>/dev/null \
              || true

          fi

          echo
          echo "Stopping Tailscale..."

          sudo tailscale down \
            || true

          echo
          echo "Cleanup complete."


      # =========================================================
      # 21. Final
      # =========================================================

      - name: Final
        if: always()
        shell: bash
        run: |
          echo
          echo "======================================================"
          echo "              WORKFLOW FINISHED"
          echo "======================================================"
