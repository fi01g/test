name: macOS Tailscale RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      # =========================================================
      # 1. SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          sw_vers
          echo
          uname -a
          echo
          whoami
          echo
          id
          echo

          echo "Architecture:"
          uname -m

          echo
          echo "Current user:"
          echo "$USER"

          echo
          echo "Home:"
          echo "$HOME"

      # =========================================================
      # 2. CREATE MACOS USER
      # =========================================================
      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING MACOS USER"
          echo "=================================================="

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            NEXT_UID=$(dscl . -list /Users UniqueID |
              awk '{print $2}' |
              sort -n |
              tail -1)

            NEXT_UID=$((NEXT_UID + 1))

            echo "Creating user:"
            echo "$MACOS_USERNAME"
            echo "UID:"
            echo "$NEXT_UID"

            sudo dscl . -create "/Users/$MACOS_USERNAME"
            sudo dscl . -create "/Users/$MACOS_USERNAME" UserShell /bin/zsh
            sudo dscl . -create "/Users/$MACOS_USERNAME" RealName "$MACOS_USERNAME"
            sudo dscl . -create "/Users/$MACOS_USERNAME" UniqueID "$NEXT_UID"
            sudo dscl . -create "/Users/$MACOS_USERNAME" PrimaryGroupID 20
            sudo dscl . -create "/Users/$MACOS_USERNAME" NFSHomeDirectory "/Users/$MACOS_USERNAME"

            sudo mkdir -p "/Users/$MACOS_USERNAME"

            sudo chown -R "$MACOS_USERNAME:staff" \
              "/Users/$MACOS_USERNAME"

            sudo dscl . -passwd "/Users/$MACOS_USERNAME" "$MACOS_PASSWORD"

            echo "User created."
          fi

          echo
          id "$MACOS_USERNAME"

      # =========================================================
      # 3. MAKE USER ADMIN
      # =========================================================
      - name: Make User Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "ADDING USER TO ADMIN GROUP"
          echo "=================================================="

          sudo dseditgroup -o edit \
            -a "$MACOS_USERNAME" \
            -t user admin

          echo "Admin group:"
          dseditgroup -o checkmember \
            -m "$MACOS_USERNAME" admin || true

      # =========================================================
      # 4. CONFIGURE AUTO LOGIN
      # =========================================================
      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set +e

          echo "=================================================="
          echo "CONFIGURING AUTO LOGIN"
          echo "=================================================="

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            DisableFDEAutoLogin \
            -bool false

          echo "Auto-login configuration written."

          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser || true

      # =========================================================
      # 5. REMOVE GUI TAILSCALE
      # =========================================================
      - name: Remove GUI Tailscale
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "REMOVING GUI TAILSCALE"
          echo "=================================================="

          echo "Existing Tailscale processes:"
          ps aux | grep -i tailscale | grep -v grep || true

          echo
          echo "Stopping GUI Tailscale..."

          sudo pkill -f "/Applications/Tailscale.app" 2>/dev/null || true

          sleep 3

          echo "Removing Tailscale.app..."

          sudo rm -rf "/Applications/Tailscale.app"

          echo "Removing old CLI launcher..."

          sudo rm -f /usr/local/bin/tailscale

          echo "GUI Tailscale removed."

      # =========================================================
      # 6. INSTALL HOMEBREW TAILSCALE CLI
      # =========================================================
      - name: Install Tailscale CLI Only
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING TAILSCALE CLI-ONLY"
          echo "=================================================="

          if command -v brew >/dev/null 2>&1; then
            echo "Homebrew already installed."
          else
            echo "Homebrew not found."

            /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          if [ -x "/opt/homebrew/bin/brew" ]; then
            eval "$(/opt/homebrew/bin/brew shellenv)"
          fi

          if [ -x "/usr/local/bin/brew" ]; then
            eval "$(/usr/local/bin/brew shellenv)"
          fi

          echo
          echo "Homebrew:"
          command -v brew

          brew update

          echo
          echo "Installing Tailscale formula..."

          brew install tailscale

          echo
          echo "Tailscale binaries:"

          which tailscale || true
          which tailscaled || true

          echo
          echo "Tailscale version:"

          tailscale version || true
          tailscaled --version || true

      # =========================================================
      # 7. INSTALL TAILSCALED SYSTEM DAEMON
      # =========================================================
      - name: Install Tailscale System Daemon
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "INSTALLING TAILSCALED SYSTEM DAEMON"
          echo "=================================================="

          TAILSCALED_BIN="$(which tailscaled)"

          echo "tailscaled:"
          echo "$TAILSCALED_BIN"

          if [ ! -x "$TAILSCALED_BIN" ]; then
            echo "ERROR: tailscaled was not found."
            exit 1
          fi

          echo
          echo "Installing launchd system daemon..."

          sudo "$TAILSCALED_BIN" install-system-daemon

          sleep 5

          echo
          echo "Checking launchd:"

          sudo launchctl list | grep -i tailscale || true

          echo
          echo "Checking processes:"

          ps aux | grep -i tailscaled | grep -v grep || true

      # =========================================================
      # 8. WAIT FOR TAILSCALED
      # =========================================================
      - name: Wait For Tailscaled
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "WAITING FOR TAILSCALED"
          echo "=================================================="

          READY=0

          for i in $(seq 1 60); do

            if sudo tailscale status >/tmp/tailscale-status 2>/tmp/tailscale-status.err; then
              echo "Tailscaled is responding."
              READY=1
              break
            fi

            echo "Waiting... $i/60"

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo
            echo "ERROR: tailscaled did not become ready."

            echo
            echo "tailscale status:"
            cat /tmp/tailscale-status 2>/dev/null || true

            echo
            echo "tailscale stderr:"
            cat /tmp/tailscale-status.err 2>/dev/null || true

            echo
            echo "Processes:"
            ps aux | grep -i tailscale | grep -v grep || true

            echo
            echo "LaunchDaemons:"
            sudo ls -lah /Library/LaunchDaemons |
              grep -i tailscale || true

            exit 1
          fi

      # =========================================================
      # 9. AUTHENTICATE TAILSCALE
      # =========================================================
      - name: Authenticate Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          echo "=================================================="
          echo "AUTHENTICATING TAILSCALE"
          echo "=================================================="

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY is empty."
            exit 1
          fi

          echo "tailscale:"
          which tailscale

          echo
          echo "Running tailscale up..."

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          EXIT_CODE=$?

          echo
          echo "tailscale up exit code:"
          echo "$EXIT_CODE"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo
            echo "ERROR: Tailscale authentication failed."

            echo
            echo "tailscale status:"
            sudo tailscale status || true

            echo
            echo "tailscaled process:"
            ps aux | grep -i tailscaled | grep -v grep || true

            exit "$EXIT_CODE"
          fi

          echo
          echo "Tailscale authentication successful."

      # =========================================================
      # 10. VERIFY TAILSCALE
      # =========================================================
      - name: Verify Tailscale
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "VERIFYING TAILSCALE"
          echo "=================================================="

          echo "Status:"
          sudo tailscale status

          echo
          echo "IP addresses:"

          TAILSCALE_IP=""

          for i in $(seq 1 30); do

            TAILSCALE_IP=$(sudo tailscale ip -4 2>/dev/null | head -1)

            if [ -n "$TAILSCALE_IP" ]; then
              break
            fi

            echo "Waiting for Tailscale IP... $i/30"
            sleep 1
          done

          if [ -z "$TAILSCALE_IP" ]; then
            echo "ERROR: No Tailscale IPv4 address found."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "TAILSCALE IPv4:"
          echo "$TAILSCALE_IP"
          echo "=========================================="

          echo
          echo "Ping self:"
          sudo tailscale ping \
            --c=1 \
            "$TAILSCALE_IP" || true

      # =========================================================
      # 11. INSTALL RUST
      # =========================================================
      - name: Install Rust
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING RUST"
          echo "=================================================="

          if command -v rustc >/dev/null 2>&1; then
            echo "Rust already installed."
          else
            curl --proto '=https' \
              --tlsv1.2 \
              -sSf \
              https://sh.rustup.rs |
              sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

      # =========================================================
      # 12. CLONE MACRDP
      # =========================================================
      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "CLONING MACRDP"
          echo "=================================================="

          rm -rf "$HOME/macrdp"

          git clone \
            --depth 1 \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          echo "Repository:"
          git remote -v

          echo
          echo "Commit:"
          git rev-parse HEAD

      # =========================================================
      # 13. BUILD MACRDP
      # =========================================================
      - name: Build macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          source "$HOME/.cargo/env"

          echo "=================================================="
          echo "BUILDING MACRDP"
          echo "=================================================="

          cd "$HOME/macrdp"

          cargo build --release

          echo
          echo "Build completed."

          find target/release \
            -maxdepth 1 \
            -type f \
            -perm -111 \
            -print

      # =========================================================
      # 14. INSTALL MACRDP
      # =========================================================
      - name: Install macrdp
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "INSTALLING MACRDP"
          echo "=================================================="

          MACRDP_BIN=""

          if [ -x "$HOME/macrdp/target/release/macrdp" ]; then
            MACRDP_BIN="$HOME/macrdp/target/release/macrdp"
          else
            echo "ERROR: macrdp binary was not found."

            find "$HOME/macrdp/target/release" \
              -maxdepth 1 \
              -type f \
              -perm -111 \
              -print

            exit 1
          fi

          sudo install -m 755 \
            "$MACRDP_BIN" \
            /usr/local/bin/macrdp

          echo
          echo "Installed:"
          ls -lah /usr/local/bin/macrdp

          echo
          echo "Help:"
          /usr/local/bin/macrdp --help || true

      # =========================================================
      # 15. PREPARE MACRDP USER ENVIRONMENT
      # =========================================================
      - name: Prepare macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          echo "=================================================="
          echo "PREPARING MACRDP"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"

          sudo mkdir -p \
            "$USER_HOME/Library/Logs/macrdp" \
            "$USER_HOME/Library/LaunchAgents"

          sudo chown -R \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/Logs/macrdp" \
            "$USER_HOME/Library/LaunchAgents"

          echo "Directories created."

      # =========================================================
      # 16. CREATE MACRDP LAUNCH AGENT
      # =========================================================
      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "=================================================="
          echo "CREATING MACRDP LAUNCHAGENT"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"

          PLIST_TMP="/tmp/com.macrdp.server.plist"

          cat > "$PLIST_TMP" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">

          <plist version="1.0">
          <dict>

              <key>Label</key>
              <string>com.macrdp.server</string>

              <key>ProgramArguments</key>
              <array>
                  <string>/usr/local/bin/macrdp</string>
                  <string>--bind</string>
                  <string>0.0.0.0:3390</string>
                  <string>--username</string>
                  <string>$MACOS_USERNAME</string>
                  <string>--password</string>
                  <string>$MACOS_PASSWORD</string>
                  <string>--enable-h264</string>
                  <string>--fps</string>
                  <string>60</string>
                  <string>--bitrate</string>
                  <string>8</string>
                  <string>--keyframe-interval</string>
                  <string>2</string>
                  <string>--flush-frames</string>
                  <string>4</string>
                  <string>--virtual-display</string>
                  <string>--log-dir</string>
                  <string>$USER_HOME/Library/Logs/macrdp</string>
                  <string>--verbose</string>
              </array>

              <key>WorkingDirectory</key>
              <string>$USER_HOME</string>

              <key>EnvironmentVariables</key>
              <dict>
                  <key>PATH</key>
                  <string>/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin</string>
                  <key>HOME</key>
                  <string>$USER_HOME</string>
                  <key>USER</key>
                  <string>$MACOS_USERNAME</string>
              </dict>

              <key>RunAtLoad</key>
              <true/>

              <key>KeepAlive</key>
              <true/>

              <key>ProcessType</key>
              <string>Interactive</string>

              <key>ThrottleInterval</key>
              <integer>5</integer>

              <key>StandardOutPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stdout.log</string>

              <key>StandardErrorPath</key>
              <string>$USER_HOME/Library/Logs/macrdp/stderr.log</string>

          </dict>
          </plist>
          EOF

          sudo cp \
            "$PLIST_TMP" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chown \
            "$MACOS_USERNAME:staff" \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          sudo chmod 644 \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "LaunchAgent created."

          sudo plutil -lint \
            "$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

      # =========================================================
      # 17. START MACRDP
      # =========================================================
      - name: Start macrdp
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "STARTING MACRDP"
          echo "=================================================="

          USER_HOME="/Users/$MACOS_USERNAME"
          PLIST="$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "Bootstrapping LaunchAgent..."

          sudo launchctl bootout \
            "gui/$(id -u "$MACOS_USERNAME")/com.macrdp.server" \
            2>/dev/null || true

          sudo launchctl bootstrap \
            "gui/$(id -u "$MACOS_USERNAME")" \
            "$PLIST"

          BOOTSTRAP_EXIT=$?

          echo
          echo "Bootstrap exit code:"
          echo "$BOOTSTRAP_EXIT"

          if [ "$BOOTSTRAP_EXIT" -ne 0 ]; then
            echo
            echo "Trying launchctl load..."

            sudo -u "$MACOS_USERNAME" \
              launchctl load "$PLIST" \
              2>/dev/null || true
          fi

          sleep 5

          echo
          echo "Launchctl status:"

          sudo launchctl print \
            "gui/$(id -u "$MACOS_USERNAME")/com.macrdp.server" \
            2>&1 || true

          echo
          echo "macrdp processes:"

          ps aux | grep macrdp | grep -v grep || true

          echo
          echo "macrdp logs:"

          find "$USER_HOME/Library/Logs/macrdp" \
            -type f \
            -maxdepth 1 \
            -print 2>/dev/null || true

          echo
          echo "stdout:"
          cat "$USER_HOME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          echo
          echo "stderr:"
          cat "$USER_HOME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

      # =========================================================
      # 18. VERIFY RDP PORT
      # =========================================================
      - name: Verify RDP Port
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "VERIFYING RDP PORT"
          echo "=================================================="

          echo "Listening sockets:"
          sudo lsof -nP -iTCP:3390 -sTCP:LISTEN || true

          echo
          echo "All macrdp processes:"
          ps aux | grep macrdp | grep -v grep || true

          echo
          echo "LaunchAgent:"
          sudo launchctl print \
            "gui/$(id -u "$MACOS_USERNAME")/com.macrdp.server" \
            2>&1 || true

          echo
          echo "Logs:"
          cat "/Users/$MACOS_USERNAME/Library/Logs/macrdp/stdout.log" \
            2>/dev/null || true

          cat "/Users/$MACOS_USERNAME/Library/Logs/macrdp/stderr.log" \
            2>/dev/null || true

      # =========================================================
      # 19. CONNECTION INFORMATION
      # =========================================================
      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo
          echo "=================================================="
          echo "REMOTE DESKTOP CONNECTION INFORMATION"
          echo "=================================================="

          TAILSCALE_IP=$(sudo tailscale ip -4 2>/dev/null | head -1)

          echo
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo
          echo "RDP address:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "=================================================="
          echo "USE MICROSOFT REMOTE DESKTOP"
          echo "=================================================="

          echo
          echo "PC:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "User:"
          echo "$MACOS_USERNAME"

          echo
          echo "Password:"
          echo "(the value stored in MACOS_PASSWORD secret)"

          echo
          echo "=================================================="

          echo
          echo "Tailscale status:"
          sudo tailscale status || true

      # =========================================================
      # 20. KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          set +e

          echo "=================================================="
          echo "KEEPING RUNNER ALIVE"
          echo "=================================================="

          echo "The runner will remain alive for approximately 5h 40m."

          END=$((SECONDS + 20400))

          while [ "$SECONDS" -lt "$END" ]; do

            REMAINING=$((END - SECONDS))

            echo
            echo "=================================================="
            echo "REMOTE SESSION STATUS"
            echo "Remaining seconds: $REMAINING"
            echo "=================================================="

            echo
            echo "Tailscale:"
            sudo tailscale status 2>&1 || true

            echo
            echo "Tailscale IP:"
            sudo tailscale ip -4 2>&1 || true

            echo
            echo "RDP port:"
            sudo lsof -nP -iTCP:3390 -sTCP:LISTEN 2>&1 || true

            echo
            echo "macrdp:"
            ps aux | grep macrdp | grep -v grep || true

            echo
            echo "tailscaled:"
            ps aux | grep tailscaled | grep -v grep || true

            sleep 60
          done

          echo
          echo "5h40m elapsed."

      # =========================================================
      # 21. CLEANUP
      # =========================================================
      - name: Cleanup
        if: always()
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          echo "=================================================="
          echo "CLEANUP"
          echo "=================================================="

          if [ -n "$MACOS_USERNAME" ]; then

            USER_ID=$(id -u "$MACOS_USERNAME" 2>/dev/null)

            if [ -n "$USER_ID" ]; then

              sudo launchctl bootout \
                "gui/$USER_ID/com.macrdp.server" \
                2>/dev/null || true

            fi

          fi

          sudo tailscale down 2>/dev/null || true

          sudo tailscaled uninstall-system-daemon \
            2>/dev/null || true

          echo "Cleanup complete."
