name: macOS - Abdulrahman + RustDesk

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. معلومات النظام
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " macOS SYSTEM INFORMATION"
          echo "=========================================="

          echo ""
          echo "macOS:"
          sw_vers

          echo ""
          echo "Architecture:"
          uname -m

          echo ""
          echo "Current process user:"
          whoami

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged-in users:"
          who || true


      # =========================================================
      # 2. إنشاء Abdulrahman
      # =========================================================
      - name: Create Abdulrahman Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CREATING ABDULRAHMAN"
          echo "=========================================="

          if [ -z "$MACOS_USERNAME" ]; then
            echo "ERROR: MACOS_USERNAME is empty."
            exit 1
          fi

          if [ -z "$MACOS_PASSWORD" ]; then
            echo "ERROR: MACOS_PASSWORD is empty."
            exit 1
          fi

          if [[ ! "$MACOS_USERNAME" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid username."
            exit 1
          fi

          echo ""
          echo "Username:"
          echo "$MACOS_USERNAME"

          # -----------------------------------------------------
          # إنشاء المستخدم إذا لم يكن موجودًا
          # -----------------------------------------------------
          if id "$MACOS_USERNAME" >/dev/null 2>&1; then

            echo ""
            echo "User already exists."

          else

            echo ""
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"

            echo "User created."

          fi

          # -----------------------------------------------------
          # جعله Administrator
          # -----------------------------------------------------
          echo ""
          echo "Adding user to admin group..."

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo ""
          echo "User ID:"
          id "$MACOS_USERNAME"

          echo ""
          echo "User groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Home directory:"

          dscl . -read \
            "/Users/$MACOS_USERNAME" \
            NFSHomeDirectory


      # =========================================================
      # 3. التحقق من أن الحساب Admin فعلًا
      # =========================================================
      - name: Verify Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING ADMINISTRATOR"
          echo "=========================================="

          echo ""
          echo "Username:"
          sudo -u "$MACOS_USERNAME" whoami

          echo ""
          echo "UID:"
          id -u "$MACOS_USERNAME"

          echo ""
          echo "Groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "Checking admin membership..."

          if dseditgroup \
            -o checkmember \
            -m "$MACOS_USERNAME" \
            admin | grep -qi "yes"; then

            echo "SUCCESS: $MACOS_USERNAME is an administrator."

          else

            echo "ERROR: $MACOS_USERNAME is NOT an administrator."
            exit 1

          fi


      # =========================================================
      # 4. اختبار كلمة المرور
      # =========================================================
      - name: Verify Password
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " VERIFYING PASSWORD"
          echo "=========================================="

          echo ""
          echo "Testing authentication for:"
          echo "$MACOS_USERNAME"

          # إنشاء عملية sudo تحت المستخدم للتأكد
          # من أن الحساب صالح وقابل للاستخدام.
          sudo -u "$MACOS_USERNAME" -H \
            sh -c '
              echo "whoami=$(whoami)"
              echo "HOME=$HOME"
              echo "USER=$USER"
            '

          echo ""
          echo "Account is usable."


      # =========================================================
      # 5. ضبط Auto Login لـ Abdulrahman
      # =========================================================
      - name: Configure Abdulrahman Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING AUTO LOGIN"
          echo "=========================================="

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Target auto-login user:"
          echo "$MACOS_USERNAME"

          sudo sysadminctl \
            -autologin set \
            -userName "$MACOS_USERNAME" \
            -password "$MACOS_PASSWORD" \
            || true

          echo ""
          echo "Auto-login status:"

          sudo sysadminctl \
            -autologin status \
            || true

          echo ""
          echo "IMPORTANT:"
          echo "Auto-login configuration affects a future login."
          echo "It does NOT replace the currently active GUI session."


      # =========================================================
      # 6. تثبيت RustDesk
      # =========================================================
      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " INSTALLING RUSTDESK"
          echo "=========================================="

          brew update

          brew install --cask rustdesk

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ ! -f "$RUSTDESK" ]; then
            echo "ERROR: RustDesk executable not found."
            exit 1
          fi

          echo ""
          echo "RustDesk version:"

          "$RUSTDESK" --version || true


      # =========================================================
      # 7. إعداد RustDesk
      # =========================================================
      - name: Configure RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo " CONFIGURING RUSTDESK"
          echo "=========================================="

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          if [ -z "$RUSTDESK_PASSWORD" ]; then
            echo "ERROR: RUSTDESK_PASSWORD is empty."
            exit 1
          fi

          echo ""
          echo "RustDesk ID:"

          ID=$(
            "$RUSTDESK" --get-id 2>/dev/null || true
          )

          echo "$ID"

          echo ""
          echo "Starting RustDesk server..."

          "$RUSTDESK" \
            --server \
            >/tmp/rustdesk-server.log 2>&1 &

          sleep 10

          echo ""
          echo "Setting permanent password..."

          PASSWORD_OUTPUT=$(
            sudo "$RUSTDESK" \
              --password "$RUSTDESK_PASSWORD" \
              2>&1
          )

          echo "$PASSWORD_OUTPUT"

          if echo "$PASSWORD_OUTPUT" | grep -qi "done"; then
            echo ""
            echo "SUCCESS: RustDesk password configured."
          else
            echo ""
            echo "WARNING: Password command did not report Done."

            cat /tmp/rustdesk-server.log || true
          fi

          echo ""
          echo "Restarting RustDesk..."

          pkill -f \
            "/Applications/RustDesk.app/Contents/MacOS/RustDesk" \
            || true

          sleep 5

          nohup "$RUSTDESK" \
            >/tmp/rustdesk.log 2>&1 &

          sleep 10

          FINAL_ID=$(
            "$RUSTDESK" --get-id 2>/dev/null || true
          )

          echo ""
          echo "=========================================="
          echo " RUSTDESK READY"
          echo "=========================================="

          echo ""
          echo "RustDesk ID:"
          echo "$FINAL_ID"

          echo ""
          echo "RustDesk password:"
          echo "CONFIGURED"


      # =========================================================
      # 8. تشغيل برنامج GUI تحت Abdulrahman
      # =========================================================
      - name: Test GUI As Abdulrahman
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          set -e

          echo "=========================================="
          echo " TESTING GUI AS ABDULRAHMAN"
          echo "=========================================="

          echo ""
          echo "Current console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Opening System Settings as:"
          echo "$MACOS_USERNAME"

          sudo -u "$MACOS_USERNAME" -H \
            env \
            HOME="/Users/$MACOS_USERNAME" \
            USER="$MACOS_USERNAME" \
            LOGNAME="$MACOS_USERNAME" \
            /usr/bin/open -a "System Settings" \
            2>&1 || true

          sleep 5

          echo ""
          echo "Processes for Abdulrahman:"

          ps aux | grep "$MACOS_USERNAME" | grep -v grep || true

          echo ""
          echo "Console user remains:"
          stat -f "%Su" /dev/console


      # =========================================================
      # 9. المعلومات النهائية
      # =========================================================
      - name: Final Check
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}

        run: |
          echo "=========================================="
          echo " FINAL CHECK"
          echo "=========================================="

          echo ""
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo ""
          echo "Logged users:"
          who || true

          echo ""
          echo "Abdulrahman:"
          id "$MACOS_USERNAME"

          echo ""
          echo "Admin groups:"
          id -Gn "$MACOS_USERNAME"

          echo ""
          echo "RustDesk:"
          pgrep -fl RustDesk || true


      # =========================================================
      # 10. إبقاء الـRunner متصل
      # =========================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "=========================================="
          echo " macOS RUNNER IS ONLINE"
          echo "=========================================="

          echo ""
          echo "RustDesk is running."
          echo "Abdulrahman account is configured."
          echo "The workflow will remain active."
          echo ""

          while true
          do
            echo ""
            echo "[$(date)] Runner alive"

            echo "Console user:"
            stat -f "%Su" /dev/console \
              2>/dev/null || echo "unknown"

            echo "RustDesk:"
            pgrep -fl RustDesk || true

            sleep 300
          done
