name: macOS RustDesk

on:
  workflow_dispatch:

jobs:
  rustdesk:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:

      - name: macOS Info
        run: |
          sw_vers
          echo "Architecture: $(uname -m)"

      - name: Install RustDesk
        shell: bash
        run: |
          set -e

          ARCH=$(uname -m)

          if [ "$ARCH" = "arm64" ]; then
            ARCH_NAME="aarch64"
          else
            ARCH_NAME="x86_64"
          fi

          curl -fsSL \
            https://api.github.com/repos/rustdesk/rustdesk/releases/latest \
            -o /tmp/release.json

          URL=$(python3 -c "
          import json

          data = json.load(open('/tmp/release.json'))

          for asset in data['assets']:
              name = asset['name'].lower()

              if '$ARCH_NAME' in name and name.endswith('.dmg'):
                  print(asset['browser_download_url'])
                  break
          ")

          if [ -z "$URL" ]; then
            echo "RustDesk DMG not found."
            exit 1
          fi

          curl -fL "$URL" -o /tmp/rustdesk.dmg

          hdiutil attach /tmp/rustdesk.dmg -nobrowse -readonly

          APP=$(find /Volumes -name "RustDesk.app" -type d -print -quit)

          if [ -z "$APP" ]; then
            echo "RustDesk.app not found."
            exit 1
          fi

          sudo rm -rf /Applications/RustDesk.app
          sudo cp -R "$APP" /Applications/RustDesk.app

          hdiutil detach "$(dirname "$APP")" || true

          echo "RustDesk installed."

      - name: Start RustDesk
        shell: bash
        env:
          RUSTDESK_PASSWORD: ${{ secrets.RUSTDESK_PASSWORD }}
        run: |
          set -e

          open -a "/Applications/RustDesk.app"

          sleep 15

          RUSTDESK="/Applications/RustDesk.app/Contents/MacOS/RustDesk"

          echo "RustDesk executable:"
          echo "$RUSTDESK"

          echo ""
          echo "RustDesk version:"
          "$RUSTDESK" --version || true

          echo ""
          echo "RustDesk ID:"

          ID=$("$RUSTDESK" --get-id 2>/dev/null || true)

          echo "$ID"

          echo ""
          echo "Checking available RustDesk commands..."

          "$RUSTDESK" --help 2>&1 | head -100 || true

      - name: Keep Runner Alive
        shell: bash
        run: |
          echo "macOS Runner is online."

          while true
          do
            echo "Runner alive: $(date)"
            sleep 300
          done
