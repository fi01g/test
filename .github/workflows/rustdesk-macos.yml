name: macOS RDP - Abdulrahman

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 350

    steps:

      - name: System Information
        shell: bash
        run: |
          echo "===== SYSTEM ====="
          sw_vers
          echo
          echo "===== CURRENT USER ====="
          whoami
          echo
          echo "===== CONSOLE USER ====="
          stat -f "%Su" /dev/console
          echo
          echo "===== GUI SESSIONS ====="
          who
          echo
          echo "===== DISK ====="
          df -h

      - name: Create macOS User
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          echo "Checking user: $MACOS_USERNAME"

          if id "$MACOS_USERNAME" >/dev/null 2>&1; then
            echo "User already exists."
          else
            echo "Creating user..."

            sudo sysadminctl \
              -addUser "$MACOS_USERNAME" \
              -fullName "$MACOS_USERNAME" \
              -password "$MACOS_PASSWORD"
          fi

          echo
          echo "===== USER ====="
          id "$MACOS_USERNAME"

      - name: Configure Administrator
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set -e

          sudo dseditgroup \
            -o edit \
            -a "$MACOS_USERNAME" \
            -t user \
            admin

          echo
          echo "===== USER GROUPS ====="
          id "$MACOS_USERNAME"

      - name: Configure Auto Login
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          sudo defaults write \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser \
            "$MACOS_USERNAME"

          echo
          sudo defaults read \
            /Library/Preferences/com.apple.loginwindow \
            autoLoginUser 2>/dev/null || true

      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if ! command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          brew install --quiet tailscale || true

          echo
          tailscale version

      - name: Start Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set +e

          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          if ! pgrep -x tailscaled >/dev/null 2>&1; then
            sudo tailscaled \
              --state=/tmp/tailscale-state \
              > /tmp/tailscaled.log 2>&1 &

            sleep 5
          fi

          echo
          echo "===== TAILSCALED ====="
          pgrep -fl tailscaled || true

          echo
          echo "===== TAILSCALE UP ====="

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="github-macos-rdp"

          echo
          echo "===== TAILSCALE STATUS ====="

          sudo tailscale status

          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null | head -n 1)

          echo
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo "$TAILSCALE_IP" > /tmp/tailscale_ip

      - name: Install Rust
        shell: bash
        run: |
          set -e

          if ! command -v rustc >/dev/null 2>&1; then
            curl \
              --proto '=https' \
              --tlsv1.2 \
              -sSf https://sh.rustup.rs \
              | sh -s -- -y
          fi

          source "$HOME/.cargo/env"

          echo
          rustc --version
          cargo --version

      - name: Clone macrdp
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/macrdp"

          git clone \
            https://github.com/clintcan/macrdp.git \
            "$HOME/macrdp"

          cd "$HOME/macrdp"

          echo
          ls -la

      - name: Build macrdp
        shell: bash
        run: |
          set -e

          source "$HOME/.cargo/env"

          cd "$HOME/macrdp"

          cargo build --release

          echo
          ls -lh target/release/macrdp

      - name: Install macrdp
        shell: bash
        run: |
          set -e

          sudo cp \
            "$HOME/macrdp/target/release/macrdp" \
            /usr/local/bin/macrdp

          sudo chmod +x \
            /usr/local/bin/macrdp

          echo
          echo "===== MACRDP HELP ====="

          /usr/local/bin/macrdp --help

      - name: Open macOS Permission Settings
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture"

          sleep 3

          sudo -u "$MACOS_USERNAME" \
            open \
            "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility"

          sleep 3

          echo
          echo "Console user:"
          stat -f "%Su" /dev/console

      - name: Create macrdp LaunchAgent
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
          MACOS_PASSWORD: ${{ secrets.MACOS_PASSWORD }}
        run: |
          set -e

          USER_HOME=$(dscl . -read \
            /Users/"$MACOS_USERNAME" NFSHomeDirectory \
            | awk '{print $2}')

          AGENT_DIR="$USER_HOME/Library/LaunchAgents"
          AGENT="$AGENT_DIR/com.macrdp.server.plist"
          LOG_DIR="$USER_HOME/Library/Logs/macrdp"

          echo "User home: $USER_HOME"
          echo "Agent: $AGENT"

          sudo mkdir -p "$AGENT_DIR"
          sudo mkdir -p "$LOG_DIR"

          sudo chown "$MACOS_USERNAME":staff "$AGENT_DIR"
          sudo chown "$MACOS_USERNAME":staff "$LOG_DIR"

          python3 - "$AGENT" "$LOG_DIR" "$MACOS_USERNAME" "$MACOS_PASSWORD" <<'PY'
          import plistlib
          import sys

          agent_path = sys.argv[1]
          log_dir = sys.argv[2]
          username = sys.argv[3]
          password = sys.argv[4]

          plist = {
              "Label": "com.macrdp.server",

              "ProgramArguments": [
                  "/usr/local/bin/macrdp",
                  "--bind",
                  "0.0.0.0:3390",
                  "--username",
                  username,
                  "--password",
                  password,
                  "--enable-h264",
                  "--fps",
                  "60",
                  "--bitrate",
                  "8",
                  "--keyframe-interval",
                  "2",
                  "--flush-frames",
                  "4",
                  "--log-dir",
                  log_dir,
                  "--verbose"
              ],

              "RunAtLoad": True,
              "KeepAlive": True,
              "ThrottleInterval": 5,
              "ProcessType": "Interactive",
              "LimitLoadToSessionType": ["Aqua"],
              "StandardOutPath": f"{log_dir}/stdout.log",
              "StandardErrorPath": f"{log_dir}/stderr.log"
          }

          with open(agent_path, "wb") as f:
              plistlib.dump(plist, f)
          PY

          sudo chown \
            "$MACOS_USERNAME":staff \
            "$AGENT"

          sudo chmod 644 "$AGENT"

          echo
          echo "===== PLIST ====="

          sudo plutil -p "$AGENT"

          echo
          echo "===== VALIDATION ====="

          sudo plutil -lint "$AGENT"

      - name: Stop Existing macrdp
        shell: bash
        run: |
          set +e

          echo "Stopping existing macrdp..."

          pkill -f "/usr/local/bin/macrdp" || true

          sleep 2

          pgrep -fl macrdp || true

      - name: Start macrdp
        shell: bash
        run: |
          set +e

          CONSOLE_USER=$(stat -f "%Su" /dev/console)

          echo
          echo "===== CONSOLE USER ====="
          echo "$CONSOLE_USER"

          if [ -z "$CONSOLE_USER" ] || [ "$CONSOLE_USER" = "root" ]; then
            echo "No GUI user detected."
            exit 0
          fi

          CONSOLE_UID=$(id -u "$CONSOLE_USER")

          USER_HOME=$(dscl . -read \
            /Users/"$CONSOLE_USER" NFSHomeDirectory \
            | awk '{print $2}')

          AGENT="$USER_HOME/Library/LaunchAgents/com.macrdp.server.plist"

          echo
          echo "UID:"
          echo "$CONSOLE_UID"

          echo
          echo "Agent:"
          echo "$AGENT"

          if [ ! -f "$AGENT" ]; then
            echo "ERROR: LaunchAgent not found."
            exit 1
          fi

          echo
          echo "Bootstrapping LaunchAgent..."

          sudo launchctl bootout \
            "gui/$CONSOLE_UID/com.macrdp.server" \
            2>/dev/null || true

          sleep 1

          sudo launchctl bootstrap \
            "gui/$CONSOLE_UID" \
            "$AGENT"

          RESULT=$?

          echo
          echo "Bootstrap result: $RESULT"

          sudo launchctl enable \
            "gui/$CONSOLE_UID/com.macrdp.server" \
            2>/dev/null || true

          sudo launchctl kickstart \
            -k \
            "gui/$CONSOLE_UID/com.macrdp.server"

          sleep 8

          echo
          echo "===== MACRDP PROCESS ====="

          pgrep -fl macrdp || true

          echo
          echo "===== PORT 3390 ====="

          lsof -nP \
            -iTCP:3390 \
            -sTCP:LISTEN \
            2>/dev/null || true

          echo
          echo "===== LAUNCHCTL ====="

          sudo launchctl print \
            "gui/$CONSOLE_UID/com.macrdp.server" \
            2>/dev/null || true

      - name: Monitor GUI User
        shell: bash
        run: |
          set +e

          echo
          echo "=================================================="
          echo "          GUI USER MONITOR STARTED"
          echo "=================================================="

          LAST_USER=""

          start_macrdp() {

            TARGET_USER="$1"

            echo
            echo "=============================================="
            echo "Starting macrdp for:"
            echo "$TARGET_USER"
            echo "=============================================="

            if ! id "$TARGET_USER" >/dev/null 2>&1; then
              echo "User does not exist."
              return
            fi

            TARGET_UID=$(id -u "$TARGET_USER")

            TARGET_HOME=$(dscl . -read \
              /Users/"$TARGET_USER" NFSHomeDirectory \
              | awk '{print $2}')

            AGENT="$TARGET_HOME/Library/LaunchAgents/com.macrdp.server.plist"

            echo "UID: $TARGET_UID"
            echo "Agent: $AGENT"

            if [ ! -f "$AGENT" ]; then
              echo "LaunchAgent not found."
              return
            fi

            echo
            echo "Stopping old macrdp..."

            pkill -f "/usr/local/bin/macrdp" || true

            sleep 2

            echo
            echo "Bootout old LaunchAgent..."

            sudo launchctl bootout \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true

            sleep 1

            echo
            echo "Bootstrap..."

            sudo launchctl bootstrap \
              "gui/$TARGET_UID" \
              "$AGENT"

            BOOT_RESULT=$?

            echo
            echo "Bootstrap result:"
            echo "$BOOT_RESULT"

            if [ "$BOOT_RESULT" -ne 0 ]; then
              echo "Bootstrap failed."
              return
            fi

            echo
            echo "Kickstart..."

            sudo launchctl kickstart \
              -k \
              "gui/$TARGET_UID/com.macrdp.server"

            sleep 6

            echo
            echo "===== PROCESS ====="

            pgrep -fl macrdp || true

            echo
            echo "===== PORT ====="

            lsof -nP \
              -iTCP:3390 \
              -sTCP:LISTEN \
              2>/dev/null || true

            echo
            echo "===== SERVICE ====="

            sudo launchctl print \
              "gui/$TARGET_UID/com.macrdp.server" \
              2>/dev/null || true
          }

          CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

          echo
          echo "Initial user:"
          echo "$CURRENT_USER"

          if [ -n "$CURRENT_USER" ] && [ "$CURRENT_USER" != "root" ]; then
            LAST_USER="$CURRENT_USER"
            start_macrdp "$CURRENT_USER"
          fi

          while true; do

            CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

            if [ -z "$CURRENT_USER" ] || [ "$CURRENT_USER" = "root" ]; then
              sleep 5
              continue
            fi

            if [ "$CURRENT_USER" != "$LAST_USER" ]; then

              echo
              echo
              echo "=================================================="
              echo "             SWITCH USER DETECTED"
              echo "=================================================="

              echo
              echo "Old user:"
              echo "$LAST_USER"

              echo
              echo "New user:"
              echo "$CURRENT_USER"

              LAST_USER="$CURRENT_USER"

              start_macrdp "$CURRENT_USER"

            fi

            if ! pgrep -f "/usr/local/bin/macrdp" >/dev/null 2>&1; then

              echo
              echo "macrdp is not running."
              echo "Restarting..."

              start_macrdp "$CURRENT_USER"

            fi

            sleep 5

          done

      - name: Connection Information
        shell: bash
        env:
          MACOS_USERNAME: ${{ secrets.MACOS_USERNAME }}
        run: |
          set +e

          TAILSCALE_IP=$(cat /tmp/tailscale_ip 2>/dev/null)

          if [ -z "$TAILSCALE_IP" ]; then
            TAILSCALE_IP=$(tailscale ip -4 2>/dev/null | head -n 1)
          fi

          echo
          echo "======================================================"
          echo "              RDP CONNECTION INFO"
          echo "======================================================"

          echo
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo
          echo "RDP:"
          echo "$TAILSCALE_IP:3390"

          echo
          echo "Username:"
          echo "$MACOS_USERNAME"

          echo
          echo "Password:"
          echo "Use MACOS_PASSWORD secret"

          echo
          echo "======================================================"

      - name: Keep Runner Alive
        shell: bash
        run: |
          echo
          echo "======================================================"
          echo "             macOS RDP SESSION ACTIVE"
          echo "======================================================"

          sleep 20400

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          echo "===== CLEANUP ====="

          pkill -f "/usr/local/bin/macrdp" || true

          CURRENT_USER=$(stat -f "%Su" /dev/console 2>/dev/null)

          if [ -n "$CURRENT_USER" ] && [ "$CURRENT_USER" != "root" ]; then

            CURRENT_UID=$(id -u "$CURRENT_USER")

            sudo launchctl bootout \
              "gui/$CURRENT_UID/com.macrdp.server" \
              2>/dev/null || true

          fi

          sudo tailscale down || true

          echo
          echo "Cleanup complete."

      - name: Final
        if: always()
        shell: bash
        run: |
          echo
          echo "======================================================"
          echo "              WORKFLOW FINISHED"
          echo "======================================================"
