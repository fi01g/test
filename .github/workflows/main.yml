name: Linux RDP + Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Tailscale
        env:
          TS_KEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          echo "Checking key..."
          echo "Prefix: ${TS_KEY:0:12} Len: ${#TS_KEY}"
          if [ -z "$TS_KEY" ]; then echo "❌ Secret TS_AUTHKEY فاضي"; exit 1; fi
          if [[ "$TS_KEY" != tskey-auth-* ]]; then echo "❌ المفتاح لازم يبدأ بـ tskey-auth-"; exit 1; fi
          echo -n "$TS_KEY" | tr -d ' \r\n' > /tmp/tskey
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey=file:/tmp/tskey --hostname=gh-rdp-$(date +%s)
          rm -f /tmp/tskey
          tailscale ip -4
          tailscale status

      - name: Install XRDP
        run: |
          sudo apt-get update
          sudo apt-get install -y --reinstall xfce4 xfce4-session xfce4-goodies dbus-x11 xrdp xorgxrdp
          sudo sed -i 's/allowed_users=console/allowed_users=anybody/' /etc/X11/Xwrapper.config
          sudo bash -c 'cat > /etc/xrdp/startwm.sh <<EOF
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
          fi
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          exec startxfce4
          EOF'
          sudo chmod +x /etc/xrdp/startwm.sh
          sudo useradd -m rdpuser || true
          echo "rdpuser:123456" | sudo chpasswd
          sudo usermod -aG sudo rdpuser
          sudo adduser xrdp ssl-cert || true
          echo "exec startxfce4" | sudo tee /home/rdpuser/.xsession > /dev/null
          echo "exec startxfce4" > ~/.xsession
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession
          sudo chmod +x /home/rdpuser/.xsession
          sudo rm -rf /tmp/.X* /tmp/.xrdp* || true
          sudo service xrdp restart
          sleep 4

      - name: Show Info
        run: |
          echo "=========================="
          echo "Username: rdpuser"
          echo "Password: 123456"
          echo "IP: $(tailscale ip -4)"
          echo "=========================="

      - name: Keep Alive
        run: |
          echo "السيرفر شغال - متقفش الصفحة"
          while true; do
            echo "[$(date)] IP: $(tailscale ip -4) - Running"
            sleep 60
          done
